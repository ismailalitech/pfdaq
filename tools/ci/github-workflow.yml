name: checks
on:
  push:
  pull_request:

jobs:
  simulation-and-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog and PyYAML
        run: sudo apt-get update && sudo apt-get install -y iverilog python3-yaml
      - name: RTL simulation, judged by the independent Python models
        run: make -C hw sim
      - name: Documentation consistency
        run: python3 tools/check_content.py
