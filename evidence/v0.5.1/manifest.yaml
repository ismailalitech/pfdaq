    title: "The Libero design flow as listed for the project"
    file: build/libero-design-flow.png
    class: build
    fabric: "0.5.1"
    date: 2026-11-15
    command: Design Flow panel of the Libero SoC 2026.1 GUI, project opened read-only (a copy)
