    file: sim/planted-bugs.txt
    class: sim
    fabric: "0.5.1"
    date: 2026-11-15
    command: python3 experiments/lab-assertions/planted_bugs.py /tmp/planted-bugs
    conditions: "Icarus Verilog 12.0. Each bug is one edit of hw/rtl/pfdaq_stream_src.v made in a copy; the repository is not modified. Every one of the 18 rules fires in at least one of the eleven runs."
