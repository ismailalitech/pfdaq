image: pfdaq-v051
results:
  - id: suite-freertos
    title: Board suite with FreeRTOS on hart 4, 27 of 27 functional tests
    file: board/suite-freertos.md
    class: board
    fabric: "0.5.1"
    date: 2026-11-15
    command: tests/board/pfdaq_final_suite.sh on the board, summarised by tests/host/summarise_suite.py
    conditions: Board idle except where a row says loaded. "Loaded" is one busy loop per Linux CPU plus a continuous capture loop. Latency rows are 100,000 events each.
  - id: suite-freertos-raw
    title: Raw output of the FreeRTOS suite, one JSON object per test
    file: board/suite-freertos.jsonl
