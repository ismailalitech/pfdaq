    conditions: "Proven pfdaq-v051 image, FreeRTOS on hart 4, board idle, nothing else using the stream source or the DMA controller. Test area at offset 0x40_0000 of udmabuf-ddr-c0 and udmabuf-ddr-nc0 (the same DDR bytes). Ten runs per condition; five for the maintenance variants and the throughput comparison; three for the read speed."
