    fabric: "0.5.1"
    date: 2026-11-15
    command: "python3 experiments/lab-assertions/planted_bugs.py /tmp/planted-bugs a_wready"
    conditions: "Scratch copy of the RTL with wire w_ready = ~out_valid | TREADY changed to ~out_valid, run with make -C hw sim-assert ASSERT_RTL=<copy>."
  - id: sim-planted-bug-emit
