<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t d">
<title id="t">disco-kit MSS configuration, hart 4 (read from the source, not measured)</title><desc id="d">Three lines of the project's MSS configuration file for the Discovery Kit, which the boot monitor's and the firmware's start-up code both use to program the PMP. PMP0CFG is 0x9F, which is binary 1001 1111, the lock bit, address mode NAPOT, and execute, write and read. CSR_PMPADDR0 is all ones, a NAPOT range that covers the whole address space. The configurator's own PMP switch, MEM_CONFIGS_ENABLED, is 0. Together they predict that entry 0 is locked and open to everything on every application hart, which would make the demo's own entries unreachable.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 12.80s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 12.80s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}28.12%{opacity:1}31.12%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="380" rx="12" fill="#12171d"/>
<rect x="0" y="0" width="900" height="134" fill="#0d1117"/>
<rect x="0" y="0" width="900" height="34" fill="#1b222c"/>
<circle cx="20" cy="17" r="6" fill="#ef6f6c"/>
<circle cx="38" cy="17" r="6" fill="#e6c04f"/>
<circle cx="56" cy="17" r="6" fill="#5fbf84"/>
<text x="450" y="22" text-anchor="middle" font-size="12" fill="#9aa8b5">disco-kit MSS configuration, hart 4 (read from the source, not measured)</text>
<text x="24" y="58" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">&lt;field Type="RW" name="PMP0CFG" offset="0" width="8"&gt;0x9F&lt;/field&gt;</text>
<text x="24" y="78" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">&lt;field Type="RW" name="CSR_PMPADDR0" offset="0" width="64"&gt;0xFFFFFFFFFFFFFFFF&lt;/field&gt;</text>
<text x="24" y="98" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">&lt;field Type="RW" name="PMP" offset="0" width="0"&gt;0x0&lt;/field&gt;</text>
<rect x="0" y="134" width="900" height="246" fill="#12171d"/>
<g class="co" style="animation-delay:0.00s"><rect x="8" y="43" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="45" r="11" fill="#ffd166"/><text x="8" y="49" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="134" width="900" height="246" fill="#12171d"/>
<circle cx="24" cy="160" r="13" fill="#ffd166"/><text x="24" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="158" font-size="15" font-weight="bold" fill="#e6ecf1">0x9F = 1001 1111</text>
<text x="48" y="178" font-size="13" fill="#9aa8b5">Bit 7 is L (locked), bits 4 and 3 are 11 (NAPOT), bits 2 to 0 are X, W, R. A locked entry cannot be changed until reset.</text>
</g>
<g class="co" style="animation-delay:3.60s"><rect x="8" y="63" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="65" r="11" fill="#ffd166"/><text x="8" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.60s">
<rect x="0" y="134" width="900" height="246" fill="#12171d"/>
<circle cx="24" cy="160" r="13" fill="#ffd166"/><text x="24" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="158" font-size="15" font-weight="bold" fill="#e6ecf1">All ones</text>
<text x="48" y="178" font-size="13" fill="#9aa8b5">A NAPOT range whose address is all ones covers the whole address space. Entry 0, lowest number, decides every access.</text>
</g>
<g class="co" style="animation-delay:7.20s"><rect x="8" y="83" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="85" r="11" fill="#ffd166"/><text x="8" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:7.20s">
<rect x="0" y="134" width="900" height="246" fill="#12171d"/>
<circle cx="24" cy="160" r="13" fill="#ffd166"/><text x="24" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="158" font-size="15" font-weight="bold" fill="#e6ecf1">Configurator PMP off</text>
<text x="48" y="178" font-size="13" fill="#9aa8b5">MEM_CONFIGS_ENABLED.PMP is 0, so the vendor start-up code writes pmpcfg0 straight from the first line.</text>
</g>
</svg>
