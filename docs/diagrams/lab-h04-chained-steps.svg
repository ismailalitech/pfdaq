<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
<title id="t">Two CRC steps in series inside one clock. The crc register feeds step A, which handles the even word. Step A's result feeds step B, which handles the odd word. Step B's result is loaded into the crc register at the next clock edge. The words from A and B go to the low and high half of the output register.</title><desc id="d">Two CRC steps in series inside one clock. The crc register feeds step A, which handles the even word. Step A's result feeds step B, which handles the odd word. Step B's result is loaded into the crc register at the next clock edge. The words from A and B go to the low and high half of the output register.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 29.00s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 29.00s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}10.34%{opacity:1}13.34%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="300" rx="12" fill="#12171d"/>
<g id="e_in">
<path d="M170,95 L230,95" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.00s" d="M170,95 L230,95" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="172.46" y="73" width="55.08" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="200" y="85.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">crc, ph</text>
</g>
<g id="e_ab">
<path d="M410,95 L490,95" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.00s" d="M410,95 L490,95" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="409.58" y="73" width="80.84" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="450" y="85.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">a_crc, a_ph</text>
</g>
<g id="e_out">
<path d="M660,95 L730,95" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:21.00s" d="M660,95 L730,95" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="670.68" y="73" width="48.64" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="695" y="85.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">b_word</text>
</g>
<g id="e_a">
<path d="M320,60 L320,30 L805,30 L805,60" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:18.00s" d="M320,60 L320,30 L805,30 L805,60" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="538.18" y="8" width="48.64" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="562.5" y="20.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">a_word</text>
</g>
<g id="e_fb">
<path d="M575,130 L575,180 L95,180 L95,130" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:15.00s" d="M575,130 L575,180 L95,180 L95,130" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="230.18" y="158" width="209.64" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="335" y="170.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">b_crc, loaded at the clock edge</text>
</g>
<g id="crc">
<rect x="20" y="60" width="150" height="70" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="95" y="82.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">crc register</text>
<text x="95" y="99.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">0xFFFFFFFF at start</text>
<text x="95" y="116.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">and after every frame</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="59" width="152" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="a">
<rect x="230" y="60" width="180" height="70" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="320" y="82.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Step A: even word</text>
<text x="320" y="99.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">pfdaq_word_step</text>
<text x="320" y="116.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">crc32_word, 32 bit steps</text>
<rect class="hl" style="animation-delay:6.00s" x="229" y="59" width="182" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="b">
<rect x="490" y="60" width="170" height="70" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="575" y="82.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Step B: odd word</text>
<text x="575" y="99.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">pfdaq_word_step</text>
<text x="575" y="116.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">starts from a_crc, a_ph</text>
<rect class="hl" style="animation-delay:12.00s" x="489" y="59" width="172" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="outr">
<rect x="730" y="60" width="150" height="70" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="805" y="91" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Output register</text>
<text x="805" y="108" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">TDATA, 64 bit</text>
<rect class="hl" style="animation-delay:24.00s" x="729" y="59" width="152" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="250" text-anchor="start" font-size="12" fill="#9aa8b5">Both steps are combinational: one signal runs through A's XOR network and then B's inside one 8 ns period. On the CRC beat B's word is ~a_crc.</text>
<text x="20" y="272" text-anchor="start" font-size="12" fill="#9aa8b5">The register is fed with pay_good, the intended payload; the word sent is pay_word, which carries an injected fault.</text>
</svg>
