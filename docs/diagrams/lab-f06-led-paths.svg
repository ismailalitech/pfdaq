<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d">
<title id="t">The two ways to drive LED1. The kernel's leds-gpio driver, reached through /sys/class/leds/led1, writes bit 17 of MSS GPIO2. A user program writes bit 0 of the GPIO_OUT register of CoreGPIO in the fabric, through the UIO page at 0x4000_0000. In the fabric an OR gate named OR2_LED1 combines the two signals and drives the LED1 pin, so either source lights the LED. Software can read back both registers; it cannot see the LED.</title><desc id="d">The two ways to drive LED1. The kernel's leds-gpio driver, reached through /sys/class/leds/led1, writes bit 17 of MSS GPIO2. A user program writes bit 0 of the GPIO_OUT register of CoreGPIO in the fabric, through the UIO page at 0x4000_0000. In the fabric an OR gate named OR2_LED1 combines the two signals and drives the LED1 pin, so either source lights the LED. Software can read back both registers; it cannot see the LED.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 16.30s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 16.30s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}7.98%{opacity:1}10.98%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="330" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M230,69 L300,69" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M230,69 L300,69" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="234.24" y="47" width="61.52" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="265" y="59.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">writes 1</text>
</g>
<g id="e1">
<path d="M500,69 L540,69 L540,129.5 L580,129.5" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M500,69 L540,69 L540,129.5 L580,129.5" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="544" y="90.25" width="48.64" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="549" y="102.75" text-anchor="start" font-size="11.5" fill="#e6ecf1">M2F_17</text>
</g>
<g id="e2">
<path d="M230,229 L300,229" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M230,229 L300,229" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="221.36" y="207" width="87.28" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="265" y="219.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">writes bit 0</text>
</g>
<g id="e3">
<path d="M500,229 L540,229 L540,168.5 L580,168.5" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.10s" d="M500,229 L540,229 L540,168.5 L580,168.5" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="544" y="189.75" width="80.84" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="549" y="202.25" text-anchor="start" font-size="11.5" fill="#e6ecf1">GPIO_OUT[0]</text>
</g>
<g id="e4">
<path d="M720,149 L780,149" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:11.70s" d="M720,149 L780,149" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="drv">
<rect x="10" y="30" width="220" height="78" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="120" y="56.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">leds-gpio driver</text>
<text x="120" y="73.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">/sys/class/leds/led1</text>
<text x="120" y="90.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">kernel holds line 17</text>
<rect class="hl" style="animation-delay:0.00s" x="9" y="29" width="222" height="80" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="prog">
<rect x="10" y="190" width="220" height="78" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="120" y="216.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">gpio_both_sides</text>
<text x="120" y="233.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">UIO page 0x4000_0000</text>
<text x="120" y="250.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">32-bit stores</text>
<rect class="hl" style="animation-delay:5.20s" x="9" y="189" width="222" height="80" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="mss">
<rect x="300" y="30" width="200" height="78" rx="9" fill="#232c44" stroke="#8da6d4" stroke-width="1.5"/>
<text x="400" y="56.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">MSS GPIO2, bit 17</text>
<text x="400" y="73.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">gpiochip1 line 17</text>
<text x="400" y="90.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">0x2012_2000</text>
<rect class="hl" style="animation-delay:2.60s" x="299" y="29" width="202" height="80" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="core">
<rect x="300" y="190" width="200" height="78" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="400" y="216.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">CoreGPIO GPIO_OUT[0]</text>
<text x="400" y="233.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">0x4000_0100 + 0xA0</text>
<text x="400" y="250.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">7 output bits</text>
<rect class="hl" style="animation-delay:7.80s" x="299" y="189" width="202" height="80" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="or2">
<rect x="580" y="110" width="140" height="78" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="650" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">OR2_LED1</text>
<text x="650" y="162" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">a gate in the fabric</text>
<rect class="hl" style="animation-delay:10.40s" x="579" y="109" width="142" height="80" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="led">
<rect x="780" y="110" width="110" height="78" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="835" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">LED1</text>
<text x="835" y="162" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the pin</text>
<rect class="hl" style="animation-delay:13.00s" x="779" y="109" width="112" height="80" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="290" text-anchor="start" font-size="12" fill="#9aa8b5">The OR gate is in the reference design's script: OR2_LED1 has input A = GPIO_OUT[0], input B = MSS GPIO2 bit 17.</text>
<text x="20" y="308" text-anchor="start" font-size="12" fill="#9aa8b5">Software reads back each source's own register. Nothing lets it read the LED pin, so no run says that an LED lit.</text>
</svg>
