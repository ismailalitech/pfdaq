<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 385" width="900" height="385" role="img" aria-labelledby="t d">
<title id="t">The UIO interrupt contract for one event: the fabric latency unit raises a level line, the PLIC delivers source 119, the kernel handler masks the line and wakes the reader, read() returns a 4-byte count, the program reads STATUS and writes ACK only if bit 0 is set, which drops the level, and then writes a 4-byte 1 so the kernel unmasks the line.</title><desc id="d">The UIO interrupt contract for one event: the fabric latency unit raises a level line, the PLIC delivers source 119, the kernel handler masks the line and wakes the reader, read() returns a 4-byte count, the program reads STATUS and writes ACK only if bit 0 is set, which drops the level, and then writes a 4-byte 1 so the kernel unmasks the line.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 21.50s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 21.50s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}6.05%{opacity:1}9.05%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="385" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M190,72 L253,72" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M190,72 L253,72" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="200.4" y="50" width="42.2" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="221.5" y="62.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">level</text>
</g>
<g id="e1">
<path d="M423,72 L486,72" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M423,72 L486,72" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="439.84" y="50" width="29.32" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="454.5" y="62.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">IRQ</text>
</g>
<g id="e2">
<path d="M656,72 L719,72" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M656,72 L719,72" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="666.4" y="50" width="42.2" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="687.5" y="62.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">wakes</text>
</g>
<g id="e3">
<path d="M799.5,114 L799.5,200" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.10s" d="M799.5,114 L799.5,200" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e4">
<path d="M719,242 L656,242" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:11.70s" d="M719,242 L656,242" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e5">
<path d="M486,242 L423,242" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:15.60s" d="M486,242 L423,242" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e6">
<path d="M571,284 L571,324 L105,324 L105,114" fill="none" stroke="#5fbf84" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ar-fabric)"/>
<path class="hl flow" style="animation-delay:14.30s" d="M571,284 L571,324 L105,324 L105,114" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="275.04" y="302" width="125.92" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="338" y="314.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">the level goes low</text>
</g>
<g id="e7">
<path d="M338,200 L338,157 L571,157 L571,114" fill="none" stroke="#8da6d4" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ar-mss)"/>
<path class="hl flow" style="animation-delay:18.20s" d="M338,200 L338,157 L571,157 L571,114" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="430.18" y="135" width="48.64" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="454.5" y="147.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">unmask</text>
</g>
<g id="fab">
<rect x="20" y="30" width="170" height="84" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="105" y="59.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Latency unit</text>
<text x="105" y="76.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">channel 0, level line</text>
<text x="105" y="93.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">F2M[1]</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="29" width="172" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="plic">
<rect x="253" y="30" width="170" height="84" rx="9" fill="#232c44" stroke="#8da6d4" stroke-width="1.5"/>
<text x="338" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">PLIC</text>
<text x="338" y="85" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">source 119</text>
<rect class="hl" style="animation-delay:2.60s" x="252" y="29" width="172" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="kern">
<rect x="486" y="30" width="170" height="84" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="571" y="59.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Kernel handler</text>
<text x="571" y="76.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">masks the line</text>
<text x="571" y="93.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">wakes the reader</text>
<rect class="hl" style="animation-delay:5.20s" x="485" y="29" width="172" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="prog">
<rect x="719" y="30" width="161" height="84" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="799.5" y="59.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Your program</text>
<text x="799.5" y="76.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">poll, then read():</text>
<text x="799.5" y="93.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">a 4-byte count</text>
<rect class="hl" style="animation-delay:7.80s" x="718" y="29" width="163" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="status">
<rect x="719" y="200" width="161" height="84" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="799.5" y="229.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Read STATUS</text>
<text x="799.5" y="246.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">bit 0 = 1: pending</text>
<text x="799.5" y="263.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">bit 0 = 0: empty</text>
<rect class="hl" style="animation-delay:10.40s" x="718" y="199" width="163" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ack">
<rect x="486" y="200" width="170" height="84" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="571" y="229.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Write ACK</text>
<text x="571" y="246.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">only if bit 0 was set</text>
<text x="571" y="263.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the level drops</text>
<rect class="hl" style="animation-delay:13.00s" x="485" y="199" width="172" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="unmask">
<rect x="253" y="200" width="170" height="84" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="338" y="229.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">write(1)</text>
<text x="338" y="246.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">4 bytes: the kernel</text>
<text x="338" y="263.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">unmasks the line</text>
<rect class="hl" style="animation-delay:16.90s" x="252" y="199" width="172" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="358" text-anchor="start" font-size="12" fill="#9aa8b5">The kernel cannot do the first half of the acknowledge: it does not know which register of an arbitrary device drops the interrupt.</text>
</svg>
