</g>
<g id="imp">
<rect x="20" y="30" width="180" height="66" rx="9" fill="#2a3140" stroke="#c9d3dd" stroke-width="1.5"/>
<text x="110" y="50.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Verilog file</text>
<text x="110" y="67.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">File &gt; Import &gt;</text>
<text x="110" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">HDL Source Files</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="29" width="182" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="hier">
<rect x="260" y="30" width="180" height="66" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="350" y="50.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Design Hierarchy</text>
<text x="350" y="67.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">Build Hierarchy lists</text>
<text x="350" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the module</text>
<rect class="hl" style="animation-delay:6.00s" x="259" y="29" width="182" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="core">
<rect x="500" y="30" width="180" height="66" rx="9" fill="#232c44" stroke="#8da6d4" stroke-width="1.5"/>
<text x="590" y="50.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Create Core</text>
<text x="590" y="67.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">ports and parameters</text>
<text x="590" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">read from the header</text>
<rect class="hl" style="animation-delay:12.00s" x="499" y="29" width="182" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="bif">
<rect x="740" y="30" width="180" height="66" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="830" y="50.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Bus interfaces</text>
<text x="830" y="67.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">APB slave, AXI4-Stream</text>
<text x="830" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">matched by port name</text>
<rect class="hl" style="animation-delay:18.00s" x="739" y="29" width="182" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="pkg">
<rect x="740" y="160" width="180" height="66" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="830" y="180.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Package</text>
<text x="830" y="197.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">make_cpz.py writes</text>
<text x="830" y="214.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the .cpz file</text>
<rect class="hl" style="animation-delay:24.00s" x="739" y="159" width="182" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="vault">
<rect x="500" y="160" width="180" height="66" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="590" y="180.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Add Core to Vault</text>
<text x="590" y="197.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">scratch vault folder,</text>
<text x="590" y="214.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">import_core</text>
<rect class="hl" style="animation-delay:30.00s" x="499" y="159" width="182" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="cat">
<rect x="260" y="160" width="180" height="66" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="350" y="180.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Catalog</text>
<text x="350" y="197.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">User Defined group,</text>
<text x="350" y="214.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">double-click to place</text>
<rect class="hl" style="animation-delay:36.00s" x="259" y="159" width="182" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="sd">
<rect x="260" y="290" width="180" height="66" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="350" y="319" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">SmartDesign</text>
<text x="350" y="336" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">wire bus to bus</text>
<rect class="hl" style="animation-delay:42.00s" x="259" y="289" width="182" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="gen">
<rect x="500" y="290" width="180" height="66" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="590" y="310.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Generate</text>
<text x="590" y="327.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">design rules check,</text>
<text x="590" y="344.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">then the component</text>
<rect class="hl" style="animation-delay:48.00s" x="499" y="289" width="182" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="syn">
<rect x="740" y="290" width="180" height="66" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="830" y="310.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Synthesize</text>
<text x="830" y="327.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">log ends with</text>
<text x="830" y="344.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">Synthesis completed.</text>
<rect class="hl" style="animation-delay:54.00s" x="739" y="289" width="182" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="396" text-anchor="start" font-size="12" fill="#9aa8b5">Short route: right-click the core in the Design Hierarchy and choose Instantiate. No package, no Catalog.</text>
<text x="20" y="422" text-anchor="start" font-size="12" fill="#9aa8b5">Catalog route: the core is found like a vendor core, and the same Verilog serves every project that uses the vault.</text>
<text x="20" y="448" text-anchor="start" font-size="12" fill="#9aa8b5">Every step has a Tcl command; Project &gt; Export Script File writes them all (module F07, step 14).</text>
</svg>
