<g class="co" style="animation-delay:0.00s"><rect x="140" y="30" width="79.2857" height="300" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="140" cy="30" r="11" fill="#ffd166"/><text x="140" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="336" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="364" r="13" fill="#ffd166"/><text x="24" y="369" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="362" font-size="15" font-weight="bold" fill="#e6ecf1">Stalled</text>
<text x="48" y="382" font-size="13" fill="#9aa8b5">TREADY is low. The source keeps TVALID high and TDATA unchanged: beat 1 waits, nothing moves.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="219.286" y="30" width="26.4286" height="300" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="219.286" cy="30" r="11" fill="#ffd166"/><text x="219.286" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.40s">
<rect x="0" y="336" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="364" r="13" fill="#ffd166"/><text x="24" y="369" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="362" font-size="15" font-weight="bold" fill="#e6ecf1">One beat</text>
<text x="48" y="382" font-size="13" fill="#9aa8b5">TVALID and TREADY are both high at the clock edge that ends this cycle: beat 1 transfers.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="404.286" y="30" width="79.2857" height="300" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="404.286" cy="30" r="11" fill="#ffd166"/><text x="404.286" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:6.80s">
<rect x="0" y="336" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="364" r="13" fill="#ffd166"/><text x="24" y="369" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="362" font-size="15" font-weight="bold" fill="#e6ecf1">Stalled again</text>
<text x="48" y="382" font-size="13" fill="#9aa8b5">TREADY drops for two clocks. TDATA still shows beat 5; it changes only after beat 5 has gone.</text>
</g>
<g class="co" style="animation-delay:10.20s"><rect x="457.143" y="30" width="79.2857" height="300" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="457.143" cy="30" r="11" fill="#ffd166"/><text x="457.143" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:10.20s">
<rect x="0" y="336" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="364" r="13" fill="#ffd166"/><text x="24" y="369" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="362" font-size="15" font-weight="bold" fill="#e6ecf1">No clock lost</text>
<text x="48" y="382" font-size="13" fill="#9aa8b5">TREADY stays high for two clocks: beats 5 and 6 go on consecutive edges, one beat per clock.</text>
</g>
<g class="co" style="animation-delay:13.60s"><rect x="589.286" y="30" width="26.4286" height="300" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="589.286" cy="30" r="11" fill="#ffd166"/><text x="589.286" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">5</text></g>
<g class="co cap" style="animation-delay:13.60s">
<rect x="0" y="336" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="364" r="13" fill="#ffd166"/><text x="24" y="369" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">5</text>
<text x="48" y="362" font-size="15" font-weight="bold" fill="#e6ecf1">Last beat</text>
<text x="48" y="382" font-size="13" fill="#9aa8b5">TLAST is high and TKEEP is 0F: this packet has 17 words, so the last beat carries only the CRC word.</text>
</g>
<g class="co" style="animation-delay:17.00s"><rect x="615.714" y="30" width="185" height="300" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="615.714" cy="30" r="11" fill="#ffd166"/><text x="615.714" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">6</text></g>
<g class="co cap" style="animation-delay:17.00s">
<rect x="0" y="336" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="364" r="13" fill="#ffd166"/><text x="24" y="369" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">6</text>
<text x="48" y="362" font-size="15" font-weight="bold" fill="#e6ecf1">Between packets</text>
<text x="48" y="382" font-size="13" fill="#9aa8b5">TVALID is low for 7 clocks (GAP_CYCLES is 7 here). That is allowed: the packet has ended.</text>
</g>
</svg>
