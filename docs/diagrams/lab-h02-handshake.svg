<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d">
<title id="t">Waveform from the stream simulation, scenario 2 with TREADY high on 30 percent of the clocks. A beat transfers on every rising clock edge where TVALID and TREADY are both high. While TREADY is low, TVALID stays high and TDATA does not change. The last beat of the packet has TLAST high and TKEEP 0F, and TVALID is low for seven clocks before the next packet. A dash means TVALID is low.</title><desc id="d">Waveform from the stream simulation, scenario 2 with TREADY high on 30 percent of the clocks. A beat transfers on every rising clock edge where TVALID and TREADY are both high. While TREADY is low, TVALID stays high and TDATA does not change. The last beat of the packet has TLAST high and TKEEP 0F, and TVALID is low for seven clocks before the next packet. A dash means TVALID is low.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 22.40s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 22.40s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}15.18%{opacity:1}18.18%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
