<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 340" width="990" height="340" role="img" aria-labelledby="t d">
<title id="t">pfdaq_cap fault runs, counter payload (suite summary rows and supervisor console)</title><desc id="d">Three recorded fault-injection runs of the board suite, one per fault type, each with the suite's summary row and the supervisor's closing console line, showing exact counts: 4 CRC errors for 4 faults, 5 sequence errors for 5, and 2 payload plus 2 CRC errors for 2.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 12.80s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 12.80s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}28.12%{opacity:1}31.12%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="990" height="340" rx="12" fill="#12171d"/>
<rect x="0" y="0" width="990" height="254" fill="#0d1117"/>
<rect x="0" y="0" width="990" height="34" fill="#1b222c"/>
<circle cx="20" cy="17" r="6" fill="#ef6f6c"/>
<circle cx="38" cy="17" r="6" fill="#e6c04f"/>
<circle cx="56" cy="17" r="6" fill="#5fbf84"/>
<text x="495" y="22" text-anchor="middle" font-size="12" fill="#9aa8b5">pfdaq_cap fault runs, counter payload (suite summary rows and supervisor console)</text>
<text x="24" y="58" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84">$ </tspan><tspan fill="#e6ecf1">pfdaq_cap -r -m counter -w 252 -f 1024 -n 20 -F crc -i 7 -e 5</tspan></text>
<text x="24" y="78" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">T9-crc-counter | PASS | 20480 frames, 21.0 MB, errors seq/pay/crc 0/0/4, faults 4, supervisor ok (20 status, 0 misses)</text>
<text x="24" y="98" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">[pfdaq-sup] DISARM from ARMED: 20 status, 0 deadline misses, 0 seq mismatches, linux errors 4, latency irqs 0</text>
<text x="24" y="118" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84">$ </tspan><tspan fill="#e6ecf1">pfdaq_cap -r -m counter -w 252 -f 1024 -n 20 -F seq -i 0 -e 4</tspan></text>
<text x="24" y="138" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">T9-seq-counter | PASS | 20480 frames, 21.0 MB, errors seq/pay/crc 5/0/0, faults 5, supervisor ok (20 status, 0 misses)</text>
<text x="24" y="158" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">[pfdaq-sup] DISARM from ARMED: 20 status, 0 deadline misses, 0 seq mismatches, linux errors 5, latency irqs 0</text>
<text x="24" y="178" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84">$ </tspan><tspan fill="#e6ecf1">pfdaq_cap -r -m counter -w 252 -f 1024 -n 20 -F payload -i 1023 -e 10</tspan></text>
<text x="24" y="198" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">T9-pay-counter | PASS | 20480 frames, 21.0 MB, errors seq/pay/crc 0/2/2, faults 2, supervisor ok (20 status, 0 misses)</text>
<text x="24" y="218" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">[pfdaq-sup] DISARM from ARMED: 20 status, 0 deadline misses, 0 seq mismatches, linux errors 4, latency irqs 0</text>
<rect x="0" y="254" width="990" height="86" fill="#12171d"/>
<g class="co" style="animation-delay:0.00s"><rect x="8" y="43" width="974" height="63" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="45" r="11" fill="#ffd166"/><text x="8" y="49" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="254" width="990" height="86" fill="#12171d"/>
<circle cx="24" cy="280" r="13" fill="#ffd166"/><text x="24" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="278" font-size="15" font-weight="bold" fill="#e6ecf1">CRC: 4 injected, 4 found</text>
<text x="48" y="298" font-size="13" fill="#9aa8b5">Bursts 5, 10, 15 and 20 carry a fault; the CRC count is 4 and the other two counts are 0.</text>
</g>
<g class="co" style="animation-delay:3.60s"><rect x="8" y="103" width="974" height="63" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="105" r="11" fill="#ffd166"/><text x="8" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.60s">
<rect x="0" y="254" width="990" height="86" fill="#12171d"/>
<circle cx="24" cy="280" r="13" fill="#ffd166"/><text x="24" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="278" font-size="15" font-weight="bold" fill="#e6ecf1">Sequence: 5 injected, 5 found</text>
<text x="48" y="298" font-size="13" fill="#9aa8b5">Bursts 4, 8, 12, 16 and 20 carry a fault; only the sequence count is not zero.</text>
</g>
<g class="co" style="animation-delay:7.20s"><rect x="8" y="163" width="974" height="63" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="165" r="11" fill="#ffd166"/><text x="8" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:7.20s">
<rect x="0" y="254" width="990" height="86" fill="#12171d"/>
<circle cx="24" cy="280" r="13" fill="#ffd166"/><text x="24" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="278" font-size="15" font-weight="bold" fill="#e6ecf1">Payload: 2 injected, 4 detections</text>
<text x="48" y="298" font-size="13" fill="#9aa8b5">Two flipped bits give 2 payload and 2 CRC errors, so the supervisor is told 4.</text>
</g>
</svg>
