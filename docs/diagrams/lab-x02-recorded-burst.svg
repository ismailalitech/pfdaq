<text x="48" y="298" font-size="15" font-weight="bold" fill="#e6ecf1">The command</text>
<text x="48" y="318" font-size="13" fill="#9aa8b5">Supervised (-r), counter payload, 252 words per frame, 1,024 frames per burst, 32 bursts.</text>
