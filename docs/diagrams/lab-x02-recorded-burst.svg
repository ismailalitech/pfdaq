<circle cx="24" cy="300" r="13" fill="#ffd166"/><text x="24" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="298" font-size="15" font-weight="bold" fill="#e6ecf1">Software sets the rate</text>
<text x="48" y="318" font-size="13" fill="#9aa8b5">Copy 70.5 and verify 55.4 MB/s: about 15 ms and 19 ms for each 1 MiB burst.</text>
</g>
<g class="co" style="animation-delay:13.60s"><rect x="8" y="143" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
