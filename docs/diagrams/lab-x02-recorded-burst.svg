<text x="48" y="298" font-size="15" font-weight="bold" fill="#e6ecf1">Size and rate</text>
<text x="48" y="318" font-size="13" fill="#9aa8b5">32 bursts, 33,554,432 bytes in 1.1335 s: 29.60 MB/s from START to the last verified frame.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="8" y="103" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
