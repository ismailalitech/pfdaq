<circle cx="24" cy="300" r="13" fill="#ffd166"/><text x="24" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="298" font-size="15" font-weight="bold" fill="#e6ecf1">Not the transfer time</text>
<text x="48" y="318" font-size="13" fill="#9aa8b5">Mean 34.3 ms: Linux verifies the previous burst between START and the wait. The minimum is 1.218 ms.</text>
</g>
<g class="co" style="animation-delay:10.20s"><rect x="8" y="123" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
