<title id="t">evidence/v0.5.1/board/suite-freertos.jsonl, test T4-counter (JSON line wrapped at its fields)</title><desc id="d">The recorded result of the first functional test: 32 bursts, 32,768 frames and 33,554,432 bytes in 1.1335 s, 29.60 MB/s end to end; start_to_irq mean 34.3 ms; copy 70.5 MB/s and verify 55.4 MB/s; zero errors of every kind; 301,159 stalled fabric clocks; the supervisor counted 32 status messages, no miss and no mismatch.</desc>
