<text x="48" y="298" font-size="15" font-weight="bold" fill="#e6ecf1">The supervisor agrees</text>
<text x="48" y="318" font-size="13" fill="#9aa8b5">32 STATUS, no miss, no mismatch; its fabric_seq 32768 equals next_seq; round trip mean 1,974 us.</text>
