<rect x="0" y="274" width="900" height="126" fill="#12171d"/>
<circle cx="24" cy="300" r="13" fill="#ffd166"/><text x="24" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">5</text>
<text x="48" y="298" font-size="15" font-weight="bold" fill="#e6ecf1">Every check clean</text>
<text x="48" y="318" font-size="13" fill="#9aa8b5">No bad magic, sequence, payload or CRC, no injected fault and no DMA failure in 33.5 MB.</text>
</g>
<g class="co" style="animation-delay:17.00s"><rect x="8" y="163" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
