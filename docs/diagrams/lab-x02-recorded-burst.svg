<text x="450" y="22" text-anchor="middle" font-size="12" fill="#9aa8b5">evidence/v0.5.1/board/suite-freertos.jsonl, test T4-counter (JSON line wrapped at its fields)</text>
<text x="24" y="58" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84">$ </tspan><tspan fill="#e6ecf1">pfdaq_cap -r -m counter -w 252 -f 1024 -n 32</tspan></text>
<text x="24" y="78" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">{"pass": true, "bursts": 32, "frames": 32768, "bytes": 33554432, "elapsed_s": 1.133499,</text>
<text x="24" y="98" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve"> "mb_per_s_end_to_end": 29.60, "serial": 0,</text>
<text x="24" y="118" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve"> "start_to_irq_s": {"min": 0.001218, "mean": 0.034325, "max": 0.039303},</text>
<text x="24" y="138" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve"> "copy_mb_per_s": 70.5, "verify_mb_per_s": 55.4,</text>
<text x="24" y="158" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve"> "bad_magic": 0, "bad_seq": 0, "bad_payload": 0, "bad_crc": 0, "faults_injected": 0, "dma_fail": 0,</text>
<text x="24" y="178" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve"> "fabric_stall_cycles": 301159, "next_seq": 32768,</text>
<text x="24" y="198" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve"> "supervisor": {"pass": true, "status_rx": 32, "deadline_miss": 0, "seq_mismatch": 0,</text>
<text x="24" y="218" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">   "fabric_seq": 32768, "fabric_frames": 32768, "xfer_fail": 0, "uptime_ms": 52846,</text>
<text x="24" y="238" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">   "rtt_us": {"min": 1249, "mean": 1974, "max": 10020}}}</text>
