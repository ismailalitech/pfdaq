<circle cx="24" cy="300" r="13" fill="#ffd166"/><text x="24" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">6</text>
<text x="48" y="298" font-size="15" font-weight="bold" fill="#e6ecf1">Little back-pressure</text>
<text x="48" y="318" font-size="13" fill="#9aa8b5">301,159 stalled clocks at 8 ns is about 2.4 ms over the whole run.</text>
</g>
<g class="co" style="animation-delay:20.40s"><rect x="8" y="183" width="884" height="63" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="185" r="11" fill="#ffd166"/><text x="8" y="189" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">7</text></g>
