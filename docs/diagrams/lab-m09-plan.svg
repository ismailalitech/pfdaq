<path class="hl flow" style="animation-delay:20.40s" d="M520,400 L580,400 L580,397.5 L640,397.5" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
