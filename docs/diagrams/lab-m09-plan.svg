<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d">
<title id="t">The four PMP entries the demo installs for user mode, and what each access of the test meets. Entry 0 is a 4 KiB canary page inside the image, read only: a load works, a store is denied with mcause 7. Entry 1 is the 1 MiB image at 0x91C00000, read, write and execute: the own data word, the code and the stack. Entry 2 is off and only holds the bottom address for entry 3, the rings, buffers and resource table from 0x91D00000 to 0x91D51000, read and write; the test only reads the first word. A user-mode load from Linux DDR at 0x80200000 or from the boot monitor's L2 scratchpad at 0x0A000000 matches no entry and is denied with mcause 5. The lowest-numbered entry that matches decides. Machine mode is not limited by any of them, because none has the lock bit, and the entries are put back as found when the test ends.</title><desc id="d">The four PMP entries the demo installs for user mode, and what each access of the test meets. Entry 0 is a 4 KiB canary page inside the image, read only: a load works, a store is denied with mcause 7. Entry 1 is the 1 MiB image at 0x91C00000, read, write and execute: the own data word, the code and the stack. Entry 2 is off and only holds the bottom address for entry 3, the rings, buffers and resource table from 0x91D00000 to 0x91D51000, read and write; the test only reads the first word. A user-mode load from Linux DDR at 0x80200000 or from the boot monitor's L2 scratchpad at 0x0A000000 matches no entry and is denied with mcause 5. The lowest-numbered entry that matches decides. Machine mode is not limited by any of them, because none has the lock bit, and the entries are put back as found when the test ends.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 27.20s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 27.20s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}4.41%{opacity:1}7.41%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
