<path class="hl flow" style="animation-delay:22.80s" d="M520,460 L580,460 L580,462.5 L640,462.5" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="user">
<rect x="10" y="215" width="160" height="90" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="90" y="247.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">User mode</text>
<text x="90" y="264.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">a few microseconds</text>
<text x="90" y="281.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">interrupts masked</text>
<rect class="hl" style="animation-delay:0.00s" x="9" y="214" width="162" height="92" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="p0">
<rect x="270" y="30" width="250" height="100" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="395" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">pmp0  canary page</text>
<text x="395" y="93" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">NAPOT 4 KiB, R only (0x19)</text>
<rect class="hl" style="animation-delay:2.40s" x="269" y="29" width="252" height="102" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="p1">
<rect x="270" y="170" width="250" height="70" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="395" y="201" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">pmp1  the image</text>
<text x="395" y="218" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">NAPOT 1 MiB at 0x91C0_0000, RWX</text>
<rect class="hl" style="animation-delay:9.60s" x="269" y="169" width="252" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="p3">
<rect x="270" y="270" width="250" height="70" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="395" y="301" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">pmp2, pmp3  rings</text>
<text x="395" y="318" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">TOR 0x91D0_0000 to 0x91D5_1000, RW</text>
<rect class="hl" style="animation-delay:14.40s" x="269" y="269" width="252" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="none">
<rect x="270" y="380" width="250" height="100" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="395" y="426" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">no entry matches</text>
<text x="395" y="443" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">user mode: denied</text>
<rect class="hl" style="animation-delay:19.20s" x="269" y="379" width="252" height="102" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ok">
<rect x="640" y="20" width="250" height="55" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="765" y="43.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">load works</text>
<text x="765" y="60.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">read of the canary page</text>
<rect class="hl" style="animation-delay:4.80s" x="639" y="19" width="252" height="57" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="can">
<rect x="640" y="85" width="250" height="55" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="765" y="108.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">store: mcause 7</text>
<text x="765" y="125.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">pmp0 says read only</text>
<rect class="hl" style="animation-delay:7.20s" x="639" y="84" width="252" height="57" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="own">
<rect x="640" y="170" width="250" height="70" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="765" y="201" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">load and store work</text>
<text x="765" y="218" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">own data word, code, stack</text>
<rect class="hl" style="animation-delay:12.00s" x="639" y="169" width="252" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ring">
<rect x="640" y="270" width="250" height="70" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="765" y="301" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">load works</text>
<text x="765" y="318" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">first ring word, only read</text>
<rect class="hl" style="animation-delay:16.80s" x="639" y="269" width="252" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="lnx">
<rect x="640" y="370" width="250" height="55" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="765" y="393.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Linux DDR 0x8020_0000</text>
<text x="765" y="410.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">load: mcause 5</text>
<rect class="hl" style="animation-delay:21.60s" x="639" y="369" width="252" height="57" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="hss">
<rect x="640" y="435" width="250" height="55" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="765" y="458.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">L2 scratchpad 0x0A00_0000</text>
<text x="765" y="475.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">boot monitor, load: mcause 5</text>
<rect class="hl" style="animation-delay:24.00s" x="639" y="434" width="252" height="57" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="10" y="518" text-anchor="start" font-size="12" fill="#9aa8b5">The lowest-numbered entry that matches decides: the store to the canary page meets pmp0 before pmp1.</text>
<text x="10" y="542" text-anchor="start" font-size="12" fill="#9aa8b5">No entry has the lock bit: machine mode is not limited, and the entries are put back as found when the test ends.</text>
</svg>
