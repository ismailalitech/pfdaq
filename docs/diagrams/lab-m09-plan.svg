<path class="hl flow" style="animation-delay:6.00s" d="M520,110 L580,110 L580,112.5 L640,112.5" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
