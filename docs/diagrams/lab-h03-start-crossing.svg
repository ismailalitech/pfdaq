<text x="605.143" y="228" text-anchor="middle" font-size="11" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">011</text>
<rect x="647.929" y="213" width="231.571" height="22" rx="4" fill="#1b2a3a" stroke="#5fbf84" stroke-width="1.2"/>
<text x="763.714" y="228" text-anchor="middle" font-size="11" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">111</text>
<text x="12" y="266" font-size="12" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">start_pulse_a</text>
<path d="M140,274 L140,274 L562.857,274 L562.857,254 L647.429,254 L647.429,274 L880,274" fill="none" stroke="#5fbf84" stroke-width="2" stroke-linejoin="round"/>
<text x="12" y="306" font-size="12" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">run</text>
<rect x="140.5" y="293" width="506.429" height="22" rx="4" fill="#1b2a3a" stroke="#5fbf84" stroke-width="1.2"/>
<text x="393.714" y="308" text-anchor="middle" font-size="11" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">IDLE</text>
<rect x="647.929" y="293" width="231.571" height="22" rx="4" fill="#1b2a3a" stroke="#5fbf84" stroke-width="1.2"/>
<text x="763.714" y="308" text-anchor="middle" font-size="11" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">RUN</text>
<text x="12" y="346" font-size="12" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">cfg_payload</text>
