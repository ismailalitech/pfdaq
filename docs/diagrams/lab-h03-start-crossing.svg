<text x="763.714" y="348" text-anchor="middle" font-size="11" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">8</text>
<rect x="0" y="376" width="900" height="104" fill="#12171d"/>
<g class="co" style="animation-delay:0.00s"><rect x="245.714" y="30" width="211.429" height="340" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="245.714" cy="30" r="11" fill="#ffd166"/><text x="245.714" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="376" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="404" r="13" fill="#ffd166"/><text x="24" y="409" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="402" font-size="15" font-weight="bold" fill="#e6ecf1">The START write</text>
<text x="48" y="422" font-size="13" fill="#9aa8b5">The access phase of the APB write to CTRL is in PCLK. apb_write is high until the PCLK edge at 2290 ns.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="457.143" y="30" width="105.714" height="340" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="457.143" cy="30" r="11" fill="#ffd166"/><text x="457.143" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.40s">
<rect x="0" y="376" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="404" r="13" fill="#ffd166"/><text x="24" y="409" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="402" font-size="15" font-weight="bold" fill="#e6ecf1">The toggle flips</text>
<text x="48" y="422" font-size="13" fill="#9aa8b5">At that PCLK edge start_tgl_p changes. The event is the change of level, not a short pulse.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="478.286" y="30" width="169.143" height="340" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="478.286" cy="30" r="11" fill="#ffd166"/><text x="478.286" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:6.80s">
<rect x="0" y="376" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="404" r="13" fill="#ffd166"/><text x="24" y="409" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="402" font-size="15" font-weight="bold" fill="#e6ecf1">The chain</text>
<text x="48" y="422" font-size="13" fill="#9aa8b5">ACLK shifts the new level in: 001 at 2292 ns, 011 at 2300 ns, 111 at 2308 ns.</text>
</g>
<g class="co" style="animation-delay:10.20s"><rect x="562.857" y="30" width="84.5714" height="340" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="562.857" cy="30" r="11" fill="#ffd166"/><text x="562.857" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:10.20s">
<rect x="0" y="376" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="404" r="13" fill="#ffd166"/><text x="24" y="409" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="402" font-size="15" font-weight="bold" fill="#e6ecf1">One pulse</text>
<text x="48" y="422" font-size="13" fill="#9aa8b5">start_pulse_a is bit 2 xor bit 1: high for exactly one ACLK clock, whatever the level does after.</text>
</g>
<g class="co" style="animation-delay:13.60s"><rect x="647.429" y="30" width="84.5714" height="340" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="647.429" cy="30" r="11" fill="#ffd166"/><text x="647.429" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">5</text></g>
<g class="co cap" style="animation-delay:13.60s">
<rect x="0" y="376" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="404" r="13" fill="#ffd166"/><text x="24" y="409" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">5</text>
<text x="48" y="402" font-size="15" font-weight="bold" fill="#e6ecf1">Copied at once</text>
<text x="48" y="422" font-size="13" fill="#9aa8b5">At the next ACLK edge run leaves IDLE and cfg_payload takes its value, 8, the one software wrote earlier.</text>
</g>
</svg>
