<text x="12" y="186" font-size="12" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">start_tgl_p</text>
<path d="M140,194 L140,194 L457.143,194 L457.143,174 L880,174" fill="none" stroke="#5aa0d6" stroke-width="2" stroke-linejoin="round"/>
<text x="12" y="226" font-size="12" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">start_sync_a</text>
