<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 340" width="810" height="340" role="img" aria-labelledby="t d">
<title id="t">A toy chain of trust: the ROM verifies stage 1, stage 1 verifies stage 2, stage 2 verifies the application. A failed check at any link halts the chain.</title><desc id="d">A toy chain of trust: the ROM verifies stage 1, stage 1 verifies stage 2, stage 2 verifies the application. A failed check at any link halts the chain.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl{opacity:0;animation:lit 11.10s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 11.10s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}11.71%{opacity:1}14.71%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="810" height="340" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M160,86 L230,86" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M160,86 L230,86" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="164.24" y="64" width="61.52" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="195" y="76.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">verifies</text>
</g>
<g id="e1">
<path d="M370,86 L440,86" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M370,86 L440,86" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="374.24" y="64" width="61.52" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="405" y="76.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">verifies</text>
</g>
<g id="e2">
<path d="M580,86 L650,86" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M580,86 L650,86" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="584.24" y="64" width="61.52" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="615" y="76.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">verifies</text>
</g>
<g id="e3">
<path d="M90,132 L90,174 L405,174 L405,216" fill="none" stroke="#ef6f6c" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ar-bad)"/>
</g>
<g id="e4">
<path d="M300,132 L300,174 L405,174 L405,216" fill="none" stroke="#ef6f6c" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ar-bad)"/>
</g>
<g id="e5">
<path d="M510,132 L510,174 L405,174 L405,216" fill="none" stroke="#ef6f6c" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ar-bad)"/>
</g>
<g id="rom">
<rect x="20" y="40" width="140" height="92" rx="9" fill="#2a3140" stroke="#c9d3dd" stroke-width="1.5"/>
<text x="90" y="73.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">ROM</text>
<text x="90" y="90.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">root public key</text>
<text x="90" y="107.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">lowest version</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="39" width="142" height="94" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="stage1">
<rect x="230" y="40" width="140" height="92" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="300" y="73.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Stage 1</text>
<text x="300" y="90.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">checked by the ROM</text>
<text x="300" y="107.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">holds the next key</text>
<rect class="hl" style="animation-delay:2.60s" x="229" y="39" width="142" height="94" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="stage2">
<rect x="440" y="40" width="140" height="92" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="510" y="73.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Stage 2</text>
<text x="510" y="90.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">checked by stage 1</text>
<text x="510" y="107.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">holds the next key</text>
<rect class="hl" style="animation-delay:5.20s" x="439" y="39" width="142" height="94" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="app">
<rect x="650" y="40" width="140" height="92" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="720" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Application</text>
<text x="720" y="99" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">checked by stage 2</text>
<rect class="hl" style="animation-delay:7.80s" x="649" y="39" width="142" height="94" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="halt">
<rect x="275" y="216" width="260" height="66" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="405" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">HALT</text>
<text x="405" y="262" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">nothing further is started</text>
</g>
<text x="405" y="312" text-anchor="middle" font-size="12" fill="#9aa8b5">A link that fails stops everything after it: bad signature, unsigned image, wrong key or a version that is too old.</text>
</svg>
