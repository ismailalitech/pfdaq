<path class="hl flow" style="animation-delay:3.00s" d="M170,63 L240,63" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="177.46" y="41" width="55.08" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="205" y="53.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">lat_now</text>
</g>
<g id="e1">
<path d="M410,63 L480,63" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.00s" d="M410,63 L480,63" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="417.46" y="41" width="55.08" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="445" y="53.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">lat_bin</text>
</g>
<g id="e2">
<path d="M670,63 L740,63" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:15.00s" d="M670,63 L740,63" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="687.12" y="41" width="35.76" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="705" y="53.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">ha_q</text>
</g>
<g id="e3">
<path d="M810,96 L810,223 L670,223" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:21.00s" d="M810,96 L810,223 L670,223" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="712.46" y="201" width="55.08" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="740" y="213.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">hw_data</text>
</g>
<g id="e4">
<path d="M410,223 L480,223" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:33.00s" d="M410,223 L480,223" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="414.24" y="201" width="61.52" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="445" y="213.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">writes 0</text>
</g>
<g id="e5">
<path d="M575,190 L575,96" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:27.00s" d="M575,190 L575,96" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="579" y="134" width="42.2" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="584" y="146.5" text-anchor="start" font-size="11.5" fill="#e6ecf1">write</text>
</g>
<g id="e6">
<path d="M575,256 L575,330" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:39.00s" d="M575,256 L575,330" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="579" y="284" width="158.12" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="584" y="296.5" text-anchor="start" font-size="11.5" fill="#e6ecf1">same address, same data</text>
</g>
<g id="e7">
<path d="M170,363 L480,363" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:45.00s" d="M170,363 L480,363" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="294.24" y="341" width="61.52" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="325" y="353.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">hist_sel</text>
</g>
<g id="e8">
<path d="M670,363 L740,363" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:48.00s" d="M670,363 L740,363" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="687.12" y="341" width="35.76" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="705" y="353.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">hb_q</text>
</g>
<g id="ack">
<rect x="20" y="30" width="150" height="66" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="95" y="50.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">ACK, pending</text>
<text x="95" y="67.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">inc_pend, inc_bin</text>
<text x="95" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">lat_now = lat_cnt + 1</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="29" width="152" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="bin">
<rect x="240" y="30" width="170" height="66" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="325" y="50.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">bin_of</text>
<text x="325" y="67.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">leading one, next bit</text>
<text x="325" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">64 bins</text>
<rect class="hl" style="animation-delay:6.00s" x="239" y="29" width="172" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ha">
<rect x="480" y="30" width="190" height="66" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="575" y="50.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">hist_a</text>
<text x="575" y="67.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">64 x 32 bits, no reset</text>
<text x="575" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">read port: lat_bin</text>
<rect class="hl" style="animation-delay:12.00s" x="479" y="29" width="192" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="plus">
<rect x="740" y="30" width="140" height="66" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="810" y="59" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">ha_q + 1</text>
<text x="810" y="76" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">= hw_data</text>
<rect class="hl" style="animation-delay:18.00s" x="739" y="29" width="142" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="sweep">
<rect x="240" y="190" width="170" height="66" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="325" y="210.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">clear sweep</text>
<text x="325" y="227.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">clearing, clr_idx</text>
<text x="325" y="244.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">one bin per clock</text>
<rect class="hl" style="animation-delay:30.00s" x="239" y="189" width="172" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="wport">
<rect x="480" y="190" width="190" height="66" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="575" y="210.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">one write port</text>
<text x="575" y="227.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">hw_en, hw_addr, hw_data</text>
<text x="575" y="244.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">sweep first, then inc_pend</text>
<rect class="hl" style="animation-delay:24.00s" x="479" y="189" width="192" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="hb">
<rect x="480" y="330" width="190" height="66" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="575" y="350.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">hist_b</text>
<text x="575" y="367.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">same writes as hist_a</text>
<text x="575" y="384.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">read port: hist_sel</text>
<rect class="hl" style="animation-delay:36.00s" x="479" y="329" width="192" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="sel">
<rect x="20" y="330" width="150" height="66" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="95" y="350.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">HIST_SEL</text>
<text x="95" y="367.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">bin to read</text>
<text x="95" y="384.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">APB write</text>
<rect class="hl" style="animation-delay:42.00s" x="19" y="329" width="152" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="out">
<rect x="740" y="330" width="140" height="66" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="810" y="359" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">HIST_DATA</text>
<text x="810" y="376" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">hb_q, APB read</text>
<rect class="hl" style="animation-delay:51.00s" x="739" y="329" width="142" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="424" text-anchor="start" font-size="12" fill="#9aa8b5">Counting never waits for the bus: each read port is wired to one purpose, so nothing is arbitrated.</text>
</svg>
