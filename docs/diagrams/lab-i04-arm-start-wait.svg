<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d">
<title id="t">Order of one DMA transfer. Linux writes the descriptor in DDR (byte count, then destination, then 0xD last), writes its physical address to STREAM_0_ADDR_REG of the DMA, and only then starts the stream source. The source sends one packet to the DMA, which fetches the descriptor, writes the burst into the data buffer, clears the descriptor's ready bit and raises the interrupt on F2M[2], PLIC source 120. The blocking read on the DMA's UIO device returns and Linux checks the status and the ready bit.</title><desc id="d">Order of one DMA transfer. Linux writes the descriptor in DDR (byte count, then destination, then 0xD last), writes its physical address to STREAM_0_ADDR_REG of the DMA, and only then starts the stream source. The source sends one packet to the DMA, which fetches the descriptor, writes the burst into the data buffer, clears the descriptor's ready bit and raises the interrupt on F2M[2], PLIC source 120. The blocking read on the DMA's UIO device returns and Linux checks the status and the ready bit.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 53.00s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 53.00s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}5.66%{opacity:1}8.66%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="500" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M250,63 L340,63" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.00s" d="M250,63 L340,63" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="270.68" y="41" width="48.64" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="295" y="53.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">writes</text>
</g>
<g id="e1">
<path d="M250,203 L340,203" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:12.00s" d="M250,203 L340,203" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="267.46" y="181" width="55.08" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="295" y="193.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">address</text>
</g>
<g id="e2">
<path d="M250,343 L340,343" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:21.00s" d="M250,343 L340,343" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="273.9" y="321" width="42.2" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="295" y="333.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">START</text>
</g>
<g id="e3">
<path d="M450,310 L450,236" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:27.00s" d="M450,310 L450,236" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="454" y="264" width="80.84" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="459" y="276.5" text-anchor="start" font-size="11.5" fill="#e6ecf1">AXI4-Stream</text>
</g>
<g id="e4">
<path d="M450,170 L450,96" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:30.00s" d="M450,170 L450,96" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="454" y="124" width="55.08" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="459" y="136.5" text-anchor="start" font-size="11.5" fill="#e6ecf1">fetches</text>
</g>
<g id="e5">
<path d="M560,189.8 L770,189.8 L770,96" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:33.00s" d="M560,189.8 L770,189.8 L770,96" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="608.48" y="167.8" width="113.04" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="665" y="180.3" text-anchor="middle" font-size="11.5" fill="#e6ecf1">writes the burst</text>
</g>
<g id="e6">
<path d="M560,222.8 L770,222.8 L770,310" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:39.00s" d="M560,222.8 L770,222.8 L770,310" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="602.04" y="200.8" width="125.92" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="665" y="213.3" text-anchor="middle" font-size="11.5" fill="#e6ecf1">full byte count in</text>
</g>
<g id="e7">
<path d="M770,376 L770,443 L250,443" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:45.00s" d="M770,376 L770,443 L250,443" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="450.26" y="421" width="119.48" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="510" y="433.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">wakes the program</text>
</g>
<g id="l1">
<rect x="20" y="30" width="230" height="66" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="135" y="50.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">1. Write the descriptor</text>
<text x="135" y="67.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">byte count, then destination,</text>
<text x="135" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">then 0xD last</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="29" width="232" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="d">
<rect x="340" y="30" width="220" height="66" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="450" y="50.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Descriptor in DDR</text>
<text x="450" y="67.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">start of the non-cached</text>
<text x="450" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">window, 0xC800_0000</text>
<rect class="hl" style="animation-delay:6.00s" x="339" y="29" width="222" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="buf">
<rect x="660" y="30" width="220" height="66" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="770" y="50.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Data buffer</text>
<text x="770" y="67.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">one page after the</text>
<text x="770" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">descriptor</text>
<rect class="hl" style="animation-delay:36.00s" x="659" y="29" width="222" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="l2">
<rect x="20" y="170" width="230" height="66" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="135" y="190.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">2. Tell the DMA</text>
<text x="135" y="207.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">STREAM_0_ADDR_REG (0x460)</text>
<text x="135" y="224.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">= descriptor's physical address</text>
<rect class="hl" style="animation-delay:9.00s" x="19" y="169" width="232" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="dma">
<rect x="340" y="170" width="220" height="66" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="450" y="190.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">CoreAXI4DMAController</text>
<text x="450" y="207.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">reads the descriptor,</text>
<text x="450" y="224.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">writes the stream to memory</text>
<rect class="hl" style="animation-delay:15.00s" x="339" y="169" width="222" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="l3">
<rect x="20" y="310" width="230" height="66" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="135" y="330.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">3. START the source</text>
<text x="135" y="347.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">SRC_CTRL = 0x1, only after</text>
<text x="135" y="364.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">steps 1 and 2</text>
<rect class="hl" style="animation-delay:18.00s" x="19" y="309" width="232" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="src">
<rect x="340" y="310" width="220" height="66" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="450" y="330.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Stream source</text>
<text x="450" y="347.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">one burst = one packet</text>
<text x="450" y="364.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">no TVALID gap inside</text>
<rect class="hl" style="animation-delay:24.00s" x="339" y="309" width="222" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="irq">
<rect x="660" y="310" width="220" height="66" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="770" y="330.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">DMA interrupt</text>
<text x="770" y="347.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">ready bit cleared, then</text>
<text x="770" y="364.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">F2M[2] = PLIC source 120</text>
<rect class="hl" style="animation-delay:42.00s" x="659" y="309" width="222" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="l4">
<rect x="20" y="410" width="230" height="66" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="135" y="430.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">4. Sleep in read()</text>
<text x="135" y="447.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">on the DMA's /dev/uioN,</text>
<text x="135" y="464.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">then check status, ready bit</text>
<rect class="hl" style="animation-delay:48.00s" x="19" y="409" width="232" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
</svg>
