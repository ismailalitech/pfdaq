<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d">
<title id="t">One trip into user mode, in the order it happens. m09_user_run saves the callee-saved registers and the four CSRs it changes, clears mie so no interrupt can arrive, points mtvec at m09_trap, keeps the stack pointer in mscratch, sets mepc to the user code, clears MPP and MPRV and executes mret. The user code does three allowed accesses and then three violations. Each violation traps into m09_trap, which logs mcause, mtval and mepc, skips the instruction and returns by mret to user mode. The ecall that ends the code traps too; m09_trap restores mtvec, mscratch, mstatus, the registers and mie, and returns to the caller as an ordinary function return. FreeRTOS' trap vector and its own mret are never involved.</title><desc id="d">One trip into user mode, in the order it happens. m09_user_run saves the callee-saved registers and the four CSRs it changes, clears mie so no interrupt can arrive, points mtvec at m09_trap, keeps the stack pointer in mscratch, sets mepc to the user code, clears MPP and MPRV and executes mret. The user code does three allowed accesses and then three violations. Each violation traps into m09_trap, which logs mcause, mtval and mepc, skips the instruction and returns by mret to user mode. The ecall that ends the code traps too; m09_trap restores mtvec, mscratch, mstatus, the registers and mie, and returns to the caller as an ordinary function return. FreeRTOS' trap vector and its own mret are never involved.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 21.20s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 21.20s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}5.66%{opacity:1}8.66%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="420" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M210,80 L250,80" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.20s" d="M210,80 L250,80" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e1">
<path d="M450,80 L490,80" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.60s" d="M450,80 L490,80" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e2">
<path d="M690,80 L730,80" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.00s" d="M690,80 L730,80" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e3">
<path d="M762,120 L762,214 L690,214" fill="none" stroke="#ef6f6c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-bad)"/>
<path class="hl flow" style="animation-delay:8.40s" d="M762,120 L762,214 L690,214" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e4">
<path d="M590,190 L590,120" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:10.80s" d="M590,190 L590,120" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="594" y="146" width="35.76" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="599" y="158.5" text-anchor="start" font-size="11.5" fill="#e6ecf1">mret</text>
</g>
<g id="e5">
<path d="M858,120 L858,190" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:12.00s" d="M858,120 L858,190" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e6">
<path d="M730,230 L450,230" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:14.40s" d="M730,230 L450,230" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e7">
<path d="M250,230 L210,230" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:16.80s" d="M250,230 L210,230" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="save">
<rect x="10" y="40" width="200" height="80" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="110" y="67.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">m09_user_run</text>
<text x="110" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">save s0-s11, ra, mtvec,</text>
<text x="110" y="101.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">mscratch, mstatus, mie</text>
<rect class="hl" style="animation-delay:0.00s" x="9" y="39" width="202" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="mask">
<rect x="250" y="40" width="200" height="80" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="350" y="67.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Mask and aim</text>
<text x="350" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">mie = 0, mtvec = m09_trap</text>
<text x="350" y="101.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">mscratch = sp, mepc set</text>
<rect class="hl" style="animation-delay:2.40s" x="249" y="39" width="202" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="mret">
<rect x="490" y="40" width="200" height="80" rx="9" fill="#232c44" stroke="#8da6d4" stroke-width="1.5"/>
<text x="590" y="67.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">mret</text>
<text x="590" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">MPP = user, MPRV = 0</text>
<text x="590" y="101.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">one-way trip</text>
<rect class="hl" style="animation-delay:4.80s" x="489" y="39" width="202" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="user">
<rect x="730" y="40" width="160" height="80" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="810" y="67.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">m09_user_entry</text>
<text x="810" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">3 allowed accesses</text>
<text x="810" y="101.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">3 violations, ecall</text>
<rect class="hl" style="animation-delay:7.20s" x="729" y="39" width="162" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="trap">
<rect x="490" y="190" width="200" height="80" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="590" y="217.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">m09_trap: fault</text>
<text x="590" y="234.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">log mcause, mtval, mepc</text>
<text x="590" y="251.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">skip the instruction, mret</text>
<rect class="hl" style="animation-delay:9.60s" x="489" y="189" width="202" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="done">
<rect x="730" y="190" width="160" height="80" rx="9" fill="#232c44" stroke="#8da6d4" stroke-width="1.5"/>
<text x="810" y="217.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">m09_trap: ecall</text>
<text x="810" y="234.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">or a full log or any</text>
<text x="810" y="251.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">other trap: the end</text>
<rect class="hl" style="animation-delay:13.20s" x="729" y="189" width="162" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="rest">
<rect x="250" y="190" width="200" height="80" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="350" y="217.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Restore</text>
<text x="350" y="234.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">mtvec, mscratch, mstatus,</text>
<text x="350" y="251.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">registers, then mie last</text>
<rect class="hl" style="animation-delay:15.60s" x="249" y="189" width="202" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ret">
<rect x="10" y="190" width="200" height="80" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="110" y="217.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Return</text>
<text x="110" y="234.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">a0 = 0, ordinary ret to</text>
<text x="110" y="251.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the supervisor task</text>
<rect class="hl" style="animation-delay:18.00s" x="9" y="189" width="202" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="10" y="26" text-anchor="start" font-size="12" fill="#9aa8b5" font-weight="bold">Into user mode</text>
<text x="10" y="176" text-anchor="start" font-size="12" fill="#9aa8b5" font-weight="bold">Out again</text>
<text x="10" y="320" text-anchor="start" font-size="12" fill="#9aa8b5">Interrupts stay masked the whole time, so FreeRTOS' own trap vector, tick and mret never run on the user stack.</text>
<text x="10" y="345" text-anchor="start" font-size="12" fill="#9aa8b5">A fault that repeats cannot loop: after 8 log entries the test is ended.</text>
</svg>
