<path d="M220,262 L305,262" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:10.40s" d="M220,262 L305,262" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="241.4" y="240" width="42.2" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="262.5" y="252.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">binds</text>
</g>
<g id="e3">
<path d="M555,262 L640,262" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:13.00s" d="M555,262 L640,262" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="579.62" y="240" width="35.76" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="597.5" y="252.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">maps</text>
</g>
<g id="devmem">
<rect x="20" y="90" width="200" height="70" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="120" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">/dev/mem</text>
<text x="120" y="138" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">map any physical address</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="89" width="202" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="strict">
<rect x="305" y="90" width="250" height="70" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="430" y="112.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Strict devmem</text>
<text x="430" y="129.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">CONFIG_STRICT_DEVMEM=y</text>
<text x="430" y="146.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">CONFIG_IO_STRICT_DEVMEM=y</text>
<rect class="hl" style="animation-delay:2.60s" x="304" y="89" width="252" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="pwm">
<rect x="640" y="46" width="240" height="46" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="760" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">0x4000_0000  PWM</text>
<text x="760" y="82" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">claimed by a driver</text>
<rect class="hl" style="animation-delay:5.20s" x="639" y="45" width="242" height="48" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="i2c">
<rect x="640" y="102" width="240" height="46" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="760" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">0x4000_0200  I2C</text>
<text x="760" y="138" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">claimed by a driver</text>
<rect class="hl" style="animation-delay:6.50s" x="639" y="101" width="242" height="48" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="uart">
<rect x="640" y="158" width="240" height="46" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="760" y="177" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">0x4000_0300  UART</text>
<text x="760" y="194" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">claimed by a driver</text>
<rect class="hl" style="animation-delay:7.80s" x="639" y="157" width="242" height="48" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="pfdaq">
<rect x="640" y="232" width="240" height="60" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="760" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">0x4000_0F00  pfdaq</text>
<text x="760" y="275" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">stream source, latency unit</text>
<rect class="hl" style="animation-delay:14.30s" x="639" y="231" width="242" height="62" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="uionode">
<rect x="20" y="232" width="200" height="60" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="120" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">UIO node</text>
<text x="120" y="275" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">generic-uio, 0x40000f00</text>
<rect class="hl" style="animation-delay:9.10s" x="19" y="231" width="202" height="62" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="uiodrv">
<rect x="305" y="232" width="250" height="60" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="430" y="249.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">UIO driver</text>
<text x="430" y="266.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">plain ioremap of the page</text>
<text x="430" y="283.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the region is not requested</text>
<rect class="hl" style="animation-delay:11.70s" x="304" y="231" width="252" height="62" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="640" y="30" text-anchor="start" font-size="12" fill="#9aa8b5" font-weight="bold">The page at 0x4000_0000</text>
<text x="20" y="322" text-anchor="start" font-size="12" fill="#9aa8b5">UIO maps whole pages: the tools map the page and add SRC_OFF 0xF00 themselves (the block sits at offset 0xF00 in it).</text>
</svg>
