<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t d">
<title id="t">The first version of task mode, which answered one event and never again. The handler gives the semaphore; portEND_SWITCHING_ISR switches to the task inside the handler; the task acknowledges and unmasks the source; the task blocks and control returns to the handler's tail; the handler returns EXT_IRQ_DISABLE and the dispatcher masks the source afterwards. The mask comes after the unmask, so the line stays masked for good.</title><desc id="d">The first version of task mode, which answered one event and never again. The handler gives the semaphore; portEND_SWITCHING_ISR switches to the task inside the handler; the task acknowledges and unmasks the source; the task blocks and control returns to the handler's tail; the handler returns EXT_IRQ_DISABLE and the dispatcher masks the source afterwards. The mask comes after the unmask, so the line stays masked for good.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 19.60s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 19.60s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}8.16%{opacity:1}11.16%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="380" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M270,88 L325,88" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.60s" d="M270,88 L325,88" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e1">
<path d="M575,88 L630,88" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:4.80s" d="M575,88 L630,88" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e2">
<path d="M755,126 L755,168 L145,168 L145,210" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:8.00s" d="M755,126 L755,168 L145,168 L145,210" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e3">
<path d="M270,248 L325,248" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:11.20s" d="M270,248 L325,248" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e4">
<path d="M575,248 L630,248" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:14.40s" d="M575,248 L630,248" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="a">
<rect x="20" y="50" width="250" height="76" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="145" y="75.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">1 Handler gives the semaphore</text>
<text x="145" y="92.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the woken task has the</text>
<text x="145" y="109.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">top priority</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="49" width="252" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="b">
<rect x="325" y="50" width="250" height="76" rx="9" fill="#232c44" stroke="#8da6d4" stroke-width="1.5"/>
<text x="450" y="75.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">2 portEND_SWITCHING_ISR</text>
<text x="450" y="92.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">switches to the task right here,</text>
<text x="450" y="109.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">inside the handler</text>
<rect class="hl" style="animation-delay:3.20s" x="324" y="49" width="252" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="c">
<rect x="630" y="50" width="250" height="76" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="755" y="75.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">3 Task acknowledges, unmasks</text>
<text x="755" y="92.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">LAT1_ACK, then PLIC_EnableIRQ:</text>
<text x="755" y="109.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the source is enabled</text>
<rect class="hl" style="animation-delay:6.40s" x="629" y="49" width="252" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="d">
<rect x="20" y="210" width="250" height="76" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="145" y="235.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">4 Task blocks again</text>
<text x="145" y="252.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">control returns to the</text>
<text x="145" y="269.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">tail of the handler</text>
<rect class="hl" style="animation-delay:9.60s" x="19" y="209" width="252" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="e">
<rect x="325" y="210" width="250" height="76" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="450" y="235.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">5 Dispatcher masks it</text>
<text x="450" y="252.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the handler returned</text>
<text x="450" y="269.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">EXT_IRQ_DISABLE</text>
<rect class="hl" style="animation-delay:12.80s" x="324" y="209" width="252" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="f">
<rect x="630" y="210" width="250" height="76" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="755" y="235.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">The line stays masked</text>
<text x="755" y="252.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">nobody unmasks it again:</text>
<text x="755" y="269.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">no second event is taken</text>
<rect class="hl" style="animation-delay:16.00s" x="629" y="209" width="252" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="330" text-anchor="start" font-size="12" fill="#9aa8b5">The unmask (step 3) runs before the mask (step 5). The failing run was not recorded; the order is read from the code (K06).</text>
</svg>
