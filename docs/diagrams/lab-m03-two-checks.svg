<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img" aria-labelledby="t d">
<title id="t">The supervisor's two checks. Linux sends a STATUS message after each verified burst. Check 1 is a deadline kept by the supervisor's own timer: silence for longer than the deadline moves it to ALARM. Check 2 compares the sequence number Linux reports with the one hart 4 reads itself from the stream source's registers over FIC3; a difference above max_lag counts a sequence mismatch.</title><desc id="d">The supervisor's two checks. Linux sends a STATUS message after each verified burst. Check 1 is a deadline kept by the supervisor's own timer: silence for longer than the deadline moves it to ALARM. Check 2 compares the sequence number Linux reports with the one hart 4 reads itself from the stream source's registers over FIC3; a difference above max_lag counts a sequence mismatch.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 17.00s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 17.00s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}8.82%{opacity:1}11.82%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="410" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M220,90 L350,90" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.50s" d="M220,90 L350,90" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="225.26" y="68" width="119.48" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="285" y="80.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">STATUS over RPMsg</text>
</g>
<g id="e1">
<path d="M400,130 L400,180 L280,180 L280,230" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:4.50s" d="M400,130 L400,180 L280,180 L280,230" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="277.04" y="158" width="125.92" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="340" y="170.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">no message in time</text>
</g>
<g id="e2">
<path d="M550,74 L680,74" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:7.50s" d="M550,74 L680,74" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="552.04" y="52" width="125.92" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="615" y="64.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">snapshot over FIC3</text>
</g>
<g id="e3">
<path d="M780,130 L780,180 L710,180 L710,230" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:10.50s" d="M780,130 L780,180 L710,180 L710,230" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="707.8" y="158" width="74.4" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="745" y="170.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">fabric_seq</text>
</g>
<g id="e4">
<path d="M500,130 L500,180 L530,180 L530,230" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:12.00s" d="M500,130 L500,180 L530,180 L530,230" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="504" y="146" width="61.52" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="509" y="158.5" text-anchor="start" font-size="11.5" fill="#e6ecf1">next_seq</text>
</g>
<g id="linux">
<rect x="20" y="50" width="200" height="80" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="120" y="77.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Linux, pfdaq_cap</text>
<text x="120" y="94.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">verifies a burst, then sends</text>
<text x="120" y="111.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">STATUS with its next_seq</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="49" width="202" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="sup">
<rect x="350" y="50" width="200" height="80" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="450" y="77.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Supervisor, hart 4</text>
<text x="450" y="94.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">waits for a message,</text>
<text x="450" y="111.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">timeout = deadline_ms</text>
<rect class="hl" style="animation-delay:3.00s" x="349" y="49" width="202" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="fab">
<rect x="680" y="50" width="200" height="80" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="780" y="77.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Stream source</text>
<text x="780" y="94.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">registers at 0x4000_0F00</text>
<text x="780" y="111.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">SNAP_SEQ: next fabric number</text>
<rect class="hl" style="animation-delay:9.00s" x="679" y="49" width="202" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="dl">
<rect x="130" y="230" width="300" height="90" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="280" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Check 1: the deadline</text>
<text x="280" y="271" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">kept by the supervisor's own timer</text>
<text x="280" y="288" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">silence &gt; deadline: ALARM, miss + 1</text>
<text x="280" y="305" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the next STATUS: back to ARMED</text>
<rect class="hl" style="animation-delay:6.00s" x="129" y="229" width="302" height="92" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="cmp">
<rect x="470" y="230" width="300" height="90" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="620" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Check 2: the sequence</text>
<text x="620" y="271" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">fabric_seq - next_seq, unsigned</text>
<text x="620" y="288" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">above max_lag: seq_mismatch + 1</text>
<text x="620" y="305" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">max_lag = frames per burst + 16</text>
<rect class="hl" style="animation-delay:13.50s" x="469" y="229" width="302" height="92" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="372" text-anchor="start" font-size="12" fill="#9aa8b5">The fabric's side of check 2 is read by hart 4 itself, over the bus Linux also uses. Nothing in it comes from Linux.</text>
</svg>
