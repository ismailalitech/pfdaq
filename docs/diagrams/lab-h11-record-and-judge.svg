<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d">
<title id="t">The testbench tb_pfdaq_latency.v drives the RTL under test (pfdaq_core) over APB and plays software by acknowledging each interrupt after a random delay. An observer inside the testbench logs interrupt rises, ACK writes, register reads and histogram reads to sim/lat_trace.txt. The separate program check_latency.py reads only that trace, recomputes every latency and statistic, and prints RESULT: PASS or FAIL. make succeeds only when the last line says PASS.</title><desc id="d">The testbench tb_pfdaq_latency.v drives the RTL under test (pfdaq_core) over APB and plays software by acknowledging each interrupt after a random delay. An observer inside the testbench logs interrupt rises, ACK writes, register reads and histogram reads to sim/lat_trace.txt. The separate program check_latency.py reads only that trace, recomputes every latency and statistic, and prints RESULT: PASS or FAIL. make succeeds only when the last line says PASS.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 32.00s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 32.00s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}9.38%{opacity:1}12.38%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="470" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M270,98 L380,98" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.00s" d="M270,98 L380,98" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="287.8" y="76" width="74.4" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="325" y="88.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">APB writes</text>
</g>
<g id="e1">
<path d="M480,60 L480,34 L145,34 L145,60" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.00s" d="M480,60 L480,34 L145,34 L145,60" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="243.1" y="12" width="138.8" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="312.5" y="24.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">IRQ lines, read data</text>
</g>
<g id="e2">
<path d="M145,136 L145,230" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:12.00s" d="M145,136 L145,230" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="149" y="174" width="119.48" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="154" y="186.5" text-anchor="start" font-size="11.5" fill="#e6ecf1">logs what it sees</text>
</g>
<g id="e3">
<path d="M270,273 L380,273" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:18.00s" d="M270,273 L380,273" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="307.12" y="251" width="35.76" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="325" y="263.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">read</text>
</g>
<g id="e4">
<path d="M580,273 L690,273" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:24.00s" d="M580,273 L690,273" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="607.46" y="251" width="55.08" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="635" y="263.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">compare</text>
</g>
<g id="tb">
<rect x="20" y="60" width="250" height="76" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="145" y="85.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">tb_pfdaq_latency.v</text>
<text x="145" y="102.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">plays software: random delay,</text>
<text x="145" y="119.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">then ACK. Records, does not judge</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="59" width="252" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="dut">
<rect x="380" y="60" width="200" height="76" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="480" y="85.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">pfdaq_core</text>
<text x="480" y="102.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">two latency channels</text>
<text x="480" y="119.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the RTL under test</text>
<rect class="hl" style="animation-delay:6.00s" x="379" y="59" width="202" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="trace">
<rect x="20" y="230" width="250" height="86" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="145" y="260.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">sim/lat_trace.txt</text>
<text x="145" y="277.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">I: interrupt rose  K: ACK write</text>
<text x="145" y="294.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">R: register read  H: histogram bin</text>
<rect class="hl" style="animation-delay:15.00s" x="19" y="229" width="252" height="88" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="check">
<rect x="380" y="230" width="200" height="86" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="480" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">check_latency.py</text>
<text x="480" y="269" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">never reads the RTL</text>
<text x="480" y="286" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">recomputes from I and K</text>
<text x="480" y="303" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">its own bin_of</text>
<rect class="hl" style="animation-delay:21.00s" x="379" y="229" width="202" height="88" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="verdict">
<rect x="690" y="230" width="190" height="86" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="785" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">RESULT: PASS</text>
<text x="785" y="269" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">or FAIL with the first</text>
<text x="785" y="286" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">mismatches; make needs</text>
<text x="785" y="303" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">PASS on the last line</text>
<rect class="hl" style="animation-delay:27.00s" x="689" y="229" width="192" height="88" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="360" text-anchor="start" font-size="12" fill="#9aa8b5">The checker recomputes: each latency (ACK clock - rise clock + 1), EVENTS, ACKS, MIN, MAX, SUM,</text>
<text x="20" y="379" text-anchor="start" font-size="12" fill="#9aa8b5">SPURIOUS, all 64 histogram bins, the event gaps, and whether OVERRUN was expected.</text>
<text x="20" y="415" text-anchor="start" font-size="12" fill="#9aa8b5">The stream source follows the same pattern: tb_pfdaq_stream_src.v, sim/trace.txt, check_trace.py.</text>
</svg>
