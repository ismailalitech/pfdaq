<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="t d">
<title id="t">One source file, two builds. pfdaq_supervisor.c is built by Makefile.freertos with -DPFDAQ_SUPERVISOR and by Makefile.bm with -DPFDAQ_SUPERVISOR -DPFDAQ_BM. The flag selects the time base, delay_ms, the receive with timeout and the task path for the latency interrupt. The FreeRTOS payload with U-Boot is 1,376,656 bytes and is carried by the SD image; the bare-metal payload is 842,208 bytes and is built by firmware/build_payload.sh.</title><desc id="d">One source file, two builds. pfdaq_supervisor.c is built by Makefile.freertos with -DPFDAQ_SUPERVISOR and by Makefile.bm with -DPFDAQ_SUPERVISOR -DPFDAQ_BM. The flag selects the time base, delay_ms, the receive with timeout and the task path for the latency interrupt. The FreeRTOS payload with U-Boot is 1,376,656 bytes and is carried by the SD image; the bare-metal payload is 842,208 bytes and is built by firmware/build_payload.sh.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 16.40s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 16.40s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}9.76%{opacity:1}12.76%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="450" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M362.5,96 L362.5,123 L225,123 L225,150" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.60s" d="M362.5,96 L362.5,123 L225,123 L225,150" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e1">
<path d="M537.5,96 L537.5,123 L675,123 L675,150" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:8.00s" d="M537.5,96 L537.5,123 L675,123 L675,150" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e2">
<path d="M225,310 L225,350" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:4.80s" d="M225,310 L225,350" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e3">
<path d="M675,310 L675,350" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:11.20s" d="M675,310 L675,350" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="src">
<rect x="275" y="30" width="350" height="66" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="450" y="50.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">pfdaq_supervisor.c</text>
<text x="450" y="67.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">one file; the macro PFDAQ_BM selects</text>
<text x="450" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the time base, delay, receive and task path</text>
<rect class="hl" style="animation-delay:0.00s" x="274" y="29" width="352" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="fr">
<rect x="20" y="150" width="410" height="160" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="225" y="183.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">FreeRTOS build, Makefile.freertos</text>
<text x="225" y="200.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">flag: -DPFDAQ_SUPERVISOR</text>
<text x="225" y="217.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">now_ms: xTaskGetTickCount(), 1 ms ticks</text>
<text x="225" y="234.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">delay_ms: vTaskDelay(), the task sleeps</text>
<text x="225" y="251.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">receive: the RPMsg queue takes the timeout</text>
<text x="225" y="268.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">latency ack: handler, or task lat1_task</text>
<text x="225" y="285.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">bit 31 of uptime_ms: clear</text>
<rect class="hl" style="animation-delay:3.20s" x="19" y="149" width="412" height="162" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="bm">
<rect x="470" y="150" width="410" height="160" rx="9" fill="#232c44" stroke="#8da6d4" stroke-width="1.5"/>
<text x="675" y="183.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Bare-metal build, Makefile.bm</text>
<text x="675" y="200.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">flags: -DPFDAQ_SUPERVISOR -DPFDAQ_BM</text>
<text x="675" y="217.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">now_ms: machine timer at 1 MHz, divided by 1000</text>
<text x="675" y="234.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">delay_ms: busy-wait on the timer</text>
<text x="675" y="251.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">receive: sup_recv() polls the queue size</text>
<text x="675" y="268.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">latency ack: handler only, no tasks</text>
<text x="675" y="285.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">bit 31 of uptime_ms: set</text>
<rect class="hl" style="animation-delay:9.60s" x="469" y="149" width="412" height="162" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="outf">
<rect x="20" y="350" width="410" height="70" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="225" y="381" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Payload with U-Boot, 1,376,656 bytes</text>
<text x="225" y="398" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">built by Yocto; the SD image carries it</text>
<rect class="hl" style="animation-delay:6.40s" x="19" y="349" width="412" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="outb">
<rect x="470" y="350" width="410" height="70" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="675" y="381" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Payload with U-Boot, 842,208 bytes</text>
<text x="675" y="398" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">firmware/build_payload.sh, written to partition 2</text>
<rect class="hl" style="animation-delay:12.80s" x="469" y="349" width="412" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
</svg>
