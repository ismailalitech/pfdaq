<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 412" width="900" height="412" role="img" aria-labelledby="t d">
<title id="t">station_common.h: the producer side of the ring</title><desc id="d">The producer side of the lock-free ring in shared memory. ring_reserve reads its own head counter, checks against the consumer's tail with an acquire load whether a slot is free and returns the slot or NULL. ring_commit publishes the slot with a sequentially consistent store of head and wakes the consumer with a futex only if the consumer announced that it sleeps.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 20.00s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 20.00s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}18.00%{opacity:1}21.00%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="412" rx="12" fill="#12171d"/>
<rect x="0" y="0" width="900" height="334" fill="#0d1117"/>
<rect x="0" y="0" width="900" height="34" fill="#1b222c"/>
<circle cx="20" cy="17" r="6" fill="#ef6f6c"/>
<circle cx="38" cy="17" r="6" fill="#e6c04f"/>
<circle cx="56" cy="17" r="6" fill="#5fbf84"/>
<text x="450" y="22" text-anchor="middle" font-size="12" fill="#9aa8b5">station_common.h: the producer side of the ring</text>
<text x="24" y="58" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">static inline void *ring_reserve(struct ring *r)</text>
<text x="24" y="78" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">{</text>
<text x="24" y="98" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">    uint32_t head = r-&gt;h-&gt;head;     /* only the producer writes head */</text>
<text x="24" y="118" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">    if (head - __atomic_load_n(&amp;r-&gt;h-&gt;tail, __ATOMIC_ACQUIRE) &gt;= r-&gt;h-&gt;nslots)</text>
<text x="24" y="138" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">        return NULL;</text>
<text x="24" y="158" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">    return r-&gt;slots + (size_t)(head % r-&gt;h-&gt;nslots) * r-&gt;h-&gt;slot_size;</text>
<text x="24" y="178" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">}</text>
<text x="24" y="198" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">static inline void ring_commit(struct ring *r)</text>
<text x="24" y="218" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">{</text>
<text x="24" y="238" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">    __atomic_store_n(&amp;r-&gt;h-&gt;head, r-&gt;h-&gt;head + 1, __ATOMIC_SEQ_CST);</text>
<text x="24" y="258" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">    if (__atomic_load_n(&amp;r-&gt;h-&gt;waiting, __ATOMIC_SEQ_CST))</text>
<text x="24" y="278" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">        syscall(SYS_futex, &amp;r-&gt;h-&gt;head, FUTEX_WAKE, 1, NULL, NULL, 0);</text>
<text x="24" y="298" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">}</text>
<rect x="0" y="334" width="900" height="78" fill="#12171d"/>
<g class="co" style="animation-delay:0.00s"><rect x="8" y="43" width="884" height="63" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="45" r="11" fill="#ffd166"/><text x="8" y="49" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="334" width="900" height="78" fill="#12171d"/>
<circle cx="24" cy="360" r="13" fill="#ffd166"/><text x="24" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="358" font-size="15" font-weight="bold" fill="#e6ecf1">One writer per counter</text>
<text x="48" y="378" font-size="13" fill="#9aa8b5">Only the producer writes head, so it can read its own counter without a barrier.</text>
</g>
<g class="co" style="animation-delay:3.60s"><rect x="8" y="103" width="884" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="105" r="11" fill="#ffd166"/><text x="8" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.60s">
<rect x="0" y="334" width="900" height="78" fill="#12171d"/>
<circle cx="24" cy="360" r="13" fill="#ffd166"/><text x="24" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="358" font-size="15" font-weight="bold" fill="#e6ecf1">Full means NULL</text>
<text x="48" y="378" font-size="13" fill="#9aa8b5">The producer never waits: a full ring returns NULL and the frame is counted as dropped.</text>
</g>
<g class="co" style="animation-delay:7.20s"><rect x="8" y="143" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="145" r="11" fill="#ffd166"/><text x="8" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:7.20s">
<rect x="0" y="334" width="900" height="78" fill="#12171d"/>
<circle cx="24" cy="360" r="13" fill="#ffd166"/><text x="24" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="358" font-size="15" font-weight="bold" fill="#e6ecf1">Free-running counters</text>
<text x="48" y="378" font-size="13" fill="#9aa8b5">The slot is the counter modulo the number of slots, so no wrap-around case is needed.</text>
</g>
<g class="co" style="animation-delay:10.80s"><rect x="8" y="223" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="225" r="11" fill="#ffd166"/><text x="8" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:10.80s">
<rect x="0" y="334" width="900" height="78" fill="#12171d"/>
<circle cx="24" cy="360" r="13" fill="#ffd166"/><text x="24" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="358" font-size="15" font-weight="bold" fill="#e6ecf1">Publish</text>
<text x="48" y="378" font-size="13" fill="#9aa8b5">The store makes the slot visible. Every write to the slot comes before it.</text>
</g>
<g class="co" style="animation-delay:14.40s"><rect x="8" y="243" width="884" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="245" r="11" fill="#ffd166"/><text x="8" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">5</text></g>
<g class="co cap" style="animation-delay:14.40s">
<rect x="0" y="334" width="900" height="78" fill="#12171d"/>
<circle cx="24" cy="360" r="13" fill="#ffd166"/><text x="24" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">5</text>
<text x="48" y="358" font-size="15" font-weight="bold" fill="#e6ecf1">Wake only if asleep</text>
<text x="48" y="378" font-size="13" fill="#9aa8b5">The system call is made only when the consumer said it sleeps: normally none per frame.</text>
</g>
</svg>
