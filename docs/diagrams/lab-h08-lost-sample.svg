<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img" aria-labelledby="t d">
<title id="t">Waveform from a scratch testbench that drives one latency channel directly. A ONESHOT event is pending when CLEAR is written. The sweep starts. An ACK written during the sweep ends the pending state and sets inc_bin to 7, but in the cycle where inc_pend is high the write port belongs to the sweep: hw_addr is 4 and hw_data is 0, so bin 7 is never incremented.</title><desc id="d">Waveform from a scratch testbench that drives one latency channel directly. A ONESHOT event is pending when CLEAR is written. The sweep starts. An ACK written during the sweep ends the pending state and sets inc_bin to 7, but in the cycle where inc_pend is high the write port belongs to the sweep: hw_addr is 4 and hw_data is 0, so bin 7 is never incremented.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 15.60s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 15.60s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}21.79%{opacity:1}24.79%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
