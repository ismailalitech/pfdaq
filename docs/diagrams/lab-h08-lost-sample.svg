<g class="co" style="animation-delay:0.00s"><rect x="192.857" y="30" width="52.8571" height="300" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="192.857" cy="30" r="11" fill="#ffd166"/><text x="192.857" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="336" width="900" height="74" fill="#12171d"/>
<circle cx="24" cy="364" r="13" fill="#ffd166"/><text x="24" y="369" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="362" font-size="15" font-weight="bold" fill="#e6ecf1">CLEAR with an event pending</text>
<text x="48" y="382" font-size="13" fill="#9aa8b5">CLEAR is written while the interrupt is still pending. The next clock, clearing goes high.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="245.714" y="30" width="158.571" height="300" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="245.714" cy="30" r="11" fill="#ffd166"/><text x="245.714" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.40s">
<rect x="0" y="336" width="900" height="74" fill="#12171d"/>
<circle cx="24" cy="364" r="13" fill="#ffd166"/><text x="24" y="369" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="362" font-size="15" font-weight="bold" fill="#e6ecf1">The sweep owns the write port</text>
<text x="48" y="382" font-size="13" fill="#9aa8b5">hw_addr steps through the bins and hw_data is 0: one bin cleared per clock, 64 clocks in all.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="404.286" y="30" width="52.8571" height="300" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="404.286" cy="30" r="11" fill="#ffd166"/><text x="404.286" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:6.80s">
<rect x="0" y="336" width="900" height="74" fill="#12171d"/>
<circle cx="24" cy="364" r="13" fill="#ffd166"/><text x="24" y="369" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="362" font-size="15" font-weight="bold" fill="#e6ecf1">The ACK arrives</text>
<text x="48" y="382" font-size="13" fill="#9aa8b5">The unit records it: pending falls and inc_bin is set to 7, the bin this sample belongs in.</text>
</g>
<g class="co" style="animation-delay:10.20s"><rect x="457.143" y="30" width="52.8571" height="300" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="457.143" cy="30" r="11" fill="#ffd166"/><text x="457.143" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:10.20s">
<rect x="0" y="336" width="900" height="74" fill="#12171d"/>
<circle cx="24" cy="364" r="13" fill="#ffd166"/><text x="24" y="369" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="362" font-size="15" font-weight="bold" fill="#e6ecf1">The increment is discarded</text>
<text x="48" y="382" font-size="13" fill="#9aa8b5">inc_pend is high for one clock, but hw_addr is the sweep's 4 and hw_data is 0. Bin 7 is never written.</text>
</g>
</svg>
