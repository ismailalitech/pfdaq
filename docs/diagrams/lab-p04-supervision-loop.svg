<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d">
<title id="t">What the supervisor watches: Linux verifies a burst and sends a STATUS message over RPMsg; the supervisor on hart 4 waits for it with a timeout equal to the deadline; if none arrives it moves to ALARM and prints a message; on each STATUS it also snapshots the fabric's sequence counter and compares it with the number Linux expects next.</title><desc id="d">What the supervisor watches: Linux verifies a burst and sends a STATUS message over RPMsg; the supervisor on hart 4 waits for it with a timeout equal to the deadline; if none arrives it moves to ALARM and prints a message; on each STATUS it also snapshots the fabric's sequence counter and compares it with the number Linux expects next.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 13.70s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 13.70s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}9.49%{opacity:1}12.49%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="330" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M210,83 L350,83" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M210,83 L350,83" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="223.48" y="61" width="113.04" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="280" y="73.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">STATUS per burst</text>
</g>
<g id="e1">
<path d="M570,83 L710,83" fill="none" stroke="#ef6f6c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-bad)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M570,83 L710,83" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="577.04" y="61" width="125.92" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="640" y="73.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">silence &gt; deadline</text>
</g>
<g id="e2">
<path d="M460,200 L460,126" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M460,200 L460,126" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="464" y="154" width="74.4" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="469" y="166.5" text-anchor="start" font-size="11.5" fill="#e6ecf1">fabric_seq</text>
</g>
<g id="e3">
<path d="M570,238 L710,238" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.10s" d="M570,238 L710,238" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="lin">
<rect x="20" y="40" width="190" height="86" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="115" y="70.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">pfdaq_cap on Linux</text>
<text x="115" y="87.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">verifies burst n,</text>
<text x="115" y="104.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">then reports it</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="39" width="192" height="88" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="sup">
<rect x="350" y="40" width="220" height="86" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="460" y="70.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Supervisor, hart 4</text>
<text x="460" y="87.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">ARMED: waits deadline_ms</text>
<text x="460" y="104.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">for the next STATUS</text>
<rect class="hl" style="animation-delay:2.60s" x="349" y="39" width="222" height="88" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="out">
<rect x="710" y="40" width="170" height="86" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="795" y="70.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">ALARM</text>
<text x="795" y="87.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">a message and a state</text>
<text x="795" y="104.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">change, nothing restarts</text>
<rect class="hl" style="animation-delay:5.20s" x="709" y="39" width="172" height="88" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="fab">
<rect x="350" y="200" width="220" height="76" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="460" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Fabric sequence counter</text>
<text x="460" y="251" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">snapshot at each STATUS</text>
<rect class="hl" style="animation-delay:7.80s" x="349" y="199" width="222" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="chk">
<rect x="710" y="200" width="170" height="76" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="795" y="225.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Cross-check</text>
<text x="795" y="242.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">fabric_seq - next_seq</text>
<text x="795" y="259.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">above max_lag: mismatch</text>
<rect class="hl" style="animation-delay:10.40s" x="709" y="199" width="172" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="316" text-anchor="start" font-size="12" fill="#9aa8b5">A late STATUS returns the supervisor to ARMED; a new ARM clears the counters.</text>
</svg>
