<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t d">
<title id="t">board console: the acquisition log at a stall of the first loop</title><desc id="d">Recorded output of the first version of the acquisition loop on the board at an end-of-run stall: the register line printed by the diagnostic note and the line of the acquisition process two seconds later. The fabric had sent 5000 frames, the station had taken 4999, the UIO event count was 4999, the fabric held 3 credits, the descriptor of the last slot read 0x9 (frame written) and its buffer held the last frame of the run, sequence 511013.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 19.00s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 19.00s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}17.89%{opacity:1}20.89%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="960" height="300" rx="12" fill="#12171d"/>
<rect x="0" y="0" width="960" height="214" fill="#0d1117"/>
<rect x="0" y="0" width="960" height="34" fill="#1b222c"/>
<circle cx="20" cy="17" r="6" fill="#ef6f6c"/>
<circle cx="38" cy="17" r="6" fill="#e6c04f"/>
<circle cx="56" cy="17" r="6" fill="#5fbf84"/>
<text x="480" y="22" text-anchor="middle" font-size="12" fill="#9aa8b5">board console: the acquisition log at a stall of the first loop</text>
<text x="24" y="58" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">DIAG no progress for 2 s: processed 4999 of 5000, fabric sent 5000, status 0x2,</text>
<text x="24" y="78" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">    next_seq 511014, drops 0, credits 3, dma stat 0x210, uio events 4999 (read 4999),</text>
<text x="24" y="98" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">    d0 cfg 0xd buf seq 511010, d1 cfg 0xd buf seq 511011, d2 cfg 0xd buf seq 511012, d3 cfg 0x9 buf seq 511013</text>
<text x="24" y="118" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">[   7.032 cpu0 acq] run 1: no progress for 2 s, aborting the source</text>
<text x="24" y="138" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">(the loop that reads descriptors, the same load, another run)</text>
<text x="24" y="158" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">run end: 5000 frames taken from the descriptors, 4999 UIO events (fewer events than completed frames)</text>
<text x="24" y="178" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">run end: 5000 frames taken from the descriptors, 5000 UIO events</text>
<rect x="0" y="214" width="960" height="86" fill="#12171d"/>
<g class="co" style="animation-delay:0.00s"><rect x="8" y="43" width="944" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="45" r="11" fill="#ffd166"/><text x="8" y="49" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="214" width="960" height="86" fill="#12171d"/>
<circle cx="24" cy="240" r="13" fill="#ffd166"/><text x="24" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="238" font-size="15" font-weight="bold" fill="#e6ecf1">Everything arrived</text>
<text x="48" y="258" font-size="13" fill="#9aa8b5">The fabric sent all 5000 frames and is done (status 0x2); 4999 were taken; it still holds 3 of its 4 credits.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="8" y="63" width="944" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="65" r="11" fill="#ffd166"/><text x="8" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.40s">
<rect x="0" y="214" width="960" height="86" fill="#12171d"/>
<circle cx="24" cy="240" r="13" fill="#ffd166"/><text x="24" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="238" font-size="15" font-weight="bold" fill="#e6ecf1">The count and the data disagree</text>
<text x="48" y="258" font-size="13" fill="#9aa8b5">The UIO event count is 4999, equal to the frames taken: the loop waits for an event that will not come.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="8" y="83" width="944" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="85" r="11" fill="#ffd166"/><text x="8" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:6.80s">
<rect x="0" y="214" width="960" height="86" fill="#12171d"/>
<circle cx="24" cy="240" r="13" fill="#ffd166"/><text x="24" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="238" font-size="15" font-weight="bold" fill="#e6ecf1">The frame is in memory</text>
<text x="48" y="258" font-size="13" fill="#9aa8b5">Descriptor 3 reads 0x9 (the DMA wrote the frame and cleared its ready bit) and its buffer holds sequence 511013, the last one of the run.</text>
</g>
<g class="co" style="animation-delay:10.20s"><rect x="8" y="103" width="944" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="105" r="11" fill="#ffd166"/><text x="8" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:10.20s">
<rect x="0" y="214" width="960" height="86" fill="#12171d"/>
<circle cx="24" cy="240" r="13" fill="#ffd166"/><text x="24" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="238" font-size="15" font-weight="bold" fill="#e6ecf1">Two seconds later</text>
<text x="48" y="258" font-size="13" fill="#9aa8b5">The station's own no-progress limit ends the run; the frame is never taken.</text>
</g>
<g class="co" style="animation-delay:13.60s"><rect x="8" y="143" width="944" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="145" r="11" fill="#ffd166"/><text x="8" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">5</text></g>
<g class="co cap" style="animation-delay:13.60s">
<rect x="0" y="214" width="960" height="86" fill="#12171d"/>
<circle cx="24" cy="240" r="13" fill="#ffd166"/><text x="24" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">5</text>
<text x="48" y="238" font-size="15" font-weight="bold" fill="#e6ecf1">Same load, no stall</text>
<text x="48" y="258" font-size="13" fill="#9aa8b5">The loop that reads descriptors took all 5000 frames although only 4999 events were counted, and the run ended at once.</text>
</g>
</svg>
