<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d">
<title id="t">The real-time loop: the fabric source sends a frame only if it holds a credit; the DMA controller writes frame n into descriptor n modulo the number of descriptors, in one of four buffers, and its interrupt increments the UIO event count. The program then copies the buffer out, re-arms its descriptor, returns one credit to the source and only then verifies the copy.</title><desc id="d">The real-time loop: the fabric source sends a frame only if it holds a credit; the DMA controller writes frame n into descriptor n modulo the number of descriptors, in one of four buffers, and its interrupt increments the UIO event count. The program then copies the buffer out, re-arms its descriptor, returns one credit to the source and only then verifies the copy.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 22.80s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 22.80s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}5.70%{opacity:1}8.70%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="400" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M190,102 L250,102" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M190,102 L250,102" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="198.9" y="80" width="42.2" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="220" y="92.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">frame</text>
</g>
<g id="e1">
<path d="M420,102 L480,102" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M420,102 L480,102" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="425.68" y="80" width="48.64" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="450" y="92.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">writes</text>
</g>
<g id="e2">
<path d="M335,60 L335,26 L795,26 L795,60" fill="none" stroke="#8da6d4" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ar-mss)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M335,60 L335,26 L795,26 L795,60" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="495.6" y="4" width="138.8" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="565" y="16.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">completion interrupt</text>
</g>
<g id="e3">
<path d="M795,144 L795,230" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.10s" d="M795,144 L795,230" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="799" y="178" width="48.64" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="804" y="190.5" text-anchor="start" font-size="11.5" fill="#e6ecf1">read()</text>
</g>
<g id="e4">
<path d="M710,272 L650,272" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:11.70s" d="M710,272 L650,272" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e5">
<path d="M480,272 L420,272" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:14.30s" d="M480,272 L420,272" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e6">
<path d="M250,272 L190,272" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:18.20s" d="M250,272 L190,272" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e7">
<path d="M335,230 L335,187 L105,187 L105,144" fill="none" stroke="#5fbf84" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ar-fabric)"/>
<path class="hl flow" style="animation-delay:16.90s" d="M335,230 L335,187 L105,187 L105,144" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="182.8" y="165" width="74.4" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="220" y="177.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">credit + 1</text>
</g>
<g id="fab">
<rect x="20" y="60" width="170" height="84" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="105" y="89.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Stream source</text>
<text x="105" y="106.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">needs a credit to send</text>
<text x="105" y="123.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">otherwise drops the slot</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="59" width="172" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="dma">
<rect x="250" y="60" width="170" height="84" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="335" y="89.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">DMA controller</text>
<text x="335" y="106.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">frame n goes to</text>
<text x="335" y="123.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">descriptor n % ndest</text>
<rect class="hl" style="animation-delay:2.60s" x="249" y="59" width="172" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="bufs">
<rect x="480" y="60" width="170" height="84" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="565" y="89.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Four buffers</text>
<text x="565" y="106.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">BUF_OFF + k * slot_sz</text>
<text x="565" y="123.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">non-cached region</text>
<rect class="hl" style="animation-delay:5.20s" x="479" y="59" width="172" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="uio">
<rect x="710" y="60" width="170" height="84" rx="9" fill="#232c44" stroke="#8da6d4" stroke-width="1.5"/>
<text x="795" y="89.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">DMA interrupt</text>
<text x="795" y="106.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">UIO event count: how</text>
<text x="795" y="123.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">many have completed</text>
<rect class="hl" style="animation-delay:7.80s" x="709" y="59" width="172" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="copy">
<rect x="710" y="230" width="170" height="84" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="795" y="259.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">1 Copy out</text>
<text x="795" y="276.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">memcpy of buffer k</text>
<text x="795" y="293.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">k = processed % ndest</text>
<rect class="hl" style="animation-delay:10.40s" x="709" y="229" width="172" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="rearm">
<rect x="480" y="230" width="170" height="84" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="565" y="259.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">2 Re-arm</text>
<text x="565" y="276.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">arm_rt(k, ...)</text>
<text x="565" y="293.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">descriptor k valid again</text>
<rect class="hl" style="animation-delay:13.00s" x="479" y="229" width="172" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="credit">
<rect x="250" y="230" width="170" height="84" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="335" y="259.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">3 Return a credit</text>
<text x="335" y="276.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">SRC_CREDIT = 1</text>
<text x="335" y="293.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">only after the re-arm</text>
<rect class="hl" style="animation-delay:15.60s" x="249" y="229" width="172" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="verify">
<rect x="20" y="230" width="170" height="84" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="105" y="259.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">4 Verify</text>
<text x="105" y="276.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">verify(copy, ...)</text>
<text x="105" y="293.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">gaps allowed</text>
<rect class="hl" style="animation-delay:19.50s" x="19" y="229" width="172" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="362" text-anchor="start" font-size="12" fill="#9aa8b5">Credits start as 0x80000000 | ndest: the fabric holds exactly as many credits as there are armed descriptors.</text>
<text x="20" y="385" text-anchor="start" font-size="12" fill="#9aa8b5">A slow consumer shows up as a drop count in the fabric, not as corruption.</text>
</svg>
