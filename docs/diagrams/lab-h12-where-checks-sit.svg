<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d">
<title id="t">How the checks are attached. The existing stream testbench is instantiated unchanged inside a new top level, tb_pfdaq_assert. It drives the stream source over APB and sets TREADY. The checker connects to the stream ports only, and a snoop module copies the APB register writes so the checker knows the run configuration. The coverage module takes events from the checker and a few probes from inside the design. At the end of the run the checker prints a violation count per rule and the coverage module prints its table.</title><desc id="d">How the checks are attached. The existing stream testbench is instantiated unchanged inside a new top level, tb_pfdaq_assert. It drives the stream source over APB and sets TREADY. The checker connects to the stream ports only, and a snoop module copies the APB register writes so the checker knows the run configuration. The coverage module takes events from the checker and a few probes from inside the design. At the end of the run the checker prints a violation count per rule and the coverage module prints its table.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 44.00s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 44.00s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}6.82%{opacity:1}9.82%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
