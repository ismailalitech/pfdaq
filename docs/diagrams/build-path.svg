<text x="710" y="256" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">payload, kernel, root fs</text>
<rect class="hl" style="animation-delay:16.90s" x="619" y="209" width="182" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
