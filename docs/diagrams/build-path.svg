<text x="510" y="126" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">FlashPro Express, JTAG</text>
<rect class="hl" style="animation-delay:5.20s" x="419" y="79" width="182" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
