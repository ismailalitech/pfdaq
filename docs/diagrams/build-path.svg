<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" role="img" aria-labelledby="t d">
<title id="t">The path from a new board to a passing test suite: the FPGA design is built with hw/libero/build.sh in Libero, exported as a FlashPro job and programmed over JTAG with hw/libero/program.sh; the Linux image is built with bitbake, written to the SD card with bmaptool; the board then cold-starts from the card and runs the 27-test suite.</title><desc id="d">The path from a new board to a passing test suite: the FPGA design is built with hw/libero/build.sh in Libero, exported as a FlashPro job and programmed over JTAG with hw/libero/program.sh; the Linux image is built with bitbake, written to the SD card with bmaptool; the board then cold-starts from the card and runs the 27-test suite.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 24.10s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 24.10s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}5.39%{opacity:1}8.39%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
