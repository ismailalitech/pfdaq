<text x="430" y="371" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Cold start</text>
<text x="430" y="388" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">then the 27-test suite</text>
<rect class="hl" style="animation-delay:20.80s" x="309" y="339" width="242" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="62" text-anchor="start" font-size="12" fill="#9aa8b5" font-weight="bold">1 · The FPGA design (module H09, F05)</text>
<text x="20" y="192" text-anchor="start" font-size="12" fill="#9aa8b5" font-weight="bold">2 · The Linux image and the SD card (modules B03, B05)</text>
<text x="20" y="372" text-anchor="start" font-size="12" fill="#9aa8b5" font-weight="bold">3 · Power-cycle with the card in,</text>
<text x="20" y="389" text-anchor="start" font-size="12" fill="#9aa8b5" font-weight="bold">then run the suite (module X03)</text>
