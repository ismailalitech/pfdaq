<g id="fab1">
<rect x="20" y="80" width="180" height="66" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="110" y="109" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">hw/libero/build.sh</text>
<text x="110" y="126" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">Libero builds the fabric</text>
