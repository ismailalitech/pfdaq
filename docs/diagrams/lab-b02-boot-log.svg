<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d">
<title id="t">boot monitor console (excerpt, board)</title><desc id="d">Lines of the boot monitor's console that match the payload: the 1632-byte header and 1376656 bytes copied, the image set name, the skip-OpenSBI flag on hart 4, u-boot.bin registered for the hart mask 0xe, the two images being processed, and the cores reaching Running.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 22.40s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 22.40s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}15.18%{opacity:1}18.18%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="960" height="360" rx="12" fill="#12171d"/>
<rect x="0" y="0" width="960" height="274" fill="#0d1117"/>
<rect x="0" y="0" width="960" height="34" fill="#1b222c"/>
<circle cx="20" cy="17" r="6" fill="#ef6f6c"/>
<circle cx="38" cy="17" r="6" fill="#e6c04f"/>
<circle cx="56" cy="17" r="6" fill="#5fbf84"/>
<text x="480" y="22" text-anchor="middle" font-size="12" fill="#9aa8b5">boot monitor console (excerpt, board)</text>
<text x="24" y="58" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">[4.486903] Boot Partition found at index 1</text>
<text x="24" y="78" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">[4.492424] Attempting to read image header (1632 bytes) ...</text>
<text x="24" y="98" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">[4.501503] Copying 1376656 bytes to 0x103fc00000</text>
<text x="24" y="118" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">[4.570249] Boot image set name: "PolarFire-SoC-HSS::Disco Linux + freertos AMP"</text>
<text x="24" y="138" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">[4.606722] boot_service(u54_4):: BOOT_FLAG_SKIP_OPENSBI found</text>
<text x="24" y="158" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">&gt;&gt; [4.621426] boot_service(u54_1)::Registering domain "u-boot.bin" (hart mask 0xe)</text>
<text x="24" y="178" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">[4.733328] boot_service(u54_1)::Processing boot image: "u-boot.bin"</text>
<text x="24" y="198" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">[4.755671] boot_service(u54_4)::Processing boot image: "polarfire-soc-freertos-amp-demo.elf"</text>
<text x="24" y="218" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">[4.862061] u54 State Change:  [Booting] [Booting] [Booting] [Running]</text>
<text x="24" y="238" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">[22.485161] u54 State Change:  [Running] [Running] [Running] [Running]</text>
<rect x="0" y="274" width="960" height="86" fill="#12171d"/>
<g class="co" style="animation-delay:0.00s"><rect x="8" y="43" width="944" height="63" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="45" r="11" fill="#ffd166"/><text x="8" y="49" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="274" width="960" height="86" fill="#12171d"/>
<circle cx="24" cy="300" r="13" fill="#ffd166"/><text x="24" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="298" font-size="15" font-weight="bold" fill="#e6ecf1">The header and the payload</text>
<text x="48" y="318" font-size="13" fill="#9aa8b5">1632 bytes is chunkTableOffset 0x660; 1376656 is bootImageLength of payload.bin.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="8" y="103" width="944" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="105" r="11" fill="#ffd166"/><text x="8" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.40s">
<rect x="0" y="274" width="960" height="86" fill="#12171d"/>
<circle cx="24" cy="300" r="13" fill="#ffd166"/><text x="24" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="298" font-size="15" font-weight="bold" fill="#e6ecf1">The label</text>
<text x="48" y="318" font-size="13" fill="#9aa8b5">The set-name line of amp.yaml.in, with @@AMP_DEMO@@ replaced by freertos.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="8" y="123" width="944" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="125" r="11" fill="#ffd166"/><text x="8" y="129" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:6.80s">
<rect x="0" y="274" width="960" height="86" fill="#12171d"/>
<circle cx="24" cy="300" r="13" fill="#ffd166"/><text x="24" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="298" font-size="15" font-weight="bold" fill="#e6ecf1">No OpenSBI on hart 4</text>
<text x="48" y="318" font-size="13" fill="#9aa8b5">The skip-opensbi flag of the hart 4 entry reached the monitor.</text>
</g>
<g class="co" style="animation-delay:10.20s"><rect x="8" y="143" width="944" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="145" r="11" fill="#ffd166"/><text x="8" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:10.20s">
<rect x="0" y="274" width="960" height="86" fill="#12171d"/>
<circle cx="24" cy="300" r="13" fill="#ffd166"/><text x="24" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="298" font-size="15" font-weight="bold" fill="#e6ecf1">One image, three cores</text>
<text x="48" y="318" font-size="13" fill="#9aa8b5">u-boot.bin is registered once for the hart mask 0xe: harts 1, 2 and 3.</text>
</g>
<g class="co" style="animation-delay:13.60s"><rect x="8" y="183" width="944" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="185" r="11" fill="#ffd166"/><text x="8" y="189" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">5</text></g>
<g class="co cap" style="animation-delay:13.60s">
<rect x="0" y="274" width="960" height="86" fill="#12171d"/>
<circle cx="24" cy="300" r="13" fill="#ffd166"/><text x="24" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">5</text>
<text x="48" y="298" font-size="15" font-weight="bold" fill="#e6ecf1">The firmware on hart 4</text>
<text x="48" y="318" font-size="13" fill="#9aa8b5">The ELF is processed as hart 4's own image; hart 4 is Running at 4.86 s, before Linux.</text>
</g>
<g class="co" style="animation-delay:17.00s"><rect x="8" y="223" width="944" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="225" r="11" fill="#ffd166"/><text x="8" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">6</text></g>
<g class="co cap" style="animation-delay:17.00s">
<rect x="0" y="274" width="960" height="86" fill="#12171d"/>
<circle cx="24" cy="300" r="13" fill="#ffd166"/><text x="24" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">6</text>
<text x="48" y="298" font-size="15" font-weight="bold" fill="#e6ecf1">All four application cores</text>
<text x="48" y="318" font-size="13" fill="#9aa8b5">Later, all four cores report Running.</text>
</g>
</svg>
