<g id="user">
<rect x="10" y="40" width="190" height="80" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="105" y="67.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">User program</text>
<text x="105" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">an ecall here is a</text>
<text x="105" y="101.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">system call, not SBI</text>
<rect class="hl" style="animation-delay:0.00s" x="9" y="39" width="192" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="kern">
<rect x="255" y="40" width="190" height="80" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="350" y="67.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Linux kernel</text>
<text x="350" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">cpu4 is disabled in the</text>
<text x="350" y="101.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">device tree: no cpu 4</text>
<rect class="hl" style="animation-delay:2.80s" x="254" y="39" width="192" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="sbi">
