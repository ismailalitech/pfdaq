<text x="595" y="67.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">OpenSBI, Linux domain</text>
<text x="595" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">possible harts 0xe</text>
<text x="595" y="101.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">(harts 1, 2, 3)</text>
<rect class="hl" style="animation-delay:5.60s" x="499" y="39" width="192" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="h4">
<rect x="745" y="40" width="145" height="80" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="817.5" y="67.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Hart 4</text>
<text x="817.5" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">outside OpenSBI,</text>
<text x="817.5" y="101.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">no IPI arrives</text>
<rect class="hl" style="animation-delay:8.40s" x="744" y="39" width="147" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ihc">
<rect x="255" y="160" width="190" height="80" rx="9" fill="#232c44" stroke="#8da6d4" stroke-width="1.5"/>
<text x="350" y="187.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Mailbox doorbell</text>
<text x="350" y="204.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">SBI vendor call in</text>
<text x="350" y="221.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the kernel mailbox driver</text>
<rect class="hl" style="animation-delay:11.20s" x="254" y="159" width="192" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="fab">
