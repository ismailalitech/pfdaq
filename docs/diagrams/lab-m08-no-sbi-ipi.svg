<text x="595" y="297.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Fabric interrupt</text>
<text x="595" y="314.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">register write from</text>
<text x="595" y="331.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">user space, source 123</text>
<rect class="hl" style="animation-delay:14.00s" x="499" y="269" width="192" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="10" y="24" text-anchor="start" font-size="12" fill="#9aa8b5" font-weight="bold">SBI send_ipi to hart 4: three places where it stops</text>
<text x="10" y="385" text-anchor="start" font-size="12" fill="#9aa8b5">Red arrows do not exist on this board. The doorbell is what RPMsg already uses; the fabric interrupt is the one used here.</text>
</svg>
