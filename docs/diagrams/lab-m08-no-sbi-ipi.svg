<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img" aria-labelledby="t d">
<title id="t">Why a software interrupt by SBI inter-processor interrupt cannot reach hart 4 from Linux. A user program cannot make an SBI call at all, only the kernel can. The kernel has no cpu for hart 4, because the device tree disables cpu4. And OpenSBI, which the boot monitor registers one domain per payload, sends an inter-processor interrupt only to harts that are in the sender's domain; the Linux domain's hart mask is 0xe, harts 1 to 3, and hart 4 runs outside OpenSBI. The nearest mechanisms that exist: the mailbox doorbell, reachable only through the kernel's driver and therefore through RPMsg, and a fabric interrupt raised by a register write, reachable from user space.</title><desc id="d">Why a software interrupt by SBI inter-processor interrupt cannot reach hart 4 from Linux. A user program cannot make an SBI call at all, only the kernel can. The kernel has no cpu for hart 4, because the device tree disables cpu4. And OpenSBI, which the boot monitor registers one domain per payload, sends an inter-processor interrupt only to harts that are in the sender's domain; the Linux domain's hart mask is 0xe, harts 1 to 3, and hart 4 runs outside OpenSBI. The nearest mechanisms that exist: the mailbox doorbell, reachable only through the kernel's driver and therefore through RPMsg, and a fabric interrupt raised by a register write, reachable from user space.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 18.80s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 18.80s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}7.45%{opacity:1}10.45%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
