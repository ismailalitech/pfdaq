<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d">
<title id="t">The two addresses of one buffer in pfdaq_cap: ddr is the program's own virtual address, mapped from /dev/udmabuf-ddr-nc0, and is used to write the descriptor and read the frames; ddr_phys is read from sysfs and is what goes into the descriptor's destination field and into the DMA controller's stream address register.</title><desc id="d">The two addresses of one buffer in pfdaq_cap: ddr is the program's own virtual address, mapped from /dev/udmabuf-ddr-nc0, and is used to write the descriptor and read the frames; ddr_phys is read from sysfs and is what goes into the descriptor's destination field and into the DMA controller's stream address register.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 26.00s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 26.00s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}11.54%{opacity:1}14.54%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="360" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M340,63 L520,63" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.00s" d="M340,63 L520,63" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e1">
<path d="M340,86.1 L430,86.1 L430,163 L520,163" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.00s" d="M340,86.1 L430,86.1 L430,163 L520,163" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e2">
<path d="M340,263 L520,263" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:18.00s" d="M340,263 L520,263" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="phys">
<rect x="20" y="30" width="320" height="66" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="180" y="50.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">ddr_phys</text>
<text x="180" y="67.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">read from sysfs: udmabuf-ddr-nc0</text>
<text x="180" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">phys_addr (the hardware's address)</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="29" width="322" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="virt">
<rect x="20" y="230" width="320" height="66" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="180" y="250.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">ddr</text>
<text x="180" y="267.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">mmap of /dev/udmabuf-ddr-nc0</text>
<text x="180" y="284.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">(the program's virtual address)</text>
<rect class="hl" style="animation-delay:15.00s" x="19" y="229" width="322" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="d2">
<rect x="520" y="30" width="360" height="66" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="700" y="59" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">desc[2], the destination</text>
<text x="700" y="76" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">(uint32_t)(ddr_phys + dest_off)</text>
<rect class="hl" style="animation-delay:6.00s" x="519" y="29" width="362" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="dreg">
<rect x="520" y="130" width="360" height="66" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="700" y="159" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">DMA stream address register</text>
<text x="700" y="176" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">(uint32_t)(ddr_phys + DESC_OFF)</text>
<rect class="hl" style="animation-delay:12.00s" x="519" y="129" width="362" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="cpu">
<rect x="520" y="230" width="360" height="66" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="700" y="250.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Program on Linux</text>
<text x="700" y="267.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">writes the descriptor at ddr + DESC_OFF</text>
<text x="700" y="284.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">reads the frames through ddr</text>
<rect class="hl" style="animation-delay:21.00s" x="519" y="229" width="362" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="336" text-anchor="start" font-size="12" fill="#9aa8b5">Mixing the two up is the classic first mistake (module I04).</text>
</svg>
