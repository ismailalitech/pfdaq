<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d">
<title id="t">Where the other board pins go. DIP5 to DIP8 are inputs, through an inverter, to MSS GPIO2 bits 25 to 28, so they can be read through the gpiochip device. DIP1 to DIP4 are not GPIO lines: they are interrupt inputs F2M[6] to F2M[9], PLIC sources 124 to 127, and no handler is registered for them on this image. LED8 is driven by line 9 of the first GPIO chip, with no fabric logic in between.</title><desc id="d">Where the other board pins go. DIP5 to DIP8 are inputs, through an inverter, to MSS GPIO2 bits 25 to 28, so they can be read through the gpiochip device. DIP1 to DIP4 are not GPIO lines: they are interrupt inputs F2M[6] to F2M[9], PLIC sources 124 to 127, and no handler is registered for them on this image. LED8 is driven by line 9 of the first GPIO chip, with no fabric logic in between.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 21.50s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 21.50s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}6.05%{opacity:1}9.05%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
