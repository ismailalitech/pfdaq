<text x="12" y="146" font-size="12" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">snap_tgl_a</text>
<path d="M140,134 L140,134 L214,134 L214,154 L880,154" fill="none" stroke="#5fbf84" stroke-width="2" stroke-linejoin="round"/>
<text x="12" y="186" font-size="12" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">snapv_sync_p</text>
