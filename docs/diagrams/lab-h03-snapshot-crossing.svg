<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-labelledby="t d">
<title id="t">Waveform from the stream simulation: the end of the first run, from ACLK to PCLK. At one ACLK edge the run ends: busy_a falls, snap_tgl_a flips and the snapshot registers hold their final values. In PCLK the chain snapv_sync_p shifts the new level in, snapv_pulse_p goes high for one PCLK clock, and at the next PCLK edge the bank snap_frames_p takes the value 5 and done_p is set together with it. The busy bit of STATUS falls one PCLK clock earlier than done_p rises.</title><desc id="d">Waveform from the stream simulation: the end of the first run, from ACLK to PCLK. At one ACLK edge the run ends: busy_a falls, snap_tgl_a flips and the snapshot registers hold their final values. In PCLK the chain snapv_sync_p shifts the new level in, snapv_pulse_p goes high for one PCLK clock, and at the next PCLK edge the bank snap_frames_p takes the value 5 and done_p is set together with it. The busy bit of STATUS falls one PCLK clock earlier than done_p rises.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 19.00s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 19.00s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}17.89%{opacity:1}20.89%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="480" rx="12" fill="#12171d"/>
<rect x="0" y="0" width="900" height="376" fill="#0d1117"/>
<line x1="140" y1="30" x2="140" y2="370" stroke="#27313d" stroke-dasharray="2 4"/><text x="140" y="22" text-anchor="middle" font-size="11" fill="#9aa8b5">2540 ns</text>
<line x1="232.5" y1="30" x2="232.5" y2="370" stroke="#27313d" stroke-dasharray="2 4"/><text x="232.5" y="22" text-anchor="middle" font-size="11" fill="#9aa8b5">2550 ns</text>
<line x1="325" y1="30" x2="325" y2="370" stroke="#27313d" stroke-dasharray="2 4"/><text x="325" y="22" text-anchor="middle" font-size="11" fill="#9aa8b5">2560 ns</text>
<line x1="417.5" y1="30" x2="417.5" y2="370" stroke="#27313d" stroke-dasharray="2 4"/><text x="417.5" y="22" text-anchor="middle" font-size="11" fill="#9aa8b5">2570 ns</text>
<line x1="510" y1="30" x2="510" y2="370" stroke="#27313d" stroke-dasharray="2 4"/><text x="510" y="22" text-anchor="middle" font-size="11" fill="#9aa8b5">2580 ns</text>
<line x1="602.5" y1="30" x2="602.5" y2="370" stroke="#27313d" stroke-dasharray="2 4"/><text x="602.5" y="22" text-anchor="middle" font-size="11" fill="#9aa8b5">2590 ns</text>
<line x1="695" y1="30" x2="695" y2="370" stroke="#27313d" stroke-dasharray="2 4"/><text x="695" y="22" text-anchor="middle" font-size="11" fill="#9aa8b5">2600 ns</text>
<line x1="787.5" y1="30" x2="787.5" y2="370" stroke="#27313d" stroke-dasharray="2 4"/><text x="787.5" y="22" text-anchor="middle" font-size="11" fill="#9aa8b5">2610 ns</text>
<line x1="880" y1="30" x2="880" y2="370" stroke="#27313d" stroke-dasharray="2 4"/><text x="880" y="22" text-anchor="middle" font-size="11" fill="#9aa8b5">2620 ns</text>
<text x="12" y="66" font-size="12" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">PCLK</text>
