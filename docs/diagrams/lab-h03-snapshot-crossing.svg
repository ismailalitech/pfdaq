<text x="186.25" y="188" text-anchor="middle" font-size="11" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">111</text>
<rect x="233" y="173" width="184" height="22" rx="4" fill="#1b2a3a" stroke="#5aa0d6" stroke-width="1.2"/>
<text x="325" y="188" text-anchor="middle" font-size="11" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">110</text>
<rect x="418" y="173" width="184" height="22" rx="4" fill="#1b2a3a" stroke="#5aa0d6" stroke-width="1.2"/>
<text x="510" y="188" text-anchor="middle" font-size="11" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">100</text>
<rect x="603" y="173" width="276.5" height="22" rx="4" fill="#1b2a3a" stroke="#5aa0d6" stroke-width="1.2"/>
<text x="741.25" y="188" text-anchor="middle" font-size="11" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">000</text>
<text x="12" y="226" font-size="12" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">snapv_pulse_p</text>
<path d="M140,234 L140,234 L417.5,234 L417.5,214 L602.5,214 L602.5,234 L880,234" fill="none" stroke="#5aa0d6" stroke-width="2" stroke-linejoin="round"/>
<text x="12" y="266" font-size="12" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">STATUS busy</text>
<path d="M140,254 L140,254 L417.5,254 L417.5,274 L880,274" fill="none" stroke="#5aa0d6" stroke-width="2" stroke-linejoin="round"/>
<text x="12" y="306" font-size="12" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">snap_frames_p</text>
<rect x="140.5" y="293" width="461.5" height="22" rx="4" fill="#1b2a3a" stroke="#c0a95f" stroke-width="1.2"/>
<text x="371.25" y="308" text-anchor="middle" font-size="11" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">0</text>
<rect x="603" y="293" width="276.5" height="22" rx="4" fill="#1b2a3a" stroke="#c0a95f" stroke-width="1.2"/>
<text x="741.25" y="308" text-anchor="middle" font-size="11" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">5</text>
<text x="12" y="346" font-size="12" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">done_p</text>
<path d="M140,354 L140,354 L602.5,354 L602.5,334 L880,334" fill="none" stroke="#c0a95f" stroke-width="2" stroke-linejoin="round"/>
<rect x="0" y="376" width="900" height="104" fill="#12171d"/>
<g class="co" style="animation-delay:0.00s"><rect x="214" y="30" width="18.5" height="340" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="214" cy="30" r="11" fill="#ffd166"/><text x="214" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="376" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="404" r="13" fill="#ffd166"/><text x="24" y="409" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="402" font-size="15" font-weight="bold" fill="#e6ecf1">The run ends</text>
<text x="48" y="422" font-size="13" fill="#9aa8b5">In ACLK, at 2548 ns: busy_a falls, snap_tgl_a flips, and the final counters are written and then held.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="232.5" y="30" width="185" height="340" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="232.5" cy="30" r="11" fill="#ffd166"/><text x="232.5" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.40s">
<rect x="0" y="376" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="404" r="13" fill="#ffd166"/><text x="24" y="409" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="402" font-size="15" font-weight="bold" fill="#e6ecf1">The chain</text>
<text x="48" y="422" font-size="13" fill="#9aa8b5">In PCLK the toggle is shifted in: 110 at 2550 ns, 100 at 2570 ns, 000 at 2590 ns.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="417.5" y="30" width="37" height="340" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="417.5" cy="30" r="11" fill="#ffd166"/><text x="417.5" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:6.80s">
<rect x="0" y="376" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="404" r="13" fill="#ffd166"/><text x="24" y="409" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="402" font-size="15" font-weight="bold" fill="#e6ecf1">busy falls first</text>
<text x="48" y="422" font-size="13" fill="#9aa8b5">STATUS busy falls at 2570 ns, 20 ns before done: in this run a STATUS read in the gap returns 0x0.</text>
</g>
<g class="co" style="animation-delay:10.20s"><rect x="417.5" y="30" width="185" height="340" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="417.5" cy="30" r="11" fill="#ffd166"/><text x="417.5" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:10.20s">
<rect x="0" y="376" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="404" r="13" fill="#ffd166"/><text x="24" y="409" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="402" font-size="15" font-weight="bold" fill="#e6ecf1">One pulse</text>
<text x="48" y="422" font-size="13" fill="#9aa8b5">snapv_pulse_p is high for one PCLK clock. The snap_* registers have not changed since 2548 ns.</text>
</g>
<g class="co" style="animation-delay:13.60s"><rect x="602.5" y="30" width="18.5" height="340" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="602.5" cy="30" r="11" fill="#ffd166"/><text x="602.5" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">5</text></g>
<g class="co cap" style="animation-delay:13.60s">
<rect x="0" y="376" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="404" r="13" fill="#ffd166"/><text x="24" y="409" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">5</text>
<text x="48" y="402" font-size="15" font-weight="bold" fill="#e6ecf1">Data and done together</text>
<text x="48" y="422" font-size="13" fill="#9aa8b5">At 2590 ns the bank snap_frames_p takes 5 and done_p rises in the same edge.</text>
</g>
</svg>
