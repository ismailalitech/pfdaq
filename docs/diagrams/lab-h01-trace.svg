<text x="48" y="558" font-size="15" font-weight="bold" fill="#e6ecf1">After the run</text>
<text x="48" y="578" font-size="13" fill="#9aa8b5">STATUS 2 is done, not busy. 5 frames, 0x3c is 60 words, next sequence number 5.</text>
</g>
<g class="co" style="animation-delay:13.60s"><rect x="8" y="483" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
