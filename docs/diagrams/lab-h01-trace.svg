<text x="48" y="558" font-size="15" font-weight="bold" fill="#e6ecf1">Counts since reset</text>
<text x="48" y="578" font-size="13" fill="#9aa8b5">Scenario 2 starts from 5 frames: the snapshot counts since reset, not since START.</text>
