<text x="48" y="558" font-size="15" font-weight="bold" fill="#e6ecf1">Identity</text>
<text x="48" y="578" font-size="13" fill="#9aa8b5">ID reads 50464451, the ASCII text PFDQ. VERSION reads 00050000. Both are constants.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="8" y="103" width="884" height="163" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
