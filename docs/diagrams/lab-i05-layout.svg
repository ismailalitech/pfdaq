<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d">
<title id="t">Layout of the 32 MiB non-cached region: the stream descriptor at offset 0 (four descriptors 0x40 bytes apart in real-time mode), the first burst buffer at 0x1000, the second burst buffer after the first rounded up to 4 KiB plus another page, and the scratch area of the shared-memory test at 0x1F0_0000.</title><desc id="d">Layout of the 32 MiB non-cached region: the stream descriptor at offset 0 (four descriptors 0x40 bytes apart in real-time mode), the first burst buffer at 0x1000, the second burst buffer after the first rounded up to 4 KiB plus another page, and the scratch area of the shared-memory test at 0x1F0_0000.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 8.50s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 8.50s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}15.29%{opacity:1}18.29%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="360" rx="12" fill="#12171d"/>
<g id="desc">
<rect x="20" y="40" width="340" height="56" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="190" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">0x0000  Descriptors</text>
<text x="190" y="81" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">DESC_OFF; real-time: four, 0x40 apart</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="39" width="342" height="58" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="b0">
<rect x="20" y="106" width="340" height="56" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="190" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">0x1000  Burst buffer 0</text>
<text x="190" y="147" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">BUF_OFF, page-aligned</text>
<rect class="hl" style="animation-delay:1.30s" x="19" y="105" width="342" height="58" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="b1">
<rect x="20" y="172" width="340" height="56" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="190" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Burst buffer 1</text>
<text x="190" y="213" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">after buffer 0, rounded to 4 KiB + a page</text>
<rect class="hl" style="animation-delay:2.60s" x="19" y="171" width="342" height="58" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="free">
<rect x="20" y="238" width="340" height="40" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="190" y="262.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">the rest of the region</text>
<rect class="hl" style="animation-delay:3.90s" x="19" y="237" width="342" height="42" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="shm">
<rect x="20" y="288" width="340" height="56" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="190" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">0x1F0_0000  shared-memory test</text>
<text x="190" y="329" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">away from the capture buffers</text>
<rect class="hl" style="animation-delay:5.20s" x="19" y="287" width="342" height="58" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="400" y="62" text-anchor="start" font-size="12" fill="#9aa8b5">Burst mode uses one descriptor; real-time mode four,</text>
<text x="400" y="80" text-anchor="start" font-size="12" fill="#9aa8b5">each announced in its own stream address register.</text>
<text x="400" y="128" text-anchor="start" font-size="12" fill="#9aa8b5">Before each burst the first 64 bytes of the buffer are set</text>
<text x="400" y="146" text-anchor="start" font-size="12" fill="#9aa8b5">to 0xEE: stale data is then recognisable.</text>
<text x="400" y="194" text-anchor="start" font-size="12" fill="#9aa8b5">A burst is at most 8 MiB (MAX_BURST); the tool checks</text>
<text x="400" y="212" text-anchor="start" font-size="12" fill="#9aa8b5">that two bursts fit the 32 MiB region.</text>
<text x="400" y="310" text-anchor="start" font-size="12" fill="#9aa8b5">The cached test uses offset 0x10_0000 of its own region.</text>
</svg>
