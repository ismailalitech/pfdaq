<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" width="900" height="395" role="img" aria-labelledby="t d">
<title id="t">A frame of 32-bit words and the check that catches each kind of damage: word 0 (0xA55A in the top half, the payload length below) is checked for bad_magic, word 1 the sequence number for bad_seq, the timestamp in word 2 is not compared, the payload words are recomputed by a model of the fabric and checked for bad_payload, and the last word, a CRC-32 over all earlier words, is checked for bad_crc.</title><desc id="d">A frame of 32-bit words and the check that catches each kind of damage: word 0 (0xA55A in the top half, the payload length below) is checked for bad_magic, word 1 the sequence number for bad_seq, the timestamp in word 2 is not compared, the payload words are recomputed by a model of the fabric and checked for bad_payload, and the last word, a CRC-32 over all earlier words, is checked for bad_crc.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 17.60s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 17.60s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}7.39%{opacity:1}10.39%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="395" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M120,110 L120,190" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M120,110 L120,190" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e1">
<path d="M305,110 L305,190" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:5.20s" d="M305,110 L305,190" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e3">
<path d="M615,110 L615,190" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.10s" d="M615,110 L615,190" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e4">
<path d="M795,110 L795,190" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:13.00s" d="M795,110 L795,190" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="w0">
<rect x="20" y="40" width="200" height="70" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="120" y="71" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Word 0</text>
<text x="120" y="88" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">0xA55A0000 | payload_words</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="39" width="202" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="w1">
<rect x="230" y="40" width="150" height="70" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="305" y="71" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Word 1</text>
<text x="305" y="88" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">sequence number</text>
<rect class="hl" style="animation-delay:3.90s" x="229" y="39" width="152" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="w2">
<rect x="390" y="40" width="130" height="70" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="455" y="71" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Word 2</text>
<text x="455" y="88" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">timestamp</text>
</g>
<g id="pl">
<rect x="530" y="40" width="170" height="70" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="615" y="71" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Words 3 to N+2</text>
<text x="615" y="88" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">payload</text>
<rect class="hl" style="animation-delay:7.80s" x="529" y="39" width="172" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="crc">
<rect x="710" y="40" width="170" height="70" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="795" y="71" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Word N+3</text>
<text x="795" y="88" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">CRC-32 of words 0..N+2</text>
<rect class="hl" style="animation-delay:11.70s" x="709" y="39" width="172" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="c0">
<rect x="20" y="190" width="200" height="80" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="120" y="217.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">bad_magic</text>
<text x="120" y="234.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">counted, frame skipped</text>
<text x="120" y="251.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">seq and model not advanced</text>
<rect class="hl" style="animation-delay:2.60s" x="19" y="189" width="202" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="c1">
<rect x="230" y="190" width="150" height="80" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="305" y="217.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">bad_seq</text>
<text x="305" y="234.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">real-time mode:</text>
<text x="305" y="251.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">counted as seq_gap</text>
<rect class="hl" style="animation-delay:6.50s" x="229" y="189" width="152" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="c3">
<rect x="530" y="190" width="170" height="80" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="615" y="217.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">bad_payload</text>
<text x="615" y="234.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">model recomputes it:</text>
<text x="615" y="251.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">counter, PRBS or FIR</text>
<rect class="hl" style="animation-delay:10.40s" x="529" y="189" width="172" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="c4">
<rect x="710" y="190" width="170" height="80" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="795" y="217.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">bad_crc</text>
<text x="795" y="234.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">crc32_words() differs</text>
<text x="795" y="251.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">from the last word</text>
<rect class="hl" style="animation-delay:14.30s" x="709" y="189" width="172" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="410" y="160" text-anchor="start" font-size="12" fill="#9aa8b5">not compared</text>
<text x="20" y="310" text-anchor="start" font-size="12" fill="#9aa8b5">A frame is payload + 4 words long. The CRC equals the standard zlib.crc32 of the raw bytes.</text>
<text x="20" y="335" text-anchor="start" font-size="12" fill="#9aa8b5">A flipped payload bit is caught twice (bad_payload and bad_crc): the fabric's CRC covers the intended payload.</text>
<text x="20" y="360" text-anchor="start" font-size="12" fill="#9aa8b5">The check recomputes what the hardware should have produced; it does not compare against a stored copy.</text>
</svg>
