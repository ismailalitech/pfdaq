<rect x="0" y="394" width="960" height="76" fill="#12171d"/>
<circle cx="24" cy="420" r="13" fill="#ffd166"/><text x="24" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">5</text>
<text x="48" y="418" font-size="15" font-weight="bold" fill="#e6ecf1">U-Boot to the kernel</text>
<text x="48" y="438" font-size="13" fill="#9aa8b5">U-Boot loads the kernel from the FIT image on the first partition and starts it.</text>
</g>
<g class="co" style="animation-delay:16.00s"><rect x="8" y="243" width="944" height="83" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="245" r="11" fill="#ffd166"/><text x="8" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">6</text></g>
<g class="co cap" style="animation-delay:16.00s">
<rect x="0" y="394" width="960" height="76" fill="#12171d"/>
<circle cx="24" cy="420" r="13" fill="#ffd166"/><text x="24" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">6</text>
<text x="48" y="418" font-size="15" font-weight="bold" fill="#e6ecf1">Linux and the supervisor</text>
<text x="48" y="438" font-size="13" fill="#9aa8b5">The device tree's model, remoteproc attaching, the RPMsg channel, then the login prompt.</text>
</g>
<g class="co" style="animation-delay:19.20s"><rect x="8" y="323" width="944" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="325" r="11" fill="#ffd166"/><text x="8" y="329" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">7</text></g>
<g class="co cap" style="animation-delay:19.20s">
<rect x="0" y="394" width="960" height="76" fill="#12171d"/>
<circle cx="24" cy="420" r="13" fill="#ffd166"/><text x="24" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">7</text>
<text x="48" y="418" font-size="15" font-weight="bold" fill="#e6ecf1">The proof</text>
<text x="48" y="438" font-size="13" fill="#9aa8b5">The suite is run from the PC and summarised; the fresh-card run ended with 27/27.</text>
</g>
