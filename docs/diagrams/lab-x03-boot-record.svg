<text x="48" y="418" font-size="15" font-weight="bold" fill="#e6ecf1">The boot monitor</text>
<text x="48" y="438" font-size="13" fill="#9aa8b5">It starts from the chip's boot flash, which this project never writes.</text>
</g>
<g class="co" style="animation-delay:3.20s"><rect x="8" y="63" width="944" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="65" r="11" fill="#ffd166"/><text x="8" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.20s">
<rect x="0" y="394" width="960" height="76" fill="#12171d"/>
<circle cx="24" cy="420" r="13" fill="#ffd166"/><text x="24" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="418" font-size="15" font-weight="bold" fill="#e6ecf1">The card</text>
<text x="48" y="438" font-size="13" fill="#9aa8b5">It selects the SD card and takes the payload from the partition at index 1.</text>
</g>
<g class="co" style="animation-delay:6.40s"><rect x="8" y="103" width="944" height="63" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="105" r="11" fill="#ffd166"/><text x="8" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:6.40s">
<rect x="0" y="394" width="960" height="76" fill="#12171d"/>
<circle cx="24" cy="420" r="13" fill="#ffd166"/><text x="24" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="418" font-size="15" font-weight="bold" fill="#e6ecf1">The payload</text>
<text x="48" y="438" font-size="13" fill="#9aa8b5">The image set and its two images: U-Boot for harts 1 to 3, the supervisor for hart 4.</text>
</g>
<g class="co" style="animation-delay:9.60s"><rect x="8" y="163" width="944" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="165" r="11" fill="#ffd166"/><text x="8" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:9.60s">
<rect x="0" y="394" width="960" height="76" fill="#12171d"/>
<circle cx="24" cy="420" r="13" fill="#ffd166"/><text x="24" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="418" font-size="15" font-weight="bold" fill="#e6ecf1">Four cores up</text>
<text x="48" y="438" font-size="13" fill="#9aa8b5">All four application cores report Running.</text>
</g>
<g class="co" style="animation-delay:12.80s"><rect x="8" y="183" width="944" height="63" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="185" r="11" fill="#ffd166"/><text x="8" y="189" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">5</text></g>
