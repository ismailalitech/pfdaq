<path class="hl flow" style="animation-delay:9.00s" d="M220,195 L255,195 L255,175 L290,175" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
