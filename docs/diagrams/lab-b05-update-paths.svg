<path class="hl flow" style="animation-delay:30.00s" d="M800,256 L800,283 L790,283 L790,310" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="pc">
<rect x="20" y="150" width="200" height="90" rx="9" fill="#2a3140" stroke="#c9d3dd" stroke-width="1.5"/>
<text x="120" y="182.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">PC</text>
<text x="120" y="199.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">files from Yocto or</text>
<text x="120" y="216.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">firmware/build_payload.sh</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="149" width="202" height="92" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="t1">
<rect x="290" y="30" width="340" height="70" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="460" y="52.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Tools and module</text>
<text x="460" y="69.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">root filesystem, partition 3</text>
<text x="460" y="86.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">scp, install, depmod: no reboot</text>
<rect class="hl" style="animation-delay:6.00s" x="289" y="29" width="342" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="t2">
<rect x="290" y="140" width="340" height="70" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="460" y="162.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Kernel image (fitImage)</text>
<text x="460" y="179.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">partition 1, FAT: mount, copy, sync</text>
<text x="460" y="196.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">checksum prefixes compared</text>
<rect class="hl" style="animation-delay:12.00s" x="289" y="139" width="342" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="t3">
<rect x="290" y="250" width="340" height="70" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="460" y="272.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Boot payload (payload.bin)</text>
<text x="460" y="289.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">partition 2, raw: dd conv=fsync</text>
<text x="460" y="306.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">read-back checksum compared</text>
<rect class="hl" style="animation-delay:18.00s" x="289" y="249" width="342" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="reboot">
<rect x="700" y="190" width="200" height="66" rx="9" fill="#232c44" stroke="#8da6d4" stroke-width="1.5"/>
<text x="800" y="219" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Reboot</text>
<text x="800" y="236" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">ssh root@&lt;board&gt; reboot</text>
<rect class="hl" style="animation-delay:27.00s" x="699" y="189" width="202" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="check">
<rect x="675" y="310" width="230" height="90" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="790" y="334" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Check</text>
<text x="790" y="351" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">remoteproc attached</text>
<text x="790" y="368" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">channel pfdaq-supervisor</text>
<text x="790" y="385" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">supervised capture passes</text>
<rect class="hl" style="animation-delay:33.00s" x="674" y="309" width="232" height="92" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="372" text-anchor="start" font-size="12" fill="#9aa8b5">Before every write to a block device, show which device it is.</text>
<text x="20" y="394" text-anchor="start" font-size="12" fill="#9aa8b5">Do not reboot until the two checksum prefixes are equal.</text>
<text x="20" y="416" text-anchor="start" font-size="12" fill="#9aa8b5">The rollback that always works is the proven image on the PC.</text>
</svg>
