<path class="hl flow" style="animation-delay:21.00s" d="M630,175 L665,175 L665,223 L700,223" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
