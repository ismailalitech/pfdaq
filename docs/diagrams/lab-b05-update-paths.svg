<path class="hl flow" style="animation-delay:15.00s" d="M220,226.5 L255,226.5 L255,285 L290,285" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
