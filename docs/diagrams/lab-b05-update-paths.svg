<path class="hl flow" style="animation-delay:24.00s" d="M630,285 L665,285 L665,223 L700,223" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
