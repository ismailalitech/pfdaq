<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t d">
<title id="t">Where a fault is injected and where it is counted: the FAULT register is read at START by the stream source, which inverts bit 0 of a CRC word, bit 8 of the first payload word or skips a sequence number; the damaged frame travels through the DMA and DDR to the Linux verifier, which counts bad_crc, bad_payload and bad_seq, and the error count goes to the supervisor in each status message.</title><desc id="d">Where a fault is injected and where it is counted: the FAULT register is read at START by the stream source, which inverts bit 0 of a CRC word, bit 8 of the first payload word or skips a sequence number; the damaged frame travels through the DMA and DDR to the Linux verifier, which counts bad_crc, bad_payload and bad_seq, and the error count goes to the supervisor in each status message.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 20.20s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 20.20s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}6.44%{opacity:1}9.44%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="380" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M135,112 L135,141 L115,141 L115,170" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M135,112 L135,141 L115,141 L115,170" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="139" y="117.5" width="93.72" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="144" y="130" text-anchor="start" font-size="11.5" fill="#e6ecf1">read at START</text>
</g>
<g id="e1">
<path d="M210,208 L250,208" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M210,208 L250,208" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e2">
<path d="M370,208 L410,208" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M370,208 L410,208" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e3">
<path d="M560,208 L640,208" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.10s" d="M560,208 L640,208" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e4">
<path d="M688,246 L688,273 L585,273 L585,300" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:11.70s" d="M688,246 L688,273 L585,273 L585,300" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e5">
<path d="M772,246 L772,273 L725,273 L725,300" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:13.00s" d="M772,246 L772,273 L725,273 L725,300" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e6">
<path d="M860.8,246 L860.8,273 L850,273 L850,300" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:14.30s" d="M860.8,246 L860.8,273 L850,273 L850,300" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e7">
<path d="M760,170 L760,96" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:15.60s" d="M760,170 L760,96" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="764" y="124" width="80.84" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="769" y="136.5" text-anchor="start" font-size="11.5" fill="#e6ecf1">error count</text>
</g>
<g id="reg">
<rect x="20" y="20" width="230" height="92" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="135" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">FAULT register 0x18</text>
<text x="135" y="62" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">bit 0 CRC, bit 1 sequence,</text>
<text x="135" y="79" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">bit 2 payload; 31:16 index</text>
<text x="135" y="96" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">written before START</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="19" width="232" height="94" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="sup">
<rect x="640" y="20" width="240" height="76" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="760" y="45.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Supervisor, hart 4</text>
<text x="760" y="62.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">adds the counts it is told:</text>
<text x="760" y="79.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">it counts, it does not alarm</text>
<rect class="hl" style="animation-delay:16.90s" x="639" y="19" width="242" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="src">
<rect x="20" y="170" width="190" height="76" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="115" y="204" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Stream source</text>
<text x="115" y="221" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">injects at the chosen frame</text>
<rect class="hl" style="animation-delay:2.60s" x="19" y="169" width="192" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="dma">
<rect x="250" y="170" width="120" height="76" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="310" y="204" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">DMA</text>
<text x="310" y="221" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">carries it</text>
<rect class="hl" style="animation-delay:5.20s" x="249" y="169" width="122" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ddr">
<rect x="410" y="170" width="150" height="76" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="485" y="204" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">DDR</text>
<text x="485" y="221" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">non-cached window</text>
<rect class="hl" style="animation-delay:7.80s" x="409" y="169" width="152" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ver">
<rect x="640" y="170" width="240" height="76" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="760" y="195.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Linux verifier</text>
<text x="760" y="212.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">pfdaq_cap, software model</text>
<text x="760" y="229.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">expects exact counts</text>
<rect class="hl" style="animation-delay:10.40s" x="639" y="169" width="242" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ccrc">
<rect x="530" y="300" width="110" height="50" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="585" y="329.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">bad_crc</text>
</g>
<g id="cpay">
<rect x="665" y="300" width="120" height="50" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="725" y="329.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">bad_payload</text>
</g>
<g id="cseq">
<rect x="810" y="300" width="80" height="50" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="850" y="329.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">bad_seq</text>
</g>
<text x="20" y="290" text-anchor="start" font-size="12" fill="#9aa8b5">CRC fault: only bad_crc rises.</text>
<text x="20" y="314" text-anchor="start" font-size="12" fill="#9aa8b5">Sequence fault: only bad_seq rises.</text>
<text x="20" y="338" text-anchor="start" font-size="12" fill="#9aa8b5">Payload fault: bad_payload and bad_crc both rise,</text>
<text x="20" y="358" text-anchor="start" font-size="12" fill="#9aa8b5">because the CRC was computed before the bit flip.</text>
</svg>
