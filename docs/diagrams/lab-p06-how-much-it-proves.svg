<path d="M450,86 L450,128 L804,128 L804,170" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:11.70s" d="M450,86 L450,128 L804,128 L804,170" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="root">
<rect x="270" y="20" width="360" height="66" rx="9" fill="#2a3140" stroke="#c9d3dd" stroke-width="1.5"/>
<text x="450" y="49" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">n trials, no failure</text>
<text x="450" y="66" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">rate below about 3/n, 95 % confidence</text>
<rect class="hl" style="animation-delay:0.00s" x="269" y="19" width="362" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="c1">
<rect x="8" y="170" width="165" height="86" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="90.5" y="200.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">30 clean boots</text>
<text x="90.5" y="217.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">3/30 = 0.1</text>
<text x="90.5" y="234.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">up to 10 % possible</text>
<rect class="hl" style="animation-delay:2.60s" x="7" y="169" width="167" height="88" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="c2">
<rect x="185" y="170" width="165" height="86" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="267.5" y="200.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">1 failure in 60?</text>
<text x="267.5" y="217.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">(59/60)^30 = 0.60</text>
<text x="267.5" y="234.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">30 clean: likely</text>
<rect class="hl" style="animation-delay:5.20s" x="184" y="169" width="167" height="88" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="c3">
<rect x="362" y="170" width="165" height="86" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="444.5" y="200.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">300 clean boots</text>
<text x="444.5" y="217.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">3/300 = 0.01</text>
<text x="444.5" y="234.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">shows a rate below 1 %</text>
<rect class="hl" style="animation-delay:7.80s" x="361" y="169" width="167" height="88" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="c4">
<rect x="539" y="170" width="165" height="86" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="621.5" y="200.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">17,408,000 frames</text>
<text x="621.5" y="217.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">3/17,408,000 = 1.7e-07</text>
<text x="621.5" y="234.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">per frame, none wrong</text>
<rect class="hl" style="animation-delay:10.40s" x="538" y="169" width="167" height="88" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="c5">
<rect x="716" y="170" width="176" height="86" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="804" y="200.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">About 57 boots</text>
<text x="804" y="217.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">(59/60)^57 = 0.38</text>
<text x="804" y="234.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">since the one failure</text>
<rect class="hl" style="animation-delay:13.00s" x="715" y="169" width="178" height="88" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="292" text-anchor="start" font-size="12" fill="#9aa8b5">Numbers from the snippet in Run it. The frame bound holds only if every bad word is caught and frames are independent.</text>
<text x="20" y="312" text-anchor="start" font-size="12" fill="#9aa8b5">The 57 boots span three fabric versions, so they are not repeats of one experiment.</text>
</svg>
