<path class="hl flow" style="animation-delay:3.90s" d="M450,86 L450,128 L267.5,128 L267.5,170" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
