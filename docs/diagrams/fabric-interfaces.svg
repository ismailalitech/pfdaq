<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="780" height="340" role="img" aria-labelledby="t d">
<title id="t">How software and fabric are joined: the U54 harts reach fabric registers over FIC3 (APB, 50 MHz); the fabric's DMA writes into DDR over FIC0 (AXI4, 125 MHz) through the MSS; interrupt lines run from the fabric to the harts; the harts also load and store directly to DDR.</title><desc id="d">How software and fabric are joined: the U54 harts reach fabric registers over FIC3 (APB, 50 MHz); the fabric's DMA writes into DDR over FIC0 (AXI4, 125 MHz) through the MSS; interrupt lines run from the fabric to the harts; the harts also load and store directly to DDR.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 11.10s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 11.10s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}11.71%{opacity:1}14.71%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="780" height="340" rx="12" fill="#12171d"/>
<g id="regs">
<path d="M230,90 L550,90" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M230,90 L550,90" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="291.62" y="68" width="196.76" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="390" y="80.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">FIC3 · APB 50 MHz · registers</text>
</g>
<g id="dma">
<path d="M655,130 L655,270 L230,270" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M655,130 L655,270 L230,270" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="334.46" y="248" width="216.08" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="442.5" y="260.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">FIC0 · AXI4 125 MHz · DMA writes</text>
</g>
<g id="irq">
<path d="M655,50 L655,16 L125,16 L125,50" fill="none" stroke="#8da6d4" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ar-mss)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M655,50 L655,16 L125,16 L125,50" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="317.38" y="-6" width="145.24" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="390" y="6.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">interrupt lines (F2M)</text>
</g>
<g id="ls">
<path d="M125,130 L125,230" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:7.80s" d="M125,130 L125,230" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="129" y="171" width="113.04" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="134" y="183.5" text-anchor="start" font-size="11.5" fill="#e6ecf1">loads and stores</text>
</g>
<g id="harts">
<rect x="20" y="50" width="210" height="80" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="125" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">U54 harts</text>
<text x="125" y="103" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">Linux and the supervisor</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="49" width="212" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="fabric">
<rect x="550" y="50" width="210" height="80" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="655" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">FPGA fabric</text>
<text x="655" y="103" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">pfdaq_core, mailbox, LEDs</text>
<rect class="hl" style="animation-delay:2.60s" x="549" y="49" width="212" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ddr">
<rect x="20" y="230" width="210" height="80" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="125" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">DDR4, 1 GB</text>
<text x="125" y="283" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">shared by harts and DMA</text>
<rect class="hl" style="animation-delay:5.20s" x="19" y="229" width="212" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
</svg>
