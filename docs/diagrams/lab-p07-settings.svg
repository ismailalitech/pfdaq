<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-labelledby="t d">
<title id="t">The path of the fabric interrupt to the measuring program and the runtime setting that acts on each step. The fabric line reaches the PLIC (source 119); smp_affinity chooses the Linux CPU that takes it; a kernel thread at SCHED_FIFO 50 serves it and wakes the program; the program, started with taskset and SCHED_FIFO 80 and locked memory, reads the event and writes ACK.</title><desc id="d">The path of the fabric interrupt to the measuring program and the runtime setting that acts on each step. The fabric line reaches the PLIC (source 119); smp_affinity chooses the Linux CPU that takes it; a kernel thread at SCHED_FIFO 50 serves it and wakes the program; the program, started with taskset and SCHED_FIFO 80 and locked memory, reads the event and writes ACK.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 13.70s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 13.70s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}9.49%{opacity:1}12.49%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="250" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M160,75 L215,75" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M160,75 L215,75" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="153.52" y="53" width="67.96" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="187.5" y="65.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">interrupt</text>
</g>
<g id="e1">
<path d="M375,75 L430,75" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M375,75 L430,75" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="381.4" y="53" width="42.2" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="402.5" y="65.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">wakes</text>
</g>
<g id="e2">
<path d="M620,75 L675,75" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M620,75 L675,75" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="626.4" y="53" width="42.2" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="647.5" y="65.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">wakes</text>
</g>
<g id="e3">
<path d="M782.5,110 L782.5,160" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.10s" d="M782.5,110 L782.5,160" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="plic">
<rect x="10" y="40" width="150" height="70" rx="9" fill="#232c44" stroke="#8da6d4" stroke-width="1.5"/>
<text x="85" y="62.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">PLIC</text>
<text x="85" y="79.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">source 119</text>
<text x="85" y="96.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">(fabric F2M[1])</text>
<rect class="hl" style="animation-delay:0.00s" x="9" y="39" width="152" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="cpu">
<rect x="215" y="40" width="160" height="70" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="295" y="62.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">One Linux CPU</text>
<text x="295" y="79.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">chosen by</text>
<text x="295" y="96.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">smp_affinity</text>
<rect class="hl" style="animation-delay:2.60s" x="214" y="39" width="162" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="thr">
<rect x="430" y="40" width="190" height="70" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="525" y="62.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">irq/80 kernel thread</text>
<text x="525" y="79.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">SCHED_FIFO 50</text>
<text x="525" y="96.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">chrt can change it</text>
<rect class="hl" style="animation-delay:5.20s" x="429" y="39" width="192" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="app">
<rect x="675" y="40" width="215" height="70" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="782.5" y="62.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">pfdaq_lat</text>
<text x="782.5" y="79.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">taskset, -R 80:</text>
<text x="782.5" y="96.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">SCHED_FIFO 80, mlockall</text>
<rect class="hl" style="animation-delay:7.80s" x="674" y="39" width="217" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ack">
<rect x="675" y="160" width="215" height="60" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="782.5" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">ACK write</text>
<text x="782.5" y="203" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">stops the fabric timer</text>
<rect class="hl" style="animation-delay:10.40s" x="674" y="159" width="217" height="62" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="160" text-anchor="start" font-size="12" fill="#9aa8b5">Settings used: smp_affinity of the interrupt, taskset for the program and for other tasks,</text>
<text x="20" y="178" text-anchor="start" font-size="12" fill="#9aa8b5">SCHED_FIFO and mlockall for the program, chrt for the kernel thread. No boot argument.</text>
</svg>
