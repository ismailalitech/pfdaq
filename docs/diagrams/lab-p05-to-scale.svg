<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 376" width="900" height="376" role="img" aria-labelledby="t d">
<title id="t">Two aborted 8,192,000-byte bursts drawn in proportion to bytes: the 2 ms abort sent 119 real frames, 1.95 MB, then 6.24 MB of zero fill; the 50 microsecond abort sent 128 real frames, 0.13 MB, then 8.06 MB of zero fill. The DMA descriptor was filled completely in both.</title><desc id="d">Two aborted 8,192,000-byte bursts drawn in proportion to bytes: the 2 ms abort sent 119 real frames, 1.95 MB, then 6.24 MB of zero fill; the 50 microsecond abort sent 128 real frames, 0.13 MB, then 8.06 MB of zero fill. The DMA descriptor was filled completely in both.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 9.00s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 9.00s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}0.00%{opacity:1}3.00%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="376" rx="12" fill="#12171d"/>
<rect x="10" y="40" width="880" height="54" rx="8" fill="#171d25" stroke="#2a3441"/>
<text x="22" y="71" font-size="13" font-weight="bold" fill="#e6ecf1">Stream, -A 2000</text>
<rect x="140" y="52" width="175.473" height="30" rx="4" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="227.736" y="71" text-anchor="middle" font-size="11.5" fill="#e6ecf1">119 frames</text>
<rect x="315.473" y="52" width="561.807" height="30" rx="4" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="596.376" y="71" text-anchor="middle" font-size="11.5" fill="#e6ecf1">zero fill, 1,560,576 words</text>
<rect x="10" y="108" width="880" height="54" rx="8" fill="#171d25" stroke="#2a3441"/>
<text x="22" y="139" font-size="13" font-weight="bold" fill="#e6ecf1">Stream, -A 50</text>
<rect x="140" y="120" width="11.7965" height="30" rx="4" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="138" y="117" text-anchor="start" font-size="11" fill="#9aa8b5">128 frames, 0.13 MB</text>
<rect x="151.796" y="120" width="725.484" height="30" rx="4" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="514.538" y="139" text-anchor="middle" font-size="11.5" fill="#e6ecf1">zero fill, 2,015,232 words</text>
<rect x="10" y="176" width="880" height="54" rx="8" fill="#171d25" stroke="#2a3441"/>
<text x="22" y="207" font-size="13" font-weight="bold" fill="#e6ecf1">DMA descriptor</text>
<rect x="140" y="188" width="737.28" height="30" rx="4" fill="#232c44" stroke="#8da6d4" stroke-width="1.5"/>
<text x="508.64" y="207" text-anchor="middle" font-size="11.5" fill="#e6ecf1">one transfer of 8,192,000 bytes, complete: status 0x210</text>
<line x1="140" y1="32" x2="140" y2="236" stroke="#2a3441" stroke-dasharray="2 4"/>
<text x="140" y="252" text-anchor="middle" font-size="11" fill="#9aa8b5">0</text>
<line x1="315.5" y1="32" x2="315.5" y2="236" stroke="#2a3441" stroke-dasharray="2 4"/>
<text x="315.5" y="252" text-anchor="middle" font-size="11" fill="#9aa8b5">1.95 MB</text>
<line x1="500" y1="32" x2="500" y2="236" stroke="#2a3441" stroke-dasharray="2 4"/>
<text x="500" y="252" text-anchor="middle" font-size="11" fill="#9aa8b5">4 MB</text>
<line x1="877.28" y1="32" x2="877.28" y2="236" stroke="#2a3441" stroke-dasharray="2 4"/>
<text x="888" y="252" text-anchor="end" font-size="11" fill="#9aa8b5">8.19 MB</text>
<g class="play" style="animation-duration:9s; --dx:738px"><line x1="140" y1="30" x2="140" y2="238" stroke="#ffd166" stroke-width="2.5"/></g>
<text x="20" y="284" text-anchor="start" font-size="12" fill="#9aa8b5">Drawn in proportion to bytes sent, not to time. 1 MB here is 1,000,000 bytes.</text>
<text x="20" y="306" text-anchor="start" font-size="12" fill="#9aa8b5">Start to interrupt: 8.899 ms for the first run, 8.904 ms for the second. The fill is streamed at the same rate as data.</text>
<text x="20" y="328" text-anchor="start" font-size="12" fill="#9aa8b5">Asked for 50 us, the source had already sent 128 frames of 1,024 bytes.</text>
</svg>
