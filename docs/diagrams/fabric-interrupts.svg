<text x="685" y="94.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">supervisor contexts</text>
<text x="685" y="111.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">enabled: 119, 120</text>
