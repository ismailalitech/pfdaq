<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d">
<title id="t">One cycle of the reboot test: reboot over SSH, wait a fixed 20 seconds, poll SSH every 2 seconds and record the time, wait 3 seconds, then read the remote-processor state, count the supervisor's RPMsg channel, run a supervised capture of 8 bursts, and append one CSV row.</title><desc id="d">One cycle of the reboot test: reboot over SSH, wait a fixed 20 seconds, poll SSH every 2 seconds and record the time, wait 3 seconds, then read the remote-processor state, count the supervisor's RPMsg channel, run a supervised capture of 8 bursts, and append one CSV row.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 21.50s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 21.50s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}6.05%{opacity:1}9.05%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="330" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M200,72 L240,72" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M200,72 L240,72" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e1">
<path d="M430,72 L470,72" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M430,72 L470,72" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e2">
<path d="M660,72 L700,72" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M660,72 L700,72" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e3">
<path d="M795,114 L795,200" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.10s" d="M795,114 L795,200" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e4">
<path d="M700,242 L660,242" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:11.70s" d="M700,242 L660,242" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e5">
<path d="M470,242 L430,242" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:14.30s" d="M470,242 L430,242" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e6">
<path d="M240,242 L200,242" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:16.90s" d="M240,242 L200,242" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="reb">
<rect x="10" y="30" width="190" height="84" rx="9" fill="#2a3140" stroke="#c9d3dd" stroke-width="1.5"/>
<text x="105" y="59.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Reboot</text>
<text x="105" y="76.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">ssh ... reboot</text>
<text x="105" y="93.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">starts the clock</text>
<rect class="hl" style="animation-delay:0.00s" x="9" y="29" width="192" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="w20">
<rect x="240" y="30" width="190" height="84" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="335" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Wait 20 s</text>
<text x="335" y="85" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">fixed, every cycle</text>
<rect class="hl" style="animation-delay:2.60s" x="239" y="29" width="192" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="poll">
<rect x="470" y="30" width="190" height="84" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="565" y="59.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Poll SSH</text>
<text x="565" y="76.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">every 2 s, 40 tries;</text>
<text x="565" y="93.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">records up_s</text>
<rect class="hl" style="animation-delay:5.20s" x="469" y="29" width="192" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="w3">
<rect x="700" y="30" width="190" height="84" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="795" y="59.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Wait 3 s</text>
<text x="795" y="76.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the supervisor announces</text>
<text x="795" y="93.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">its channel</text>
<rect class="hl" style="animation-delay:7.80s" x="699" y="29" width="192" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="rp">
<rect x="700" y="200" width="190" height="84" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="795" y="229.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">remoteproc0 state</text>
<text x="795" y="246.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">recorded; attached</text>
<text x="795" y="263.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">in all 30 cycles</text>
<rect class="hl" style="animation-delay:10.40s" x="699" y="199" width="192" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ch">
<rect x="470" y="200" width="190" height="84" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="565" y="229.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">RPMsg channel</text>
<text x="565" y="246.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">pfdaq-supervisor</text>
<text x="565" y="263.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">counted, 1 if present</text>
<rect class="hl" style="animation-delay:13.00s" x="469" y="199" width="192" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="cap">
<rect x="240" y="200" width="190" height="84" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="335" y="229.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Supervised capture</text>
<text x="335" y="246.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">pfdaq_cap -r -w 252</text>
<text x="335" y="263.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">-f 1024 -n 8</text>
<rect class="hl" style="animation-delay:15.60s" x="239" y="199" width="192" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="row">
<rect x="10" y="200" width="190" height="84" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="105" y="229.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">One CSV row</text>
<text x="105" y="246.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">capture_pass, sup_pass,</text>
<text x="105" y="263.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">console bytes</text>
<rect class="hl" style="animation-delay:18.20s" x="9" y="199" width="192" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="10" y="316" text-anchor="start" font-size="12" fill="#9aa8b5">A TIMEOUT row means SSH never came back. The file's last line counts channel 1 rows and rows where capture and supervisor both passed.</text>
</svg>
