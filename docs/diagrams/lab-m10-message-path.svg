<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d">
<title id="t">One message from a Linux cpu to hart 4 and back. The station hello program, pinned to a cpu, writes a 64-byte HELLO to the rpmsg character device; the message travels through the shared rings and the Mi-V inter-hart interrupt to hart 4; the supervisor task decodes it with st_handle and prints one line on its UART; it then sends a 64-byte acknowledgement with its own tick count, which the program reads and prints with a CLOCK_MONOTONIC time stamp.</title><desc id="d">One message from a Linux cpu to hart 4 and back. The station hello program, pinned to a cpu, writes a 64-byte HELLO to the rpmsg character device; the message travels through the shared rings and the Mi-V inter-hart interrupt to hart 4; the supervisor task decodes it with st_handle and prints one line on its UART; it then sends a 64-byte acknowledgement with its own tick count, which the program reads and prints with a CLOCK_MONOTONIC time stamp.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 23.00s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 23.00s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}6.09%{opacity:1}9.09%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="340" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M205,87 L240,87" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.40s" d="M205,87 L240,87" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e1">
<path d="M430,87 L465,87" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:4.20s" d="M430,87 L465,87" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e2">
<path d="M655,87 L690,87" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:7.00s" d="M655,87 L690,87" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e3">
<path d="M785,124 L785,200" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.80s" d="M785,124 L785,200" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e4">
<path d="M690,237 L655,237" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:12.60s" d="M690,237 L655,237" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e5">
<path d="M465,237 L430,237" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:15.40s" d="M465,237 L430,237" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e6">
<path d="M240,237 L205,237" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:18.20s" d="M240,237 L205,237" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="cli">
<rect x="15" y="50" width="190" height="74" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="110" y="74.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">station hello</text>
<text x="110" y="91.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">pinned to cpu N</text>
<text x="110" y="108.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">sched_getcpu()</text>
<rect class="hl" style="animation-delay:0.00s" x="14" y="49" width="192" height="76" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="chr">
<rect x="240" y="50" width="190" height="74" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="335" y="74.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">/dev/rpmsgN</text>
<text x="335" y="91.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">write 64 bytes</text>
<text x="335" y="108.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">HELLO #seq, text</text>
<rect class="hl" style="animation-delay:2.80s" x="239" y="49" width="192" height="76" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ring">
<rect x="465" y="50" width="190" height="74" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="560" y="83" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Shared rings</text>
<text x="560" y="100" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">0x91D0_0000, 0x91D0_8000</text>
<rect class="hl" style="animation-delay:5.60s" x="464" y="49" width="192" height="76" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ihc">
<rect x="690" y="50" width="190" height="74" rx="9" fill="#232c44" stroke="#8da6d4" stroke-width="1.5"/>
<text x="785" y="83" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">IHC interrupt</text>
<text x="785" y="100" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">wakes hart 4</text>
<rect class="hl" style="animation-delay:8.40s" x="689" y="49" width="192" height="76" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="task">
<rect x="690" y="200" width="190" height="74" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="785" y="233" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Supervisor task</text>
<text x="785" y="250" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">st_handle(HELLO)</text>
<rect class="hl" style="animation-delay:11.20s" x="689" y="199" width="192" height="76" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="uart">
<rect x="465" y="200" width="190" height="74" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="560" y="224.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">UART print</text>
<text x="560" y="241.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">[roll-call] hart 4 got</text>
<text x="560" y="258.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">HELLO #1 from hart 2</text>
<rect class="hl" style="animation-delay:14.00s" x="464" y="199" width="192" height="76" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ack">
<rect x="240" y="200" width="190" height="74" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="335" y="224.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Acknowledgement</text>
<text x="335" y="241.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">64 bytes, its own tick</text>
<text x="335" y="258.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">and a text</text>
<rect class="hl" style="animation-delay:16.80s" x="239" y="199" width="192" height="76" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="back">
<rect x="15" y="200" width="190" height="74" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="110" y="224.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">station hello prints</text>
<text x="110" y="241.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">reply and hart 4 tick</text>
<text x="110" y="258.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">CLOCK_MONOTONIC time</text>
<rect class="hl" style="animation-delay:19.60s" x="14" y="199" width="192" height="76" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="15" y="36" text-anchor="start" font-size="12" fill="#9aa8b5" font-weight="bold">Linux side</text>
<text x="690" y="186" text-anchor="start" font-size="12" fill="#9aa8b5" font-weight="bold">Hart 4 side</text>
</svg>
