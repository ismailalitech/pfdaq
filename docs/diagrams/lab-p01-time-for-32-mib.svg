<text x="175.315" y="187" text-anchor="middle" font-size="11.5" fill="#e6ecf1">copy 0.477 s</text>
<rect x="220.63" y="172" width="125.59" height="22" rx="4" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="283.425" y="187" text-anchor="middle" font-size="11.5" fill="#e6ecf1">verify 0.661 s</text>
<rect x="346.22" y="172" width="12.54" height="22" rx="4" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="352.49" y="187" text-anchor="middle" font-size="11.5" fill="#e6ecf1"></text>
<rect x="10" y="220" width="880" height="46" rx="8" fill="#171d25" stroke="#2a3441"/>
<text x="22" y="247" font-size="13" font-weight="bold" fill="#e6ecf1">FIR</text>
