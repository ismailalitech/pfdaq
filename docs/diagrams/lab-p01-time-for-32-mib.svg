<line x1="130" y1="32" x2="130" y2="272" stroke="#2a3441" stroke-dasharray="2 4"/>
<text x="130" y="288" text-anchor="middle" font-size="11" fill="#9aa8b5">0 s</text>
<line x1="320" y1="32" x2="320" y2="272" stroke="#2a3441" stroke-dasharray="2 4"/>
<text x="320" y="288" text-anchor="middle" font-size="11" fill="#9aa8b5">1 s</text>
<line x1="510" y1="32" x2="510" y2="272" stroke="#2a3441" stroke-dasharray="2 4"/>
<text x="510" y="288" text-anchor="middle" font-size="11" fill="#9aa8b5">2 s</text>
<line x1="700" y1="32" x2="700" y2="272" stroke="#2a3441" stroke-dasharray="2 4"/>
<text x="700" y="288" text-anchor="middle" font-size="11" fill="#9aa8b5">3 s</text>
<line x1="890" y1="32" x2="890" y2="272" stroke="#2a3441" stroke-dasharray="2 4"/>
<text x="888" y="288" text-anchor="end" font-size="11" fill="#9aa8b5">4 s</text>
<g class="play" style="animation-duration:9s; --dx:779px"><line x1="130" y1="30" x2="130" y2="274" stroke="#ffd166" stroke-width="2.5"/></g>
<text x="20" y="310" text-anchor="start" font-size="12" fill="#9aa8b5">To scale. Copy (purple), verify (blue), supervisor round trips (yellow, 32 x mean round trip).</text>
<text x="20" y="330" text-anchor="start" font-size="12" fill="#9aa8b5">Each lane is the sum of its parts: 1.145, 1.204 and 3.860 s. The measured loop times are 1.133, 1.193 and 3.858 s.</text>
<text x="20" y="350" text-anchor="start" font-size="12" fill="#9aa8b5">The tool alternates copy, verify and report burst by burst; the totals are drawn as single blocks.</text>
</svg>
