<text x="765" y="238" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">wic.gz, wic.bmap, fitImage</text>
<text x="765" y="255" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">device tree, payload.bin</text>
<text x="765" y="272" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">firmware ELF</text>
