<text x="20" y="34" text-anchor="start" font-size="12" fill="#9aa8b5" font-weight="bold">meta-pfdaq: the one project layer, on top of the vendor's</text>
<text x="20" y="320" text-anchor="start" font-size="12" fill="#9aa8b5">Each part supplies only what the vendor layer cannot: no vendor file is edited.</text>
