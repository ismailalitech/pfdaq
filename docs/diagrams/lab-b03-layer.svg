<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d">
<title id="t">How the project layer is used: five parts of meta-pfdaq (machine, U-Boot files, kernel device tree, supervisor firmware, extras) and the vendor layers all go into bitbake mchp-base-image, built with MACHINE=mpfs-disco-kit-amp, which leaves the SD image, kernel image, device tree, payload and firmware in the deploy directory.</title><desc id="d">How the project layer is used: five parts of meta-pfdaq (machine, U-Boot files, kernel device tree, supervisor firmware, extras) and the vendor layers all go into bitbake mchp-base-image, built with MACHINE=mpfs-disco-kit-amp, which leaves the SD image, kernel image, device tree, payload and firmware in the deploy directory.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 41.00s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 41.00s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}6.34%{opacity:1}9.34%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
