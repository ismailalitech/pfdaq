- id: lab-p06-how-much-it-proves
  alt: "What clean trials bound: after n trials without a failure the rate is below about 3 over n at 95 percent confidence. For 30 clean boots that is up to 10 percent; if the true rate were 1 boot in 60, 30 clean boots would still occur with probability 0.60; about 300 clean boots would show a rate below 1 percent; 17,408,000 clean frames bound the per-frame error rate below 1.7 times ten to the minus seven; about 57 boots since the one failure would be clean with probability 0.38."
  width: 900
  height: 330
  nodes:
    root: {x: 270, y: 20,  w: 360, h: 66, kind: start, title: "n trials, no failure", sub: "rate below about 3/n, 95 % confidence"}
    c1:   {x: 8,   y: 170, w: 165, h: 86, kind: bad,   title: "30 clean boots", sub: "3/30 = 0.1\nup to 10 % possible"}
    c2:   {x: 185, y: 170, w: 165, h: 86, kind: bad,   title: "1 failure in 60?", sub: "(59/60)^30 = 0.60\n30 clean: likely"}
    c3:   {x: 362, y: 170, w: 165, h: 86, kind: plain, title: "300 clean boots", sub: "3/300 = 0.01\nshows a rate below 1 %"}
    c4:   {x: 539, y: 170, w: 165, h: 86, kind: good,  title: "17,408,000 frames", sub: "3/17,408,000 = 1.7e-07\nper frame, none wrong"}
    c5:   {x: 716, y: 170, w: 176, h: 86, kind: mem,   title: "About 57 boots", sub: "(59/60)^57 = 0.38\nsince the one failure"}
  edges:
    - {from: root.bottom, to: c1.top}
    - {from: root.bottom, to: c2.top}
    - {from: root.bottom, to: c3.top}
    - {from: root.bottom, to: c4.top}
    - {from: root.bottom, to: c5.top}
  steps: [root, e0, c1, e1, c2, e2, c3, e3, c4, e4, c5]
  notes:
    - {x: 20, y: 292, text: "Numbers from the snippet in Run it. The frame bound holds only if every bad word is caught and frames are independent."}
    - {x: 20, y: 312, text: "The 57 boots span three fabric versions, so they are not repeats of one experiment."}
