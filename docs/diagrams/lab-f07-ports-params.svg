<text x="48" y="642.75" font-size="15" font-weight="bold" fill="#e6ecf1">Next: bus interfaces</text>
<text x="48" y="662.75" font-size="13" fill="#9aa8b5">This button opens the page where the ports are grouped into APB and AXI4-Stream.</text>
