<circle cx="24" cy="644.75" r="13" fill="#ffd166"/><text x="24" y="649.75" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="642.75" font-size="15" font-weight="bold" fill="#e6ecf1">The parameter</text>
<text x="48" y="662.75" font-size="13" fill="#9aa8b5">DEFAULT_LEN becomes a parameter of the core; the red cross removes one you do not want.</text>
