<text x="12" y="186" font-size="12" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">PWRITE</text>
<path d="M140,194 L140,194 L186.25,194 L186.25,174 L371.25,174 L371.25,194 L880,194" fill="none" stroke="#5aa0d6" stroke-width="2" stroke-linejoin="round"/>
<text x="12" y="226" font-size="12" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">PADDR</text>
