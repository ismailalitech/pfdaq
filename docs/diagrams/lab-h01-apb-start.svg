<line x1="695" y1="30" x2="695" y2="370" stroke="#27313d" stroke-dasharray="2 4"/><text x="695" y="22" text-anchor="middle" font-size="11" fill="#9aa8b5">2360 ns</text>
<line x1="787.5" y1="30" x2="787.5" y2="370" stroke="#27313d" stroke-dasharray="2 4"/><text x="787.5" y="22" text-anchor="middle" font-size="11" fill="#9aa8b5">2380 ns</text>
