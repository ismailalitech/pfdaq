<text x="12" y="106" font-size="12" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">PSEL</text>
<path d="M140,114 L140,114 L186.25,114 L186.25,94 L371.25,94 L371.25,114 L463.75,114 L463.75,94 L648.75,94 L648.75,114 L741.25,114 L741.25,94 L880,94" fill="none" stroke="#5aa0d6" stroke-width="2" stroke-linejoin="round"/>
