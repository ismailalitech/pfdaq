<text x="325" y="228" text-anchor="middle" font-size="11" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">0x08</text>
<rect x="464.25" y="213" width="415.25" height="22" rx="4" fill="#1b2a3a" stroke="#5aa0d6" stroke-width="1.2"/>
<text x="671.875" y="228" text-anchor="middle" font-size="11" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">0x1c</text>
<text x="12" y="266" font-size="12" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">PWDATA</text>
<rect x="140.5" y="253" width="45.25" height="22" rx="4" fill="#1b2a3a" stroke="#5aa0d6" stroke-width="1.2"/>
<text x="163.125" y="268" text-anchor="middle" font-size="11" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">0x02</text>
<rect x="186.75" y="253" width="692.75" height="22" rx="4" fill="#1b2a3a" stroke="#5aa0d6" stroke-width="1.2"/>
<text x="533.125" y="268" text-anchor="middle" font-size="11" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">0x01</text>
<text x="12" y="306" font-size="12" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">PRDATA</text>
<rect x="140.5" y="293" width="415.25" height="22" rx="4" fill="#1b2a3a" stroke="#5fbf84" stroke-width="1.2"/>
<text x="348.125" y="308" text-anchor="middle" font-size="11" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">0x00</text>
<rect x="556.75" y="293" width="322.75" height="22" rx="4" fill="#1b2a3a" stroke="#5fbf84" stroke-width="1.2"/>
<text x="718.125" y="308" text-anchor="middle" font-size="11" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">0x01</text>
<text x="12" y="346" font-size="12" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">start_tgl_p</text>
<path d="M140,354 L140,354 L371.25,354 L371.25,334 L880,334" fill="none" stroke="#b08fe0" stroke-width="2" stroke-linejoin="round"/>
<rect x="0" y="376" width="900" height="104" fill="#12171d"/>
<g class="co" style="animation-delay:0.00s"><rect x="186.25" y="30" width="92.5" height="340" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="186.25" cy="30" r="11" fill="#ffd166"/><text x="186.25" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="376" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="404" r="13" fill="#ffd166"/><text x="24" y="409" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="402" font-size="15" font-weight="bold" fill="#e6ecf1">Setup phase</text>
<text x="48" y="422" font-size="13" fill="#9aa8b5">PSEL is high, PENABLE low. The master puts offset 0x08 (CTRL) and the data 0x01 (START) on the bus.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="278.75" y="30" width="92.5" height="340" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="278.75" cy="30" r="11" fill="#ffd166"/><text x="278.75" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.40s">
<rect x="0" y="376" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="404" r="13" fill="#ffd166"/><text x="24" y="409" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="402" font-size="15" font-weight="bold" fill="#e6ecf1">Access phase</text>
<text x="48" y="422" font-size="13" fill="#9aa8b5">PENABLE is high. PREADY is tied high, so the write completes at the end of this one clock.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="371.25" y="30" width="92.5" height="340" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="371.25" cy="30" r="11" fill="#ffd166"/><text x="371.25" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:6.80s">
<rect x="0" y="376" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="404" r="13" fill="#ffd166"/><text x="24" y="409" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="402" font-size="15" font-weight="bold" fill="#e6ecf1">A toggle, not a bit</text>
<text x="48" y="422" font-size="13" fill="#9aa8b5">At that edge start_tgl_p flips. START is stored nowhere; the flip is the event.</text>
</g>
<g class="co" style="animation-delay:10.20s"><rect x="463.75" y="30" width="185" height="340" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="463.75" cy="30" r="11" fill="#ffd166"/><text x="463.75" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:10.20s">
<rect x="0" y="376" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="404" r="13" fill="#ffd166"/><text x="24" y="409" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="402" font-size="15" font-weight="bold" fill="#e6ecf1">A read of STATUS</text>
<text x="48" y="422" font-size="13" fill="#9aa8b5">Offset 0x1C in the setup phase; PRDATA is a multiplexer on PADDR, with no wait state. It reads 0x01: busy.</text>
</g>
</svg>
