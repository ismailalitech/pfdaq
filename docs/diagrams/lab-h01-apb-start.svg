<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-labelledby="t d">
<title id="t">Waveform from the stream simulation: the testbench writes 1 to CTRL at offset 0x08, which is START, and then reads STATUS at offset 0x1C. The write has a setup phase with PSEL high and PENABLE low, then an access phase with PENABLE high, and PREADY is always high so it ends after one clock. At the end of the access phase the toggle start_tgl_p flips; the START bit itself is not stored. The read returns STATUS through a combinational multiplexer.</title><desc id="d">Waveform from the stream simulation: the testbench writes 1 to CTRL at offset 0x08, which is START, and then reads STATUS at offset 0x1C. The write has a setup phase with PSEL high and PENABLE low, then an access phase with PENABLE high, and PREADY is always high so it ends after one clock. At the end of the access phase the toggle start_tgl_p flips; the START bit itself is not stored. The read returns STATUS through a combinational multiplexer.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 15.60s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 15.60s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}21.79%{opacity:1}24.79%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
