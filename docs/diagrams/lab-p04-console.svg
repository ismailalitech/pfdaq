<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d">
<title id="t">supervisor console (hart 4), recorded in the fresh-card suite: stall test, then kill test</title><desc id="d">The supervisor's console lines for the two deliberate failures: in the stall test it arms with a 300 ms deadline, raises one alarm, resumes at burst 5 and disarms with 12 status messages and 1 miss; in the kill test it arms, raises an alarm and stays silent until the next run arms it again, which then passes with 16 status messages and no miss.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 16.40s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 16.40s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}21.95%{opacity:1}24.95%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="340" rx="12" fill="#12171d"/>
<rect x="0" y="0" width="900" height="234" fill="#0d1117"/>
<rect x="0" y="0" width="900" height="34" fill="#1b222c"/>
<circle cx="20" cy="17" r="6" fill="#ef6f6c"/>
<circle cx="38" cy="17" r="6" fill="#e6c04f"/>
<circle cx="56" cy="17" r="6" fill="#5fbf84"/>
<text x="450" y="22" text-anchor="middle" font-size="12" fill="#9aa8b5">supervisor console (hart 4), recorded in the fresh-card suite: stall test, then kill test</text>
<text x="24" y="58" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">[pfdaq-sup] ARMED: deadline 300 ms, max lag 1040 frames, fabric seq 285295</text>
<text x="24" y="78" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">[pfdaq-sup] ALARM: no status within 300 ms (miss #1, t=105082 ms)</text>
<text x="24" y="98" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">[pfdaq-sup] status resumed at burst 5, back to ARMED</text>
<text x="24" y="118" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">[pfdaq-sup] DISARM from ARMED: 12 status, 1 deadline misses, 0 seq mismatches, linux errors 0, latency irqs 0</text>
<text x="24" y="138" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">[pfdaq-sup] ARMED: deadline 300 ms, max lag 1040 frames, fabric seq 2595920</text>
<text x="24" y="158" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">[pfdaq-sup] ALARM: no status within 300 ms (miss #1, t=412557 ms)</text>
<text x="24" y="178" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">[pfdaq-sup] ARMED: deadline 500 ms, max lag 1040 frames, fabric seq 2654288</text>
<text x="24" y="198" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">[pfdaq-sup] DISARM from ARMED: 16 status, 0 deadline misses, 0 seq mismatches, linux errors 0, latency irqs 0</text>
<rect x="0" y="234" width="900" height="106" fill="#12171d"/>
<g class="co" style="animation-delay:0.00s"><rect x="8" y="43" width="884" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="45" r="11" fill="#ffd166"/><text x="8" y="49" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="234" width="900" height="106" fill="#12171d"/>
<circle cx="24" cy="260" r="13" fill="#ffd166"/><text x="24" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="258" font-size="15" font-weight="bold" fill="#e6ecf1">Stall test: pfdaq_cap -r -D 300 -P 5:900 ...</text>
<text x="48" y="278" font-size="13" fill="#9aa8b5">Linux sleeps 900 ms against a 300 ms deadline; one alarm is raised.</text>
</g>
<g class="co" style="animation-delay:3.60s"><rect x="8" y="83" width="884" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="85" r="11" fill="#ffd166"/><text x="8" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.60s">
<rect x="0" y="234" width="900" height="106" fill="#12171d"/>
<circle cx="24" cy="260" r="13" fill="#ffd166"/><text x="24" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="258" font-size="15" font-weight="bold" fill="#e6ecf1">Late, not wrong</text>
<text x="48" y="278" font-size="13" fill="#9aa8b5">The next STATUS clears the alarm; the miss stays counted: 12 status, 1 miss, no data error.</text>
</g>
<g class="co" style="animation-delay:7.20s"><rect x="8" y="123" width="884" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="125" r="11" fill="#ffd166"/><text x="8" y="129" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:7.20s">
<rect x="0" y="234" width="900" height="106" fill="#12171d"/>
<circle cx="24" cy="260" r="13" fill="#ffd166"/><text x="24" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="258" font-size="15" font-weight="bold" fill="#e6ecf1">Kill test: pkill -9 two seconds into the run</text>
<text x="48" y="278" font-size="13" fill="#9aa8b5">No DISARM is sent. 300 ms after the last STATUS the supervisor raises the alarm and says no more.</text>
</g>
<g class="co" style="animation-delay:10.80s"><rect x="8" y="163" width="884" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="165" r="11" fill="#ffd166"/><text x="8" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:10.80s">
<rect x="0" y="234" width="900" height="106" fill="#12171d"/>
<circle cx="24" cy="260" r="13" fill="#ffd166"/><text x="24" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="258" font-size="15" font-weight="bold" fill="#e6ecf1">The next run recovers it</text>
<text x="48" y="278" font-size="13" fill="#9aa8b5">Its own ARM resets the counters: 16 status messages, 0 misses.</text>
</g>
</svg>
