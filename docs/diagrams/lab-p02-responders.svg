<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d">
<title id="t">Four responders to the same kind of event, idle board. On hart 4 a FreeRTOS handler has a mean of 0.52 microseconds and a maximum of 2.10; a task woken by that handler adds a semaphore and a task switch and has a mean of 2.04 and a maximum of 11.66. In Linux the kernel handler has a mean of 4.41 and a maximum of 1298.18; a user-space program adds the scheduler wake-up, poll and reads and has a mean of 78.31 and a maximum of 5130.60.</title><desc id="d">Four responders to the same kind of event, idle board. On hart 4 a FreeRTOS handler has a mean of 0.52 microseconds and a maximum of 2.10; a task woken by that handler adds a semaphore and a task switch and has a mean of 2.04 and a maximum of 11.66. In Linux the kernel handler has a mean of 4.41 and a maximum of 1298.18; a user-space program adds the scheduler wake-up, poll and reads and has a mean of 78.31 and a maximum of 5130.60.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 9.80s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 9.80s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}13.27%{opacity:1}16.27%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="360" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M370,78 L600,78" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M370,78 L600,78" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="402.72" y="56" width="164.56" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="485" y="68.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">+ semaphore, task switch</text>
</g>
<g id="e1">
<path d="M370,248 L600,248" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:5.20s" d="M370,248 L600,248" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="418.82" y="226" width="132.36" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="485" y="238.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">+ wake, poll, reads</text>
</g>
<g id="h4a">
<rect x="110" y="30" width="260" height="96" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="240" y="57" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">FreeRTOS handler (hart 4)</text>
<text x="240" y="74" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">mean 0.52 us, p99 &lt;= 0.62 us</text>
<text x="240" y="91" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">max 2.10 us</text>
<text x="240" y="108" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">missed events 0</text>
<rect class="hl" style="animation-delay:0.00s" x="109" y="29" width="262" height="98" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="h4b">
<rect x="600" y="30" width="260" height="96" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="730" y="57" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">FreeRTOS task (hart 4)</text>
<text x="730" y="74" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">mean 2.04 us, p99 &lt;= 2.54 us</text>
<text x="730" y="91" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">max 11.66 us</text>
<text x="730" y="108" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">missed events 0</text>
<rect class="hl" style="animation-delay:2.60s" x="599" y="29" width="262" height="98" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="lxa">
<rect x="110" y="200" width="260" height="96" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="240" y="227" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Linux kernel handler</text>
<text x="240" y="244" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">mean 4.41 us, p99 &lt;= 10.22 us</text>
<text x="240" y="261" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">max 1298.18 us</text>
<text x="240" y="278" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">missed events 6</text>
<rect class="hl" style="animation-delay:3.90s" x="109" y="199" width="262" height="98" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="lxb">
<rect x="600" y="200" width="260" height="96" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="730" y="227" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Linux user space</text>
<text x="730" y="244" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">mean 78.31 us, p99 &lt;= 122.86 us</text>
<text x="730" y="261" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">max 5130.60 us</text>
<text x="730" y="278" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">missed events 89</text>
<rect class="hl" style="animation-delay:6.50s" x="599" y="199" width="262" height="98" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="80" text-anchor="start" font-size="12" fill="#9aa8b5" font-weight="bold">Hart 4</text>
<text x="20" y="250" text-anchor="start" font-size="12" fill="#9aa8b5" font-weight="bold">Harts 1-3</text>
<text x="20" y="328" text-anchor="start" font-size="12" fill="#9aa8b5">Idle board, 100,000 events per row, fabric v0.5.1. The user-space row uses a 500 us period, the others 200 us.</text>
</svg>
