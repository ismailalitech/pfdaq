<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 552" width="900" height="552" role="img" aria-labelledby="t d">
<title id="t">pfdaq_station.h and pfdaq_supervisor.c: the trip decision on hart 4</title><desc id="d">The decision on hart 4 in six steps. st_features compares the four window values with the limits and builds a reason mask; if the mask is not empty it calls st_trip. st_trip does nothing when the state is already SAFE; otherwise it stops the source through abort_source, sets the state to SAFE, counts the trip, stores the reason, and sends one unsolicited notice to the Linux endpoint. On the board abort_source writes 0x10 (CTRL.ABORT) to the stream source's control register.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 32.40s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 32.40s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}11.73%{opacity:1}14.73%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="552" rx="12" fill="#12171d"/>
<rect x="0" y="0" width="900" height="474" fill="#0d1117"/>
<rect x="0" y="0" width="900" height="34" fill="#1b222c"/>
<circle cx="20" cy="17" r="6" fill="#ef6f6c"/>
<circle cx="38" cy="17" r="6" fill="#e6c04f"/>
<circle cx="56" cy="17" r="6" fill="#5fbf84"/>
<text x="450" y="22" text-anchor="middle" font-size="12" fill="#9aa8b5">pfdaq_station.h and pfdaq_supervisor.c: the trip decision on hart 4</text>
<text x="24" y="58" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">    c-&gt;windows++;</text>
<text x="24" y="78" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">    if (c-&gt;state != ST_S_ARMED)</text>
<text x="24" y="98" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">        return;</text>
<text x="24" y="118" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">    if (m-&gt;x[2] &gt; c-&gt;lim.max_bad)   why |= ST_R_BAD_FRAMES;</text>
<text x="24" y="138" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">    if (m-&gt;x[3] &gt; c-&gt;lim.max_drops) why |= ST_R_DROPS;</text>
<text x="24" y="158" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">    if (m-&gt;x[4] &gt; c-&gt;lim.max_peak)  why |= ST_R_PEAK;</text>
<text x="24" y="178" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">    if (m-&gt;x[5] &gt; c-&gt;lim.max_mean)  why |= ST_R_MEAN;</text>
<text x="24" y="198" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">    if (why)</text>
<text x="24" y="218" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">        st_trip(c, why, fseq, fframes, now);</text>
<text x="24" y="238" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">    if (c-&gt;state == ST_S_SAFE)</text>
<text x="24" y="258" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">        return;</text>
<text x="24" y="278" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">    c-&gt;io.abort_source();</text>
<text x="24" y="298" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">    c-&gt;state = ST_S_SAFE;</text>
<text x="24" y="318" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">    c-&gt;trips++;</text>
<text x="24" y="338" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">    c-&gt;last_reason = reasons;</text>
<text x="24" y="358" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">    st_reason_str(reasons, r, sizeof(r));</text>
<text x="24" y="378" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">    c-&gt;io.print("[station] TRIP #%u: %s at t=%u ms, source aborted, state SAFE",</text>
<text x="24" y="398" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">    st_fill_ack(c, ST_T_TRIP_NOTICE, fabric_seq, fabric_frames, now_ms, "TRIP", &amp;a);</text>
<text x="24" y="418" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">    c-&gt;io.send(c-&gt;last_remote, &amp;a, sizeof(a));</text>
<text x="24" y="438" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">static void st_abort_source(void) { SRC_REG(SRC_CTRL) = 0x10u; }</text>
<rect x="0" y="474" width="900" height="78" fill="#12171d"/>
<g class="co" style="animation-delay:0.00s"><rect x="8" y="43" width="884" height="63" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="45" r="11" fill="#ffd166"/><text x="8" y="49" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="474" width="900" height="78" fill="#12171d"/>
<circle cx="24" cy="500" r="13" fill="#ffd166"/><text x="24" y="505" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="498" font-size="15" font-weight="bold" fill="#e6ecf1">Only while armed</text>
<text x="48" y="518" font-size="13" fill="#9aa8b5">A window that arrives in SAFE is counted and ignored: one trip per fault, not one per window.</text>
</g>
<g class="co" style="animation-delay:3.80s"><rect x="8" y="103" width="884" height="83" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="105" r="11" fill="#ffd166"/><text x="8" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.80s">
<rect x="0" y="474" width="900" height="78" fill="#12171d"/>
<circle cx="24" cy="500" r="13" fill="#ffd166"/><text x="24" y="505" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="498" font-size="15" font-weight="bold" fill="#e6ecf1">Four limits, one mask</text>
<text x="48" y="518" font-size="13" fill="#9aa8b5">Bad frames, drops, peak and mean of the window against the limits Linux set; each violation adds a bit.</text>
</g>
<g class="co" style="animation-delay:7.60s"><rect x="8" y="183" width="884" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="185" r="11" fill="#ffd166"/><text x="8" y="189" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:7.60s">
<rect x="0" y="474" width="900" height="78" fill="#12171d"/>
<circle cx="24" cy="500" r="13" fill="#ffd166"/><text x="24" y="505" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="498" font-size="15" font-weight="bold" fill="#e6ecf1">Any bit trips</text>
<text x="48" y="518" font-size="13" fill="#9aa8b5">Any violated limit is enough. The same st_trip is called for a missed deadline and a sequence mismatch.</text>
</g>
<g class="co" style="animation-delay:11.40s"><rect x="8" y="223" width="884" height="-117" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="225" r="11" fill="#ffd166"/><text x="8" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:11.40s">
<rect x="0" y="474" width="900" height="78" fill="#12171d"/>
<circle cx="24" cy="500" r="13" fill="#ffd166"/><text x="24" y="505" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="498" font-size="15" font-weight="bold" fill="#e6ecf1">Once</text>
<text x="48" y="518" font-size="13" fill="#9aa8b5">A second trip while SAFE does nothing: the first reason stays recorded.</text>
</g>
<g class="co" style="animation-delay:15.20s"><rect x="8" y="263" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="265" r="11" fill="#ffd166"/><text x="8" y="269" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">5</text></g>
<g class="co cap" style="animation-delay:15.20s">
<rect x="0" y="474" width="900" height="78" fill="#12171d"/>
<circle cx="24" cy="500" r="13" fill="#ffd166"/><text x="24" y="505" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">5</text>
<text x="48" y="498" font-size="15" font-weight="bold" fill="#e6ecf1">Stop the source</text>
<text x="48" y="518" font-size="13" fill="#9aa8b5">The first action is to stop the data, before printing or telling anyone.</text>
</g>
<g class="co" style="animation-delay:19.00s"><rect x="8" y="323" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="325" r="11" fill="#ffd166"/><text x="8" y="329" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">6</text></g>
<g class="co cap" style="animation-delay:19.00s">
<rect x="0" y="474" width="900" height="78" fill="#12171d"/>
<circle cx="24" cy="500" r="13" fill="#ffd166"/><text x="24" y="505" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">6</text>
<text x="48" y="498" font-size="15" font-weight="bold" fill="#e6ecf1">Remember why</text>
<text x="48" y="518" font-size="13" fill="#9aa8b5">Trip count and reason go into every later acknowledgement.</text>
</g>
<g class="co" style="animation-delay:22.80s"><rect x="8" y="383" width="884" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="385" r="11" fill="#ffd166"/><text x="8" y="389" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">7</text></g>
<g class="co cap" style="animation-delay:22.80s">
<rect x="0" y="474" width="900" height="78" fill="#12171d"/>
<circle cx="24" cy="500" r="13" fill="#ffd166"/><text x="24" y="505" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">7</text>
<text x="48" y="498" font-size="15" font-weight="bold" fill="#e6ecf1">Tell Linux</text>
<text x="48" y="518" font-size="13" fill="#9aa8b5">One unsolicited message to the endpoint that spoke last: the analysis process.</text>
</g>
<g class="co" style="animation-delay:26.60s"><rect x="8" y="423" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="425" r="11" fill="#ffd166"/><text x="8" y="429" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">8</text></g>
<g class="co cap" style="animation-delay:26.60s">
<rect x="0" y="474" width="900" height="78" fill="#12171d"/>
<circle cx="24" cy="500" r="13" fill="#ffd166"/><text x="24" y="505" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">8</text>
<text x="48" y="498" font-size="15" font-weight="bold" fill="#e6ecf1">On the board</text>
<text x="48" y="518" font-size="13" fill="#9aa8b5">Writing 0x10 to CTRL is the graceful ABORT of module P05: the frame in progress is finished, then it stops.</text>
</g>
</svg>
