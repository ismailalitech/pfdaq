<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d">
<title id="t">pfdaq_cap, counter payload, recorded run (fields marked ... left out)</title><desc id="d">The recorded JSON result of the counter throughput run, with callouts on the end-to-end rate, the start-to-interrupt times, the copy and verify rates, the stall cycles and the supervisor round trip.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 20.00s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 20.00s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}18.00%{opacity:1}21.00%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="340" rx="12" fill="#12171d"/>
<rect x="0" y="0" width="900" height="214" fill="#0d1117"/>
<rect x="0" y="0" width="900" height="34" fill="#1b222c"/>
<circle cx="20" cy="17" r="6" fill="#ef6f6c"/>
<circle cx="38" cy="17" r="6" fill="#e6c04f"/>
<circle cx="56" cy="17" r="6" fill="#5fbf84"/>
<text x="450" y="22" text-anchor="middle" font-size="12" fill="#9aa8b5">pfdaq_cap, counter payload, recorded run (fields marked ... left out)</text>
<text x="24" y="58" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84">$ </tspan><tspan fill="#e6ecf1">pfdaq_cap -r -m counter -w 252 -f 1024 -n 32</tspan></text>
<text x="24" y="78" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">{"pass": true, "bursts": 32, "frames": 32768, "bytes": 33554432, "elapsed_s": 1.133499,</text>
<text x="24" y="98" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve"> "mb_per_s_end_to_end": 29.60, ..., "start_to_irq_s": {"min": 0.001218, "mean": 0.034325, "max": 0.039303},</text>
<text x="24" y="118" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve"> "copy_mb_per_s": 70.5, "verify_mb_per_s": 55.4, "bad_seq": 0, "bad_payload": 0, "bad_crc": 0, ...,</text>
<text x="24" y="138" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve"> "faults_injected": 0, "dma_fail": 0, "fabric_stall_cycles": 301159, "next_seq": 32768,</text>
<text x="24" y="158" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve"> "supervisor": {"pass": true, "status_rx": 32, "deadline_miss": 0, "seq_mismatch": 0, ...,</text>
<text x="24" y="178" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">  "rtt_us": {"min": 1249, "mean": 1974, "max": 10020}}}</text>
<rect x="0" y="214" width="900" height="126" fill="#12171d"/>
<g class="co" style="animation-delay:0.00s"><rect x="8" y="63" width="884" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="65" r="11" fill="#ffd166"/><text x="8" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="214" width="900" height="126" fill="#12171d"/>
<circle cx="24" cy="240" r="13" fill="#ffd166"/><text x="24" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="238" font-size="15" font-weight="bold" fill="#e6ecf1">End to end: 29.6 MB/s</text>
<text x="48" y="258" font-size="13" fill="#9aa8b5">33,554,432 bytes in 1.133 s of wall-clock time for the whole loop.</text>
</g>
<g class="co" style="animation-delay:3.60s"><rect x="8" y="83" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="85" r="11" fill="#ffd166"/><text x="8" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.60s">
<rect x="0" y="214" width="900" height="126" fill="#12171d"/>
<circle cx="24" cy="240" r="13" fill="#ffd166"/><text x="24" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="238" font-size="15" font-weight="bold" fill="#e6ecf1">The DMA is not where the time goes</text>
<text x="48" y="258" font-size="13" fill="#9aa8b5">Fastest start to interrupt 1.218 ms; the mean of 34.3 ms includes waiting for the previous verify.</text>
</g>
<g class="co" style="animation-delay:7.20s"><rect x="8" y="103" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="105" r="11" fill="#ffd166"/><text x="8" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:7.20s">
<rect x="0" y="214" width="900" height="126" fill="#12171d"/>
<circle cx="24" cy="240" r="13" fill="#ffd166"/><text x="24" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="238" font-size="15" font-weight="bold" fill="#e6ecf1">Two software rates</text>
<text x="48" y="258" font-size="13" fill="#9aa8b5">14.9 ms to copy and 18.9 ms to verify one MiB, one after the other on one core.</text>
</g>
<g class="co" style="animation-delay:10.80s"><rect x="8" y="123" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="125" r="11" fill="#ffd166"/><text x="8" y="129" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:10.80s">
<rect x="0" y="214" width="900" height="126" fill="#12171d"/>
<circle cx="24" cy="240" r="13" fill="#ffd166"/><text x="24" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="238" font-size="15" font-weight="bold" fill="#e6ecf1">Stall cycles</text>
<text x="48" y="258" font-size="13" fill="#9aa8b5">301,159 over 32 bursts is 9,411 per burst: 131,072 beats plus 9,411 stalls at 8 ns is 933 MB/s.</text>
</g>
<g class="co" style="animation-delay:14.40s"><rect x="8" y="143" width="884" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="145" r="11" fill="#ffd166"/><text x="8" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">5</text></g>
<g class="co cap" style="animation-delay:14.40s">
<rect x="0" y="214" width="900" height="126" fill="#12171d"/>
<circle cx="24" cy="240" r="13" fill="#ffd166"/><text x="24" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">5</text>
<text x="48" y="238" font-size="15" font-weight="bold" fill="#e6ecf1">Supervisor round trips</text>
<text x="48" y="258" font-size="13" fill="#9aa8b5">32 messages at a mean of 1.974 ms is 0.063 s of the 1.133 s.</text>
</g>
</svg>
