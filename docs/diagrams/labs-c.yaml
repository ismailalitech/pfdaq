# Diagrams of group C labs: boot, images and the memory map (B02 to B05, X03, F02).
# Console text is copied from evidence/v0.5.1/board; flow figures use only names and numbers from the lab pages and sources.

- id: lab-b02-payload-layout
  alt: "How the boot payload is made and used: the template amp.yaml.in is filled in and given to hss-payload-generator, which writes payload.bin. The boot monitor on the E51 reads it from the SD card and starts u-boot.bin on harts 1 to 3 in supervisor mode at 0x80200000, and the FreeRTOS firmware on hart 4 in machine mode at 0x91C00000 without OpenSBI."
  width: 900
  height: 440
  step: 3
  nodes:
    yaml:    {x: 20,  y: 40,  w: 230, h: 66, kind: sw,     title: "amp.yaml.in", sub: "set-name, entry points, payloads"}
    gen:     {x: 340, y: 40,  w: 240, h: 66, kind: hart,   title: "hss-payload-generator", sub: "-c amp.yaml -v payload.bin"}
    payload: {x: 640, y: 40,  w: 240, h: 66, kind: good,   title: "payload.bin", sub: "header, chunk table, chunks"}
    hss:     {x: 400, y: 190, w: 280, h: 66, kind: mss,    title: "HSS on the E51", sub: "reads the header, loads the chunks"}
    uboot:   {x: 330, y: 330, w: 270, h: 80, kind: hart,   title: "u-boot.bin", sub: "harts 1, 2 and 3 (owner: 1)\nsupervisor mode, entry 0x80200000"}
    sup:     {x: 640, y: 330, w: 240, h: 80, kind: sw,     title: "FreeRTOS ELF", sub: "hart 4, machine mode\nentry 0x91C00000, no OpenSBI"}
  edges:
    - {from: yaml.right,    to: gen.left, label: "filled in"}
    - {from: gen.right,     to: payload.left}
    - {from: payload.bottom, to: hss.top, label: "SD card, partition 2"}
    - {from: hss.bottom@0.2, to: uboot.right}
    - {from: hss.bottom@0.7, to: sup.top}
  steps: [yaml, e0, gen, e1, payload, e2, hss, e3, uboot, e4, sup]
  notes:
    - {x: 20, y: 150, text: "One file, two images:", bold: true}
    - {x: 20, y: 172, text: "each core gets its own entry point,"}
    - {x: 20, y: 192, text: "privilege mode and owner."}
    - {x: 20, y: 350, text: "skip-opensbi: true on hart 4:"}
    - {x: 20, y: 370, text: "started by a plain mret"}
    - {x: 20, y: 390, text: "(see the table in the lab)."}

- id: lab-b02-boot-log
  type: terminal
  title: "boot monitor console (excerpt, board)"
  alt: "Lines of the boot monitor's console that match the payload: the 1632-byte header and 1376656 bytes copied, the image set name, the skip-OpenSBI flag on hart 4, u-boot.bin registered for the hart mask 0xe, the two images being processed, and the cores reaching Running."
  width: 960
  height: 360
  step: 3.4
  lines:
    - "[4.486903] Boot Partition found at index 1"
    - "[4.492424] Attempting to read image header (1632 bytes) ..."
    - "[4.501503] Copying 1376656 bytes to 0x103fc00000"
    - "[4.570249] Boot image set name: \"PolarFire-SoC-HSS::Disco Linux + freertos AMP\""
    - "[4.606722] boot_service(u54_4):: BOOT_FLAG_SKIP_OPENSBI found"
    - ">> [4.621426] boot_service(u54_1)::Registering domain \"u-boot.bin\" (hart mask 0xe)"
    - "[4.733328] boot_service(u54_1)::Processing boot image: \"u-boot.bin\""
    - "[4.755671] boot_service(u54_4)::Processing boot image: \"polarfire-soc-freertos-amp-demo.elf\""
    - "[4.862061] u54 State Change:  [Booting] [Booting] [Booting] [Running]"
    - "[22.485161] u54 State Change:  [Running] [Running] [Running] [Running]"
  callouts:
    - {lines: [0, 2], title: "The header and the payload", text: "1632 bytes is chunkTableOffset 0x660; 1376656 is bootImageLength of payload.bin."}
    - {lines: [3, 3], title: "The label", text: "The set-name line of amp.yaml.in, with @@AMP_DEMO@@ replaced by freertos."}
    - {lines: [4, 4], title: "No OpenSBI on hart 4", text: "The skip-opensbi flag of the hart 4 entry reached the monitor."}
    - {lines: [5, 6], title: "One image, three cores", text: "u-boot.bin is registered once for the hart mask 0xe: harts 1, 2 and 3."}
    - {lines: [7, 8], title: "The firmware on hart 4", text: "The ELF is processed as hart 4's own image; hart 4 is Running at 4.86 s, before Linux."}
    - {lines: [9, 9], title: "All four application cores", text: "Later, all four cores report Running."}

- id: lab-b03-layer
  alt: "How the project layer is used: five parts of meta-pfdaq (machine, U-Boot files, kernel device tree, supervisor firmware, extras) and the vendor layers all go into bitbake mchp-base-image, built with MACHINE=mpfs-disco-kit-amp, which leaves the SD image, kernel image, device tree, payload and firmware in the deploy directory."
  width: 900
  height: 340
  step: 2.6
  nodes:
    m:      {x: 20,  y: 50, w: 164, h: 66, kind: sw, title: "Machine", sub: "conf/machine/\nmpfs-disco-kit-amp.conf"}
    u:      {x: 194, y: 50, w: 164, h: 66, kind: sw, title: "U-Boot", sub: "payload template,\nenvironment, .cfg"}
    k:      {x: 368, y: 50, w: 164, h: 66, kind: sw, title: "Kernel", sub: "device tree .dts\ncopied in do_configure"}
    f:      {x: 542, y: 50, w: 164, h: 66, kind: sw, title: "Firmware", sub: "do_pfdaq_overlay\nruns apply.sh"}
    x:      {x: 716, y: 50, w: 164, h: 66, kind: sw, title: "Extras", sub: "pfdaq-tools, pfdaq-uio\npackagegroup"}
    vendor: {x: 20,  y: 200, w: 240, h: 84, kind: plain, title: "Vendor layers", sub: "OpenEmbedded-Core\nmeta-openembedded\nmeta-mchp (not edited)"}
    bb:     {x: 330, y: 200, w: 260, h: 84, kind: hart, title: "bitbake mchp-base-image", sub: "MACHINE=mpfs-disco-kit-amp"}
    out:    {x: 650, y: 200, w: 230, h: 84, kind: good, title: "Deploy directory", sub: "wic.gz, wic.bmap, fitImage\ndevice tree, payload.bin\nfirmware ELF"}
  edges:
    - {from: m.bottom, to: bb.top}
    - {from: u.bottom, to: bb.top}
    - {from: k.bottom, to: bb.top}
    - {from: f.bottom, to: bb.top}
    - {from: x.bottom, to: bb.top}
    - {from: vendor.right, to: bb.left}
    - {from: bb.right, to: out.left}
  steps: [m, e0, u, e1, k, e2, f, e3, x, e4, vendor, e5, bb, e6, out]
  notes:
    - {x: 20, y: 34, text: "meta-pfdaq: the one project layer, on top of the vendor's", bold: true}
    - {x: 20, y: 320, text: "Each part supplies only what the vendor layer cannot: no vendor file is edited."}

- id: lab-b04-reserved-block
  alt: "The reserved block of the device tree, drawn in address order and not to scale: the supervisor region at 0x91C00000 (1 MiB), two RPMsg rings of 32 KiB, the 256 KiB message buffer pool and the 4 KiB resource table, after which Linux's System RAM resumes at 0x91D51000. The boot payload, the firmware linker script and the firmware resource table must name the same addresses."
  width: 900
  height: 500
  step: 2.8
  nodes:
    ctx:    {x: 20, y: 40,  w: 380, h: 120, kind: sw,  title: "0x91C0_0000  contextb_reserved", sub: "1 MiB, no-map\nthe supervisor's code and data"}
    ring0:  {x: 20, y: 166, w: 380, h: 52,  kind: mem, title: "0x91D0_0000  vdev0vring0", sub: "32 KiB, RPMsg ring 0"}
    ring1:  {x: 20, y: 224, w: 380, h: 52,  kind: mem, title: "0x91D0_8000  vdev0vring1", sub: "32 KiB, RPMsg ring 1"}
    buf:    {x: 20, y: 282, w: 380, h: 52,  kind: mem, title: "0x91D1_0000  vdev0buffer", sub: "256 KiB, message buffers"}
    rsc:    {x: 20, y: 340, w: 380, h: 52,  kind: mem, title: "0x91D5_0000  rsctable", sub: "4 KiB, resource table"}
    ram:    {x: 20, y: 398, w: 380, h: 52,  kind: plain, title: "0x91D5_1000  System RAM", sub: "Linux's memory again"}
    pay:    {x: 520, y: 36,  w: 360, h: 56, kind: hart, title: "Boot payload (module B02)", sub: "exec-addr 0x91C00000, owner u54_4"}
    link:   {x: 520, y: 108, w: 360, h: 56, kind: hart, title: "Firmware linker script", sub: "links the supervisor for 0x91C00000"}
    rtab:   {x: 520, y: 331, w: 360, h: 70, kind: hart, title: "Firmware resource table", sub: "names the ring and buffer addresses\ncopied to 0x91D50000 at start"}
  edges:
    - {from: pay.left,  to: ctx.right@0.2, label: "same address"}
    - {from: link.left, to: ctx.right@0.8, label: "same address"}
    - {from: rtab.left, to: rsc.right, label: "same address"}
  steps: [ctx, ring0, ring1, buf, rsc, ram, pay, e0, link, e1, rtab, e2]
  notes:
    - {x: 20, y: 24, text: "Reserved block 0x91C0_0000 to 0x91D5_0FFF (sizes not to scale)", bold: true}
    - {x: 20, y: 478, text: "If the three places on the right disagree with the device tree, the system fails in confusing ways."}

- id: lab-b04-checks
  type: terminal
  title: "Linux console on the board (excerpt, kernel timestamps removed)"
  alt: "Read-only checks on the running board: the reserved block 0x91C00000 to 0x91D50FFF in /proc/iomem with System RAM resuming at 0x91D51000, two of the kernel's reserved-memory messages, the three UIO device names, and 0-2 as the online CPUs."
  width: 960
  height: 420
  step: 3.4
  lines:
    - "$ grep -i -E 'reserved|91c00000|91d' /proc/iomem"
    - "91c00000-91d50fff : Reserved"
    - "  91d50000-91d50fff : remote-context rsc-table@91d50000"
    - "91d51000-91ffffff : System RAM"
    - "$ dmesg | grep -i reserved"
    - "OF: reserved mem: 0x0000000091c00000..0x0000000091cfffff (1024 KiB) nomap non-reusable contextb_reserved@91c00000"
    - "OF: reserved mem: 0x0000000091d50000..0x0000000091d50fff (4 KiB) nomap non-reusable rsc-table@91d50000"
    - "$ grep -H . /sys/class/uio/uio*/name"
    - "/sys/class/uio/uio0/name:fpga_lsram"
    - "/sys/class/uio/uio1/name:pfdaq_stream_src"
    - "/sys/class/uio/uio2/name:dma-controller@60010000"
    - "$ cat /sys/devices/system/cpu/online"
    - "0-2"
  callouts:
    - {lines: [1, 3], title: "One reserved block", text: "0x91C00000 to 0x91D50FFF is reserved; RAM resumes at 0x91D51000. The resource table sits inside."}
    - {lines: [5, 6], title: "The kernel names the regions", text: "Two of the five regions (the others are left out): firmware and resource table, both nomap."}
    - {lines: [8, 10], title: "UIO devices", text: "The fabric registers and the DMA controller appear as UIO devices, in the order Linux found them."}
    - {lines: [12, 12], title: "Three CPUs", text: "Hart 4 is disabled in the tree, so Linux has CPUs 0 to 2."}

- id: lab-b05-update-paths
  alt: "Where each kind of update goes on the running board: the Linux tools and module go to the root filesystem on partition 3 and need no reboot; the kernel image goes to the FAT partition 1 by mount, copy, sync and a checksum compare; the boot payload goes to the raw partition 2 with dd and a read-back checksum compare. After a reboot you check that remoteproc is attached and the supervisor channel is present."
  width: 920
  height: 440
  step: 3
  nodes:
    pc:     {x: 20,  y: 150, w: 200, h: 90, kind: start, title: "PC", sub: "files from Yocto or\nfirmware/build_payload.sh"}
    t1:     {x: 290, y: 30,  w: 340, h: 70, kind: sw, title: "Tools and module", sub: "root filesystem, partition 3\nscp, install, depmod: no reboot"}
    t2:     {x: 290, y: 140, w: 340, h: 70, kind: sw, title: "Kernel image (fitImage)", sub: "partition 1, FAT: mount, copy, sync\nchecksum prefixes compared"}
    t3:     {x: 290, y: 250, w: 340, h: 70, kind: sw, title: "Boot payload (payload.bin)", sub: "partition 2, raw: dd conv=fsync\nread-back checksum compared"}
    reboot: {x: 700, y: 190, w: 200, h: 66, kind: mss, title: "Reboot", sub: "ssh root@<board> reboot"}
    check:  {x: 675, y: 310, w: 230, h: 90, kind: good, title: "Check", sub: "remoteproc attached\nchannel pfdaq-supervisor\nsupervised capture passes"}
  edges:
    - {from: pc.right@0.15, to: t1.left}
    - {from: pc.right@0.5,  to: t2.left}
    - {from: pc.right@0.85, to: t3.left}
    - {from: t2.right, to: reboot.left}
    - {from: t3.right, to: reboot.left}
    - {from: reboot.bottom, to: check.top}
  steps: [pc, e0, t1, e1, t2, e2, t3, e3, e4, reboot, e5, check]
  notes:
    - {x: 20, y: 372, text: "Before every write to a block device, show which device it is."}
    - {x: 20, y: 394, text: "Do not reboot until the two checksum prefixes are equal."}
    - {x: 20, y: 416, text: "The rollback that always works is the proven image on the PC."}

