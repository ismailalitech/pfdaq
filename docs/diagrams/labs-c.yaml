    - {lines: [3, 3], title: "Cycles 3 to 29 left out", text: "This line is not in the record: it marks the cut."}
    - {lines: [5, 5], title: "The verdict", text: "The record's last line. Across the 30 cycles SSH came back after 45.9 to 61.4 s."}

