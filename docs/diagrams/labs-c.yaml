- id: lab-f02-three-windows
  alt: "Three address windows onto the same DDR: the cached window at 0x8000_0000 (64-bit 0x10_0000_0000), the non-cached window at 0xC000_0000 (0x14_0000_0000) and the non-cached write-combining window at 0xD000_0000 (0x18_0000_0000) all point at physical DDR address 0. The three vendor buffers sit at the same 0x0800_0000 offset in each window."
  width: 900
  height: 430
  step: 3
  nodes:
    c:   {x: 20,  y: 40,  w: 340, h: 96, kind: hart,   title: "Cached window", sub: "32-bit base 0x8000_0000\n64-bit base 0x10_0000_0000\nbuffer udmabuf-ddr-c0 at 0x8800_0000"}
    nc:  {x: 20,  y: 160, w: 340, h: 96, kind: fabric, title: "Non-cached window", sub: "32-bit base 0xC000_0000\n64-bit base 0x14_0000_0000\nbuffer udmabuf-ddr-nc0 at 0xC800_0000"}
    wcb: {x: 20,  y: 280, w: 340, h: 96, kind: mem,    title: "Non-cached WCB window", sub: "32-bit base 0xD000_0000\n64-bit base 0x18_0000_0000\nbuffer udmabuf-ddr-nc-wcb0 at 0xD800_0000"}
    ddr: {x: 560, y: 40,  w: 320, h: 336, kind: mss,   title: "Physical DDR", sub: "all six windows start at\nphysical DDR address 0\n \nphysical byte N answers at\n0x8000_0000 + N cached\n0xC000_0000 + N non-cached\n0xD000_0000 + N write-combining\n \neach buffer is at offset 0x0800_0000"}
  edges:
    - {from: c.right,   to: ddr.left@0.2}
    - {from: nc.right,  to: ddr.left@0.5}
    - {from: wcb.right, to: ddr.left@0.8}
  steps: [c, e0, nc, e1, wcb, e2, ddr]
  notes:
    - {x: 20,  y: 404, text: "Read from the boot monitor's segment table and the buffers' addresses; this project did not test the aliasing directly."}

- id: lab-f02-segment-table
  type: terminal
  title: "boot monitor console (excerpt, board)"
  alt: "The boot monitor's segment configuration: two cached segments at 0x0080000000 and 0x1000000000, two non-cached at 0x00c0000000 and 0x1400000000, two non-cached write-combining at 0x00d0000000 and 0x1800000000, all with physical DDR 0x00000000."
  width: 900
  height: 300
  step: 3.4
  lines:
    - "[0.860312] Segment Configuration:"
    - "        Cached: SEG0_0: offset 0x0080000000, physical DDR 0x00000000"
    - "        Cached: SEG0_1: offset 0x1000000000, physical DDR 0x00000000"
    - "    Non-cached: SEG1_2: offset 0x00c0000000, physical DDR 0x00000000"
    - "    Non-cached: SEG1_3: offset 0x1400000000, physical DDR 0x00000000"
    - "Non-cached WCB: SEG1_4: offset 0x00d0000000, physical DDR 0x00000000"
    - "Non-cached WCB: SEG1_5: offset 0x1800000000, physical DDR 0x00000000"
  callouts:
    - {lines: [1, 2], title: "Cached", text: "Two windows, at a 32-bit and a 64-bit address."}
    - {lines: [3, 4], title: "Non-cached", text: "The same pair again: 0xC000_0000 and 0x14_0000_0000."}
    - {lines: [5, 6], title: "Non-cached, write-combining", text: "A third pair: 0xD000_0000 and 0x18_0000_0000."}
    - {lines: [1, 6], title: "One memory", text: "In all six lines the physical DDR address is 0x00000000."}

- id: lab-f02-two-addresses
  alt: "The two addresses of one buffer in pfdaq_cap: ddr is the program's own virtual address, mapped from /dev/udmabuf-ddr-nc0, and is used to write the descriptor and read the frames; ddr_phys is read from sysfs and is what goes into the descriptor's destination field and into the DMA controller's stream address register."
  width: 900
  height: 360
  step: 3
  nodes:
    phys: {x: 20,  y: 30,  w: 320, h: 66, kind: mem,    title: "ddr_phys", sub: "read from sysfs: udmabuf-ddr-nc0\nphys_addr (the hardware's address)"}
    virt: {x: 20,  y: 230, w: 320, h: 66, kind: hart,   title: "ddr", sub: "mmap of /dev/udmabuf-ddr-nc0\n(the program's virtual address)"}
    d2:   {x: 520, y: 30,  w: 360, h: 66, kind: good,   title: "desc[2], the destination", sub: "(uint32_t)(ddr_phys + dest_off)"}
    dreg: {x: 520, y: 130, w: 360, h: 66, kind: fabric, title: "DMA stream address register", sub: "(uint32_t)(ddr_phys + DESC_OFF)"}
    cpu:  {x: 520, y: 230, w: 360, h: 66, kind: sw,     title: "Program on Linux", sub: "writes the descriptor at ddr + DESC_OFF\nreads the frames through ddr"}
  edges:
    - {from: phys.right@0.5, to: d2.left}
    - {from: phys.right@0.85, to: dreg.left}
    - {from: virt.right, to: cpu.left}
  steps: [phys, e0, d2, e1, dreg, virt, e2, cpu]
  notes:
    - {x: 20, y: 336, text: "Mixing the two up is the classic first mistake (module I04)."}
