# ---------------------------------------------------------------- P07
- id: lab-p07-settings
  alt: "The path of the fabric interrupt to the measuring program and the runtime setting that acts on each step. The fabric line reaches the PLIC (source 119); smp_affinity chooses the Linux CPU that takes it; a kernel thread at SCHED_FIFO 50 serves it and wakes the program; the program, started with taskset and SCHED_FIFO 80 and locked memory, reads the event and writes ACK."
  width: 900
  height: 250
  nodes:
    plic: {x: 10,  y: 40, w: 150, h: 70, kind: mss,    title: "PLIC", sub: "source 119\n(fabric F2M[1])"}
    cpu:  {x: 215, y: 40, w: 160, h: 70, kind: hart,   title: "One Linux CPU", sub: "chosen by\nsmp_affinity"}
    thr:  {x: 430, y: 40, w: 190, h: 70, kind: sw,     title: "irq/80 kernel thread", sub: "SCHED_FIFO 50\nchrt can change it"}
    app:  {x: 675, y: 40, w: 215, h: 70, kind: good,   title: "pfdaq_lat", sub: "taskset, -R 80:\nSCHED_FIFO 80, mlockall"}
    ack:  {x: 675, y: 160, w: 215, h: 60, kind: fabric, title: "ACK write", sub: "stops the fabric timer"}
  edges:
    - {id: e0, from: plic.right, to: cpu.left, label: "interrupt"}
    - {id: e1, from: cpu.right, to: thr.left, label: "wakes"}
    - {id: e2, from: thr.right, to: app.left, label: "wakes"}
    - {id: e3, from: app.bottom, to: ack.top}
  steps: [plic, e0, cpu, e1, thr, e2, app, e3, ack]
  notes:
    - {x: 20, y: 160, text: "Settings used: smp_affinity of the interrupt, taskset for the program and for other tasks,"}
    - {x: 20, y: 178, text: "SCHED_FIFO and mlockall for the program, chrt for the kernel thread. No boot argument."}

- id: lab-p07-irq-counts
  type: terminal
  title: "p07_run.sh, recorded lines: which CPU takes the interrupt (columns are CPU0/CPU1/CPU2)"
  alt: "Three recorded excerpts of the harness. By default the fabric interrupt count grows on CPU0 only (200,000 interrupts in one run). After writing mask 2 to the interrupt's smp_affinity it grows on CPU1 only, and after mask 4 on CPU2 only."
  width: 940
  height: 300
  step: 3.6
  lines:
    - "# irq-counts u1_default_idle run 1 before(cpu0/1/2) 5999253/1003997/4992945 after 6199252/1003997/4992945"
    - "# irq 80 affinity 2, effective 2"
    - "# irq-counts u5_fifo80_cpu1_irq_cpu1 run 1 before(cpu0/1/2) 9999243/1003997/4992945 after 9999243/1203997/4992945"
    - "# irq 80 affinity 4, effective 4"
    - "# irq-counts u6_fifo80_cpu2_irq_cpu2 run 1 before(cpu0/1/2) 9999243/2003997/4992945 after 9999243/2003997/5192945"
  callouts:
    - {lines: [0, 0], title: "Default: CPU0", text: "200,000 interrupts for 100,000 events (the double wake-up of I02), all on CPU0."}
    - {lines: [1, 2], title: "Mask 2: CPU1", text: "After writing 2 to smp_affinity the effective affinity is CPU1 and the counts grow there."}
    - {lines: [3, 4], title: "Mask 4: CPU2", text: "The same with mask 4: only CPU2 counts."}

# ---------------------------------------------------------------- F06
- id: lab-f06-led-paths
  alt: "The two ways to drive LED1. The kernel's leds-gpio driver, reached through /sys/class/leds/led1, writes bit 17 of MSS GPIO2. A user program writes bit 0 of the GPIO_OUT register of CoreGPIO in the fabric, through the UIO page at 0x4000_0000. In the fabric an OR gate named OR2_LED1 combines the two signals and drives the LED1 pin, so either source lights the LED. Software can read back both registers; it cannot see the LED."
  width: 900
  height: 330
  nodes:
    drv:  {x: 10,  y: 30,  w: 220, h: 78, kind: sw,     title: "leds-gpio driver", sub: "/sys/class/leds/led1\nkernel holds line 17"}
    prog: {x: 10,  y: 190, w: 220, h: 78, kind: hart,   title: "gpio_both_sides", sub: "UIO page 0x4000_0000\n32-bit stores"}
    mss:  {x: 300, y: 30,  w: 200, h: 78, kind: mss,    title: "MSS GPIO2, bit 17", sub: "gpiochip1 line 17\n0x2012_2000"}
    core: {x: 300, y: 190, w: 200, h: 78, kind: fabric, title: "CoreGPIO GPIO_OUT[0]", sub: "0x4000_0100 + 0xA0\n7 output bits"}
    or2:  {x: 580, y: 110, w: 140, h: 78, kind: fabric, title: "OR2_LED1", sub: "a gate in the fabric"}
    led:  {x: 780, y: 110, w: 110, h: 78, kind: good,   title: "LED1", sub: "the pin"}
  edges:
    - {id: e0, from: drv.right,  to: mss.left,  label: "writes 1"}
    - {id: e1, from: mss.right,  to: or2.left@0.25, label: "M2F_17"}
    - {id: e2, from: prog.right, to: core.left, label: "writes bit 0"}
    - {id: e3, from: core.right, to: or2.left@0.75, label: "GPIO_OUT[0]"}
    - {id: e4, from: or2.right,  to: led.left}
  steps: [drv, e0, mss, e1, prog, e2, core, e3, or2, e4, led]
  notes:
    - {x: 20, y: 290, text: "The OR gate is in the reference design's script: OR2_LED1 has input A = GPIO_OUT[0], input B = MSS GPIO2 bit 17."}
    - {x: 20, y: 308, text: "Software reads back each source's own register. Nothing lets it read the LED pin, so no run says that an LED lit."}

- id: lab-f06-pins
  alt: "Where the other board pins go. DIP5 to DIP8 are inputs, through an inverter, to MSS GPIO2 bits 25 to 28, so they can be read through the gpiochip device. DIP1 to DIP4 are not GPIO lines: they are interrupt inputs F2M[6] to F2M[9], PLIC sources 124 to 127, and no handler is registered for them on this image. LED8 is driven by line 9 of the first GPIO chip, with no fabric logic in between."
  width: 900
  height: 330
  nodes:
    d58:  {x: 10,  y: 20,  w: 170, h: 70, kind: fabric, title: "DIP5 to DIP8", sub: "switch pins, inverted"}
    d14:  {x: 10,  y: 130, w: 170, h: 70, kind: fabric, title: "DIP1 to DIP4", sub: "switch pins, inverted"}
    l8:   {x: 10,  y: 240, w: 170, h: 70, kind: good,   title: "LED8", sub: "pin GPIO_1_9_OUT"}
    g2:   {x: 290, y: 20,  w: 200, h: 70, kind: mss,    title: "MSS GPIO2 bits 25 to 28", sub: "inputs F2M_25 to F2M_28"}
    plic: {x: 290, y: 130, w: 200, h: 70, kind: mss,    title: "PLIC sources 124 to 127", sub: "fabric lines F2M[6] to [9]"}
    g0:   {x: 290, y: 240, w: 200, h: 70, kind: mss,    title: "MSS GPIO1 bit 9", sub: "gpiochip0 line 9"}
    rd:   {x: 610, y: 20,  w: 280, h: 70, kind: hart,   title: "gpiochip1 read", sub: "request lines 25 to 28 as inputs"}
    none: {x: 610, y: 130, w: 280, h: 70, kind: bad,    title: "no handler", sub: "no entry in /proc/interrupts"}
    drv:  {x: 610, y: 240, w: 280, h: 70, kind: sw,     title: "leds-gpio driver", sub: "/sys/class/leds/led8"}
  edges:
    - {id: e0, from: d58.right, to: g2.left}
    - {id: e1, from: g2.right,  to: rd.left,   label: "read"}
    - {id: e2, from: d14.right, to: plic.left}
    - {id: e3, from: plic.right, to: none.left, kind: bad, label: "nobody listens"}
    - {id: e4, from: drv.left,  to: g0.right,  label: "writes"}
    - {id: e5, from: g0.left,   to: l8.right}
  steps: [d58, e0, g2, e1, rd, d14, e2, plic, e3, none, drv, e4, g0, e5, l8]

- id: lab-f06-run
  type: terminal
  title: "gpio_both_sides on the board, excerpts of the recorded run"
  alt: "Recorded output of the program. Line 17 of MSS GPIO2 is held by the kernel for led1 and a request for it fails with device busy. DIP5 to DIP8 read 0 0 0 0. CoreGPIO's configuration registers read 0, its GPIO_OUT register keeps 7 bits (writing 0xffffffff reads back 0x7f, and bit 7 reads back as 0), and its GPIO_IN reads 0. The four combinations of the kernel side and the fabric side for LED1 each read back what was written to that side, independently."
  width: 940
  height: 440
  step: 3.4
  lines:
    - "mss    line 17  out  kernel  consumer \"led1\""
    - "mss    line 25  in   free    consumer \"\""
    - "mss  DIP5..DIP8 read 0 0 0 0 (read 1)"
    - "mss  request of line 17 (led1, held by leds-gpio): Device or resource busy"
    - "core CFG0..CFG7 00000000 00000000 00000000 00000000 00000000 00000000 00000000 00000000"
    - "core IRQ 00000000  GPIO_IN 00000000  GPIO_OUT 00000000"
    - "core GPIO_OUT after writing 0xffffffff: 0000007f"
    - "core GPIO_OUT after writing bit 6:      00000040"
    - "core GPIO_OUT after writing bit 7:      00000000"
    - "both  mss=0 core=0: led1 brightness 0, debugfs gpio-17 out lo | CoreGPIO OUT bit0 0, IN 00000000"
    - "both  mss=0 core=1: led1 brightness 0, debugfs gpio-17 out lo | CoreGPIO OUT bit0 1, IN 00000000"
    - "both  mss=1 core=0: led1 brightness 1, debugfs gpio-17 out hi | CoreGPIO OUT bit0 0, IN 00000000"
    - "both  mss=1 core=1: led1 brightness 1, debugfs gpio-17 out hi | CoreGPIO OUT bit0 1, IN 00000000"
    - "both  restored: led1 brightness 0, GPIO_OUT 00000000"
  callouts:
    - {lines: [0, 0], title: "The kernel owns the LED lines", text: "Lines 17 to 23 of gpiochip1 are held by the leds-gpio driver (consumer led1 to led7)."}
    - {lines: [1, 2], title: "DIP5 to DIP8 are free inputs", text: "The four lines can be requested and read; they read 0 0 0 0 here (the switch positions were not checked by eye)."}
    - {lines: [3, 3], title: "A held line cannot be requested", text: "Only the LED class can drive line 17; to drive it from a program, use brightness."}
    - {lines: [4, 5], title: "CoreGPIO has no configuration", text: "The configuration registers read 0 (the core is built with fixed configuration) and GPIO_IN reads 0."}
    - {lines: [6, 8], title: "Seven output bits", text: "Writing all ones reads back 0x7f; bit 7 does not exist. Each bit drives the OR gate of one LED."}
    - {lines: [9, 12], title: "Two independent sources", text: "Each side reads back what was written to it, whatever the other side holds: the OR happens after both."}
    - {lines: [13, 13], title: "Put back", text: "led1 brightness and GPIO_OUT are returned to 0."}

# ---------------------------------------------------------------- M10 (recorded output of the stall)
- id: lab-m10-stall-diag
  type: terminal
  title: 'board console: the acquisition log at a stall of the first loop'
  alt: "Recorded output of the first version of the acquisition loop on the board at an end-of-run stall: the register line printed by the diagnostic note and the line of the acquisition process two seconds later. The fabric had sent 5000 frames, the station had taken 4999, the UIO event count was 4999, the fabric held 3 credits, the descriptor of the last slot read 0x9 (frame written) and its buffer held the last frame of the run, sequence 511013."
  width: 960
  height: 300
  step: 3.4
  lines:
  - "DIAG no progress for 2 s: processed 4999 of 5000, fabric sent 5000, status 0x2,"
  - "    next_seq 511014, drops 0, credits 3, dma stat 0x210, uio events 4999 (read 4999),"
  - "    d0 cfg 0xd buf seq 511010, d1 cfg 0xd buf seq 511011, d2 cfg 0xd buf seq 511012, d3 cfg 0x9 buf seq 511013"
  - "[   7.032 cpu0 acq] run 1: no progress for 2 s, aborting the source"
  - "(the loop that reads descriptors, the same load, another run)"
  - "run end: 5000 frames taken from the descriptors, 4999 UIO events (fewer events than completed frames)"
  - "run end: 5000 frames taken from the descriptors, 5000 UIO events"
  callouts:
  - lines: [0, 0]
    title: Everything arrived
    text: "The fabric sent all 5000 frames and is done (status 0x2); 4999 were taken; it still holds 3 of its 4 credits."
  - lines: [1, 1]
    title: The count and the data disagree
    text: "The UIO event count is 4999, equal to the frames taken: the loop waits for an event that will not come."
  - lines: [2, 2]
    title: The frame is in memory
    text: "Descriptor 3 reads 0x9 (the DMA wrote the frame and cleared its ready bit) and its buffer holds sequence 511013, the last one of the run."
  - lines: [3, 3]
    title: Two seconds later
    text: "The station's own no-progress limit ends the run; the frame is never taken."
  - lines: [5, 5]
    title: Same load, no stall
    text: "The loop that reads descriptors took all 5000 frames although only 4999 events were counted, and the run ended at once."

# ---------------------------------------------------------------- I09
- id: lab-i09-three-movers
  alt: "Three ways to put 1 MiB into a DDR buffer. The fabric DMA: the stream source sends frames to the CoreAXI4DMAController, which writes them into the destination buffer after the program has armed a descriptor. The MSS DMA: the program gives two physical addresses and a length to the dma-proxy device with two ioctls, and the PDMA copies from a source buffer to the destination buffer. The processor: the program copies with memcpy, so a hart does every load and store."
  width: 920
  height: 440
  nodes:
    ss:   {x: 10,  y: 20,  w: 150, h: 70, kind: fabric, title: "Stream source", sub: "1 KiB frames,\ncounter payload"}
    fd:   {x: 220, y: 20,  w: 190, h: 70, kind: fabric, title: "Fabric DMA", sub: "CoreAXI4DMAController\narmed by a descriptor"}
    prog: {x: 10,  y: 190, w: 190, h: 90, kind: hart,   title: "Linux program", sub: "U54, three cores\ntimes every transfer"}
    px:   {x: 260, y: 190, w: 150, h: 70, kind: sw,     title: "dma-proxy", sub: "two ioctls:\nstart, finish"}
    pd:   {x: 470, y: 190, w: 170, h: 70, kind: mss,    title: "MSS PDMA", sub: "4 channels, PLIC 5 to 12"}
    cp:   {x: 260, y: 340, w: 150, h: 70, kind: hart,   title: "memcpy", sub: "a hart does every\nload and store"}
    srcb: {x: 700, y: 190, w: 200, h: 70, kind: mem,    title: "Source buffer", sub: "c, nc or wcb window\nof the same DDR"}
    dstb: {x: 700, y: 340, w: 200, h: 70, kind: mem,    title: "Destination buffer", sub: "c, nc or wcb window\nof the same DDR"}
  edges:
    - {id: e0, from: ss.right,   to: fd.left,    label: "stream"}
    - {id: e1, from: fd.right,   to: dstb.top,   label: "FIC0, writes"}
    - {id: e2, from: prog.right@0.3, to: px.left, label: "ioctl"}
    - {id: e3, from: px.right,   to: pd.left,    label: "memcpy"}
    - {id: e4, from: srcb.left,  to: pd.right,   label: "reads"}
    - {id: e5, from: pd.bottom,  to: dstb.left@0.2,  label: "writes"}
    - {id: e6, from: prog.bottom, to: cp.left,   label: "same copy"}
    - {id: e7, from: cp.right,   to: dstb.left@0.8, dashed: true, label: "loads, stores"}
  steps: [ss, e0, fd, e1, dstb, prog, e2, px, e3, pd, e4, srcb, e5, e6, cp, e7]
  notes:
    - {x: 20, y: 425, text: "Same bytes, same kind of destination, three movers. The fabric DMA has no source buffer: its data comes from the stream."}

- id: lab-i09-run
  type: terminal
  title: "dma_compare on the board: 1 MiB into DDR, four ways (fields marked ... left out)"
  alt: "Four recorded runs of dma_compare moving 1 MiB. The fabric DMA into the non-cached window takes 1.2078 ms per transfer, 868 MB/s, with the program on a CPU 45 microseconds of that. The MSS DMA from non-cached to non-cached takes 2.8412 ms, 369 MB/s, 38 microseconds on a CPU. The MSS DMA from the non-cached to the cached window takes 0.9093 ms, 1,153 MB/s, 74 microseconds. memcpy for the same copy takes 13.0429 ms, 80 MB/s, with the program on a CPU the whole time. No word was wrong in any of them."
  width: 940
  height: 420
  step: 3.6
  lines:
    - "$ dma_compare -m fabric -b 1048576 -D nc"
    - '{"mode": "fabric", ..., "reps": 819, "counted_words": 260096, "bad_words_own_view": 0, "bad_words_ddr_view": 0,'
    - ' "ms_mean": 1.2078, "mb_per_s": 868.16, "cpu_ms_net": 0.0451, "cpu_share": 0.0373, "non_idle_cores": 0.091, ...}'
    - "$ dma_compare -m pdma -b 1048576 -R nc -D nc"
    - '{"mode": "pdma", ..., "reps": 351, "counted_words": 262144, "bad_words_own_view": 0, "bad_words_ddr_view": 0,'
    - ' "ms_mean": 2.8412, "mb_per_s": 369.07, "cpu_ms_net": 0.0378, "cpu_share": 0.0133, "non_idle_cores": 0.027, ...}'
    - "$ dma_compare -m pdma -b 1048576 -R nc -D c"
    - '{"mode": "pdma", ..., "reps": 1078, "counted_words": 262144, "bad_words_own_view": 0, "bad_words_ddr_view": 0,'
    - ' "ms_mean": 0.9093, "mb_per_s": 1153.13, "cpu_ms_net": 0.0735, "cpu_share": 0.0808, "non_idle_cores": 0.173, ...}'
    - "$ dma_compare -m memcpy -b 1048576 -R nc -D c"
    - '{"mode": "memcpy", ..., "reps": 77, "counted_words": 262144, "bad_words_own_view": 0, "bad_words_ddr_view": 0,'
    - ' "ms_mean": 13.0429, "mb_per_s": 80.39, "cpu_ms_net": 13.044, "cpu_share": 1.0001, "non_idle_cores": 1.002, ...}'
  callouts:
    - {lines: [0, 2], title: "Fabric DMA", text: "The stream source's 1 MiB lands in the non-cached buffer in 1.21 ms, and the program is on a CPU 45 us of that."}
    - {lines: [3, 5], title: "MSS DMA, non-cached to non-cached", text: "A copy that the processor only starts and waits for: 2.84 ms, 38 us on a CPU. The source is read from the non-cached window."}
    - {lines: [6, 8], title: "MSS DMA, non-cached to cached", text: "The copy-out step of the project's capture loop done by the DMA: 0.91 ms."}
    - {lines: [9, 11], title: "The processor's copy", text: "The same copy with memcpy: 13.04 ms with a hart busy the whole time (cpu_share 1.0001)."}

