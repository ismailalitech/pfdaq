<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 250" width="940" height="250" role="img" aria-labelledby="t d">
<title id="t">board console, recorded (boot-uboot-linux and device-tree-checks)</title><desc id="d">Two recorded pieces of board output: the kernel command line that enables the generic UIO driver for device-tree nodes (the leading time stamp is cut), and the names of the three UIO devices, uio0 fpga_lsram, uio1 pfdaq_stream_src and uio2 dma-controller@60010000, which the tools look up by name.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 12.20s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 12.20s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}27.87%{opacity:1}30.87%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="940" height="250" rx="12" fill="#12171d"/>
<rect x="0" y="0" width="940" height="154" fill="#0d1117"/>
<rect x="0" y="0" width="940" height="34" fill="#1b222c"/>
<circle cx="20" cy="17" r="6" fill="#ef6f6c"/>
<circle cx="38" cy="17" r="6" fill="#e6c04f"/>
<circle cx="56" cy="17" r="6" fill="#5fbf84"/>
<text x="470" y="22" text-anchor="middle" font-size="12" fill="#9aa8b5">board console, recorded (boot-uboot-linux and device-tree-checks)</text>
<text x="24" y="58" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">Kernel command line: earlycon root=/dev/mmcblk0p3 rootwait uio_pdrv_genirq.of_id=generic-uio clk_ignore_unused</text>
<text x="24" y="78" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">/sys/class/uio/uio0/name:fpga_lsram</text>
<text x="24" y="98" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">/sys/class/uio/uio1/name:pfdaq_stream_src</text>
<text x="24" y="118" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">/sys/class/uio/uio2/name:dma-controller@60010000</text>
<rect x="0" y="154" width="940" height="96" fill="#12171d"/>
<g class="co" style="animation-delay:0.00s"><rect x="8" y="43" width="924" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="45" r="11" fill="#ffd166"/><text x="8" y="49" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="154" width="940" height="96" fill="#12171d"/>
<circle cx="24" cy="180" r="13" fill="#ffd166"/><text x="24" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="178" font-size="15" font-weight="bold" fill="#e6ecf1">The kernel is told to use the generic driver</text>
<text x="48" y="198" font-size="13" fill="#9aa8b5">uio_pdrv_genirq.of_id=generic-uio is what makes compatible = "generic-uio" a binding.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="8" y="83" width="924" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="85" r="11" fill="#ffd166"/><text x="8" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.40s">
<rect x="0" y="154" width="940" height="96" fill="#12171d"/>
<circle cx="24" cy="180" r="13" fill="#ffd166"/><text x="24" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="178" font-size="15" font-weight="bold" fill="#e6ecf1">The device the tools look up</text>
<text x="48" y="198" font-size="13" fill="#9aa8b5">pfdaq_stream_src is the linux,uio-name of the node; pfdaq_cap and pfdaq_lat search for it.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="8" y="63" width="924" height="63" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="65" r="11" fill="#ffd166"/><text x="8" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:6.80s">
<rect x="0" y="154" width="940" height="96" fill="#12171d"/>
<circle cx="24" cy="180" r="13" fill="#ffd166"/><text x="24" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="178" font-size="15" font-weight="bold" fill="#e6ecf1">The number is not the identity</text>
<text x="48" y="198" font-size="13" fill="#9aa8b5">It is uio1 here, but it depends on probe order. The DMA controller is a second UIO device, found by name too.</text>
</g>
</svg>
