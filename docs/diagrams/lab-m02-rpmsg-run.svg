<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d">
<title id="t">pfdaq_cap JSON (FreeRTOS suite) and hart 4 console (fresh-card suite), JSON wrapped</title><desc id="d">A supervised capture seen from both ends: the hart 4 console prints the ARMED line with a 500 ms deadline and a maximum lag of 1040 frames, then the DISARM line with 32 status messages; the capture's own JSON reports 32 status messages received, no transfer failure, and a round trip of 1249, 1974 and 10020 microseconds.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 19.00s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 19.00s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}17.89%{opacity:1}20.89%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="340" rx="12" fill="#12171d"/>
<rect x="0" y="0" width="900" height="194" fill="#0d1117"/>
<rect x="0" y="0" width="900" height="34" fill="#1b222c"/>
<circle cx="20" cy="17" r="6" fill="#ef6f6c"/>
<circle cx="38" cy="17" r="6" fill="#e6c04f"/>
<circle cx="56" cy="17" r="6" fill="#5fbf84"/>
<text x="450" y="22" text-anchor="middle" font-size="12" fill="#9aa8b5">pfdaq_cap JSON (FreeRTOS suite) and hart 4 console (fresh-card suite), JSON wrapped</text>
<text x="24" y="58" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84">$ </tspan><tspan fill="#e6ecf1">pfdaq_cap -r -m counter -w 252 -f 1024 -n 32</tspan></text>
<text x="24" y="78" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">[pfdaq-sup] ARMED: deadline 500 ms, max lag 1040 frames, fabric seq 0</text>
<text x="24" y="98" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">[pfdaq-sup] DISARM from ARMED: 32 status, 0 deadline misses, 0 seq mismatches, linux errors 0, latency irqs 0</text>
<text x="24" y="118" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">"supervisor": {"pass": true, "status_rx": 32, "deadline_miss": 0, "seq_mismatch": 0,</text>
<text x="24" y="138" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">  "fabric_seq": 32768, "fabric_frames": 32768, "xfer_fail": 0, "uptime_ms": 52846,</text>
<text x="24" y="158" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">  "rtt_us": {"min": 1249, "mean": 1974, "max": 10020}}</text>
<rect x="0" y="194" width="900" height="146" fill="#12171d"/>
<g class="co" style="animation-delay:0.00s"><rect x="8" y="43" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="45" r="11" fill="#ffd166"/><text x="8" y="49" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="194" width="900" height="146" fill="#12171d"/>
<circle cx="24" cy="220" r="13" fill="#ffd166"/><text x="24" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="218" font-size="15" font-weight="bold" fill="#e6ecf1">A supervised capture</text>
<text x="48" y="238" font-size="13" fill="#9aa8b5">-r makes the tool open the channel, send ARM, one STATUS per burst, and DISARM at the end.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="8" y="63" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="65" r="11" fill="#ffd166"/><text x="8" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.40s">
<rect x="0" y="194" width="900" height="146" fill="#12171d"/>
<circle cx="24" cy="220" r="13" fill="#ffd166"/><text x="24" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="218" font-size="15" font-weight="bold" fill="#e6ecf1">The ARM message arrives</text>
<text x="48" y="238" font-size="13" fill="#9aa8b5">500 ms is the tool's default deadline; max lag 1040 is the 1024 frames of a burst plus 16.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="8" y="83" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="85" r="11" fill="#ffd166"/><text x="8" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:6.80s">
<rect x="0" y="194" width="900" height="146" fill="#12171d"/>
<circle cx="24" cy="220" r="13" fill="#ffd166"/><text x="24" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="218" font-size="15" font-weight="bold" fill="#e6ecf1">DISARM closes the exchange</text>
<text x="48" y="238" font-size="13" fill="#9aa8b5">32 STATUS messages, one per burst, counted by the supervisor itself, with no miss and no mismatch.</text>
</g>
<g class="co" style="animation-delay:10.20s"><rect x="8" y="103" width="884" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="105" r="11" fill="#ffd166"/><text x="8" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:10.20s">
<rect x="0" y="194" width="900" height="146" fill="#12171d"/>
<circle cx="24" cy="220" r="13" fill="#ffd166"/><text x="24" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="218" font-size="15" font-weight="bold" fill="#e6ecf1">The same run from Linux</text>
<text x="48" y="238" font-size="13" fill="#9aa8b5">status_rx 32 and xfer_fail 0: every message was acknowledged; fabric_seq is the fabric's own count.</text>
</g>
<g class="co" style="animation-delay:13.60s"><rect x="8" y="143" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="145" r="11" fill="#ffd166"/><text x="8" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">5</text></g>
<g class="co cap" style="animation-delay:13.60s">
<rect x="0" y="194" width="900" height="146" fill="#12171d"/>
<circle cx="24" cy="220" r="13" fill="#ffd166"/><text x="24" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">5</text>
<text x="48" y="218" font-size="15" font-weight="bold" fill="#e6ecf1">What a round trip costs</text>
<text x="48" y="238" font-size="13" fill="#9aa8b5">Never below 1 ms (min 1249 us), because the supervisor waits 1 ms to snapshot the fabric first.</text>
</g>
</svg>
