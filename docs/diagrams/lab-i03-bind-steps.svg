<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-labelledby="t d">
<title id="t">Switching a device from the generic UIO driver to pfdaq_uio: load the module with modprobe, unbind 40000f00.uio from uio_pdrv_genirq, write pfdaq_uio into driver_override of the device, bind it to pfdaq_uio, and run pfdaq_lat -k, which refuses to run unless the pfdaq_uio driver is bound and kernel_ack reads Y.</title><desc id="d">Switching a device from the generic UIO driver to pfdaq_uio: load the module with modprobe, unbind 40000f00.uio from uio_pdrv_genirq, write pfdaq_uio into driver_override of the device, bind it to pfdaq_uio, and run pfdaq_lat -k, which refuses to run unless the pfdaq_uio driver is bound and kernel_ack reads Y.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 13.70s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 13.70s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}9.49%{opacity:1}12.49%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="250" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M170,82 L202,82" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M170,82 L202,82" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e1">
<path d="M352,82 L384,82" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M352,82 L384,82" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e2">
<path d="M534,82 L566,82" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M534,82 L566,82" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e3">
<path d="M716,82 L748,82" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.10s" d="M716,82 L748,82" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="mod">
<rect x="20" y="40" width="150" height="84" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="95" y="69.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">modprobe</text>
<text x="95" y="86.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">pfdaq_uio</text>
<text x="95" y="103.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">loads the module</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="39" width="152" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="unb">
<rect x="202" y="40" width="150" height="84" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="277" y="69.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">1 unbind</text>
<text x="277" y="86.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">40000f00.uio from</text>
<text x="277" y="103.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">uio_pdrv_genirq</text>
<rect class="hl" style="animation-delay:2.60s" x="201" y="39" width="152" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ovr">
<rect x="384" y="40" width="150" height="84" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="459" y="69.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">2 override</text>
<text x="459" y="86.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">driver_override</text>
<text x="459" y="103.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">= pfdaq_uio</text>
<rect class="hl" style="animation-delay:5.20s" x="383" y="39" width="152" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="bnd">
<rect x="566" y="40" width="150" height="84" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="641" y="69.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">3 bind</text>
<text x="641" y="86.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">40000f00.uio to the</text>
<text x="641" y="103.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">pfdaq_uio driver</text>
<rect class="hl" style="animation-delay:7.80s" x="565" y="39" width="152" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="chk">
<rect x="748" y="40" width="132" height="84" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="814" y="69.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">pfdaq_lat -k</text>
<text x="814" y="86.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">checks the driver</text>
<text x="814" y="103.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">and kernel_ack = Y</text>
<rect class="hl" style="animation-delay:10.40s" x="747" y="39" width="134" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="165" text-anchor="start" font-size="12" fill="#9aa8b5">Afterwards the reverse: name uio_pdrv_genirq in driver_override, bind it back, then clear the override.</text>
<text x="20" y="188" text-anchor="start" font-size="12" fill="#9aa8b5">Until the driver is bound, kernel_acks does not move: the generic driver still owns the device.</text>
<text x="20" y="211" text-anchor="start" font-size="12" fill="#9aa8b5">It is not bound by default: after every boot the generic driver owns the device.</text>
</svg>
