<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t d">
<title id="t">Deferred interrupt handling for a level-triggered line, in the order that works. The fabric raises F2M[5]; the handler masks the source with PLIC_DisableIRQ, gives the semaphore with xSemaphoreGiveFromISR and calls portEND_SWITCHING_ISR, which runs the task at once. The task wakes, writes LAT1_ACK so the line drops and the fabric timer stops, unmasks the source with PLIC_EnableIRQ and blocks again. The handler's tail returns EXT_IRQ_KEEP_ENABLED.</title><desc id="d">Deferred interrupt handling for a level-triggered line, in the order that works. The fabric raises F2M[5]; the handler masks the source with PLIC_DisableIRQ, gives the semaphore with xSemaphoreGiveFromISR and calls portEND_SWITCHING_ISR, which runs the task at once. The task wakes, writes LAT1_ACK so the line drops and the fabric timer stops, unmasks the source with PLIC_EnableIRQ and blocks again. The handler's tail returns EXT_IRQ_KEEP_ENABLED.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 23.00s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 23.00s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}6.09%{opacity:1}9.09%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="380" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M215,98 L246,98" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.40s" d="M215,98 L246,98" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e1">
<path d="M441,98 L472,98" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:4.20s" d="M441,98 L472,98" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e2">
<path d="M667,98 L698,98" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:7.00s" d="M667,98 L698,98" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e3">
<path d="M795.5,136 L795.5,230" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.80s" d="M795.5,136 L795.5,230" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e4">
<path d="M698,268 L667,268" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:12.60s" d="M698,268 L667,268" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e5">
<path d="M472,268 L441,268" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:15.40s" d="M472,268 L441,268" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e6">
<path d="M246,268 L215,268" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:18.20s" d="M246,268 L215,268" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="fab">
<rect x="20" y="60" width="195" height="76" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="117.5" y="85.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Fabric raises F2M[5]</text>
<text x="117.5" y="102.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">PLIC source 123</text>
<text x="117.5" y="119.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">level: stays high</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="59" width="197" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="mask">
<rect x="246" y="60" width="195" height="76" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="343.5" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">1 Handler masks it</text>
<text x="343.5" y="111" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">PLIC_DisableIRQ(F2M_5)</text>
<rect class="hl" style="animation-delay:2.80s" x="245" y="59" width="197" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="give">
<rect x="472" y="60" width="195" height="76" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="569.5" y="85.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">2 Handler gives</text>
<text x="569.5" y="102.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">xSemaphoreGiveFromISR</text>
<text x="569.5" y="119.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">lat1_sem, binary</text>
<rect class="hl" style="animation-delay:5.60s" x="471" y="59" width="197" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="swi">
<rect x="698" y="60" width="195" height="76" rx="9" fill="#232c44" stroke="#8da6d4" stroke-width="1.5"/>
<text x="795.5" y="85.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">3 Switch to the task</text>
<text x="795.5" y="102.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">portEND_SWITCHING_ISR</text>
<text x="795.5" y="119.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">runs the task right here</text>
<rect class="hl" style="animation-delay:8.40s" x="697" y="59" width="197" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="wake">
<rect x="698" y="230" width="195" height="76" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="795.5" y="255.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">4 Task wakes</text>
<text x="795.5" y="272.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">xSemaphoreTake returns</text>
<text x="795.5" y="289.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">top-priority task</text>
<rect class="hl" style="animation-delay:11.20s" x="697" y="229" width="197" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ack">
<rect x="472" y="230" width="195" height="76" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="569.5" y="255.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">5 Task acknowledges</text>
<text x="569.5" y="272.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">LAT1_ACK = 1: line drops,</text>
<text x="569.5" y="289.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">fabric timer stops</text>
<rect class="hl" style="animation-delay:14.00s" x="471" y="229" width="197" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="unm">
<rect x="246" y="230" width="195" height="76" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="343.5" y="255.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">6 Task unmasks</text>
<text x="343.5" y="272.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">PLIC_EnableIRQ(F2M_5)</text>
<text x="343.5" y="289.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">then blocks again</text>
<rect class="hl" style="animation-delay:16.80s" x="245" y="229" width="197" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ret">
<rect x="20" y="230" width="195" height="76" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="117.5" y="255.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">7 Handler's tail</text>
<text x="117.5" y="272.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">returns EXT_IRQ_KEEP_ENABLED</text>
<text x="117.5" y="289.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">nothing is masked afterwards</text>
<rect class="hl" style="animation-delay:19.60s" x="19" y="229" width="197" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="44" text-anchor="start" font-size="12" fill="#9aa8b5" font-weight="bold">In the interrupt handler</text>
<text x="20" y="214" text-anchor="start" font-size="12" fill="#9aa8b5" font-weight="bold">In the task lat1_task (priority configMAX_PRIORITIES - 1), then back in the handler</text>
<text x="20" y="350" text-anchor="start" font-size="12" fill="#9aa8b5">The order is the whole design: mask before the task is woken, unmask after the acknowledge.</text>
</svg>
