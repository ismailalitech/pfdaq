<text x="48" y="322" font-size="15" font-weight="bold" fill="#e6ecf1">Pipeline fills</text>
<text x="48" y="342" font-size="13" fill="#9aa8b5">START sets run to PREFILL. Stages in flight rise 1 to 4; the FIFO stays empty for 5 clocks.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="351.429" y="30" width="211.429" height="260" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
