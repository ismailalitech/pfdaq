<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d">
<title id="t">Waveform from the stream simulation, the start of scenario 11 (FIR payload). After START the run state is PREFILL while the four-stage pipeline fills: the stages in flight rise to four, then the FIFO count rises by two per clock. The issue rule stops new work when count plus two times inflight plus two would exceed 16. The run starts when the count reaches 12, the first beat appears when the count is 16, and the count never exceeds 16.</title><desc id="d">Waveform from the stream simulation, the start of scenario 11 (FIR payload). After START the run state is PREFILL while the four-stage pipeline fills: the stages in flight rise to four, then the FIFO count rises by two per clock. The issue rule stops new work when count plus two times inflight plus two would exceed 16. The run starts when the count reaches 12, the first beat appears when the count is 16, and the count never exceeds 16.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 19.00s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 19.00s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}17.89%{opacity:1}20.89%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
