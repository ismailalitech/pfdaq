<rect x="0" y="296" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="324" r="13" fill="#ffd166"/><text x="24" y="329" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="322" font-size="15" font-weight="bold" fill="#e6ecf1">First beat</text>
<text x="48" y="342" font-size="13" fill="#9aa8b5">TVALID rises. fir_pop is 1 on the first beat after the header, which needs one payload word.</text>
</g>
<g class="co" style="animation-delay:13.60s"><rect x="633.333" y="30" width="246.667" height="260" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="633.333" cy="30" r="11" fill="#ffd166"/><text x="633.333" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">5</text></g>
<g class="co cap" style="animation-delay:13.60s">
<rect x="0" y="296" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="324" r="13" fill="#ffd166"/><text x="24" y="329" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">5</text>
<text x="48" y="322" font-size="15" font-weight="bold" fill="#e6ecf1">Steady state</text>
<text x="48" y="342" font-size="13" fill="#9aa8b5">The generator pops 2 words per beat, the count falls, issue returns. The count never goes above 16.</text>
</g>
</svg>
