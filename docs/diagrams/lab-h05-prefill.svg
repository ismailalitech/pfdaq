<circle cx="24" cy="324" r="13" fill="#ffd166"/><text x="24" y="329" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="322" font-size="15" font-weight="bold" fill="#e6ecf1">Prefill</text>
<text x="48" y="342" font-size="13" fill="#9aa8b5">The FIFO count rises by 2 every clock. When it reaches 12, run changes to RUN on the next clock.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="457.143" y="30" width="140.952" height="260" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
