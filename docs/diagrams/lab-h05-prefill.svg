<circle cx="24" cy="324" r="13" fill="#ffd166"/><text x="24" y="329" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="322" font-size="15" font-weight="bold" fill="#e6ecf1">The credit rule</text>
<text x="48" y="342" font-size="13" fill="#9aa8b5">At 8 words and 4 stages in flight, 8 + 2 * 4 + 2 is 18, over 16: issue goes low. The count stops at 16.</text>
</g>
<g class="co" style="animation-delay:10.20s"><rect x="598.095" y="30" width="35.2381" height="260" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
