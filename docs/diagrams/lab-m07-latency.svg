<title id="t">evidence/v0.5.1/board/suite-freertos.md: who acknowledges, 100,000 events each</title><desc id="d">The four recorded rows of interrupt-to-acknowledge latency on hart 4: handler at idle mean 0.52 microseconds and worst 2.10; handler under load mean 0.53 and worst 1.94; task at idle mean 2.04 and worst 11.66; task under load mean 2.09 and worst 9.36. No event was missed in any row.</desc>
