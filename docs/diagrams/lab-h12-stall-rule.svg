<text x="48" y="322" font-size="15" font-weight="bold" fill="#e6ecf1">Stalled</text>
<text x="48" y="342" font-size="13" fill="#9aa8b5">TREADY stays low. As built, TVALID stays high and TDATA holds 00000218. The stall lasts 17 clocks in all.</text>
