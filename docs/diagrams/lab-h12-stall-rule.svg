<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img" aria-labelledby="t d">
<title id="t">Waveform of 72 ns of scenario 2 of the stream simulation. The sink takes one beat at 4388 ns and then holds TREADY low. In the unmodified design the source keeps TVALID high and TDATA at 00000218 for the whole window. In a scratch copy where the generator ignores w_ready, TDATA changes to 00050001 at 4396 ns and again every clock, and the checker reports rule 2, DATA_STABLE, from 4404 ns on, every clock.</title><desc id="d">Waveform of 72 ns of scenario 2 of the stream simulation. The sink takes one beat at 4388 ns and then holds TREADY low. In the unmodified design the source keeps TVALID high and TDATA at 00000218 for the whole window. In a scratch copy where the generator ignores w_ready, TDATA changes to 00050001 at 4396 ns and again every clock, and the checker reports rule 2, DATA_STABLE, from 4404 ns on, every clock.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 15.60s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 15.60s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}21.79%{opacity:1}24.79%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
