<text x="48" y="322" font-size="15" font-weight="bold" fill="#e6ecf1">The bug</text>
<text x="48" y="342" font-size="13" fill="#9aa8b5">The generator ignores w_ready: TDATA changes to 00050001 at 4396 ns while the sink has not taken the beat.</text>
