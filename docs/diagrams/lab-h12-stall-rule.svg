<text x="48" y="322" font-size="15" font-weight="bold" fill="#e6ecf1">The rule fires</text>
<text x="48" y="342" font-size="13" fill="#9aa8b5">The checker compares each clock with the last: rule 2 from 4404 ns. The testbench monitor reports the same time.</text>
