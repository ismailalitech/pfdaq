<rect x="0" y="254" width="900" height="86" fill="#12171d"/>
<circle cx="24" cy="280" r="13" fill="#ffd166"/><text x="24" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="278" font-size="15" font-weight="bold" fill="#e6ecf1">What 30 of 30 says</text>
<text x="48" y="298" font-size="13" fill="#9aa8b5">No failure in 30 boots, which does not show that the failure rate is low (next figure).</text>
</g>
