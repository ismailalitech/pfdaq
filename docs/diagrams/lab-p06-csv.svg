<circle cx="24" cy="280" r="13" fill="#ffd166"/><text x="24" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="278" font-size="15" font-weight="bold" fill="#e6ecf1">Cycle 1 is the slowest</text>
<text x="48" y="298" font-size="13" fill="#9aa8b5">61.4 s; cycles 2 to 30 take 45.9 to 52.0 s. Why is not known.</text>
</g>
<g class="co" style="animation-delay:7.20s"><rect x="8" y="143" width="884" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="145" r="11" fill="#ffd166"/><text x="8" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:7.20s">
<rect x="0" y="254" width="900" height="86" fill="#12171d"/>
<circle cx="24" cy="280" r="13" fill="#ffd166"/><text x="24" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="278" font-size="15" font-weight="bold" fill="#e6ecf1">Console bytes vary</text>
<text x="48" y="298" font-size="13" fill="#9aa8b5">501 to 647 bytes over the 30 cycles, 581 in 21 of them; not investigated.</text>
</g>
<g class="co" style="animation-delay:10.80s"><rect x="8" y="203" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="205" r="11" fill="#ffd166"/><text x="8" y="209" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
