<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 385" width="900" height="385" role="img" aria-labelledby="t d">
<title id="t">How a Linux program reaches the stream source registers: the device-tree node uio@40000f00 hands the block to the generic UIO driver, which maps the page at 0x4000_0000; pfdaq_cap finds the device by its name, maps the page, adds the offset 0xF00, checks the ID word 0x50464451 and then reads and writes the registers with 32-bit accesses over FIC3.</title><desc id="d">How a Linux program reaches the stream source registers: the device-tree node uio@40000f00 hands the block to the generic UIO driver, which maps the page at 0x4000_0000; pfdaq_cap finds the device by its name, maps the page, adds the offset 0xF00, checks the ID word 0x50464451 and then reads and writes the registers with 32-bit accesses over FIC3.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 16.30s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 16.30s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}7.98%{opacity:1}10.98%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="385" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M250,82 L335,82" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M250,82 L335,82" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="252.08" y="60" width="80.84" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="292.5" y="72.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">generic-uio</text>
</g>
<g id="e1">
<path d="M565,82 L650,82" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M565,82 L650,82" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="573.52" y="60" width="67.96" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="607.5" y="72.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">/dev/uioN</text>
</g>
<g id="e2">
<path d="M765,124 L765,214" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M765,124 L765,214" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="769" y="160" width="113.04" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="774" y="172.5" text-anchor="start" font-size="11.5" fill="#e6ecf1">register pointer</text>
</g>
<g id="e3">
<path d="M650,256 L565,256" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.10s" d="M650,256 L565,256" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="567.08" y="234" width="80.84" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="607.5" y="246.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">load, store</text>
</g>
<g id="e4">
<path d="M335,256 L250,256" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:11.70s" d="M335,256 L250,256" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="264.96" y="234" width="55.08" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="292.5" y="246.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">ID word</text>
</g>
<g id="dts">
<rect x="20" y="40" width="230" height="84" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="135" y="61" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Device-tree node</text>
<text x="135" y="78" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">uio@40000f00, generic-uio</text>
<text x="135" y="95" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">linux,uio-name =</text>
<text x="135" y="112" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">pfdaq_stream_src</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="39" width="232" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="uio">
<rect x="335" y="40" width="230" height="84" rx="9" fill="#232c44" stroke="#8da6d4" stroke-width="1.5"/>
<text x="450" y="61" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">UIO driver</text>
<text x="450" y="78" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">maps the page 0x4000_0000</text>
<text x="450" y="95" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">region not requested</text>
<text x="450" y="112" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">/dev/uioN</text>
<rect class="hl" style="animation-delay:2.60s" x="334" y="39" width="232" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="tool">
<rect x="650" y="40" width="230" height="84" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="765" y="61" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">pfdaq_cap: open_uio</text>
<text x="765" y="78" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">finds uioN by its name</text>
<text x="765" y="95" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">mmap of the page, then</text>
<text x="765" y="112" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">+ SRC_OFF (0xF00)</text>
<rect class="hl" style="animation-delay:5.20s" x="649" y="39" width="232" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="store">
<rect x="650" y="214" width="230" height="84" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="765" y="243.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">32-bit accesses</text>
<text x="765" y="260.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">volatile uint32_t *</text>
<text x="765" y="277.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">never byte stores</text>
<rect class="hl" style="animation-delay:7.80s" x="649" y="213" width="232" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="src">
<rect x="335" y="214" width="230" height="84" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="450" y="243.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Stream source</text>
<text x="450" y="260.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">0x4000_0F00, APB over FIC3</text>
<text x="450" y="277.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">256 bytes</text>
<rect class="hl" style="animation-delay:10.40s" x="334" y="213" width="232" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="id">
<rect x="20" y="214" width="230" height="84" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="135" y="243.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">ID check first</text>
<text x="135" y="260.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">src[SRC_ID / 4] must be</text>
<text x="135" y="277.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">0x50464451 (PFDQ)</text>
<rect class="hl" style="animation-delay:13.00s" x="19" y="213" width="232" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="338" text-anchor="start" font-size="12" fill="#9aa8b5">Byte stores to these registers are decoded as whole-register writes (case study K02), so every access is 32 bits.</text>
<text x="20" y="361" text-anchor="start" font-size="12" fill="#9aa8b5">A wrong ID means a wrong device, a wrong offset or an unprogrammed fabric: the tool stops before it does anything else.</text>
</svg>
