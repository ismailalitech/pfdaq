<rect x="243.14" y="213" width="93.72" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="290" y="225.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">req / irq_req</text>
</g>
