</g>
<g id="prog">
<rect x="10" y="190" width="170" height="90" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="95" y="222.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">m08_rtt</text>
<text x="95" y="239.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">pinned to one cpu</text>
<text x="95" y="256.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">CLOCK_MONOTONIC</text>
<rect class="hl" style="animation-delay:0.00s" x="9" y="189" width="172" height="92" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="dev">
<rect x="250" y="30" width="170" height="70" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="335" y="61" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">/dev/rpmsgN</text>
<text x="335" y="78" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">write, poll, read</text>
<rect class="hl" style="animation-delay:2.40s" x="249" y="29" width="172" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="rings">
<rect x="470" y="30" width="170" height="70" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="555" y="61" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Shared rings</text>
<text x="555" y="78" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">0x91D0_0000</text>
<rect class="hl" style="animation-delay:4.80s" x="469" y="29" width="172" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ihc">
<rect x="690" y="30" width="200" height="70" rx="9" fill="#232c44" stroke="#8da6d4" stroke-width="1.5"/>
<text x="790" y="61" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Mi-V IHC interrupt</text>
<text x="790" y="78" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">mailbox doorbell</text>
<rect class="hl" style="animation-delay:7.20s" x="689" y="29" width="202" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="page">
<rect x="400" y="200" width="250" height="70" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="525" y="231" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Page in the non-cached window</text>
<text x="525" y="248" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">0xC9E0_0000, four words used</text>
<rect class="hl" style="animation-delay:9.60s" x="399" y="199" width="252" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="poll">
<rect x="690" y="200" width="200" height="70" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="790" y="231" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Hart 4 polls</text>
<text x="790" y="248" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">inside one RPMsg call</text>
<rect class="hl" style="animation-delay:12.00s" x="689" y="199" width="202" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="reg">
<rect x="250" y="370" width="170" height="70" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="335" y="401" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Latency channel 1</text>
<text x="335" y="418" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">CTRL.ONESHOT</text>
<rect class="hl" style="animation-delay:14.40s" x="249" y="369" width="172" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="plic">
<rect x="470" y="370" width="170" height="70" rx="9" fill="#232c44" stroke="#8da6d4" stroke-width="1.5"/>
<text x="555" y="401" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">F2M 5 to the PLIC</text>
<text x="555" y="418" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">source 123, hart 4</text>
<rect class="hl" style="animation-delay:16.80s" x="469" y="369" width="172" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="isr">
<rect x="690" y="370" width="200" height="70" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="790" y="401" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Hart 4 handler</text>
<text x="790" y="418" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">writes irq_ack, then ACK</text>
<rect class="hl" style="animation-delay:19.20s" x="689" y="369" width="202" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="250" y="16" text-anchor="start" font-size="12" fill="#9aa8b5" font-weight="bold">1  RPMsg: message through the rings and the mailbox</text>
<text x="400" y="186" text-anchor="start" font-size="12" fill="#9aa8b5" font-weight="bold">2  Flag: both sides read and write the same word</text>
<text x="250" y="356" text-anchor="start" font-size="12" fill="#9aa8b5" font-weight="bold">3  Interrupt: one register write raises a fabric interrupt</text>
<text x="10" y="450" text-anchor="start" font-size="12" fill="#9aa8b5">The answer of every method is a word in the page or a message back; the program stops its clock when it sees it.</text>
</svg>
