<path d="M129,280 L129,405 L250,405" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:13.20s" d="M129,280 L129,405 L250,405" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
