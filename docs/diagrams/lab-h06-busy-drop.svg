<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="t d">
<title id="t">Waveform from the stream simulation, scenario 14: real-time mode, a slot every 20 clocks (160 ns), a frame of 44 words that takes 22 clocks (176 ns), 100 credits. The first slot is sent and uses a credit. The next slot falls due while the frame is still going out, so can_start is low and the slot is dropped although credits remain. The slot after that finds the source idle and is sent to the next TDEST.</title><desc id="d">Waveform from the stream simulation, scenario 14: real-time mode, a slot every 20 clocks (160 ns), a frame of 44 words that takes 22 clocks (176 ns), 100 credits. The first slot is sent and uses a credit. The next slot falls due while the frame is still going out, so can_start is low and the slot is dropped although credits remain. The slot after that finds the source idle and is sent to the next TDEST.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 15.60s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 15.60s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}21.79%{opacity:1}24.79%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
