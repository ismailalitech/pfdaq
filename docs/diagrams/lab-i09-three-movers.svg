<text x="335" y="246.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">start, finish</text>
<rect class="hl" style="animation-delay:9.10s" x="259" y="189" width="152" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
