<text x="800" y="246.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">of the same DDR</text>
<rect class="hl" style="animation-delay:14.30s" x="699" y="189" width="202" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="dstb">
<rect x="700" y="340" width="200" height="70" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="800" y="362.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Destination buffer</text>
<text x="800" y="379.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">c, nc or wcb window</text>
<text x="800" y="396.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">of the same DDR</text>
<rect class="hl" style="animation-delay:5.20s" x="699" y="339" width="202" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="425" text-anchor="start" font-size="12" fill="#9aa8b5">Same bytes, same kind of destination, three movers. The fabric DMA has no source buffer: its data comes from the stream.</text>
</svg>
