<text x="555" y="238" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">4 channels, PLIC 5 to 12</text>
<rect class="hl" style="animation-delay:11.70s" x="469" y="189" width="172" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
