<text x="105" y="239.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">U54, three cores</text>
<text x="105" y="256.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">times every transfer</text>
<rect class="hl" style="animation-delay:6.50s" x="9" y="189" width="192" height="92" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
