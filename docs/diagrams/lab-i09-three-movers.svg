<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" role="img" aria-labelledby="t d">
<title id="t">Three ways to put 1 MiB into a DDR buffer. The fabric DMA: the stream source sends frames to the CoreAXI4DMAController, which writes them into the destination buffer after the program has armed a descriptor. The MSS DMA: the program gives two physical addresses and a length to the dma-proxy device with two ioctls, and the PDMA copies from a source buffer to the destination buffer. The processor: the program copies with memcpy, so a hart does every load and store.</title><desc id="d">Three ways to put 1 MiB into a DDR buffer. The fabric DMA: the stream source sends frames to the CoreAXI4DMAController, which writes them into the destination buffer after the program has armed a descriptor. The MSS DMA: the program gives two physical addresses and a length to the dma-proxy device with two ioctls, and the PDMA copies from a source buffer to the destination buffer. The processor: the program copies with memcpy, so a hart does every load and store.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 22.80s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 22.80s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}5.70%{opacity:1}8.70%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
