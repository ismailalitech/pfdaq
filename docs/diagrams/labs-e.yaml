  type: terminal
  title: "evidence/v0.5.1/board: the two suite records, one grep each"
  alt: "Two recorded suite summaries read with grep. Each starts with a context line naming the build that ran on hart 4: freertos, or bare-metal. The interrupt-handler latency row at idle reads mean 0.52 microseconds and worst 2.10 for FreeRTOS, and mean 0.50 and worst 3.10 for bare metal."
  width: 900
  height: 360
  step: 3.4
  lines:
    - "$ cd evidence/v0.5.1/board"
    - "$ grep -h 'Context\\|T8-u54_4-isr-idle' suite-freertos.md"
    - "Context: u54_4_context=freertos kernel=6.18.17-linux4microchip-2026.04.1-g7fbe4f69684d-dirty uptime_s=34"
    - "| T8-u54_4-isr-idle | PASS | events 100000, overrun 0, min 0.52 / mean 0.52 / p99<= 0.62 / max 2.10 us |"
    - "$ grep -h 'Context\\|T8-u54_4-isr-idle' suite-baremetal.md"
    - "Context: u54_4_context=bare-metal remoteproc=attached"
    - "| T8-u54_4-isr-idle | PASS | events 100000, overrun 0, min 0.50 / mean 0.50 / p99<= 0.62 / max 3.10 us |"
  callouts:
    - {lines: [2],    title: "Which build ran", text: "The suite's first line names the context. Linux reads it from the supervisor's build tag, bit 31."}
    - {lines: [3],    title: "FreeRTOS, handler acknowledges", text: "100,000 events at idle: mean 0.52 us, worst 2.10 us, none missed."}
    - {lines: [5],    title: "The same suite on bare metal", text: "Only the payload on the SD card changed; the context line says bare-metal."}
    - {lines: [6],    title: "Almost the same cost", text: "Mean 0.50 us: 0.02 us less, one count of the 20 ns instrument. Worst 3.10 us is a single sample."}

# ---------------------------------------------------------------- M05

- id: lab-m05-memchk-turns
  alt: "One iteration of the shared-memory test, by turns. Linux fills 64 K words with an xorshift32 sequence and executes a full barrier; it sends one MEMCHK message with the physical address, the word count and the seed; hart 4 reads every word, counts those that differ, writes the inverse back and executes fence rw, rw; it replies with the number of mismatches and words checked; Linux then reads every word and expects the inverse."
  width: 900
  height: 440
  step: 1.6
  nodes:
    lin1: {x: 20,  y: 50,  w: 250, h: 80, kind: hart, title: "1 Linux fills the region", sub: "xorshift32 sequence from a seed\nthen __sync_synchronize()"}
    msg:  {x: 325, y: 50,  w: 250, h: 80, kind: plain, title: "2 MEMCHK message, type 6", sub: "physical address, word count,\nseed, over RPMsg"}
    h4:   {x: 630, y: 50,  w: 250, h: 80, kind: mss,  title: "3 Hart 4 checks", sub: "reads each word, counts differences\nwrites ~x back, fence rw, rw"}
    ack:  {x: 325, y: 200, w: 250, h: 80, kind: plain, title: "4 Acknowledgement", sub: "mismatches and words checked\n(in fabric_seq, fabric_frames)"}
    lin2: {x: 20,  y: 200, w: 250, h: 80, kind: hart, title: "5 Linux checks the inverse", sub: "reads each word, expects ~x\ncounts its own mismatches"}
    ddr:  {x: 20,  y: 340, w: 860, h: 78, kind: mem,  title: "The shared DDR: two 32 MiB windows", sub: "cached: udmabuf-ddr-c0 at 0x8800_0000, test at offset 0x100000\nnon-cached: udmabuf-ddr-nc0 at 0xC800_0000, test at offset 0x1F00000"}
  edges:
    - {from: lin1.right, to: msg.left}
    - {from: msg.right,  to: h4.left}
    - {from: h4.bottom,  to: ack.right}
    - {from: ack.left,   to: lin2.right}
  steps: [lin1, e0, msg, e1, h4, e2, ack, e3, lin2]
  notes:
    - {x: 630, y: 300, text: "Only one side touches the data\nat a time; a message marks each turn."}

- id: lab-m05-memchk-run
  type: terminal
  title: "pfdaq_cap JSON (FreeRTOS suite, lines wrapped) and hart 4 console (fresh-card suite, 1 of 50 lines)"
  alt: "The shared-memory test, cached and non-cached. Each run is 50 iterations of 65,536 words with 0 mismatches seen by hart 4 and 0 seen by Linux. The cached run reports a mean check of 20.104 ms at physical address 0x88100000, the non-cached run 31.148 ms at 0xc9f00000. Hart 4's console prints one MEMCHK line per iteration: 65536 words, 0 mismatches, inverse written."
  width: 900
  height: 380
  step: 3.4
  lines:
    - "$ pfdaq_cap -X 65536 -n 50 -c"
    - '{"pass": true, "mode": "shm", "region": "udmabuf-ddr-c0", "cached": true, "phys": "0x88100000",'
    - ' "words": 65536, "iterations": 50, "mismatch_seen_by_u54_4": 0, "mismatch_seen_by_linux": 0,'
    - ' "rpmsg_fail": 0, "mean_check_ms": 20.104, "context": "freertos"}'
    - "[pfdaq-sup] MEMCHK 65536 words at 0x88100000: 0 mismatches, inverse written"
    - "$ pfdaq_cap -X 65536 -n 50"
    - '{"pass": true, "mode": "shm", "region": "udmabuf-ddr-nc0", "cached": false, "phys": "0xc9f00000",'
    - ' "words": 65536, "iterations": 50, "mismatch_seen_by_u54_4": 0, "mismatch_seen_by_linux": 0,'
    - ' "rpmsg_fail": 0, "mean_check_ms": 31.148, "context": "freertos"}'
    - "[pfdaq-sup] MEMCHK 65536 words at 0xc9f00000: 0 mismatches, inverse written"
  callouts:
    - {lines: [0],    title: "The cached run", text: "-X is the word count, -n the iterations, -c the cached window. Nobody flushes or invalidates a cache."}
    - {lines: [1, 3], title: "Both sides agree", text: "Hart 4 saw 0 mismatches and Linux saw 0, over 50 passes of 65,536 words; no RPMsg failure."}
    - {lines: [4],    title: "Hart 4's own line", text: "One MEMCHK line is printed per iteration, 50 per run; the pointer is the physical address from sysfs."}
    - {lines: [5],    title: "The non-cached run", text: "The same command without -c uses the non-cached window, the one the DMA buffers live in."}
    - {lines: [6, 8], title: "Slower, not different", text: "mean_check_ms 31.148 against 20.104: the time includes the message exchange and the hart's whole pass."}

# ---------------------------------------------------------------- M07

- id: lab-m07-defer-in-task
  alt: "Deferred interrupt handling for a level-triggered line, in the order that works. The fabric raises F2M[5]; the handler masks the source with PLIC_DisableIRQ, gives the semaphore with xSemaphoreGiveFromISR and calls portEND_SWITCHING_ISR, which runs the task at once. The task wakes, writes LAT1_ACK so the line drops and the fabric timer stops, unmasks the source with PLIC_EnableIRQ and blocks again. The handler's tail returns EXT_IRQ_KEEP_ENABLED."
  width: 900
  height: 380
  step: 1.4
  nodes:
    fab:  {x: 20,  y: 60,  w: 195, h: 76, kind: fabric, title: "Fabric raises F2M[5]", sub: "PLIC source 123\nlevel: stays high"}
    mask: {x: 246, y: 60,  w: 195, h: 76, kind: hart,   title: "1 Handler masks it", sub: "PLIC_DisableIRQ(F2M_5)"}
    give: {x: 472, y: 60,  w: 195, h: 76, kind: hart,   title: "2 Handler gives", sub: "xSemaphoreGiveFromISR\nlat1_sem, binary"}
    swi:  {x: 698, y: 60,  w: 195, h: 76, kind: mss,    title: "3 Switch to the task", sub: "portEND_SWITCHING_ISR\nruns the task right here"}
    wake: {x: 698, y: 230, w: 195, h: 76, kind: sw,     title: "4 Task wakes", sub: "xSemaphoreTake returns\ntop-priority task"}
    ack:  {x: 472, y: 230, w: 195, h: 76, kind: fabric, title: "5 Task acknowledges", sub: "LAT1_ACK = 1: line drops,\nfabric timer stops"}
    unm:  {x: 246, y: 230, w: 195, h: 76, kind: sw,     title: "6 Task unmasks", sub: "PLIC_EnableIRQ(F2M_5)\nthen blocks again"}
    ret:  {x: 20,  y: 230, w: 195, h: 76, kind: good,   title: "7 Handler's tail", sub: "returns EXT_IRQ_KEEP_ENABLED\nnothing is masked afterwards"}
  edges:
    - {from: fab.right,  to: mask.left}
    - {from: mask.right, to: give.left}
    - {from: give.right, to: swi.left}
    - {from: swi.bottom, to: wake.top}
    - {from: wake.left,  to: ack.right}
    - {from: ack.left,   to: unm.right}
    - {from: unm.left,   to: ret.right}
  steps: [fab, e0, mask, e1, give, e2, swi, e3, wake, e4, ack, e5, unm, e6, ret]
  notes:
    - {x: 20, y: 44,  text: "In the interrupt handler", bold: true}
    - {x: 20, y: 214, text: "In the task lat1_task (priority configMAX_PRIORITIES - 1), then back in the handler", bold: true}
    - {x: 20, y: 350, text: "The order is the whole design: mask before the task is woken, unmask after the acknowledge."}

- id: lab-m07-wrong-order
  alt: "The first version of task mode, which answered one event and never again. The handler gives the semaphore; portEND_SWITCHING_ISR switches to the task inside the handler; the task acknowledges and unmasks the source; the task blocks and control returns to the handler's tail; the handler returns EXT_IRQ_DISABLE and the dispatcher masks the source afterwards. The mask comes after the unmask, so the line stays masked for good."
  width: 900
  height: 380
  step: 1.6
  nodes:
    a: {x: 20,  y: 50,  w: 250, h: 76, kind: hart,  title: "1 Handler gives the semaphore", sub: "the woken task has the\ntop priority"}
    b: {x: 325, y: 50,  w: 250, h: 76, kind: mss,   title: "2 portEND_SWITCHING_ISR", sub: "switches to the task right here,\ninside the handler"}
    c: {x: 630, y: 50,  w: 250, h: 76, kind: sw,    title: "3 Task acknowledges, unmasks", sub: "LAT1_ACK, then PLIC_EnableIRQ:\nthe source is enabled"}
    d: {x: 20,  y: 210, w: 250, h: 76, kind: sw,    title: "4 Task blocks again", sub: "control returns to the\ntail of the handler"}
    e: {x: 325, y: 210, w: 250, h: 76, kind: hart,  title: "5 Dispatcher masks it", sub: "the handler returned\nEXT_IRQ_DISABLE"}
    f: {x: 630, y: 210, w: 250, h: 76, kind: bad,   title: "The line stays masked", sub: "nobody unmasks it again:\nno second event is taken"}
  edges:
    - {from: a.right, to: b.left}
    - {from: b.right, to: c.left}
    - {from: c.bottom, to: d.top}
    - {from: d.right, to: e.left}
    - {from: e.right, to: f.left}
  steps: [a, e0, b, e1, c, e2, d, e3, e, e4, f]
  notes:
    - {x: 20, y: 330, text: "The unmask (step 3) runs before the mask (step 5). The failing run was not recorded; the order is read from the code (K06)."}

- id: lab-m07-latency
  type: terminal
  title: "evidence/v0.5.1/board/suite-freertos.md: who acknowledges, 100,000 events each"
  alt: "The four recorded rows of interrupt-to-acknowledge latency on hart 4: handler at idle mean 0.52 microseconds and worst 2.10; handler under load mean 0.53 and worst 1.94; task at idle mean 2.04 and worst 11.66; task under load mean 2.09 and worst 9.36. No event was missed in any row."
  width: 900
  height: 300
  step: 3.4
  lines:
    - "$ grep 'T8-u54_4' evidence/v0.5.1/board/suite-freertos.md"
    - "| T8-u54_4-isr-idle | PASS | events 100000, overrun 0, min 0.52 / mean 0.52 / p99<= 0.62 / max 2.10 us |"
    - "| T8-u54_4-isr-load | PASS | events 100000, overrun 0, min 0.52 / mean 0.53 / p99<= 0.94 / max 1.94 us |"
    - "| T8-u54_4-task-idle | PASS | events 100000, overrun 0, min 2.00 / mean 2.04 / p99<= 2.54 / max 11.66 us |"
    - "| T8-u54_4-task-load | PASS | events 100000, overrun 0, min 2.00 / mean 2.09 / p99<= 3.82 / max 9.36 us |"
  callouts:
    - {lines: [1],    title: "The handler acknowledges", text: "Mode 1, pfdaq_cap -L 0: one register write in the handler. Mean 0.52 us, worst 2.10 us."}
    - {lines: [2],    title: "Under load the handler barely moves", text: "One busy loop on each Linux core plus a capture loop: mean 0.53 us, worst 1.94 us."}
    - {lines: [3],    title: "The task acknowledges", text: "Mode 2, pfdaq_cap -L 1: mean 2.04 us, about 1.5 us more, and a worst case of 11.66 us."}
    - {lines: [4],    title: "Under load", text: "Mean 2.09 us, worst 9.36 us. Overrun 0 in all four rows: the line was re-armed for every event."}

# ---------------------------------------------------------------- X02

- id: lab-x02-recorded-burst
  type: terminal
