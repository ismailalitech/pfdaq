# Figures of the group E labs: M02, M03, M04, M05, M07 and X02 (Linux and a real-time hart).
# Every console line below is copied from a record in evidence/ or comes from a host-side command
# run on those records; flow figures use names and numbers from the labs' own source files.

# ---------------------------------------------------------------- M02

- id: lab-m02-rpmsg-handshake
  alt: "How a message gets from Linux to the real-time hart. The supervisor on hart 4 announces the channel pfdaq-supervisor through the shared rings; Linux's virtio_rpmsg_bus creates the channel and a sysfs device; sup_open() binds it to rpmsg_chrdev and opens /dev/rpmsgN; sup_xfer() writes a 7-word message, the supervisor snapshots the fabric and sends one 9-word acknowledgement back."
  width: 900
  height: 450
  step: 1.4
  nodes:
    sup:  {x: 20,  y: 50,  w: 220, h: 74, kind: hart, title: "Supervisor on hart 4", sub: "endpoint at address 0\nrpmsg_ns_announce(name)"}
    ring: {x: 340, y: 50,  w: 220, h: 74, kind: mem,  title: "Shared memory", sub: "rings 0x91D0_0000, 0x91D0_8000\npool 0x91D1_0000"}
    bus:  {x: 660, y: 50,  w: 220, h: 74, kind: hart, title: "Linux, virtio_rpmsg_bus", sub: "creating channel\npfdaq-supervisor addr 0x0"}
    dev:  {x: 660, y: 190, w: 220, h: 74, kind: sw,   title: "sysfs device", sub: "/sys/bus/rpmsg/devices/<name>\nonly a device so far"}
    bind: {x: 340, y: 190, w: 220, h: 74, kind: sw,   title: "sup_open() binds it", sub: "driver_override = rpmsg_chrdev\nthen write to .../bind"}
    node: {x: 20,  y: 190, w: 220, h: 74, kind: sw,   title: "/dev/rpmsgN", sub: "polled for up to 1 second\nrpmsg_ctrl flow as fallback"}
    xfer: {x: 20,  y: 320, w: 220, h: 74, kind: sw,   title: "sup_xfer()", sub: "write 7 words, poll 1000 ms\nread 9 words, check magic, type"}
    ack:  {x: 340, y: 320, w: 220, h: 74, kind: hart, title: "Supervisor answers", sub: "snapshot, waits 1 ms\none 9-word acknowledgement"}
  edges:
    - {from: sup.right,  to: ring.left, label: "announce"}
    - {from: ring.right, to: bus.left,  label: "name service"}
    - {from: bus.bottom, to: dev.top}
    - {from: dev.left,   to: bind.right}
    - {from: bind.left,  to: node.right}
    - {from: node.bottom, to: xfer.top}
    - {from: xfer.right, to: ack.left,  label: "message"}
    - {from: ack.bottom, to: xfer.bottom, bulge: 24, label: "9-word acknowledgement"}
  steps: [sup, e0, ring, e1, bus, e2, dev, e3, bind, e4, node, e5, xfer, e6, ack, e7]
  notes:
    - {x: 20,  y: 36,  text: "Announce", bold: true}
    - {x: 20,  y: 176, text: "Bind", bold: true}
    - {x: 20,  y: 306, text: "One message, one answer", bold: true}

- id: lab-m02-rpmsg-run
  type: terminal
  title: "pfdaq_cap JSON (FreeRTOS suite) and hart 4 console (fresh-card suite), JSON wrapped"
  alt: "A supervised capture seen from both ends: the hart 4 console prints the ARMED line with a 500 ms deadline and a maximum lag of 1040 frames, then the DISARM line with 32 status messages; the capture's own JSON reports 32 status messages received, no transfer failure, and a round trip of 1249, 1974 and 10020 microseconds."
  width: 900
  height: 340
  step: 3.4
  lines:
    - "$ pfdaq_cap -r -m counter -w 252 -f 1024 -n 32"
    - "[pfdaq-sup] ARMED: deadline 500 ms, max lag 1040 frames, fabric seq 0"
    - "[pfdaq-sup] DISARM from ARMED: 32 status, 0 deadline misses, 0 seq mismatches, linux errors 0, latency irqs 0"
    - '"supervisor": {"pass": true, "status_rx": 32, "deadline_miss": 0, "seq_mismatch": 0,'
    - '  "fabric_seq": 32768, "fabric_frames": 32768, "xfer_fail": 0, "uptime_ms": 52846,'
    - '  "rtt_us": {"min": 1249, "mean": 1974, "max": 10020}}'
  callouts:
    - {lines: [0],    title: "A supervised capture", text: "-r makes the tool open the channel, send ARM, one STATUS per burst, and DISARM at the end."}
    - {lines: [1],    title: "The ARM message arrives", text: "500 ms is the tool's default deadline; max lag 1040 is the 1024 frames of a burst plus 16."}
    - {lines: [2],    title: "DISARM closes the exchange", text: "32 STATUS messages, one per burst, counted by the supervisor itself, with no miss and no mismatch."}
    - {lines: [3, 4], title: "The same run from Linux", text: "status_rx 32 and xfer_fail 0: every message was acknowledged; fabric_seq is the fabric's own count."}
    - {lines: [5],    title: "What a round trip costs", text: "Never below 1 ms (min 1249 us), because the supervisor waits 1 ms to snapshot the fabric first."}

# ---------------------------------------------------------------- M03

- id: lab-m03-two-checks
  alt: "The supervisor's two checks. Linux sends a STATUS message after each verified burst. Check 1 is a deadline kept by the supervisor's own timer: silence for longer than the deadline moves it to ALARM. Check 2 compares the sequence number Linux reports with the one hart 4 reads itself from the stream source's registers over FIC3; a difference above max_lag counts a sequence mismatch."
  width: 900
  height: 410
  step: 1.5
  nodes:
    linux: {x: 20,  y: 50,  w: 200, h: 80, kind: hart,   title: "Linux, pfdaq_cap", sub: "verifies a burst, then sends\nSTATUS with its next_seq"}
    sup:   {x: 350, y: 50,  w: 200, h: 80, kind: hart,   title: "Supervisor, hart 4", sub: "waits for a message,\ntimeout = deadline_ms"}
    fab:   {x: 680, y: 50,  w: 200, h: 80, kind: fabric, title: "Stream source", sub: "registers at 0x4000_0F00\nSNAP_SEQ: next fabric number"}
    dl:    {x: 130, y: 230, w: 300, h: 90, kind: bad,    title: "Check 1: the deadline", sub: "kept by the supervisor's own timer\nsilence > deadline: ALARM, miss + 1\nthe next STATUS: back to ARMED"}
    cmp:   {x: 470, y: 230, w: 300, h: 90, kind: good,   title: "Check 2: the sequence", sub: "fabric_seq - next_seq, unsigned\nabove max_lag: seq_mismatch + 1\nmax_lag = frames per burst + 16"}
  edges:
    - {from: linux.right,       to: sup.left,  label: "STATUS over RPMsg"}
    - {from: sup.bottom@0.25,   to: dl.top,    label: "no message in time"}
    - {from: sup.right@0.3,     to: fab.left@0.3, label: "snapshot over FIC3"}
    - {from: fab.bottom,        to: cmp.top@0.8,  label: "fabric_seq"}
    - {from: sup.bottom@0.75,   to: cmp.top@0.2,  label: "next_seq"}
  steps: [linux, e0, sup, e1, dl, e2, fab, e3, e4, cmp]
  notes:
    - {x: 20, y: 372, text: "The fabric's side of check 2 is read by hart 4 itself, over the bus Linux also uses. Nothing in it comes from Linux."}

- id: lab-m03-deadline-run
  type: terminal
  title: "suite commands, and the hart 4 console of the recorded run (two stretches)"
  alt: "Two recorded stretches of the hart 4 console. With a 300 ms deadline and a 900 ms stall before burst 5 the supervisor prints ALARM and then status resumed at burst 5, and DISARM reports 12 status and 1 deadline miss. After a consumer is killed with SIGKILL the supervisor prints ALARM; the next run is armed again and finishes with 16 status and no miss."
  width: 900
  height: 410
  step: 3.4
  lines:
    - "$ pfdaq_cap -r -D 300 -P 5:900 -w 252 -f 1024 -n 12"
    - "[pfdaq-sup] ARMED: deadline 300 ms, max lag 1040 frames, fabric seq 285295"
    - "[pfdaq-sup] ALARM: no status within 300 ms (miss #1, t=105082 ms)"
    - "[pfdaq-sup] status resumed at burst 5, back to ARMED"
    - "[pfdaq-sup] DISARM from ARMED: 12 status, 1 deadline misses, 0 seq mismatches, linux errors 0, latency irqs 0"
    - "$ ( pfdaq_cap -r -D 300 -w 252 -f 1024 -n 100000 >/dev/null 2>&1 ) &"
    - "[pfdaq-sup] ARMED: deadline 300 ms, max lag 1040 frames, fabric seq 2595920"
    - "$ pkill -9 -f 'pfdaq_cap -r -D 300'"
    - "[pfdaq-sup] ALARM: no status within 300 ms (miss #1, t=412557 ms)"
    - "$ pfdaq_cap -r -w 252 -f 1024 -n 16"
    - "[pfdaq-sup] ARMED: deadline 500 ms, max lag 1040 frames, fabric seq 2654288"
    - "[pfdaq-sup] DISARM from ARMED: 16 status, 0 deadline misses, 0 seq mismatches, linux errors 0, latency irqs 0"
  callouts:
    - {lines: [0],         title: "A stall longer than the deadline", text: "-D 300 sets a 300 ms deadline; -P 5:900 sleeps 900 ms before the report of burst 5."}
    - {lines: [2, 3],      title: "Alarm, then resume", text: "No STATUS within 300 ms: ALARM and one miss. The next STATUS, burst 5, returns the state to ARMED."}
    - {lines: [4],         title: "One stall, one miss", text: "12 status and exactly 1 deadline miss: the count the stall predicts, which is what the test checks."}
    - {lines: [5, 8],      title: "A consumer that dies", text: "The tool is killed with SIGKILL while armed; no DISARM comes, and the supervisor alarms by itself."}
    - {lines: [9, 11],     title: "The next run recovers", text: "ARM resets state and counters: 16 status, 0 misses, with no reboot. The alarm shows only on this console."}

# ---------------------------------------------------------------- M04

- id: lab-m04-one-source
  alt: "One source file, two builds. pfdaq_supervisor.c is built by Makefile.freertos with -DPFDAQ_SUPERVISOR and by Makefile.bm with -DPFDAQ_SUPERVISOR -DPFDAQ_BM. The flag selects the time base, delay_ms, the receive with timeout and the task path for the latency interrupt. The FreeRTOS payload with U-Boot is 1,376,656 bytes and is carried by the SD image; the bare-metal payload is 842,208 bytes and is built by firmware/build_payload.sh."
  width: 900
  height: 450
  step: 1.6
  nodes:
    src:  {x: 275, y: 30,  w: 350, h: 66,  kind: sw,   title: "pfdaq_supervisor.c", sub: "one file; the macro PFDAQ_BM selects\nthe time base, delay, receive and task path"}
    fr:   {x: 20,  y: 150, w: 410, h: 160, kind: hart, title: "FreeRTOS build, Makefile.freertos", sub: "flag: -DPFDAQ_SUPERVISOR\nnow_ms: xTaskGetTickCount(), 1 ms ticks\ndelay_ms: vTaskDelay(), the task sleeps\nreceive: the RPMsg queue takes the timeout\nlatency ack: handler, or task lat1_task\nbit 31 of uptime_ms: clear"}
    bm:   {x: 470, y: 150, w: 410, h: 160, kind: mss,  title: "Bare-metal build, Makefile.bm", sub: "flags: -DPFDAQ_SUPERVISOR -DPFDAQ_BM\nnow_ms: machine timer at 1 MHz, divided by 1000\ndelay_ms: busy-wait on the timer\nreceive: sup_recv() polls the queue size\nlatency ack: handler only, no tasks\nbit 31 of uptime_ms: set"}
    outf: {x: 20,  y: 350, w: 410, h: 70,  kind: mem,  title: "Payload with U-Boot, 1,376,656 bytes", sub: "built by Yocto; the SD image carries it"}
    outb: {x: 470, y: 350, w: 410, h: 70,  kind: mem,  title: "Payload with U-Boot, 842,208 bytes", sub: "firmware/build_payload.sh, written to partition 2"}
  edges:
    - {from: src.bottom@0.25, to: fr.top}
    - {from: src.bottom@0.75, to: bm.top}
    - {from: fr.bottom, to: outf.top}
    - {from: bm.bottom, to: outb.top}
  steps: [src, e0, fr, e2, outf, e1, bm, e3, outb]

