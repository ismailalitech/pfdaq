<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-labelledby="t d">
<title id="t">One event wakes the program twice. After the first wake-up STATUS bit 0 is set, so the program writes ACK and counts an ack; it then writes 1 to unmask the line. A second wake-up follows with STATUS bit 0 clear: the program writes no ACK, counts an empty wake-up and writes 1 again.</title><desc id="d">One event wakes the program twice. After the first wake-up STATUS bit 0 is set, so the program writes ACK and counts an ack; it then writes 1 to unmask the line. A second wake-up follows with STATUS bit 0 clear: the program writes no ACK, counts an empty wake-up and writes 1 again.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 13.70s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 13.70s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}9.49%{opacity:1}12.49%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="290" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M170,85 L202,85" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M170,85 L202,85" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e1">
<path d="M352,85 L384,85" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M352,85 L384,85" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e2">
<path d="M534,85 L566,85" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M534,85 L566,85" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e3">
<path d="M716,85 L748,85" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.10s" d="M716,85 L748,85" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="ev">
<rect x="20" y="40" width="150" height="90" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="95" y="72.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">One event</text>
<text x="95" y="89.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the fabric raises</text>
<text x="95" y="106.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the level</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="39" width="152" height="92" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="w1">
<rect x="202" y="40" width="150" height="90" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="277" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Wake-up 1</text>
<text x="277" y="81" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">STATUS bit 0 = 1</text>
<text x="277" y="98" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">write ACK</text>
<text x="277" y="115" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">acks + 1</text>
<rect class="hl" style="animation-delay:2.60s" x="201" y="39" width="152" height="92" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="um1">
<rect x="384" y="40" width="150" height="90" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="459" y="72.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">write(1)</text>
<text x="459" y="89.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the line is</text>
<text x="459" y="106.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">unmasked</text>
<rect class="hl" style="animation-delay:5.20s" x="383" y="39" width="152" height="92" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="w2">
<rect x="566" y="40" width="150" height="90" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="641" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Wake-up 2</text>
<text x="641" y="81" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">STATUS bit 0 = 0</text>
<text x="641" y="98" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">no ACK</text>
<text x="641" y="115" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">empty_wakeups + 1</text>
<rect class="hl" style="animation-delay:7.80s" x="565" y="39" width="152" height="92" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="um2">
<rect x="748" y="40" width="132" height="90" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="814" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">write(1)</text>
<text x="814" y="98" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">unmask again</text>
<rect class="hl" style="animation-delay:10.40s" x="747" y="39" width="134" height="92" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="170" text-anchor="start" font-size="12" fill="#9aa8b5">Recorded explanation: the interrupt controller latches the still-high level again when the kernel handler completes,</text>
<text x="20" y="190" text-anchor="start" font-size="12" fill="#9aa8b5">and delivers it once the line is unmasked, although the program has acknowledged by then. The PLIC was not traced.</text>
<text x="20" y="225" text-anchor="start" font-size="12" fill="#4fd1a5">Checking STATUS keeps the program correct whatever the cause: ACK is never written with nothing pending (spurious 0).</text>
<text x="20" y="262" text-anchor="start" font-size="12" fill="#9aa8b5">Without the check, the second wake-up of every event would be a write to ACK with nothing pending.</text>
</svg>
