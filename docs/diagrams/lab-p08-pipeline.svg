<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d">
<title id="t">The multi-threaded capture loop. The main thread arms a burst in a free buffer of a ring in the non-cached region and starts the stream source; the DMA writes the burst into the buffer. A finished burst goes to one of the worker threads, which copies it out of the non-cached buffer, hands the buffer back to the ring, and verifies its private copy. With three workers all three Linux cores are busy.</title><desc id="d">The multi-threaded capture loop. The main thread arms a burst in a free buffer of a ring in the non-cached region and starts the stream source; the DMA writes the burst into the buffer. A finished burst goes to one of the worker threads, which copies it out of the non-cached buffer, hands the buffer back to the ring, and verifies its private copy. With three workers all three Linux cores are busy.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 18.90s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 18.90s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}6.88%{opacity:1}9.88%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="340" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M125,110 L125,220" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M125,110 L125,220" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="129" y="156" width="74.4" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="134" y="168.5" text-anchor="start" font-size="11.5" fill="#e6ecf1">arm, START</text>
</g>
<g id="e1">
<path d="M240,255 L440,255 L440,210" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M240,255 L440,255 L440,210" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="289.92" y="233" width="100.16" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="340" y="245.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">writes a burst</text>
</g>
<g id="e2">
<path d="M240,70 L440,70 L440,110" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M240,70 L440,70 L440,110" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="289.92" y="48" width="100.16" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="340" y="60.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">finished burst</text>
</g>
<g id="e3">
<path d="M550,130 L600,130 L600,51 L650,51" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:7.80s" d="M550,130 L600,130 L600,51 L650,51" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e4">
<path d="M550,160 L600,160 L600,141 L650,141" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.10s" d="M550,160 L600,160 L600,141 L650,141" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="544.24" y="138" width="61.52" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="575" y="150.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">copy out</text>
</g>
<g id="e5">
<path d="M550,190 L600,190 L600,231 L650,231" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:10.40s" d="M550,190 L600,190 L600,231 L650,231" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e6">
<path d="M770,262 L770,302 L440,302 L440,210" fill="none" stroke="#5aa0d6" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ar-hart)"/>
<path class="hl flow" style="animation-delay:15.60s" d="M770,262 L770,302 L440,302 L440,210" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="545.26" y="280" width="119.48" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="605" y="292.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">buffer free again</text>
</g>
<g id="main">
<rect x="10" y="30" width="230" height="80" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="125" y="57.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Main thread</text>
<text x="125" y="74.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">arm, START, wait for the</text>
<text x="125" y="91.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">DMA interrupt, hand over</text>
<rect class="hl" style="animation-delay:0.00s" x="9" y="29" width="232" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="dma">
<rect x="10" y="220" width="230" height="70" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="125" y="251" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Stream source and DMA</text>
<text x="125" y="268" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">one 1 MiB burst at a time</text>
<rect class="hl" style="animation-delay:2.60s" x="9" y="219" width="232" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ring">
<rect x="330" y="110" width="220" height="100" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="440" y="147.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Buffer ring</text>
<text x="440" y="164.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">workers + 2 buffers</text>
<text x="440" y="181.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">in the non-cached region</text>
<rect class="hl" style="animation-delay:5.20s" x="329" y="109" width="222" height="102" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="w1">
<rect x="650" y="20" width="240" height="62" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="770" y="47" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Worker 1</text>
<text x="770" y="64" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">copy out, free the buffer, verify</text>
<rect class="hl" style="animation-delay:11.70s" x="649" y="19" width="242" height="64" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="w2">
<rect x="650" y="110" width="240" height="62" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="770" y="137" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Worker 2</text>
<text x="770" y="154" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">copy out, free the buffer, verify</text>
<rect class="hl" style="animation-delay:13.00s" x="649" y="109" width="242" height="64" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="w3">
<rect x="650" y="200" width="240" height="62" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="770" y="227" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Worker 3</text>
<text x="770" y="244" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">copy out, free the buffer, verify</text>
<rect class="hl" style="animation-delay:14.30s" x="649" y="199" width="242" height="64" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="322" text-anchor="start" font-size="12" fill="#9aa8b5">The workers verify in parallel; with three of them all three Linux cores are busy, and hart 4 stays with the supervisor.</text>
</svg>
