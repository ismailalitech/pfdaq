<text x="210.516" y="192" text-anchor="middle" font-size="11.5" fill="#e6ecf1"></text>
<rect x="10" y="226" width="880" height="48" rx="8" fill="#171d25" stroke="#2a3441"/>
<text x="22" y="254" font-size="13" font-weight="bold" fill="#e6ecf1">memcpy, nc to cached</text>
<rect x="190" y="238" width="587.25" height="24" rx="4" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="483.625" y="254" text-anchor="middle" font-size="11.5" fill="#e6ecf1">a hart copies 13.05 ms</text>
