<text x="190" y="296" text-anchor="middle" font-size="11" fill="#9aa8b5">0 ms</text>
<line x1="280" y1="32" x2="280" y2="280" stroke="#2a3441" stroke-dasharray="2 4"/>
<text x="280" y="296" text-anchor="middle" font-size="11" fill="#9aa8b5">2</text>
<line x1="370" y1="32" x2="370" y2="280" stroke="#2a3441" stroke-dasharray="2 4"/>
<text x="370" y="296" text-anchor="middle" font-size="11" fill="#9aa8b5">4</text>
<line x1="460" y1="32" x2="460" y2="280" stroke="#2a3441" stroke-dasharray="2 4"/>
<text x="460" y="296" text-anchor="middle" font-size="11" fill="#9aa8b5">6</text>
<line x1="550" y1="32" x2="550" y2="280" stroke="#2a3441" stroke-dasharray="2 4"/>
<text x="550" y="296" text-anchor="middle" font-size="11" fill="#9aa8b5">8</text>
<line x1="640" y1="32" x2="640" y2="280" stroke="#2a3441" stroke-dasharray="2 4"/>
<text x="640" y="296" text-anchor="middle" font-size="11" fill="#9aa8b5">10</text>
<line x1="730" y1="32" x2="730" y2="280" stroke="#2a3441" stroke-dasharray="2 4"/>
<text x="730" y="296" text-anchor="middle" font-size="11" fill="#9aa8b5">12</text>
<line x1="820" y1="32" x2="820" y2="280" stroke="#2a3441" stroke-dasharray="2 4"/>
<text x="820" y="296" text-anchor="middle" font-size="11" fill="#9aa8b5">14 ms</text>
<g class="play" style="animation-duration:9s; --dx:648px"><line x1="190" y1="30" x2="190" y2="282" stroke="#ffd166" stroke-width="2.5"/></g>
<text x="20" y="340" text-anchor="start" font-size="12" fill="#9aa8b5">Per 1 MiB, mean times of five passes: fabric DMA 1.20 ms; MSS DMA 2.84 ms and 0.91 ms.</text>
<text x="20" y="362" text-anchor="start" font-size="12" fill="#9aa8b5">818 to 831, 351, 1,069 to 1,079 and 77 transfers per pass, in this order.</text>
<text x="20" y="384" text-anchor="start" font-size="12" fill="#9aa8b5">The program was on a CPU 0.04 ms of each DMA transfer (0.08 ms for the cached destination), all of the memcpy.</text>
</svg>
