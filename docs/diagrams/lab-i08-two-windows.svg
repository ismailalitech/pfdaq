<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d">
<title id="t">Two ways for the fabric DMA to write the same DDR bytes. Through the cached window at 0x8800_0000 the data lands in the caches that the processor also reads, so a cached read sees it; it reaches DDR later by write-back. Through the non-cached window at 0xC800_0000 the data goes straight to DDR, and a processor that holds those lines in its cache is not told, so a cached read returns the old copy.</title><desc id="d">Two ways for the fabric DMA to write the same DDR bytes. Through the cached window at 0x8800_0000 the data lands in the caches that the processor also reads, so a cached read sees it; it reaches DDR later by write-back. Through the non-cached window at 0xC800_0000 the data goes straight to DDR, and a processor that holds those lines in its cache is not told, so a cached read returns the old copy.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 18.90s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 18.90s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}6.88%{opacity:1}9.88%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
