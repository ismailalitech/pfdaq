<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d">
<title id="t">One iteration of the shared-memory test, by turns. Linux fills 64 K words with an xorshift32 sequence and executes a full barrier; it sends one MEMCHK message with the physical address, the word count and the seed; hart 4 reads every word, counts those that differ, writes the inverse back and executes fence rw, rw; it replies with the number of mismatches and words checked; Linux then reads every word and expects the inverse.</title><desc id="d">One iteration of the shared-memory test, by turns. Linux fills 64 K words with an xorshift32 sequence and executes a full barrier; it sends one MEMCHK message with the physical address, the word count and the seed; hart 4 reads every word, counts those that differ, writes the inverse back and executes fence rw, rw; it replies with the number of mismatches and words checked; Linux then reads every word and expects the inverse.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 16.40s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 16.40s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}9.76%{opacity:1}12.76%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="440" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M270,90 L325,90" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.60s" d="M270,90 L325,90" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e1">
<path d="M575,90 L630,90" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:4.80s" d="M575,90 L630,90" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e2">
<path d="M755,130 L755,240 L575,240" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:8.00s" d="M755,130 L755,240 L575,240" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e3">
<path d="M325,240 L270,240" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:11.20s" d="M325,240 L270,240" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="lin1">
<rect x="20" y="50" width="250" height="80" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="145" y="77.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">1 Linux fills the region</text>
<text x="145" y="94.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">xorshift32 sequence from a seed</text>
<text x="145" y="111.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">then __sync_synchronize()</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="49" width="252" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="msg">
<rect x="325" y="50" width="250" height="80" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="450" y="77.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">2 MEMCHK message, type 6</text>
<text x="450" y="94.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">physical address, word count,</text>
<text x="450" y="111.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">seed, over RPMsg</text>
<rect class="hl" style="animation-delay:3.20s" x="324" y="49" width="252" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="h4">
<rect x="630" y="50" width="250" height="80" rx="9" fill="#232c44" stroke="#8da6d4" stroke-width="1.5"/>
<text x="755" y="77.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">3 Hart 4 checks</text>
<text x="755" y="94.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">reads each word, counts differences</text>
<text x="755" y="111.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">writes ~x back, fence rw, rw</text>
<rect class="hl" style="animation-delay:6.40s" x="629" y="49" width="252" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ack">
<rect x="325" y="200" width="250" height="80" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="450" y="227.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">4 Acknowledgement</text>
<text x="450" y="244.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">mismatches and words checked</text>
<text x="450" y="261.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">(in fabric_seq, fabric_frames)</text>
<rect class="hl" style="animation-delay:9.60s" x="324" y="199" width="252" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="lin2">
<rect x="20" y="200" width="250" height="80" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="145" y="227.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">5 Linux checks the inverse</text>
<text x="145" y="244.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">reads each word, expects ~x</text>
<text x="145" y="261.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">counts its own mismatches</text>
<rect class="hl" style="animation-delay:12.80s" x="19" y="199" width="252" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ddr">
<rect x="20" y="340" width="860" height="78" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="450" y="366.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">The shared DDR: two 32 MiB windows</text>
<text x="450" y="383.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">cached: udmabuf-ddr-c0 at 0x8800_0000, test at offset 0x100000</text>
<text x="450" y="400.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">non-cached: udmabuf-ddr-nc0 at 0xC800_0000, test at offset 0x1F00000</text>
</g>
<text x="630" y="300" text-anchor="start" font-size="12" fill="#9aa8b5">Only one side touches the data</text>
<text x="630" y="317" text-anchor="start" font-size="12" fill="#9aa8b5">at a time; a message marks each turn.</text>
</svg>
