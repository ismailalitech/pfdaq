<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d">
<title id="t">What the real-time source does when a slot is due. The slot timer counts down and reloads. When a slot is due, the source sends the frame if it is idle in R_RTWAIT and holds a credit; sending uses one credit and moves to the next TDEST. Otherwise it drops the slot: DROPS goes up by one and the sequence number still advances. Software returns credits by writing CREDIT after it has freed a buffer.</title><desc id="d">What the real-time source does when a slot is due. The slot timer counts down and reloads. When a slot is due, the source sends the frame if it is idle in R_RTWAIT and holds a credit; sending uses one credit and moves to the next TDEST. Otherwise it drops the slot: DROPS goes up by one and the sequence number still advances. Software returns credits by writing CREDIT after it has freed a buffer.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 29.00s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 29.00s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}10.34%{opacity:1}13.34%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="330" rx="12" fill="#12171d"/>
<g id="e_due">
<path d="M190,125 L270,125" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.00s" d="M190,125 L270,125" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="192.8" y="103" width="74.4" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="230" y="115.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">every RATE</text>
</g>
<g id="e_yes">
<path d="M490,111 L535,111 L535,55 L580,55" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.00s" d="M490,111 L535,111 L535,55 L580,55" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="539" y="74" width="29.32" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="544" y="86.5" text-anchor="start" font-size="11.5" fill="#e6ecf1">yes</text>
</g>
<g id="e_no">
<path d="M490,139 L535,139 L535,195 L580,195" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:21.00s" d="M490,139 L535,139 L535,195 L580,195" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="539" y="158" width="22.88" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="544" y="170.5" text-anchor="start" font-size="11.5" fill="#e6ecf1">no</text>
</g>
<g id="e_cred">
<path d="M380,230 L380,160" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:15.00s" d="M380,230 L380,160" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="384" y="186" width="48.64" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="389" y="198.5" text-anchor="start" font-size="11.5" fill="#e6ecf1">credit</text>
</g>
<g id="timer">
<rect x="20" y="90" width="170" height="70" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="105" y="112.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Slot timer</text>
<text x="105" y="129.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">rt_timer counts down,</text>
<text x="105" y="146.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">reloads rate - 1</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="89" width="172" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="decide">
<rect x="270" y="90" width="220" height="70" rx="9" fill="#232c44" stroke="#8da6d4" stroke-width="1.5"/>
<text x="380" y="112.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Slot due: can_start?</text>
<text x="380" y="129.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">idle in R_RTWAIT and</text>
<text x="380" y="146.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">credits != 0</text>
<rect class="hl" style="animation-delay:6.00s" x="269" y="89" width="222" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="send">
<rect x="580" y="20" width="290" height="70" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="725" y="42.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Send the frame</text>
<text x="725" y="59.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">uses one credit, next TDEST,</text>
<text x="725" y="76.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">timestamp = when it was due</text>
<rect class="hl" style="animation-delay:12.00s" x="579" y="19" width="292" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="drop">
<rect x="580" y="160" width="290" height="70" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="725" y="182.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Drop the slot</text>
<text x="725" y="199.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">DROPS + 1, and the sequence</text>
<text x="725" y="216.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">number still advances</text>
<rect class="hl" style="animation-delay:24.00s" x="579" y="159" width="292" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="soft">
<rect x="270" y="230" width="220" height="70" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="380" y="252.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Software</text>
<text x="380" y="269.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">writes CREDIT after it</text>
<text x="380" y="286.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">has freed a buffer</text>
<rect class="hl" style="animation-delay:18.00s" x="269" y="229" width="222" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="322" text-anchor="start" font-size="12" fill="#9aa8b5">The two reasons for a drop, no credit and busy, look the same in DROPS.</text>
</svg>
