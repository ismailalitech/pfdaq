<text x="735" y="129.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">cfg_* copied once, at START;</text>
<text x="735" y="146.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">counters keep running</text>
<rect class="hl" style="animation-delay:12.00s" x="589" y="84" width="292" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
