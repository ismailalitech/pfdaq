<text x="735" y="299.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">copied on SNAPSHOT and</text>
<text x="735" y="316.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">at the end of a run</text>
<rect class="hl" style="animation-delay:27.00s" x="589" y="259" width="292" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
