<circle cx="24" cy="284" r="13" fill="#ffd166"/><text x="24" y="289" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="282" font-size="15" font-weight="bold" fill="#e6ecf1">A gap in the packet</text>
<text x="48" y="302" font-size="13" fill="#9aa8b5">fir_ok is low, TVALID is low for three clocks and underrun is set: three VALID_GAP lines.</text>
</g>
