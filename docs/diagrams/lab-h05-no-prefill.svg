<rect x="0" y="256" width="900" height="84" fill="#12171d"/>
<circle cx="24" cy="284" r="13" fill="#ffd166"/><text x="24" y="289" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="282" font-size="15" font-weight="bold" fill="#e6ecf1">No margin</text>
<text x="48" y="302" font-size="13" fill="#9aa8b5">With the threshold at 0 the run leaves PREFILL after one clock, with an empty FIFO.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="310.769" y="30" width="56.9231" height="220" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
