<text x="48" y="282" font-size="15" font-weight="bold" fill="#e6ecf1">Header beat</text>
<text x="48" y="302" font-size="13" fill="#9aa8b5">The header beat does not need a filter output, so it goes out.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="367.692" y="30" width="170.769" height="220" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="367.692" cy="30" r="11" fill="#ffd166"/><text x="367.692" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:6.80s">
