<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d">
<title id="t">How the boot payload is made and used: the template amp.yaml.in is filled in and given to hss-payload-generator, which writes payload.bin. The boot monitor on the E51 reads it from the SD card and starts u-boot.bin on harts 1 to 3 in supervisor mode at 0x80200000, and the FreeRTOS firmware on hart 4 in machine mode at 0x91C00000 without OpenSBI.</title><desc id="d">How the boot payload is made and used: the template amp.yaml.in is filled in and given to hss-payload-generator, which writes payload.bin. The boot monitor on the E51 reads it from the SD card and starts u-boot.bin on harts 1 to 3 in supervisor mode at 0x80200000, and the FreeRTOS firmware on hart 4 in machine mode at 0x91C00000 without OpenSBI.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 35.00s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 35.00s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}8.57%{opacity:1}11.57%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="440" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M250,73 L340,73" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.00s" d="M250,73 L340,73" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="261.02" y="51" width="67.96" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="295" y="63.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">filled in</text>
</g>
<g id="e1">
<path d="M580,73 L640,73" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.00s" d="M580,73 L640,73" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e2">
<path d="M760,106 L760,148 L540,148 L540,190" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:15.00s" d="M760,106 L760,148 L540,148 L540,190" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="580.6" y="126" width="138.8" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="650" y="138.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">SD card, partition 2</text>
</g>
<g id="e3">
<path d="M456,256 L456,370 L600,370" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:21.00s" d="M456,256 L456,370 L600,370" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e4">
<path d="M596,256 L596,293 L760,293 L760,330" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:27.00s" d="M596,256 L596,293 L760,293 L760,330" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="yaml">
<rect x="20" y="40" width="230" height="66" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="135" y="69" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">amp.yaml.in</text>
<text x="135" y="86" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">set-name, entry points, payloads</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="39" width="232" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="gen">
<rect x="340" y="40" width="240" height="66" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="460" y="69" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">hss-payload-generator</text>
<text x="460" y="86" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">-c amp.yaml -v payload.bin</text>
<rect class="hl" style="animation-delay:6.00s" x="339" y="39" width="242" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="payload">
<rect x="640" y="40" width="240" height="66" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="760" y="69" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">payload.bin</text>
<text x="760" y="86" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">header, chunk table, chunks</text>
<rect class="hl" style="animation-delay:12.00s" x="639" y="39" width="242" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="hss">
<rect x="400" y="190" width="280" height="66" rx="9" fill="#232c44" stroke="#8da6d4" stroke-width="1.5"/>
<text x="540" y="219" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">HSS on the E51</text>
<text x="540" y="236" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">reads the header, loads the chunks</text>
<rect class="hl" style="animation-delay:18.00s" x="399" y="189" width="282" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="uboot">
<rect x="330" y="330" width="270" height="80" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="465" y="357.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">u-boot.bin</text>
<text x="465" y="374.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">harts 1, 2 and 3 (owner: 1)</text>
<text x="465" y="391.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">supervisor mode, entry 0x80200000</text>
<rect class="hl" style="animation-delay:24.00s" x="329" y="329" width="272" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="sup">
<rect x="640" y="330" width="240" height="80" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="760" y="357.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">FreeRTOS ELF</text>
<text x="760" y="374.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">hart 4, machine mode</text>
<text x="760" y="391.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">entry 0x91C00000, no OpenSBI</text>
<rect class="hl" style="animation-delay:30.00s" x="639" y="329" width="242" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="150" text-anchor="start" font-size="12" fill="#9aa8b5" font-weight="bold">One file, two images:</text>
<text x="20" y="172" text-anchor="start" font-size="12" fill="#9aa8b5">each core gets its own entry point,</text>
<text x="20" y="192" text-anchor="start" font-size="12" fill="#9aa8b5">privilege mode and owner.</text>
<text x="20" y="350" text-anchor="start" font-size="12" fill="#9aa8b5">skip-opensbi: true on hart 4:</text>
<text x="20" y="370" text-anchor="start" font-size="12" fill="#9aa8b5">started by a plain mret</text>
<text x="20" y="390" text-anchor="start" font-size="12" fill="#9aa8b5">(see the table in the lab).</text>
</svg>
