<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d">
<title id="t">What an ABORT does: CTRL bit 4 makes the source finish the frame in progress. In per-frame and real-time modes it then stops, because each frame was its own packet. In burst mode it sends zero words until the whole run's word count is out, with TLAST on the last, so the DMA transfer completes and STATUS bit 2 is set. FORCE_ABORT, CTRL bit 5, stops at once and can leave the DMA waiting.</title><desc id="d">What an ABORT does: CTRL bit 4 makes the source finish the frame in progress. In per-frame and real-time modes it then stops, because each frame was its own packet. In burst mode it sends zero words until the whole run's word count is out, with TLAST on the last, so the DMA transfer completes and STATUS bit 2 is set. FORCE_ABORT, CTRL bit 5, stops at once and can leave the DMA waiting.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 17.60s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 17.60s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}7.39%{opacity:1}10.39%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="360" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M210,165 L270,165" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M210,165 L270,165" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e1">
<path d="M470,151 L505,151 L505,70 L540,70" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.10s" d="M470,151 L505,151 L505,70 L540,70" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e2">
<path d="M470,179 L505,179 L505,185 L540,185" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M470,179 L505,179 L505,185 L540,185" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e3">
<path d="M870,70 L882,70 L882,305 L870,305" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:11.70s" d="M870,70 L882,70 L882,305 L870,305" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e4">
<path d="M705,230 L705,270" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M705,230 L705,270" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e5">
<path d="M115,200 L115,235 L145,235 L145,270" fill="none" stroke="#ef6f6c" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ar-bad)"/>
<path class="hl flow" style="animation-delay:13.00s" d="M115,200 L115,235 L145,235 L145,270" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="119" y="208.5" width="93.72" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="124" y="221" text-anchor="start" font-size="11.5" fill="#e6ecf1">bit 5 instead</text>
</g>
<g id="abort">
<rect x="20" y="130" width="190" height="70" rx="9" fill="#2a3140" stroke="#c9d3dd" stroke-width="1.5"/>
<text x="115" y="152.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">ABORT</text>
<text x="115" y="169.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">CTRL bit 4, written</text>
<text x="115" y="186.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">during a run</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="129" width="192" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="fin">
<rect x="270" y="130" width="200" height="70" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="370" y="161" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Finish the frame</text>
<text x="370" y="178" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">that is in progress</text>
<rect class="hl" style="animation-delay:2.60s" x="269" y="129" width="202" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="pf">
<rect x="540" y="30" width="330" height="80" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="705" y="57.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Per-frame and real-time modes</text>
<text x="705" y="74.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">each frame was its own packet:</text>
<text x="705" y="91.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">stop, nothing to pad</text>
<rect class="hl" style="animation-delay:10.40s" x="539" y="29" width="332" height="82" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="burst">
<rect x="540" y="140" width="330" height="90" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="705" y="172.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Burst mode: one packet per run</text>
<text x="705" y="189.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">send zero words until FRAME_COUNT x</text>
<text x="705" y="206.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">(PAYLOAD_WORDS + 4) are out, TLAST on last</text>
<rect class="hl" style="animation-delay:5.20s" x="539" y="139" width="332" height="92" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="done">
<rect x="540" y="270" width="330" height="70" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="705" y="292.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">DMA completes</text>
<text x="705" y="309.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">STATUS bit 2 set; FRAMES_SENT says</text>
<text x="705" y="326.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">where the real data ends</text>
<rect class="hl" style="animation-delay:7.80s" x="539" y="269" width="332" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="force">
<rect x="20" y="270" width="250" height="70" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="145" y="292.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">FORCE_ABORT (CTRL bit 5)</text>
<text x="145" y="309.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">stops at once; the DMA may</text>
<text x="145" y="326.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">wait, only a reboot clears it</text>
<rect class="hl" style="animation-delay:14.30s" x="19" y="269" width="252" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
</svg>
