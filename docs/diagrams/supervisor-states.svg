<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 270" width="780" height="270" role="img" aria-labelledby="t d">
<title id="t">The deadline supervisor's states: IDLE goes to ARMED on ARM; ARMED goes to ALARM when silence lasts longer than the deadline; a STATUS message returns ALARM to ARMED. ARM in ARMED or ALARM resets the counters, and DISARM from any state returns to IDLE.</title><desc id="d">The deadline supervisor's states: IDLE goes to ARMED on ARM; ARMED goes to ALARM when silence lasts longer than the deadline; a STATUS message returns ALARM to ARMED. ARM in ARMED or ALARM resets the counters, and DISARM from any state returns to IDLE.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl{opacity:0;animation:lit 9.80s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 9.80s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}13.27%{opacity:1}16.27%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="780" height="270" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M170,85 L320,85" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M170,85 L320,85" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="230.34" y="63" width="29.32" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="245" y="75.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">ARM</text>
</g>
<g id="e1">
<path d="M460,85 L610,85" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M460,85 L610,85" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="472.04" y="63" width="125.92" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="535" y="75.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">silence &gt; deadline</text>
</g>
<g id="e2">
<path d="M680,120 L680,164 L390,164 L390,120" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M680,120 L680,164 L390,164 L390,120" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="484.92" y="142" width="100.16" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="535" y="154.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">STATUS resumed</text>
</g>
<g id="idle">
<rect x="30" y="50" width="140" height="70" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="100" y="89.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">IDLE</text>
<rect class="hl" style="animation-delay:0.00s" x="29" y="49" width="142" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="armed">
<rect x="320" y="50" width="140" height="70" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="390" y="89.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">ARMED</text>
<rect class="hl" style="animation-delay:2.60s" x="319" y="49" width="142" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="alarm">
<rect x="610" y="50" width="140" height="70" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="680" y="89.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">ALARM</text>
<rect class="hl" style="animation-delay:5.20s" x="609" y="49" width="142" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="30" y="206" text-anchor="start" font-size="12" fill="#9aa8b5">ARM in ARMED or ALARM  →  ARMED, counters reset</text>
<text x="30" y="228" text-anchor="start" font-size="12" fill="#9aa8b5">DISARM from any state  →  IDLE</text>
</svg>
