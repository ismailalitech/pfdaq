<title id="t">reboot-30.csv (excerpt, written by tests/host/amp_reboot_test.sh)</title><desc id="d">Lines of the 30-cycle warm-reboot record: the header, cycles 1, 2 and 30 with the time until SSH answered, remoteproc attached, the supervisor channel present and both capture checks true, and the final line, 30 of 30.</desc>
