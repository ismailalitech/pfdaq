<path class="hl flow" style="animation-delay:3.00s" d="M180,63 L270,63" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="184.58" y="41" width="80.84" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="225" y="53.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">lfsr &amp; mask</text>
</g>
<g id="e1">
<path d="M470,63 L560,63" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.00s" d="M470,63 L560,63" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="500.34" y="41" width="29.32" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="515" y="53.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">due</text>
</g>
<g id="e2">
<path d="M650,96 L650,170" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:15.00s" d="M650,96 L650,170" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="654" y="124" width="74.4" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="659" y="136.5" text-anchor="start" font-size="11.5" fill="#e6ecf1">while high</text>
</g>
