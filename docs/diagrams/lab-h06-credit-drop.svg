<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d">
<title id="t">Waveform from the stream simulation, scenario 13: real-time mode, a slot every 200 clocks (1600 ns), 12 credits and none ever returned. The twelfth slot takes the last credit and its frame is sent. The thirteenth slot falls due with zero credits: can_start is low, the slot is dropped, DROPS goes from 0 to 1 and the sequence number advances although no frame was sent.</title><desc id="d">Waveform from the stream simulation, scenario 13: real-time mode, a slot every 200 clocks (1600 ns), 12 credits and none ever returned. The twelfth slot takes the last credit and its frame is sent. The thirteenth slot falls due with zero credits: can_start is low, the slot is dropped, DROPS goes from 0 to 1 and the sequence number advances although no frame was sent.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 15.60s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 15.60s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}21.79%{opacity:1}24.79%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
