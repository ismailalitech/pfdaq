<path d="M140,234 L140,234 L417.5,234 L417.5,214 L510,214 L510,234 L880,234" fill="none" stroke="#5fbf84" stroke-width="2" stroke-linejoin="round"/>
<text x="12" y="266" font-size="12" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">hw_addr</text>
<rect x="140.5" y="253" width="276.5" height="22" rx="4" fill="#1b2a3a" stroke="#c0a95f" stroke-width="1.2"/>
<text x="278.75" y="268" text-anchor="middle" font-size="11" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">11</text>
<rect x="418" y="253" width="461.5" height="22" rx="4" fill="#1b2a3a" stroke="#c0a95f" stroke-width="1.2"/>
<text x="648.75" y="268" text-anchor="middle" font-size="11" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">7</text>
<text x="12" y="306" font-size="12" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">hw_data</text>
<rect x="140.5" y="293" width="184" height="22" rx="4" fill="#1b2a3a" stroke="#c0a95f" stroke-width="1.2"/>
<text x="232.5" y="308" text-anchor="middle" font-size="11" fill="#e6ecf1" font-family="IBM Plex Mono, ui-monospace, monospace">1</text>
<rect x="325.5" y="293" width="276.5" height="22" rx="4" fill="#1b2a3a" stroke="#c0a95f" stroke-width="1.2"/>
