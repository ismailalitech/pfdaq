<rect x="0" y="336" width="900" height="74" fill="#12171d"/>
<g class="co" style="animation-delay:0.00s"><rect x="325" y="30" width="92.5" height="300" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="325" cy="30" r="11" fill="#ffd166"/><text x="325" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="336" width="900" height="74" fill="#12171d"/>
<circle cx="24" cy="364" r="13" fill="#ffd166"/><text x="24" y="369" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="362" font-size="15" font-weight="bold" fill="#e6ecf1">t: the ACK write</text>
<text x="48" y="382" font-size="13" fill="#9aa8b5">lat_now is 13, lat_bin is 7, and ha_q, which follows lat_bin one clock later, holds the old count of bin 7: 1.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="417.5" y="30" width="92.5" height="300" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="417.5" cy="30" r="11" fill="#ffd166"/><text x="417.5" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.40s">
<rect x="0" y="336" width="900" height="74" fill="#12171d"/>
<circle cx="24" cy="364" r="13" fill="#ffd166"/><text x="24" y="369" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="362" font-size="15" font-weight="bold" fill="#e6ecf1">t+1: the write</text>
<text x="48" y="382" font-size="13" fill="#9aa8b5">inc_pend is high, hw_addr is 7, hw_data is ha_q + 1 = 2. At the end of this cycle 2 is written to the RAM.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="510" y="30" width="92.5" height="300" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="510" cy="30" r="11" fill="#ffd166"/><text x="510" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:6.80s">
<rect x="0" y="336" width="900" height="74" fill="#12171d"/>
<circle cx="24" cy="364" r="13" fill="#ffd166"/><text x="24" y="369" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="362" font-size="15" font-weight="bold" fill="#e6ecf1">t+2: still the old count</text>
<text x="48" y="382" font-size="13" fill="#9aa8b5">ha_q still reads 1: a read of bin 7 addressed in t+1 would have got the old count.</text>
</g>
<g class="co" style="animation-delay:10.20s"><rect x="602.5" y="30" width="92.5" height="300" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="602.5" cy="30" r="11" fill="#ffd166"/><text x="602.5" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:10.20s">
<rect x="0" y="336" width="900" height="74" fill="#12171d"/>
<circle cx="24" cy="364" r="13" fill="#ffd166"/><text x="24" y="369" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="362" font-size="15" font-weight="bold" fill="#e6ecf1">t+3: the new count</text>
<text x="48" y="382" font-size="13" fill="#9aa8b5">ha_q reads 2: a read of bin 7 addressed in t+2 sees the increment.</text>
</g>
</svg>
