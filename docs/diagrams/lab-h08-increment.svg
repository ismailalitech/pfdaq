<line x1="417.5" y1="30" x2="417.5" y2="330" stroke="#27313d" stroke-dasharray="2 4"/><text x="417.5" y="22" text-anchor="middle" font-size="11" fill="#9aa8b5">t+1</text>
<line x1="510" y1="30" x2="510" y2="330" stroke="#27313d" stroke-dasharray="2 4"/><text x="510" y="22" text-anchor="middle" font-size="11" fill="#9aa8b5">t+2</text>
