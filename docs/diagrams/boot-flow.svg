<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d">
<title id="t">Boot flow: power on, then the system controller, then the Hart Software Services on the E51. They start OpenSBI, U-Boot and Linux on harts 1 to 3, and the real-time supervisor on hart 4. Linux attaches to the supervisor through remoteproc.</title><desc id="d">Boot flow: power on, then the system controller, then the Hart Software Services on the E51. They start OpenSBI, U-Boot and Linux on harts 1 to 3, and the real-time supervisor on hart 4. Linux attaches to the supervisor through remoteproc.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl{opacity:0;animation:lit 20.20s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 20.20s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}6.44%{opacity:1}9.44%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="800" height="400" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M240,57 L270,57" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M240,57 L270,57" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e1">
<path d="M490,57 L520,57" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M490,57 L520,57" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e2">
<path d="M630,90 L630,176" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M630,90 L630,176" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e3">
<path d="M520,209 L490,209" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.10s" d="M520,209 L490,209" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e4">
<path d="M270,209 L240,209" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:11.70s" d="M270,209 L240,209" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e5">
<path d="M740,57 L764,57 L764,343 L740,343" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:14.30s" d="M740,57 L764,57 L764,343 L740,343" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e6">
<path d="M130,242 L130,343 L520,343" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:16.90s" d="M130,242 L130,343 L520,343" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="233.06" y="321" width="183.88" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="325" y="333.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">attaches through remoteproc</text>
</g>
<g id="power">
<rect x="20" y="24" width="220" height="66" rx="9" fill="#2a3140" stroke="#c9d3dd" stroke-width="1.5"/>
<text x="130" y="61.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Power on</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="23" width="222" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="sysctl">
<rect x="270" y="24" width="220" height="66" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="380" y="44.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">System controller</text>
<text x="380" y="61.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">configures the FPGA fabric</text>
<text x="380" y="78.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">releases the processors</text>
<rect class="hl" style="animation-delay:2.60s" x="269" y="23" width="222" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="hss">
<rect x="520" y="24" width="220" height="66" rx="9" fill="#232c44" stroke="#8da6d4" stroke-width="1.5"/>
<text x="630" y="44.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">HSS on the E51</text>
<text x="630" y="61.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">from the chip's boot flash</text>
<text x="630" y="78.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">trains DDR, reads the SD card</text>
<rect class="hl" style="animation-delay:5.20s" x="519" y="23" width="222" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="opensbi">
<rect x="520" y="176" width="220" height="66" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="630" y="213.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">OpenSBI</text>
<rect class="hl" style="animation-delay:7.80s" x="519" y="175" width="222" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="uboot">
<rect x="270" y="176" width="220" height="66" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="380" y="213.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">U-Boot</text>
<rect class="hl" style="animation-delay:10.40s" x="269" y="175" width="222" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="linux">
<rect x="20" y="176" width="220" height="66" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="130" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Linux</text>
<text x="130" y="222" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">on harts 1 to 3</text>
<rect class="hl" style="animation-delay:13.00s" x="19" y="175" width="222" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="sup">
<rect x="520" y="310" width="220" height="66" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="630" y="339" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Real-time supervisor</text>
<text x="630" y="356" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">FreeRTOS or bare metal</text>
<rect class="hl" style="animation-delay:15.60s" x="519" y="309" width="222" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="162" text-anchor="start" font-size="12" fill="#9aa8b5">U54 harts 1 to 3 · supervisor mode</text>
<text x="270" y="296" text-anchor="start" font-size="12" fill="#9aa8b5">U54 hart 4 · machine mode,</text>
<text x="270" y="313" text-anchor="start" font-size="12" fill="#9aa8b5">started without OpenSBI</text>
</svg>
