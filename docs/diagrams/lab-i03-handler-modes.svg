<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 385" width="900" height="385" role="img" aria-labelledby="t d">
<title id="t">Two handler modes of the project's UIO driver for the same interrupt. With kernel_ack on, the kernel handler reads STATUS, writes ACK itself and returns IRQ_HANDLED, so the line is already low; the UIO core counts the event, wakes the reader, and the program only reads statistics. With kernel_ack off, the handler masks the line and the user program reads STATUS, writes ACK and writes 1 to unmask.</title><desc id="d">Two handler modes of the project's UIO driver for the same interrupt. With kernel_ack on, the kernel handler reads STATUS, writes ACK itself and returns IRQ_HANDLED, so the line is already low; the UIO core counts the event, wakes the reader, and the program only reads statistics. With kernel_ack off, the handler masks the line and the user program reads STATUS, writes ACK and writes 1 to unmask.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 21.50s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 21.50s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}6.05%{opacity:1}9.05%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
