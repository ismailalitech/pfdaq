<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" role="img" aria-labelledby="t d">
<title id="t">Two waveforms of the same first 120 ns of scenario 1, which sends one packet of five frames with TREADY always high. As built, TVALID is high on every clock and a beat goes on every edge. With w_ready changed to ~out_valid, TVALID is high only every second clock, so the same beats take twice as long and every low clock inside the packet is a TVALID gap. The beat rows number the beats of each 12-word frame, 0 to 5.</title><desc id="d">Two waveforms of the same first 120 ns of scenario 1, which sends one packet of five frames with TREADY always high. As built, TVALID is high on every clock and a beat goes on every edge. With w_ready changed to ~out_valid, TVALID is high only every second clock, so the same beats take twice as long and every low clock inside the packet is a TVALID gap. The beat rows number the beats of each 12-word frame, 0 to 5.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 12.20s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 12.20s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}27.87%{opacity:1}30.87%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
