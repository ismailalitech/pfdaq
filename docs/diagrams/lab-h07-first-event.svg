<g class="co cap" style="animation-delay:10.20s">
<rect x="0" y="256" width="900" height="84" fill="#12171d"/>
<circle cx="24" cy="284" r="13" fill="#ffd166"/><text x="24" y="289" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="282" font-size="15" font-weight="bold" fill="#e6ecf1">Line drops, result kept</text>
<text x="48" y="302" font-size="13" fill="#9aa8b5">IRQ_LAT0 falls and LAT_LAST reads 12 counts, 12 x 20 ns = 240 ns. lat_cnt stops at 12.</text>
</g>
