<circle cx="24" cy="284" r="13" fill="#ffd166"/><text x="24" y="289" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="282" font-size="15" font-weight="bold" fill="#e6ecf1">Software is busy</text>
<text x="48" y="302" font-size="13" fill="#9aa8b5">lat_cnt rises by one every clock while the line is high; software cannot slow or speed it up.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="646.316" y="30" width="38.9474" height="220" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
