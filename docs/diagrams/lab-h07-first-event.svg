<text x="48" y="282" font-size="15" font-weight="bold" fill="#e6ecf1">The event</text>
<text x="48" y="302" font-size="13" fill="#9aa8b5">IRQ_LAT0 goes high and lat_cnt restarts at 0. One count is one 50 MHz clock, 20 ns.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="256.842" y="30" width="389.474" height="220" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="256.842" cy="30" r="11" fill="#ffd166"/><text x="256.842" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
