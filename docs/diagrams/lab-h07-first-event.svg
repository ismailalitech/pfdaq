<rect x="0" y="256" width="900" height="84" fill="#12171d"/>
<circle cx="24" cy="284" r="13" fill="#ffd166"/><text x="24" y="289" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="282" font-size="15" font-weight="bold" fill="#e6ecf1">The ACK write</text>
<text x="48" y="302" font-size="13" fill="#9aa8b5">It arrives while lat_cnt is 11, so lat_now = lat_cnt + 1 = 12: the cycle of the ACK itself is counted.</text>
</g>
<g class="co" style="animation-delay:10.20s"><rect x="685.263" y="30" width="194.737" height="220" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
