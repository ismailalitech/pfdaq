<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 285" width="900" height="285" role="img" aria-labelledby="t d">
<title id="t">The order in which arm_rt writes one real-time descriptor: byte count and destination first, then a fence, then the configuration word 0xD that marks it valid, then a fence, then the descriptor's address into stream address register k (0x460, 0x464, 0x468 or 0x46C) and a last fence. Only after that does the loop return the credit. Returning the credit before the re-arm lets the fabric send into a descriptor the DMA still believes is complete.</title><desc id="d">The order in which arm_rt writes one real-time descriptor: byte count and destination first, then a fence, then the configuration word 0xD that marks it valid, then a fence, then the descriptor's address into stream address register k (0x460, 0x464, 0x468 or 0x46C) and a last fence. Only after that does the loop return the credit. Returning the credit before the re-arm lets the fabric send into a descriptor the DMA still believes is complete.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 11.10s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 11.10s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}11.71%{opacity:1}14.71%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="285" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M200,85 L250,85" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M200,85 L250,85" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="203.9" y="63" width="42.2" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="225" y="75.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">fence</text>
</g>
<g id="e1">
<path d="M430,85 L480,85" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M430,85 L480,85" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="433.9" y="63" width="42.2" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="455" y="75.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">fence</text>
</g>
<g id="e2">
<path d="M660,85 L710,85" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M660,85 L710,85" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="663.9" y="63" width="42.2" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="685" y="75.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">fence</text>
</g>
<g id="f1">
<rect x="20" y="40" width="180" height="90" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="110" y="72.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Fields first</text>
<text x="110" y="89.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">desc[1] = byte count</text>
<text x="110" y="106.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">desc[2] = destination</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="39" width="182" height="92" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="f2">
<rect x="250" y="40" width="180" height="90" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="340" y="72.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Then valid</text>
<text x="340" y="89.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">desc[0] = DESC_CFG_ARMED</text>
<text x="340" y="106.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">value 0xD</text>
<rect class="hl" style="animation-delay:2.60s" x="249" y="39" width="182" height="92" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="f3">
<rect x="480" y="40" width="180" height="90" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="570" y="72.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Then tell the DMA</text>
<text x="570" y="89.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">dma[DMA_STREAM0 / 4 + k]</text>
<text x="570" y="106.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">address of descriptor k</text>
<rect class="hl" style="animation-delay:5.20s" x="479" y="39" width="182" height="92" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="f4">
<rect x="710" y="40" width="170" height="90" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="795" y="72.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Last: the credit</text>
<text x="795" y="89.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">SRC_CREDIT = 1</text>
<text x="795" y="106.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">in the run_realtime loop</text>
<rect class="hl" style="animation-delay:7.80s" x="709" y="39" width="172" height="92" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="175" text-anchor="start" font-size="12" fill="#9aa8b5">Descriptor k sits at DESC_OFF + k * 0x40 (RT_DESC_STRIDE), 8-byte aligned. fence_io() is __sync_synchronize().</text>
<text x="20" y="200" text-anchor="start" font-size="12" fill="#9aa8b5">The valid word must not become visible before the fields it vouches for, and the DMA must not learn the address earlier.</text>
<text x="20" y="235" text-anchor="start" font-size="12" fill="#ef6f6c">A credit before the re-arm can let the fabric send into a descriptor the DMA still believes is complete (case study K04).</text>
</svg>
