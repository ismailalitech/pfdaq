<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img" aria-labelledby="t d">
<title id="t">p07_run.sh, recorded lines: which CPU takes the interrupt (columns are CPU0/CPU1/CPU2)</title><desc id="d">Three recorded excerpts of the harness. By default the fabric interrupt count grows on CPU0 only (200,000 interrupts in one run). After writing mask 2 to the interrupt's smp_affinity it grows on CPU1 only, and after mask 4 on CPU2 only.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 12.80s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 12.80s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}28.12%{opacity:1}31.12%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="940" height="300" rx="12" fill="#12171d"/>
<rect x="0" y="0" width="940" height="174" fill="#0d1117"/>
<rect x="0" y="0" width="940" height="34" fill="#1b222c"/>
<circle cx="20" cy="17" r="6" fill="#ef6f6c"/>
<circle cx="38" cy="17" r="6" fill="#e6c04f"/>
<circle cx="56" cy="17" r="6" fill="#5fbf84"/>
<text x="470" y="22" text-anchor="middle" font-size="12" fill="#9aa8b5">p07_run.sh, recorded lines: which CPU takes the interrupt (columns are CPU0/CPU1/CPU2)</text>
<text x="24" y="58" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84"># </tspan><tspan fill="#e6ecf1">irq-counts u1_default_idle run 1 before(cpu0/1/2) 5999253/1003997/4992945 after 6199252/1003997/4992945</tspan></text>
<text x="24" y="78" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84"># </tspan><tspan fill="#e6ecf1">irq 80 affinity 2, effective 2</tspan></text>
<text x="24" y="98" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84"># </tspan><tspan fill="#e6ecf1">irq-counts u5_fifo80_cpu1_irq_cpu1 run 1 before(cpu0/1/2) 9999243/1003997/4992945 after 9999243/1203997/4992945</tspan></text>
<text x="24" y="118" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84"># </tspan><tspan fill="#e6ecf1">irq 80 affinity 4, effective 4</tspan></text>
<text x="24" y="138" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84"># </tspan><tspan fill="#e6ecf1">irq-counts u6_fifo80_cpu2_irq_cpu2 run 1 before(cpu0/1/2) 9999243/2003997/4992945 after 9999243/2003997/5192945</tspan></text>
<rect x="0" y="174" width="940" height="126" fill="#12171d"/>
<g class="co" style="animation-delay:0.00s"><rect x="8" y="43" width="924" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="45" r="11" fill="#ffd166"/><text x="8" y="49" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="174" width="940" height="126" fill="#12171d"/>
<circle cx="24" cy="200" r="13" fill="#ffd166"/><text x="24" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="198" font-size="15" font-weight="bold" fill="#e6ecf1">Default: CPU0</text>
<text x="48" y="218" font-size="13" fill="#9aa8b5">200,000 interrupts for 100,000 events (the double wake-up of I02), all on CPU0.</text>
</g>
<g class="co" style="animation-delay:3.60s"><rect x="8" y="63" width="924" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="65" r="11" fill="#ffd166"/><text x="8" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.60s">
<rect x="0" y="174" width="940" height="126" fill="#12171d"/>
<circle cx="24" cy="200" r="13" fill="#ffd166"/><text x="24" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="198" font-size="15" font-weight="bold" fill="#e6ecf1">Mask 2: CPU1</text>
<text x="48" y="218" font-size="13" fill="#9aa8b5">After writing 2 to smp_affinity the effective affinity is CPU1 and the counts grow there.</text>
</g>
<g class="co" style="animation-delay:7.20s"><rect x="8" y="103" width="924" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="105" r="11" fill="#ffd166"/><text x="8" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:7.20s">
<rect x="0" y="174" width="940" height="126" fill="#12171d"/>
<circle cx="24" cy="200" r="13" fill="#ffd166"/><text x="24" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="198" font-size="15" font-weight="bold" fill="#e6ecf1">Mask 4: CPU2</text>
<text x="48" y="218" font-size="13" fill="#9aa8b5">The same with mask 4: only CPU2 counts.</text>
</g>
</svg>
