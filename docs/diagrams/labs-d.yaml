# Figures for the labs of group D (Linux and the FPGA): I01, I02, I03, I05, I06, I07.
# Terminal figures copy lines from evidence/v0.5.1/board/ (suite-freertos.jsonl, device-tree-checks.txt,
# boot-uboot-linux.txt, boot-hss.txt, fabric-interrupts-run.txt). Long JSON lines are wrapped at field
# boundaries and fields that are not discussed are replaced by [...], as each alt text says.

# ---------------------------------------------------------------- I01
- id: lab-i01-register-path
  alt: "How a Linux program reaches the stream source registers: the device-tree node uio@40000f00 hands the block to the generic UIO driver, which maps the page at 0x4000_0000; pfdaq_cap finds the device by its name, maps the page, adds the offset 0xF00, checks the ID word 0x50464451 and then reads and writes the registers with 32-bit accesses over FIC3."
  width: 900
  height: 385
  nodes:
    dts:   {x: 20,  y: 40,  w: 230, h: 84, kind: sw,     title: "Device-tree node", sub: "uio@40000f00, generic-uio\nlinux,uio-name =\npfdaq_stream_src"}
    uio:   {x: 335, y: 40,  w: 230, h: 84, kind: mss,    title: "UIO driver", sub: "maps the page 0x4000_0000\nregion not requested\n/dev/uioN"}
    tool:  {x: 650, y: 40,  w: 230, h: 84, kind: hart,   title: "pfdaq_cap: open_uio", sub: "finds uioN by its name\nmmap of the page, then\n+ SRC_OFF (0xF00)"}
    store: {x: 650, y: 214, w: 230, h: 84, kind: sw,     title: "32-bit accesses", sub: "volatile uint32_t *\nnever byte stores"}
    src:   {x: 335, y: 214, w: 230, h: 84, kind: fabric, title: "Stream source", sub: "0x4000_0F00, APB over FIC3\n256 bytes"}
    id:    {x: 20,  y: 214, w: 230, h: 84, kind: good,   title: "ID check first", sub: "src[SRC_ID / 4] must be\n0x50464451 (PFDQ)"}
  edges:
    - {id: e0, from: dts.right,   to: uio.left,   label: "generic-uio"}
    - {id: e1, from: uio.right,   to: tool.left,  label: "/dev/uioN"}
    - {id: e2, from: tool.bottom, to: store.top,  label: "register pointer"}
    - {id: e3, from: store.left,  to: src.right,  label: "load, store"}
    - {id: e4, from: src.left,    to: id.right,   label: "ID word"}
  steps: [dts, e0, uio, e1, tool, e2, store, e3, src, e4, id]
  notes:
    - {x: 20, y: 338, text: "Byte stores to these registers are decoded as whole-register writes (case study K02), so every access is 32 bits."}
    - {x: 20, y: 361, text: "A wrong ID means a wrong device, a wrong offset or an unprogrammed fabric: the tool stops before it does anything else."}

- id: lab-i01-shared-page
  alt: "Why /dev/mem was refused and UIO works: the page at 0x4000_0000 holds a PWM at 0x4000_0000, an I2C at 0x4000_0200 and a UART at 0x4000_0300, each claimed by a driver, plus the project's stream source at 0x4000_0F00. A kernel built with strict devmem refuses a /dev/mem mapping of a page whose range a driver has claimed. The UIO driver maps the page without requesting the region, so it does not collide with those claims."
  width: 900
  height: 345
  nodes:
    devmem:  {x: 20,  y: 90,  w: 200, h: 70, kind: plain,  title: "/dev/mem", sub: "map any physical address"}
    strict:  {x: 305, y: 90,  w: 250, h: 70, kind: bad,    title: "Strict devmem", sub: "CONFIG_STRICT_DEVMEM=y\nCONFIG_IO_STRICT_DEVMEM=y"}
    pwm:     {x: 640, y: 46,  w: 240, h: 46, kind: mem,    title: "0x4000_0000  PWM", sub: "claimed by a driver"}
    i2c:     {x: 640, y: 102, w: 240, h: 46, kind: mem,    title: "0x4000_0200  I2C", sub: "claimed by a driver"}
    uart:    {x: 640, y: 158, w: 240, h: 46, kind: mem,    title: "0x4000_0300  UART", sub: "claimed by a driver"}
    pfdaq:   {x: 640, y: 232, w: 240, h: 60, kind: fabric, title: "0x4000_0F00  pfdaq", sub: "stream source, latency unit"}
    uionode: {x: 20,  y: 232, w: 200, h: 60, kind: sw,     title: "UIO node", sub: "generic-uio, 0x40000f00"}
    uiodrv:  {x: 305, y: 232, w: 250, h: 60, kind: good,   title: "UIO driver", sub: "plain ioremap of the page\nthe region is not requested"}
  edges:
    - {id: e0, from: devmem.right,  to: strict.left,  label: "mmap"}
    - {id: e1, from: strict.right,  to: i2c.left,     label: "refuses", kind: bad}
    - {id: e2, from: uionode.right, to: uiodrv.left,  label: "binds"}
    - {id: e3, from: uiodrv.right,  to: pfdaq.left,   label: "maps"}
  steps: [devmem, e0, strict, e1, pwm, i2c, uart, uionode, e2, uiodrv, e3, pfdaq]
  notes:
    - {x: 640, y: 30, text: "The page at 0x4000_0000", size: 12, bold: true}
    - {x: 20, y: 322, text: "UIO maps whole pages: the tools map the page and add SRC_OFF 0xF00 themselves (the block sits at offset 0xF00 in it)."}

- id: lab-i01-uio-names
  type: terminal
  title: "board console, recorded (boot-uboot-linux and device-tree-checks)"
  alt: "Two recorded pieces of board output: the kernel command line that enables the generic UIO driver for device-tree nodes (the leading time stamp is cut), and the names of the three UIO devices, uio0 fpga_lsram, uio1 pfdaq_stream_src and uio2 dma-controller@60010000, which the tools look up by name."
  width: 940
  height: 250
  step: 3.4
  lines:
    - "Kernel command line: earlycon root=/dev/mmcblk0p3 rootwait uio_pdrv_genirq.of_id=generic-uio clk_ignore_unused"
    - "/sys/class/uio/uio0/name:fpga_lsram"
    - "/sys/class/uio/uio1/name:pfdaq_stream_src"
    - "/sys/class/uio/uio2/name:dma-controller@60010000"
  callouts:
    - {lines: [0], title: "The kernel is told to use the generic driver", text: "uio_pdrv_genirq.of_id=generic-uio is what makes compatible = \"generic-uio\" a binding."}
    - {lines: [2], title: "The device the tools look up", text: "pfdaq_stream_src is the linux,uio-name of the node; pfdaq_cap and pfdaq_lat search for it."}
    - {lines: [1, 3], title: "The number is not the identity", text: "It is uio1 here, but it depends on probe order. The DMA controller is a second UIO device, found by name too."}

# ---------------------------------------------------------------- I02
- id: lab-i02-uio-contract
  alt: "The UIO interrupt contract for one event: the fabric latency unit raises a level line, the PLIC delivers source 119, the kernel handler masks the line and wakes the reader, read() returns a 4-byte count, the program reads STATUS and writes ACK only if bit 0 is set, which drops the level, and then writes a 4-byte 1 so the kernel unmasks the line."
  width: 900
  height: 385
  nodes:
    fab:    {x: 20,  y: 30,  w: 170, h: 84, kind: fabric, title: "Latency unit", sub: "channel 0, level line\nF2M[1]"}
    plic:   {x: 253, y: 30,  w: 170, h: 84, kind: mss,    title: "PLIC", sub: "source 119"}
    kern:   {x: 486, y: 30,  w: 170, h: 84, kind: hart,   title: "Kernel handler", sub: "masks the line\nwakes the reader"}
    prog:   {x: 719, y: 30,  w: 161, h: 84, kind: sw,     title: "Your program", sub: "poll, then read():\na 4-byte count"}
    status: {x: 719, y: 200, w: 161, h: 84, kind: sw,     title: "Read STATUS", sub: "bit 0 = 1: pending\nbit 0 = 0: empty"}
    ack:    {x: 486, y: 200, w: 170, h: 84, kind: good,   title: "Write ACK", sub: "only if bit 0 was set\nthe level drops"}
    unmask: {x: 253, y: 200, w: 170, h: 84, kind: sw,     title: "write(1)", sub: "4 bytes: the kernel\nunmasks the line"}
  edges:
    - {id: e0, from: fab.right,    to: plic.left,    label: "level"}
    - {id: e1, from: plic.right,   to: kern.left,    label: "IRQ"}
    - {id: e2, from: kern.right,   to: prog.left,    label: "wakes"}
    - {id: e3, from: prog.bottom,  to: status.top}
    - {id: e4, from: status.left,  to: ack.right}
    - {id: e5, from: ack.left,     to: unmask.right}
    - {id: e6, from: ack.bottom,   to: fab.bottom, bulge: 40, dashed: true, kind: fabric, label: "the level goes low"}
    - {id: e7, from: unmask.top,   to: kern.bottom, dashed: true, kind: mss, label: "unmask"}
  steps: [fab, e0, plic, e1, kern, e2, prog, e3, status, e4, ack, e6, e5, unmask, e7]
  notes:
    - {x: 20, y: 358, text: "The kernel cannot do the first half of the acknowledge: it does not know which register of an arbitrary device drops the interrupt."}

- id: lab-i02-double-wakeup
  alt: "One event wakes the program twice. After the first wake-up STATUS bit 0 is set, so the program writes ACK and counts an ack; it then writes 1 to unmask the line. A second wake-up follows with STATUS bit 0 clear: the program writes no ACK, counts an empty wake-up and writes 1 again."
  width: 900
  height: 290
  nodes:
    ev:   {x: 20,  y: 40, w: 150, h: 90, kind: fabric, title: "One event", sub: "the fabric raises\nthe level"}
    w1:   {x: 202, y: 40, w: 150, h: 90, kind: good,   title: "Wake-up 1", sub: "STATUS bit 0 = 1\nwrite ACK\nacks + 1"}
    um1:  {x: 384, y: 40, w: 150, h: 90, kind: sw,     title: "write(1)", sub: "the line is\nunmasked"}
    w2:   {x: 566, y: 40, w: 150, h: 90, kind: bad,    title: "Wake-up 2", sub: "STATUS bit 0 = 0\nno ACK\nempty_wakeups + 1"}
    um2:  {x: 748, y: 40, w: 132, h: 90, kind: sw,     title: "write(1)", sub: "unmask again"}
  edges:
    - {id: e0, from: ev.right,  to: w1.left}
    - {id: e1, from: w1.right,  to: um1.left}
    - {id: e2, from: um1.right, to: w2.left}
    - {id: e3, from: w2.right,  to: um2.left}
  steps: [ev, e0, w1, e1, um1, e2, w2, e3, um2]
  notes:
    - {x: 20, y: 170, text: "Recorded explanation: the interrupt controller latches the still-high level again when the kernel handler completes,"}
    - {x: 20, y: 190, text: "and delivers it once the line is unmasked, although the program has acknowledged by then. The PLIC was not traced."}
    - {x: 20, y: 225, text: "Checking STATUS keeps the program correct whatever the cause: ACK is never written with nothing pending (spurious 0).", kind: good}
    - {x: 20, y: 262, text: "Without the check, the second wake-up of every event would be a write to ACK with nothing pending."}

- id: lab-i02-wakeup-count
  type: terminal
  title: "board console, recorded (fabric-interrupts-run)"
  alt: "A recorded run of pfdaq_lat on channel 0 with 100,000 events: acks equal events, empty_wakeups is 99,998, spurious is 0; afterwards the kernel's interrupt counter for PLIC source 119 and the UIO event counter of pfdaq_stream_src both read 199,999. The JSON line is wrapped for display and its histogram is cut to [...]."
  width: 900
  height: 300
  step: 3.4
  lines:
    - "$ pfdaq_lat -c 0 -p 500 -n 100000"
    - '{"pass": true, "channel": 0, "context": "linux-uio", "period_us": 500, "jitter_mask": 1023, "rt_prio": 0,'
    - ' "events": 100000, "acks": 100000, "overrun": 0, "spurious": 0, "empty_wakeups": 99998, "timeouts": 0,'
    - ' "elapsed_s": 51.017, "latency_us": {"min": 45.96, "mean": 79.72, "max": 208.80, "p50_le": 81.90,'
    - ' "p90_le": 122.86, "p99_le": 122.86, "p999_le": 122.86}, "resolution_ns": 20, "histogram_us": [...]}'
    - " 80:     199999          0          0 SiFive PLIC 119 Edge      pfdaq_stream_src"
    - "pfdaq_stream_src 199999"
  callouts:
    - {lines: [0], title: "100,000 events, one per 500 us", text: "Channel 0 of the latency unit, answered from a user program through UIO."}
    - {lines: [2, 2], title: "Every event answered, nearly every one woken twice", text: "acks equals events; empty_wakeups is 99,998; spurious is 0 thanks to the STATUS check."}
    - {lines: [3, 3], title: "The cost is time, not correctness", text: "Latency measured by the fabric: mean 79.72 us, max 208.80 us in this run."}
    - {lines: [5, 6], title: "The kernel saw about two per event", text: "PLIC source 119 and the UIO event counter both read 199,999 after the run."}

# ---------------------------------------------------------------- I03
- id: lab-i03-handler-modes
  alt: "Two handler modes of the project's UIO driver for the same interrupt. With kernel_ack on, the kernel handler reads STATUS, writes ACK itself and returns IRQ_HANDLED, so the line is already low; the UIO core counts the event, wakes the reader, and the program only reads statistics. With kernel_ack off, the handler masks the line and the user program reads STATUS, writes ACK and writes 1 to unmask."
  width: 900
  height: 385
  nodes:
    i1:  {x: 20,  y: 50,  w: 180, h: 84, kind: fabric, title: "Interrupt", sub: "latency channel 0\nPLIC source 119"}
    h1:  {x: 250, y: 50,  w: 180, h: 84, kind: hart,   title: "Kernel handler", sub: "kernel_ack = Y (default)\nreads STATUS, writes ACK"}
    c1:  {x: 480, y: 50,  w: 180, h: 84, kind: mss,    title: "UIO core", sub: "IRQ_HANDLED: counts the\nevent, wakes readers"}
    p1:  {x: 710, y: 50,  w: 170, h: 84, kind: good,   title: "pfdaq_lat -k", sub: "only reads statistics\nempty_wakeups = 0"}
    i2:  {x: 20,  y: 220, w: 180, h: 84, kind: fabric, title: "Interrupt", sub: "latency channel 0\nPLIC source 119"}
    h2:  {x: 250, y: 220, w: 180, h: 84, kind: hart,   title: "Kernel handler", sub: "kernel_ack = N\nmasks the line, once"}
    c2:  {x: 480, y: 220, w: 180, h: 84, kind: mss,    title: "UIO core", sub: "IRQ_HANDLED: counts the\nevent, wakes readers"}
    p2:  {x: 710, y: 220, w: 170, h: 84, kind: sw,     title: "Your program", sub: "STATUS, ACK, then\nwrite(1) to unmask"}
  edges:
    - {id: a0, from: i1.right, to: h1.left}
    - {id: a1, from: h1.right, to: c1.left}
    - {id: a2, from: c1.right, to: p1.left}
    - {id: b0, from: i2.right, to: h2.left}
    - {id: b1, from: h2.right, to: c2.left}
    - {id: b2, from: c2.right, to: p2.left}
    - {id: b3, from: p2.bottom, to: h2.bottom, bulge: 36, dashed: true, kind: mss, label: "irqcontrol: unmask"}
  steps: [i1, a0, h1, a1, c1, a2, p1, i2, b0, h2, b1, c2, b2, p2, b3]
  notes:
    - {x: 20, y: 30, text: "The handler acknowledges (the project's measurement mode)", size: 12, bold: true, kind: good}
    - {x: 20, y: 200, text: "Generic behaviour (kernel_ack = N)", size: 12, bold: true}
    - {x: 20, y: 365, text: "The same device, interrupt and tool: only the place where ACK is written differs."}

- id: lab-i03-bind-steps
  alt: "Switching a device from the generic UIO driver to pfdaq_uio: load the module with modprobe, unbind 40000f00.uio from uio_pdrv_genirq, write pfdaq_uio into driver_override of the device, bind it to pfdaq_uio, and run pfdaq_lat -k, which refuses to run unless the pfdaq_uio driver is bound and kernel_ack reads Y."
  width: 900
  height: 250
  nodes:
    mod:  {x: 20,  y: 40, w: 150, h: 84, kind: sw,    title: "modprobe", sub: "pfdaq_uio\nloads the module"}
    unb:  {x: 202, y: 40, w: 150, h: 84, kind: plain, title: "1 unbind", sub: "40000f00.uio from\nuio_pdrv_genirq"}
    ovr:  {x: 384, y: 40, w: 150, h: 84, kind: plain, title: "2 override", sub: "driver_override\n= pfdaq_uio"}
    bnd:  {x: 566, y: 40, w: 150, h: 84, kind: hart,  title: "3 bind", sub: "40000f00.uio to the\npfdaq_uio driver"}
    chk:  {x: 748, y: 40, w: 132, h: 84, kind: good,  title: "pfdaq_lat -k", sub: "checks the driver\nand kernel_ack = Y"}
  edges:
    - {id: e0, from: mod.right, to: unb.left}
    - {id: e1, from: unb.right, to: ovr.left}
    - {id: e2, from: ovr.right, to: bnd.left}
    - {id: e3, from: bnd.right, to: chk.left}
  steps: [mod, e0, unb, e1, ovr, e2, bnd, e3, chk]
  notes:
    - {x: 20, y: 165, text: "Afterwards the reverse: name uio_pdrv_genirq in driver_override, bind it back, then clear the override."}
    - {x: 20, y: 188, text: "Until the driver is bound, kernel_acks does not move: the generic driver still owns the device."}
    - {x: 20, y: 211, text: "It is not bound by default: after every boot the generic driver owns the device."}

- id: lab-i03-two-handlers
  type: terminal
  title: "board console, recorded (suite-freertos raw record)"
  alt: "Two recorded runs of pfdaq_lat on latency channel 0, 100,000 events each, idle: the generic user-space path (context linux-uio) and the in-kernel acknowledge (context linux-kernel-isr). Fields not discussed are replaced by [...]; the user-space run has 99,967 empty wake-ups and a mean latency of 78.31 microseconds, the kernel handler 0 empty wake-ups and a mean of 4.41 microseconds, and both have a maximum above one millisecond."
  width: 900
  height: 340
  step: 3.4
  lines:
    - "$ pfdaq_lat -c 0 -p 500 -n 100000"
    - '{"pass": false, "channel": 0, "context": "linux-uio", "period_us": 500, [...]'
    - ' "events": 100000, "acks": 100000, "overrun": 89, "spurious": 0, "empty_wakeups": 99967, [...]'
    - ' "latency_us": {"min": 4.18, "mean": 78.31, "max": 5130.60, "p50_le": 81.90, "p90_le": 122.86, [...]'
    - "$ pfdaq_lat -k -p 200 -n 100000"
    - '{"pass": false, "channel": 0, "context": "linux-kernel-isr", "period_us": 200, [...]'
    - ' "events": 100000, "acks": 100000, "overrun": 6, "spurious": 0, "empty_wakeups": 0, [...]'
    - ' "latency_us": {"min": 1.36, "mean": 4.41, "max": 1298.18, "p50_le": 5.10, "p90_le": 5.10, [...]'
  callouts:
    - {lines: [1, 1], title: "Which handler answered", text: "context linux-uio: the program acknowledges. In the second run, linux-kernel-isr: the kernel does."}
    - {lines: [2, 2], title: "The second wake-up is gone", text: "empty_wakeups 99,967 in user space; 0 with the kernel handler, where the line is already low."}
    - {lines: [3, 3], title: "About 18 times faster on average", text: "Mean 78.31 us in user space; the kernel handler's mean is 4.41 us (last line)."}
    - {lines: [7, 7], title: "The worst case is not small", text: "Max 1298.18 us with the kernel handler. The cause of such stalls was not investigated."}
    - {lines: [5, 5], title: "pass is false in both rows", text: "The tool's pass needs overrun 0; both runs had some (89 and 6). They are measurements."}

# ---------------------------------------------------------------- I05
- id: lab-i05-windows-and-regions
  type: terminal
  title: "board console, recorded (boot-hss and device-tree-checks)"
  alt: "Recorded boot output: the boot monitor's segment table, shortened to the cached window at 0x8000_0000, the non-cached window at 0xC000_0000 and the write-combining window at 0xD000_0000, all mapping physical DDR 0x00000000; then the kernel's three reserved 32 MiB regions at 0x88000000, 0xC8000000 and 0xD8000000, and u-dma-buf attaching to each. Time stamps are cut, and the three higher windows of the table are left out."
  width: 900
  height: 370
  step: 3.4
  lines:
    - "Segment Configuration:"
    - "        Cached: SEG0_0: offset 0x0080000000, physical DDR 0x00000000"
    - "    Non-cached: SEG1_2: offset 0x00c0000000, physical DDR 0x00000000"
    - "Non-cached WCB: SEG1_4: offset 0x00d0000000, physical DDR 0x00000000"
    - "OF: reserved mem: 0x0000000088000000..0x0000000089ffffff (32768 KiB) nomap non-reusable buffer@88000000"
    - "OF: reserved mem: 0x00000000c8000000..0x00000000c9ffffff (32768 KiB) nomap non-reusable buffer@c8000000"
    - "OF: reserved mem: 0x00000000d8000000..0x00000000d9ffffff (32768 KiB) nomap non-reusable buffer@d8000000"
    - "u-dma-buf udmabuf0: assigned reserved memory node buffer@88000000"
    - "u-dma-buf udmabuf1: assigned reserved memory node buffer@c8000000"
    - "u-dma-buf udmabuf2: assigned reserved memory node buffer@d8000000"
  callouts:
    - {lines: [1, 3], title: "Three windows onto one DDR", text: "Offsets 0x8000_0000, 0xC000_0000 and 0xD000_0000 all map physical DDR 0x00000000."}
    - {lines: [4, 6], title: "One 32 MiB region per window", text: "At 0x0800_0000 in each window, marked nomap: Linux leaves the pages for devices."}
    - {lines: [7, 9], title: "u-dma-buf turns each into a device", text: "The driver attaches to each reserved node; user space maps it through /dev/udmabuf-ddr-*."}

- id: lab-i05-two-addresses
  alt: "The two addresses of one buffer: pfdaq_cap maps /dev/udmabuf-ddr-nc0 and writes the descriptor through that virtual mapping, but the descriptor and the DMA's stream address register hold physical addresses, ddr_phys plus an offset, read from the device's phys_addr attribute. The DMA controller fetches the descriptor and writes the burst into the buffer by physical address, and the program copies the burst out through its virtual mapping."
  width: 900
  height: 345
  nodes:
    prog: {x: 20,  y: 70,  w: 250, h: 90, kind: hart,   title: "pfdaq_cap", sub: "ddr = mmap(udmabuf-ddr-nc0)\nddr_phys = sysfs phys_addr\nvirtual and physical differ"}
    desc: {x: 355, y: 70,  w: 250, h: 90, kind: mem,    title: "Descriptor", sub: "at DESC_OFF 0x0\ndesc[2] = ddr_phys + dest_off\nthe physical destination"}
    buf:  {x: 690, y: 70,  w: 190, h: 90, kind: mem,    title: "Burst buffer", sub: "at BUF_OFF 0x1000\npage-aligned\nnon-cached region"}
    dma:  {x: 355, y: 235, w: 250, h: 84, kind: fabric, title: "DMA controller", sub: "STREAM_0_ADDR_REG (0x460)\n= ddr_phys + DESC_OFF"}
  edges:
    - {id: e0, from: prog.right,  to: desc.left,   label: "virtual"}
    - {id: e1, from: prog.bottom, to: dma.left,    label: "physical"}
    - {id: e2, from: dma.top,     to: desc.bottom, label: "reads the descriptor"}
    - {id: e3, from: dma.right,   to: buf.bottom,  label: "writes the burst"}
    - {id: e4, from: buf.top,     to: prog.top, bulge: 36, dashed: true, kind: hart, label: "copy out through the virtual mapping"}
  steps: [prog, e0, desc, e1, dma, e2, e3, buf, e4]

- id: lab-i05-layout
  alt: "Layout of the 32 MiB non-cached region: the stream descriptor at offset 0 (four descriptors 0x40 bytes apart in real-time mode), the first burst buffer at 0x1000, the second burst buffer after the first rounded up to 4 KiB plus another page, and the scratch area of the shared-memory test at 0x1F0_0000."
  width: 900
  height: 360
  nodes:
    desc: {x: 20, y: 40,  w: 340, h: 56, kind: mem,   title: "0x0000  Descriptors", sub: "DESC_OFF; real-time: four, 0x40 apart"}
    b0:   {x: 20, y: 106, w: 340, h: 56, kind: mem,   title: "0x1000  Burst buffer 0", sub: "BUF_OFF, page-aligned"}
    b1:   {x: 20, y: 172, w: 340, h: 56, kind: mem,   title: "Burst buffer 1", sub: "after buffer 0, rounded to 4 KiB + a page"}
    free: {x: 20, y: 238, w: 340, h: 40, kind: plain, title: "the rest of the region"}
    shm:  {x: 20, y: 288, w: 340, h: 56, kind: sw,    title: "0x1F0_0000  shared-memory test", sub: "away from the capture buffers"}
  steps: [desc, b0, b1, free, shm]
  notes:
    - {x: 400, y: 62,  text: "Burst mode uses one descriptor; real-time mode four,", size: 12}
    - {x: 400, y: 80,  text: "each announced in its own stream address register.", size: 12}
    - {x: 400, y: 128, text: "Before each burst the first 64 bytes of the buffer are set", size: 12}
    - {x: 400, y: 146, text: "to 0xEE: stale data is then recognisable.", size: 12}
    - {x: 400, y: 194, text: "A burst is at most 8 MiB (MAX_BURST); the tool checks", size: 12}
    - {x: 400, y: 212, text: "that two bursts fit the 32 MiB region.", size: 12}
    - {x: 400, y: 310, text: "The cached test uses offset 0x10_0000 of its own region.", size: 12}

# ---------------------------------------------------------------- I06
- id: lab-i06-frame-checks
  alt: "A frame of 32-bit words and the check that catches each kind of damage: word 0 (0xA55A in the top half, the payload length below) is checked for bad_magic, word 1 the sequence number for bad_seq, the timestamp in word 2 is not compared, the payload words are recomputed by a model of the fabric and checked for bad_payload, and the last word, a CRC-32 over all earlier words, is checked for bad_crc."
  width: 900
  height: 395
  nodes:
    w0:  {x: 20,  y: 40, w: 200, h: 70, kind: fabric, title: "Word 0", sub: "0xA55A0000 | payload_words"}
    w1:  {x: 230, y: 40, w: 150, h: 70, kind: fabric, title: "Word 1", sub: "sequence number"}
    w2:  {x: 390, y: 40, w: 130, h: 70, kind: plain,  title: "Word 2", sub: "timestamp"}
    pl:  {x: 530, y: 40, w: 170, h: 70, kind: fabric, title: "Words 3 to N+2", sub: "payload"}
    crc: {x: 710, y: 40, w: 170, h: 70, kind: fabric, title: "Word N+3", sub: "CRC-32 of words 0..N+2"}
    c0:  {x: 20,  y: 190, w: 200, h: 80, kind: good,  title: "bad_magic", sub: "counted, frame skipped\nseq and model not advanced"}
    c1:  {x: 230, y: 190, w: 150, h: 80, kind: good,  title: "bad_seq", sub: "real-time mode:\ncounted as seq_gap"}
    c3:  {x: 530, y: 190, w: 170, h: 80, kind: good,  title: "bad_payload", sub: "model recomputes it:\ncounter, PRBS or FIR"}
    c4:  {x: 710, y: 190, w: 170, h: 80, kind: good,  title: "bad_crc", sub: "crc32_words() differs\nfrom the last word"}
  edges:
    - {id: e0, from: w0.bottom,  to: c0.top}
    - {id: e1, from: w1.bottom,  to: c1.top}
    - {id: e3, from: pl.bottom,  to: c3.top}
    - {id: e4, from: crc.bottom, to: c4.top}
  steps: [w0, e0, c0, w1, e1, c1, pl, e3, c3, crc, e4, c4]
  notes:
    - {x: 410, y: 160, text: "not compared", size: 12}
    - {x: 20, y: 310, text: "A frame is payload + 4 words long. The CRC equals the standard zlib.crc32 of the raw bytes."}
    - {x: 20, y: 335, text: "A flipped payload bit is caught twice (bad_payload and bad_crc): the fabric's CRC covers the intended payload."}
    - {x: 20, y: 360, text: "The check recomputes what the hardware should have produced; it does not compare against a stored copy."}

- id: lab-i06-fault-counts
  type: terminal
  title: "board console, recorded (suite-freertos raw record)"
  alt: "Three recorded fault-injection runs of pfdaq_cap with the counter payload, 20 bursts of 1,024 frames each. Fields not discussed are replaced by [...]. A CRC fault injected four times gives bad_crc 4 and nothing else; a sequence fault injected five times gives bad_seq 5; a payload fault injected twice gives bad_payload 2 and bad_crc 2."
  width: 900
  height: 340
  step: 3.4
  lines:
    - "$ pfdaq_cap -r -m counter -w 252 -f 1024 -n 20 -F crc -i 7 -e 5"
    - '{"pass": true, "bursts": 20, [...]'
    - ' "bad_magic": 0, "bad_seq": 0, "bad_payload": 0, "bad_crc": 4, "faults_injected": 4, [...]'
    - "$ pfdaq_cap -r -m counter -w 252 -f 1024 -n 20 -F seq -i 0 -e 4"
    - '{"pass": true, "bursts": 20, [...]'
    - ' "bad_magic": 0, "bad_seq": 5, "bad_payload": 0, "bad_crc": 0, "faults_injected": 5, [...]'
    - "$ pfdaq_cap -r -m counter -w 252 -f 1024 -n 20 -F payload -i 1023 -e 10"
    - '{"pass": true, "bursts": 20, [...]'
    - ' "bad_magic": 0, "bad_seq": 0, "bad_payload": 2, "bad_crc": 2, "faults_injected": 2, [...]'
  callouts:
    - {lines: [0, 2], title: "A corrupted CRC", text: "Every fifth burst: 4 faults injected, 4 bad_crc, and no other counter moves."}
    - {lines: [3, 5], title: "A skipped sequence number", text: "Every fourth burst: 5 injected, 5 bad_seq, payload and CRC still correct."}
    - {lines: [6, 8], title: "A flipped payload bit", text: "Every tenth burst: 2 injected, 2 bad_payload and 2 bad_crc: the CRC covers the intended data."}
    - {lines: [1, 1], title: "pass means: counters equal what was injected", text: "The tool expects exactly these counts; pass is true only when they match."}

- id: lab-i06-where-the-speed-goes
  type: terminal
  title: "board console, recorded (suite-freertos raw record)"
  alt: "Two recorded burst runs of pfdaq_cap, 32 bursts of 1 MiB: the counter payload reaches 29.60 MB/s end to end with a copy rate of 70.5 MB/s and a verify rate of 55.4 MB/s, the FIR payload only 8.70 MB/s because its verify rate is 10.2 MB/s. In the counter run the shortest start-to-interrupt time is 1.218 ms and the mean 34.325 ms. Fields not discussed are replaced by [...]."
  width: 960
  height: 330
  step: 3.4
  lines:
    - "$ pfdaq_cap -r -m counter -w 252 -f 1024 -n 32"
    - '{"pass": true, "bursts": 32, "frames": 32768, "bytes": 33554432, "elapsed_s": 1.133499,'
    - ' "mb_per_s_end_to_end": 29.60, "serial": 0, "start_to_irq_s": {"min": 0.001218, "mean": 0.034325, "max": 0.039303},'
    - ' "copy_mb_per_s": 70.5, "verify_mb_per_s": 55.4, "bad_magic": 0, "bad_seq": 0, "bad_payload": 0, "bad_crc": 0, [...]'
    - "$ pfdaq_cap -r -m fir -S 333 -w 252 -f 1024 -n 32"
    - '{"pass": true, "bursts": 32, "frames": 32768, "bytes": 33554432, "elapsed_s": 3.857602,'
    - ' "mb_per_s_end_to_end": 8.70, "serial": 0, "start_to_irq_s": {"min": 0.001256, "mean": 0.116828, "max": 0.125036},'
    - ' "copy_mb_per_s": 66.8, "verify_mb_per_s": 10.2, "bad_magic": 0, "bad_seq": 0, "bad_payload": 0, "bad_crc": 0, [...]'
  callouts:
    - {lines: [1, 1], title: "32 bursts of 1 MiB, no errors", text: "33,554,432 bytes verified word by word; every error counter is 0."}
    - {lines: [2, 2], title: "The fabric is not the limit", text: "Shortest start_to_irq 1.218 ms (first burst, nothing to verify first); the mean is 34.3 ms."}
    - {lines: [3, 3], title: "Copy and verify run one after the other", text: "1/70.5 + 1/55.4 s per MB is 31.0 MB/s; the recorded end-to-end rate is 29.60 MB/s."}
    - {lines: [6, 7], title: "FIR: the model is the cost", text: "Same copy rate, but verify only 10.2 MB/s, so 8.70 MB/s end to end."}

# ---------------------------------------------------------------- I07
- id: lab-i07-credit-loop
  alt: "The real-time loop: the fabric source sends a frame only if it holds a credit; the DMA controller writes frame n into descriptor n modulo the number of descriptors, in one of four buffers, and its interrupt increments the UIO event count. The program then copies the buffer out, re-arms its descriptor, returns one credit to the source and only then verifies the copy."
  width: 900
  height: 400
  nodes:
    fab:    {x: 20,  y: 60,  w: 170, h: 84, kind: fabric, title: "Stream source", sub: "needs a credit to send\notherwise drops the slot"}
    dma:    {x: 250, y: 60,  w: 170, h: 84, kind: fabric, title: "DMA controller", sub: "frame n goes to\ndescriptor n % ndest"}
    bufs:   {x: 480, y: 60,  w: 170, h: 84, kind: mem,    title: "Four buffers", sub: "BUF_OFF + k * slot_sz\nnon-cached region"}
    uio:    {x: 710, y: 60,  w: 170, h: 84, kind: mss,    title: "DMA interrupt", sub: "UIO event count: how\nmany have completed"}
    copy:   {x: 710, y: 230, w: 170, h: 84, kind: hart,   title: "1 Copy out", sub: "memcpy of buffer k\nk = processed % ndest"}
    rearm:  {x: 480, y: 230, w: 170, h: 84, kind: hart,   title: "2 Re-arm", sub: "arm_rt(k, ...)\ndescriptor k valid again"}
    credit: {x: 250, y: 230, w: 170, h: 84, kind: good,   title: "3 Return a credit", sub: "SRC_CREDIT = 1\nonly after the re-arm"}
    verify: {x: 20,  y: 230, w: 170, h: 84, kind: sw,     title: "4 Verify", sub: "verify(copy, ...)\ngaps allowed"}
  edges:
    - {id: e0, from: fab.right,   to: dma.left,   label: "frame"}
    - {id: e1, from: dma.right,   to: bufs.left,  label: "writes"}
    - {id: e2, from: dma.top,     to: uio.top, bulge: 34, dashed: true, kind: mss, label: "completion interrupt"}
    - {id: e3, from: uio.bottom,  to: copy.top,   label: "read()"}
    - {id: e4, from: copy.left,   to: rearm.right}
    - {id: e5, from: rearm.left,  to: credit.right}
    - {id: e6, from: credit.left, to: verify.right}
    - {id: e7, from: credit.top,  to: fab.bottom, dashed: true, kind: fabric, label: "credit + 1"}
  steps: [fab, e0, dma, e1, bufs, e2, uio, e3, copy, e4, rearm, e5, credit, e7, e6, verify]
  notes:
    - {x: 20, y: 362, text: "Credits start as 0x80000000 | ndest: the fabric holds exactly as many credits as there are armed descriptors."}
    - {x: 20, y: 385, text: "A slow consumer shows up as a drop count in the fabric, not as corruption."}

- id: lab-i07-arm-order
  alt: "The order in which arm_rt writes one real-time descriptor: byte count and destination first, then a fence, then the configuration word 0xD that marks it valid, then a fence, then the descriptor's address into stream address register k (0x460, 0x464, 0x468 or 0x46C) and a last fence. Only after that does the loop return the credit. Returning the credit before the re-arm lets the fabric send into a descriptor the DMA still believes is complete."
  width: 900
  height: 285
  nodes:
    f1: {x: 20,  y: 40, w: 180, h: 90, kind: mem,    title: "Fields first", sub: "desc[1] = byte count\ndesc[2] = destination"}
    f2: {x: 250, y: 40, w: 180, h: 90, kind: mem,    title: "Then valid", sub: "desc[0] = DESC_CFG_ARMED\nvalue 0xD"}
    f3: {x: 480, y: 40, w: 180, h: 90, kind: fabric, title: "Then tell the DMA", sub: "dma[DMA_STREAM0 / 4 + k]\naddress of descriptor k"}
    f4: {x: 710, y: 40, w: 170, h: 90, kind: good,   title: "Last: the credit", sub: "SRC_CREDIT = 1\nin the run_realtime loop"}
  edges:
    - {id: e0, from: f1.right, to: f2.left, label: "fence"}
    - {id: e1, from: f2.right, to: f3.left, label: "fence"}
    - {id: e2, from: f3.right, to: f4.left, label: "fence"}
  steps: [f1, e0, f2, e1, f3, e2, f4]
  notes:
    - {x: 20, y: 175, text: "Descriptor k sits at DESC_OFF + k * 0x40 (RT_DESC_STRIDE), 8-byte aligned. fence_io() is __sync_synchronize()."}
    - {x: 20, y: 200, text: "The valid word must not become visible before the fields it vouches for, and the DMA must not learn the address earlier."}
    - {x: 20, y: 235, text: "A credit before the re-arm can let the fabric send into a descriptor the DMA still believes is complete (case study K04).", kind: bad}

- id: lab-i07-drop-rows
  type: terminal
  title: "board console, recorded (suite-freertos raw record)"
  alt: "Three recorded real-time runs of pfdaq_cap, 4,000 slots of 1 KiB frames. At a 1,000 microsecond slot with four descriptors nothing is dropped and the run passes. At a 50 microsecond slot with four descriptors 792 slots are dropped, 3,208 are sent, 3,205 verified and the run ends by timeout, so pass is false. With one descriptor at the same slot 2,007 are dropped, 1,993 sent and verified, and pass is true. Fields not discussed are replaced by [...]."
  width: 900
  height: 410
  step: 3.4
  lines:
    - "$ pfdaq_cap -m prbs -w 252 -T 125000 -n 4000 -d 4"
    - '{"pass": true, "mode": "realtime", "payload_mode": 1, "rate_cycles": 125000, "slot_us": 1000.000, [...]'
    - ' "destinations": 4, "slots": 4000, "sent": 4000, "dropped": 0, [...]'
    - ' "verified": 4000, "seq_gaps": 0, [...] "timed_out": 0}'
    - "$ pfdaq_cap -m prbs -w 252 -T 6250 -n 4000 -d 4"
    - '{"pass": false, "mode": "realtime", "payload_mode": 1, "rate_cycles": 6250, "slot_us": 50.000, [...]'
    - ' "destinations": 4, "slots": 4000, "sent": 3208, "dropped": 792, [...]'
    - ' "verified": 3205, "seq_gaps": 788, [...] "timed_out": 1}'
    - "$ pfdaq_cap -m counter -w 252 -T 6250 -n 4000 -d 1"
    - '{"pass": true, "mode": "realtime", "payload_mode": 0, "rate_cycles": 6250, "slot_us": 50.000, [...]'
    - ' "destinations": 1, "slots": 4000, "sent": 1993, "dropped": 2007, [...]'
    - ' "verified": 1993, "seq_gaps": 2006, [...] "timed_out": 0}'
  callouts:
    - {lines: [1, 3], title: "A slow slot: nothing is dropped", text: "4,000 sent, 0 dropped, 4,000 verified. Software keeps up with 1 ms slots."}
    - {lines: [6, 6], title: "A fast slot: sent + dropped = 4,000", text: "3,208 + 792 = 4,000, and seq_gaps (788) stays below the drops: the fabric's books balance."}
    - {lines: [5, 7], title: "Why this row says pass: false", text: "verified 3,205 is less than sent 3,208 and timed_out is 1; the tool requires verified = sent."}
    - {lines: [9, 11], title: "One descriptor drops more, and passes", text: "2,007 dropped against 792 with four (this run uses the counter payload); it ended without a timeout."}
