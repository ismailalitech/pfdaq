<text x="535" y="26" text-anchor="start" font-size="12" fill="#9aa8b5" font-weight="bold">Report path</text>
<text x="10" y="430" text-anchor="start" font-size="12" fill="#9aa8b5">Every box is a core or a memory: the three Linux cpus are separate processes; hart 4 is the safety supervisor.</text>
