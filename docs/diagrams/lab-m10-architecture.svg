<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d">
<title id="t">The four-core station. The fabric stream source and DMA deliver one frame per millisecond to the acquisition process on Linux cpu 0 (hart 1), which copies each frame into ring A in shared memory. The analysis process on cpu 1 (hart 2) verifies every frame and sends a heartbeat every 100 ms and the window features every 500 ms over RPMsg to the FreeRTOS supervisor on hart 4. If a limit, the deadline or the sequence check is violated, hart 4 writes the abort to the stream source and sends a notice back. The analysis process passes windows and events through ring B to the telemetry process on cpu 2 (hart 3), which prints the dashboard and takes operator commands, which travel back through ring C to the analysis process.</title><desc id="d">The four-core station. The fabric stream source and DMA deliver one frame per millisecond to the acquisition process on Linux cpu 0 (hart 1), which copies each frame into ring A in shared memory. The analysis process on cpu 1 (hart 2) verifies every frame and sends a heartbeat every 100 ms and the window features every 500 ms over RPMsg to the FreeRTOS supervisor on hart 4. If a limit, the deadline or the sequence check is violated, hart 4 writes the abort to the stream source and sends a notice back. The analysis process passes windows and events through ring B to the telemetry process on cpu 2 (hart 3), which prints the dashboard and takes operator commands, which travel back through ring C to the analysis process.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 34.50s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 34.50s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}3.77%{opacity:1}6.77%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
