<circle cx="24" cy="360" r="13" fill="#ffd166"/><text x="24" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="358" font-size="15" font-weight="bold" fill="#e6ecf1">Deadline as timeout</text>
<text x="48" y="378" font-size="13" fill="#9aa8b5">While armed, the receive call waits at most the deadline: the same mechanism as module P04.</text>
</g>
<g class="co" style="animation-delay:3.80s"><rect x="8" y="123" width="884" height="103" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="125" r="11" fill="#ffd166"/><text x="8" y="129" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.80s">
<rect x="0" y="334" width="900" height="78" fill="#12171d"/>
<circle cx="24" cy="360" r="13" fill="#ffd166"/><text x="24" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="358" font-size="15" font-weight="bold" fill="#e6ecf1">Silence means alarm</text>
<text x="48" y="378" font-size="13" fill="#9aa8b5">A timeout in ARMED runs st_on_timeout: the ALARM line, then the trip.</text>
</g>
<g class="co" style="animation-delay:7.60s"><rect x="8" y="223" width="884" height="3" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="225" r="11" fill="#ffd166"/><text x="8" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:7.60s">
<rect x="0" y="334" width="900" height="78" fill="#12171d"/>
<circle cx="24" cy="360" r="13" fill="#ffd166"/><text x="24" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="358" font-size="15" font-weight="bold" fill="#e6ecf1">One new branch</text>
<text x="48" y="378" font-size="13" fill="#9aa8b5">A 64-byte message goes to st_handle and never reaches the old code; 28-byte messages are untouched.</text>
</g>
