<rect width="900" height="412" rx="12" fill="#12171d"/>
<rect x="0" y="0" width="900" height="334" fill="#0d1117"/>
<rect x="0" y="0" width="900" height="34" fill="#1b222c"/>
<circle cx="20" cy="17" r="6" fill="#ef6f6c"/>
