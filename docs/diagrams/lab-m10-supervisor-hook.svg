<text x="450" y="22" text-anchor="middle" font-size="12" fill="#9aa8b5">pfdaq_supervisor.c: how the demo variant plugs into the supervisor loop</text>
<text x="24" y="58" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">        timeout = st_timeout(&amp;stn, timeout);</text>
<text x="24" y="78" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">        ret = sup_recv(rp, &amp;remote_addr, &amp;stm, &amp;len, timeout);</text>
<text x="24" y="98" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">        if (ret == RL_SUCCESS &amp;&amp; len &gt;= sizeof(msg))</text>
<text x="24" y="118" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">            memcpy(&amp;msg, &amp;stm, sizeof(msg));        /* first seven words: the production layout */</text>
<text x="24" y="138" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">            if (stn.state == ST_S_ARMED)</text>
<text x="24" y="158" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">            {</text>
<text x="24" y="178" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">                fabric_snapshot(&amp;fabric_frames, &amp;fabric_seq);</text>
<text x="24" y="198" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">                st_on_timeout(&amp;stn, fabric_seq, fabric_frames, now_ms());</text>
<text x="24" y="218" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">                continue;</text>
<text x="24" y="238" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">            /* 64-byte station message: the protection logic of pfdaq_station.h answers it */</text>
<text x="24" y="258" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">            fabric_snapshot(&amp;fabric_frames, &amp;fabric_seq);</text>
<text x="24" y="278" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">            st_handle(&amp;stn, &amp;stm, remote_addr, fabric_seq, fabric_frames, now_ms());</text>
<text x="24" y="298" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">            continue;</text>
<rect x="0" y="334" width="900" height="78" fill="#12171d"/>
