<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="t d">
<title id="t">Three address windows onto the same DDR: the cached window at 0x8000_0000 (64-bit 0x10_0000_0000), the non-cached window at 0xC000_0000 (0x14_0000_0000) and the non-cached write-combining window at 0xD000_0000 (0x18_0000_0000) all point at physical DDR address 0. The three vendor buffers sit at the same 0x0800_0000 offset in each window.</title><desc id="d">Three address windows onto the same DDR: the cached window at 0x8000_0000 (64-bit 0x10_0000_0000), the non-cached window at 0xC000_0000 (0x14_0000_0000) and the non-cached write-combining window at 0xD000_0000 (0x18_0000_0000) all point at physical DDR address 0. The three vendor buffers sit at the same 0x0800_0000 offset in each window.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 23.00s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 23.00s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}13.04%{opacity:1}16.04%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="430" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M360,88 L460,88 L460,107.2 L560,107.2" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.00s" d="M360,88 L460,88 L460,107.2 L560,107.2" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e1">
<path d="M360,208 L560,208" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.00s" d="M360,208 L560,208" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e2">
<path d="M360,328 L460,328 L460,308.8 L560,308.8" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:15.00s" d="M360,328 L460,328 L460,308.8 L560,308.8" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="c">
<rect x="20" y="40" width="340" height="96" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="190" y="67" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Cached window</text>
<text x="190" y="84" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">32-bit base 0x8000_0000</text>
<text x="190" y="101" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">64-bit base 0x10_0000_0000</text>
<text x="190" y="118" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">buffer udmabuf-ddr-c0 at 0x8800_0000</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="39" width="342" height="98" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="nc">
<rect x="20" y="160" width="340" height="96" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="190" y="187" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Non-cached window</text>
<text x="190" y="204" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">32-bit base 0xC000_0000</text>
<text x="190" y="221" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">64-bit base 0x14_0000_0000</text>
<text x="190" y="238" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">buffer udmabuf-ddr-nc0 at 0xC800_0000</text>
<rect class="hl" style="animation-delay:6.00s" x="19" y="159" width="342" height="98" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="wcb">
<rect x="20" y="280" width="340" height="96" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="190" y="307" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Non-cached WCB window</text>
<text x="190" y="324" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">32-bit base 0xD000_0000</text>
<text x="190" y="341" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">64-bit base 0x18_0000_0000</text>
<text x="190" y="358" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">buffer udmabuf-ddr-nc-wcb0 at 0xD800_0000</text>
<rect class="hl" style="animation-delay:12.00s" x="19" y="279" width="342" height="98" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ddr">
<rect x="560" y="40" width="320" height="336" rx="9" fill="#232c44" stroke="#8da6d4" stroke-width="1.5"/>
<text x="720" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Physical DDR</text>
<text x="720" y="153" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">all six windows start at</text>
<text x="720" y="170" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">physical DDR address 0</text>
<text x="720" y="187" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5"> </text>
<text x="720" y="204" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">physical byte N answers at</text>
<text x="720" y="221" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">0x8000_0000 + N cached</text>
<text x="720" y="238" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">0xC000_0000 + N non-cached</text>
<text x="720" y="255" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">0xD000_0000 + N write-combining</text>
<text x="720" y="272" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5"> </text>
<text x="720" y="289" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">each buffer is at offset 0x0800_0000</text>
<rect class="hl" style="animation-delay:18.00s" x="559" y="39" width="322" height="338" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="404" text-anchor="start" font-size="12" fill="#9aa8b5">Read from the boot monitor's segment table and the buffers' addresses; this project did not test the aliasing directly.</text>
</svg>
