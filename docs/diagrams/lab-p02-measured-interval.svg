<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
<title id="t">What the latency unit measures: it raises the interrupt line and starts counting 20 ns cycles, the line reaches the PLIC and then the responding hart, software claims the interrupt and writes ACK, and the write travels back through the MSS, FIC3 and the APB bus to the unit, which stops the count.</title><desc id="d">What the latency unit measures: it raises the interrupt line and starts counting 20 ns cycles, the line reaches the PLIC and then the responding hart, software claims the interrupt and writes ACK, and the write travels back through the MSS, FIC3 and the APB bus to the unit, which stops the count.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 11.10s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 11.10s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}11.71%{opacity:1}14.71%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="300" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M250,82 L340,82" fill="none" stroke="#8da6d4" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ar-mss)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M250,82 L340,82" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="248.14" y="60" width="93.72" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="295" y="72.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">IRQ line high</text>
</g>
<g id="e1">
<path d="M510,82 L600,82" fill="none" stroke="#8da6d4" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ar-mss)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M510,82 L600,82" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="514.58" y="60" width="80.84" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="555" y="72.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">to the hart</text>
</g>
<g id="e2">
<path d="M740,124 L740,164 L135,164 L135,124" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M740,124 L740,164 L135,164 L135,124" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="339.12" y="142" width="196.76" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="437.5" y="154.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">ACK write: MSS, FIC3, APB bus</text>
</g>
<g id="lat">
<rect x="20" y="40" width="230" height="84" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="135" y="69.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Latency unit</text>
<text x="135" y="86.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">starts counting when the</text>
<text x="135" y="103.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">line is high, stops on ACK</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="39" width="232" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="plic">
<rect x="340" y="40" width="170" height="84" rx="9" fill="#232c44" stroke="#8da6d4" stroke-width="1.5"/>
<text x="425" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">PLIC</text>
<text x="425" y="95" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">source 119 or 123</text>
<rect class="hl" style="animation-delay:2.60s" x="339" y="39" width="172" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="resp">
<rect x="600" y="40" width="280" height="84" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="740" y="69.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Responder</text>
<text x="740" y="86.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">trap, claim, find handler,</text>
<text x="740" y="103.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">then write ACK</text>
<rect class="hl" style="animation-delay:5.20s" x="599" y="39" width="282" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="214" text-anchor="start" font-size="12" fill="#9aa8b5">Counted: the way into the PLIC, entering the trap code, finding the handler, whatever the software does before ACK, the write.</text>
<text x="20" y="238" text-anchor="start" font-size="12" fill="#9aa8b5">Not counted: completing the interrupt in the PLIC, returning from the handler, work done after the ACK.</text>
<text x="20" y="262" text-anchor="start" font-size="12" fill="#9aa8b5">One count is one 50 MHz clock cycle: 20 ns.</text>
</svg>
