    title: Hardware and data paths
    height: 600
    bands:
      - {label: Processor subsystem (MSS), box: [10, 20, 980, 190]}
      - {label: FPGA fabric, box: [10, 250, 980, 150]}
      - {label: DDR4 memory, box: [10, 440, 980, 140]}
