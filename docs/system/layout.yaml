# Where each component sits in the explorer's two views. Positions are boxes on a 1000-unit-wide
# canvas: [x, y, width, height]. Components not listed here are still reachable from the panel and
# from docs/system/README.md. tools/check_content.py checks that every id exists and that every step of
# every walk in architecture.yaml can be shown in at least one view.
