# pfdaq system architecture: the single source for the architecture explorer, the diagrams in the
# README and the connection tables in docs/system/. Checked by tools/check_content.py.
#
# Every fact here was measured on the board, produced by a tool, or read from a primary source;
# docs/architecture.md gives the evidence class for each. Applies to the baseline below.
schema: 1
baseline:
  tag: pfdaq-v0.5.1
  fabric: "0.5.1"
  design_version: 6
  board: MPFS-DISCO-KIT
  device: MPFS095T-FCSG325

# kind: group | hart | mss-block | bus | fabric-block | memory | software | board-part | host
# parent: id of the containing node (gives the explorer its layers)
nodes:
  # ---------------------------------------------------------------- top level
  - id: board
    title: PolarFire SoC Discovery Kit
    kind: group
    summary: The physical board. One MPFS095T system-on-chip, 1 GB DDR4, microSD, Gigabit Ethernet and an on-board FlashPro5 debugger on USB-C.
  - id: soc
    title: MPFS095T system-on-chip
    kind: group
    parent: board
    summary: A hardened RISC-V processor subsystem (the MSS) and an FPGA fabric of 93,516 logic elements on one die.
  - id: mss
    title: Microprocessor subsystem (MSS)
    kind: group
    parent: soc
    summary: Five RISC-V harts, their interrupt controllers, the DDR controller, hard peripherals and the interfaces into the fabric. Fixed silicon; only its configuration is chosen.
  - id: fabric
    title: FPGA fabric
    kind: group
    parent: soc
    summary: Programmable logic. Holds the vendor reference design plus the project's stream source and latency unit. 24,334 logic elements used (26 %).
  - id: ddr
    title: DDR4 memory, 1 GB
    kind: group
    parent: board
    summary: Main memory. The same physical memory appears at several addresses with different cache behaviour; the project reserves regions for each purpose.
  - id: software
    title: Software
    kind: group
    summary: Everything that runs on the five harts, from the boot monitor to the test tools.
  - id: host
    title: Development PC
    kind: host
    summary: Builds the fabric (Libero SoC 2026.1), the Linux image (Yocto) and the firmware, programs the board over JTAG and drives the tests over SSH.

  # ---------------------------------------------------------------- MSS
  - id: e51
    title: E51 (hart 0)
    kind: hart
    parent: mss
    summary: 64-bit monitor core without an MMU. Runs the Hart Software Services in machine mode for the whole life of the system.
    facts: {mode: M, runs: hss}
  - id: u54-linux
    title: U54 harts 1 to 3
    kind: hart
    parent: mss
    summary: Three application cores running Linux as one symmetric system in supervisor mode, with OpenSBI underneath.
    facts: {mode: S, runs: linux}
  - id: u54-4
    title: U54 hart 4
    kind: hart
    parent: mss
    summary: The fourth application core, kept out of Linux. Runs the supervisor in machine mode, on FreeRTOS or on bare metal.
    facts: {mode: M, runs: supervisor, image: "0x91C0_0000, 1 MiB"}
  - id: plic
    title: Platform-level interrupt controller
    kind: mss-block
    parent: mss
    summary: Routes peripheral and fabric interrupts to harts. Each hart context enables the sources it wants; fabric line F2M[n] is source 118 + n.
    facts: {f2m_base: 118}
  - id: fic0
    title: FIC0 (AXI4, 125 MHz)
    kind: bus
    parent: mss
    summary: Fabric interface controller 0. An AXI4 bridge in both directions - the MSS reaches fabric registers through it, and the fabric DMA reaches DDR through it.
    facts: {protocol: AXI4, clock: "125 MHz"}
  - id: fic3
    title: FIC3 (APB, 50 MHz)
    kind: bus
    parent: mss
    summary: Fabric interface controller 3. An APB master from the MSS into the fabric, used for low-speed register access.
    facts: {protocol: APB, clock: "50 MHz"}
  - id: mss-gpio2
    title: MSS GPIO2
    kind: mss-block
    parent: mss
    summary: A hard GPIO block whose pins are routed through the fabric to the LEDs, DIP switches 5 to 8 and the Raspberry Pi header.
    facts: {address: "0x2012_2000"}
  - id: mss-pdma
    title: MSS PDMA
    kind: mss-block
    parent: mss
    summary: The hard memory-to-memory DMA of the processor subsystem. Four channels, each with a done and an error interrupt. Linux binds the sf-pdma driver to it; the fabric DMA is a separate engine.
    facts: {address: "0x0300_0000", size: "32 KiB", channels: "4", plic: "5 to 12"}
  - id: mss-uarts
    title: MMUART 0, 1 and 4
    kind: mss-block
    parent: mss
    summary: Three hard UARTs on the USB-C debug connector - MMUART1 for HSS, MMUART4 for Linux, MMUART0 (routed through the fabric) for hart 4.

  # ---------------------------------------------------------------- fabric
  - id: pfdaq-core
    title: pfdaq_core
    kind: fabric-block
    parent: fabric
    summary: The project's logic. Decodes one 256-byte APB slot into the stream source and two latency channels.
    facts: {address: "0x4000_0F00", bus: fic3}
    sources:
      - {path: hw/rtl/pfdaq_core.v, symbols: [pfdaq_core]}
      - {path: hw/libero/overlay/PFDAQ.tcl}
  - id: pfdaq-stream-src
    title: Stream source
    kind: fabric-block
    parent: pfdaq-core
    summary: Generates framed test data - header, sequence number, timestamp, payload, CRC-32 - two 32-bit words per clock, as a 64-bit AXI4-Stream. Burst and real-time run modes, fault injection, abort.
    facts: {address: "0x4000_0F00 to 0x4000_0F7F", clocks: "50 MHz registers, 125 MHz generator"}
    sources:
      - {path: hw/rtl/pfdaq_stream_src.v, symbols: [pfdaq_stream_src, pfdaq_word_step]}
  - id: pfdaq-fir-src
    title: FIR payload source
    kind: fabric-block
    parent: pfdaq-stream-src
    summary: A triangle-wave generator and an 8-tap FIR filter on the fabric's math blocks, decoupled from the frame generator by a 16-word FIFO.
    sources:
      - {path: hw/rtl/pfdaq_stream_src.v, symbols: [pfdaq_fir_src]}
  - id: pfdaq-latency
    title: Latency unit (two channels)
    kind: fabric-block
    parent: pfdaq-core
    summary: Raises an interrupt on a schedule and counts 50 MHz cycles until software acknowledges it. Keeps minimum, maximum, sum and a 64-bin histogram per channel.
    facts: {address: "0x4000_0F80 (channel 0), 0x4000_0FC0 (channel 1)", resolution: "20 ns"}
    sources:
      - {path: hw/rtl/pfdaq_latency.v, symbols: [pfdaq_latency_ch]}
  - id: dma
    title: CoreAXI4DMAController
    kind: fabric-block
    parent: fabric
    summary: Vendor DMA core, version 2.2.107. Receives the AXI4-Stream and writes it into DDR through FIC0, following descriptors that Linux prepares in memory.
    facts: {address: "0x6001_0000", version: "2.2.107"}
  - id: ihc
    title: Mi-V inter-hart communication
    kind: fabric-block
    parent: fabric
    summary: Vendor mailbox core. Carries the notifications that RPMsg needs between Linux and hart 4, with one interrupt line per hart.
    facts: {address: "0x5000_0000", version: "2.0.100"}
  - id: refdesign-peripherals
    title: Reference design peripherals
    kind: fabric-block
    parent: fabric
    summary: Fabric peripherals inherited from the vendor design - CoreGPIO driving the LEDs, CoreI2C, CoreUART, CorePWM and an SPI core for the 7-segment adapter.
    facts: {coregpio: "0x4000_0100", corei2c: "0x4000_0200", coreuart: "0x4000_0300", corepwm: "0x4000_0000", spi: "0x4000_0400"}
  - id: fabric-clocks
    title: Fabric clocks and resets
    kind: fabric-block
    parent: fabric
    summary: One clock conditioning circuit produces the 50 MHz and 125 MHz clocks that the fabric logic and the two FICs share.

  # ---------------------------------------------------------------- memory regions
  - id: ddr-noncached
    title: Non-cached window
    kind: memory
    parent: ddr
    summary: 32 MiB that Linux maps without caching. Holds the DMA descriptors and the buffers the DMA fills, so software always reads what the hardware wrote.
    facts: {address: "0xC800_0000", size: "32 MiB", linux: /dev/udmabuf-ddr-nc0}
  - id: ddr-cached-shared
    title: Cached shared region
    kind: memory
    parent: ddr
    summary: 32 MiB of ordinary cached memory that both Linux and hart 4 can reach. Used to show that the two contexts see each other's writes.
    facts: {address: "0x8800_0000", size: "32 MiB", linux: /dev/udmabuf-ddr-c0}
  - id: ddr-rpmsg
    title: RPMsg shared memory
    kind: memory
    parent: ddr
    summary: Two virtqueue rings, a buffer pool and the resource table that Linux and hart 4 use to exchange messages.
    facts: {address: "0x91D0_0000 to 0x91D5_0FFF"}
  - id: ddr-u54-4-image
    title: Hart 4 image
    kind: memory
    parent: ddr
    summary: 1 MiB reserved for the supervisor's code and data, hidden from Linux.
    facts: {address: "0x91C0_0000", size: "1 MiB"}

  # ---------------------------------------------------------------- board parts
  - id: sd-card
    title: microSD card
    kind: board-part
    parent: board
    summary: The only boot medium besides the chip's own flash. Partition 1 holds the kernel image, partition 2 the HSS payload, partition 3 the root filesystem.
  - id: envm
    title: eNVM boot flash
    kind: board-part
    parent: soc
    summary: Non-volatile memory inside the chip that holds the Hart Software Services. This project never reprograms it.
  - id: debug-usb
    title: FlashPro5 on USB-C
    kind: board-part
    parent: board
    summary: On-board debugger. One JTAG interface for programming the fabric and three serial consoles.
  - id: ethernet
    title: Gigabit Ethernet
    kind: board-part
    parent: board
    summary: Used for SSH - deployment, test automation and file transfer.
  - id: user-io
    title: LEDs, switches and headers
    kind: board-part
    parent: board
    summary: Seven user LEDs, eight DIP switches, two push buttons, a Raspberry Pi compatible header and a mikroBUS socket.

  # ---------------------------------------------------------------- software
  - id: hss
    title: Hart Software Services
    kind: software
    parent: software
    summary: Microchip's boot monitor, v2026.04.1. Trains DDR, loads the payload from the SD card, starts every hart in its privilege mode and stays resident on the E51.
  - id: opensbi
    title: OpenSBI
    kind: software
    parent: software
    summary: The machine-mode layer under Linux on harts 1 to 3. Hart 4 is started without it.
  - id: u-boot
    title: U-Boot
    kind: software
    parent: software
    summary: v2025.07-mchp. Loads the kernel image from the SD card and starts Linux.
  - id: linux-kernel
    title: Linux 6.18.17
    kind: software
    parent: software
    summary: Built with Yocto from Microchip's BSP plus the project layer. Three CPUs; the fourth is disabled in the device tree.
    sources:
      - {path: yocto/meta-pfdaq/recipes-kernel/linux/files/mpfs-disco-kit-amp.dts}
  - id: uio
    title: UIO devices
    kind: software
    parent: linux-kernel
    summary: How user space reaches fabric registers and waits for fabric interrupts - a generic UIO device for the stream source and latency unit, and the vendor's UIO driver for the DMA controller.
  - id: pfdaq-uio
    title: pfdaq_uio kernel driver
    kind: software
    parent: linux-kernel
    summary: A small optional driver that acknowledges the latency interrupt inside the kernel handler, to measure kernel response separately from user-space response.
    sources:
      - {path: yocto/meta-pfdaq/recipes-kernel/pfdaq-uio/files/pfdaq_uio.c, symbols: [pfdaq_uio_handler]}
  - id: udmabuf
    title: u-dma-buf
    kind: software
    parent: linux-kernel
    summary: Exposes the reserved DDR regions to user space as mappable devices.
  - id: dma-proxy
    title: dma-proxy (MSS DMA)
    kind: software
    parent: linux-kernel
    summary: The vendor's character devices /dev/dma-proxy0 to 3. Two ioctls take physical source and destination addresses and a length, and run one PDMA memory-to-memory copy on that channel.
    sources:
      - {path: experiments/I09-dma-comparison/dma_compare.c, symbols: [op_pdma]}
  - id: remoteproc-rpmsg
    title: remoteproc and RPMsg
    kind: software
    parent: linux-kernel
    summary: Linux attaches to the already-running hart 4 and exchanges messages with it over a virtio channel named pfdaq-supervisor.
  - id: pfdaq-cap
    title: pfdaq_cap
    kind: software
    parent: software
    summary: The Linux capture tool. Arms the DMA, starts the fabric, verifies every frame against a software model and reports to the supervisor.
    sources:
      - {path: yocto/meta-pfdaq/recipes-pfdaq/pfdaq-tools/files/pfdaq_cap.c, symbols: [arm, wait_done, verify]}
  - id: pfdaq-lat
    title: pfdaq_lat
    kind: software
    parent: software
    summary: The Linux tool for the latency unit. Configures a channel, acknowledges interrupts where Linux is the responder, and reads the statistics.
    sources:
      - {path: yocto/meta-pfdaq/recipes-pfdaq/pfdaq-tools/files/pfdaq_lat.c}
  - id: supervisor
    title: pfdaq supervisor
    kind: software
    parent: software
    summary: Runs on hart 4. Enforces a deadline on Linux's reports, cross-checks them against the fabric's own counters, and answers the latency interrupt. One source file, built for FreeRTOS or for bare metal.
    sources:
      - {path: firmware/u54_4-supervisor/pfdaq_supervisor.c, symbols: [PLIC_f2m_5_IRQHandler]}

# kind: apb | axi4 | axi4-stream | irq | rpmsg | mem | boot | runs | jtag | uart | net | uses
edges:
  - {id: linux-fic3, from: u54-linux, to: fic3, kind: apb, label: "register access"}
  - {id: hart4-fic3, from: u54-4, to: fic3, kind: apb, label: "reads counters, acknowledges latency channel 1"}
  - {id: fic3-core, from: fic3, to: pfdaq-core, kind: apb, label: "APB, 0x4000_0F00", detail: "32-bit accesses only"}
  - {id: fic3-ihc, from: fic3, to: ihc, kind: apb, label: "APB, 0x5000_0000"}
  - {id: fic3-refdesign, from: fic3, to: refdesign-peripherals, kind: apb, label: "APB, 0x4000_0000 to 0x4000_04FF"}
  - {id: linux-fic0, from: u54-linux, to: fic0, kind: axi4, label: "DMA register access"}
  - {id: fic0-dma-regs, from: fic0, to: dma, kind: axi4, label: "AXI4-Lite, 0x6001_0000"}
  - {id: stream, from: pfdaq-stream-src, to: dma, kind: axi4-stream, label: "AXI4-Stream, 64 bit, 125 MHz", detail: "TVALID continuous within a packet; TDEST 0 to 3 selects the descriptor"}
  - {id: fir-stream, from: pfdaq-fir-src, to: pfdaq-stream-src, kind: uses, label: "filtered samples through a FIFO"}
  - {id: dma-fic0, from: dma, to: fic0, kind: axi4, label: "AXI4 write bursts"}
  - {id: fic0-ddr, from: fic0, to: ddr-noncached, kind: mem, label: "frames into the buffers"}
  - {id: dma-descriptors, from: ddr-noncached, to: dma, kind: mem, label: "reads stream descriptors"}
  - {id: irq-dma, from: dma, to: plic, kind: irq, label: "F2M[2], PLIC 120", detail: "transfer complete"}
  - {id: irq-lat0, from: pfdaq-latency, to: plic, kind: irq, label: "F2M[1], PLIC 119", detail: "latency channel 0"}
  - {id: irq-lat1, from: pfdaq-latency, to: plic, kind: irq, label: "F2M[5], PLIC 123", detail: "latency channel 1"}
  - {id: irq-ihc, from: ihc, to: plic, kind: irq, label: "F2M[59..63], PLIC 177 to 181", detail: "one line per hart"}
  - {id: plic-linux, from: plic, to: u54-linux, kind: irq, label: "sources 119, 120 and the IHC lines"}
  - {id: plic-hart4, from: plic, to: u54-4, kind: irq, label: "source 123 and its IHC line"}
  - {id: clocks-fic, from: fabric-clocks, to: pfdaq-core, kind: uses, label: "50 MHz and 125 MHz"}
  - {id: cap-buffers, from: pfdaq-cap, to: ddr-noncached, kind: mem, label: "writes descriptors, reads frames"}
  - {id: cap-udmabuf, from: pfdaq-cap, to: udmabuf, kind: uses, label: "maps the reserved regions"}
  - {id: cap-uio, from: pfdaq-cap, to: uio, kind: uses, label: "registers and interrupt wait"}
  - {id: lat-uio, from: pfdaq-lat, to: uio, kind: uses, label: "registers and interrupt wait"}
  - {id: lat-pfdaq-uio, from: pfdaq-lat, to: pfdaq-uio, kind: uses, label: "kernel acknowledge mode"}
  - {id: cap-rpmsg, from: pfdaq-cap, to: remoteproc-rpmsg, kind: rpmsg, label: "status reports"}
  - {id: rpmsg-supervisor, from: remoteproc-rpmsg, to: supervisor, kind: rpmsg, label: "channel pfdaq-supervisor"}
  - {id: rpmsg-mem, from: remoteproc-rpmsg, to: ddr-rpmsg, kind: mem, label: "rings and buffers"}
  - {id: rpmsg-ihc, from: remoteproc-rpmsg, to: ihc, kind: uses, label: "notifications"}
  - {id: shared-linux, from: pfdaq-cap, to: ddr-cached-shared, kind: mem, label: "shared-memory test"}
  - {id: shared-hart4, from: supervisor, to: ddr-cached-shared, kind: mem, label: "shared-memory test"}
  - {id: supervisor-runs, from: supervisor, to: u54-4, kind: runs, label: "machine mode"}
  - {id: supervisor-image, from: supervisor, to: ddr-u54-4-image, kind: mem, label: "code and data"}
  - {id: linux-runs, from: linux-kernel, to: u54-linux, kind: runs, label: "supervisor mode"}
  - {id: opensbi-runs, from: opensbi, to: u54-linux, kind: runs, label: "machine mode"}
  - {id: hss-runs, from: hss, to: e51, kind: runs, label: "machine mode"}
  - {id: envm-hss, from: envm, to: hss, kind: boot, label: "stored in"}
  - {id: hss-payload, from: sd-card, to: hss, kind: boot, label: "payload from partition 2"}
  - {id: hss-uboot, from: hss, to: u-boot, kind: boot, label: "starts on harts 1 to 3 through OpenSBI"}
  - {id: hss-supervisor, from: hss, to: supervisor, kind: boot, label: "starts on hart 4 without OpenSBI"}
  - {id: uboot-linux, from: u-boot, to: linux-kernel, kind: boot, label: "kernel image from partition 1"}
  - {id: gpio-userio, from: mss-gpio2, to: user-io, kind: uses, label: "LEDs, DIP 5 to 8, header pins (through the fabric)"}
  - {id: proxy-pdma, from: dma-proxy, to: mss-pdma, kind: uses, label: "one memory-to-memory copy per ioctl pair"}
  - {id: pdma-ddr, from: mss-pdma, to: ddr-noncached, kind: mem, label: "copies between DDR buffers (any window)"}
  - {id: coregpio-userio, from: refdesign-peripherals, to: user-io, kind: uses, label: "LEDs (OR'd with MSS GPIO2)"}
  - {id: uart-debug, from: mss-uarts, to: debug-usb, kind: uart, label: "three consoles"}
  - {id: host-jtag, from: host, to: debug-usb, kind: jtag, label: "fabric programming, FABRIC and SNVM only"}
  - {id: host-ssh, from: host, to: ethernet, kind: net, label: "SSH"}

# Named walks through the system. Each step names an edge; the explorer plays them in order and the
# static pages print them as numbered lists.
paths:
  - id: one-burst
    title: One burst, from START to verified
    steps:
      - {edge: cap-buffers, say: "pfdaq_cap writes a stream descriptor into the non-cached window - valid, destination ready, byte count, destination address."}
      - {edge: fic0-dma-regs, say: "It gives the DMA the descriptor's address and enables the interrupt."}
      - {edge: fic3-core, say: "It writes frame length and frame count to the stream source and sets START."}
      - {edge: stream, say: "The source sends the whole burst as one packet, two words per clock, with TVALID held high."}
      - {edge: dma-fic0, say: "The DMA turns the stream into AXI4 write bursts."}
      - {edge: fic0-ddr, say: "The frames land in the buffer the descriptor named."}
      - {edge: irq-dma, say: "When the byte count is reached the DMA raises its interrupt."}
      - {edge: plic-linux, say: "The PLIC delivers it to Linux; the UIO read in pfdaq_cap returns."}
      - {edge: cap-buffers, say: "pfdaq_cap copies the burst out and checks header, sequence, payload and CRC of every frame."}
      - {edge: cap-rpmsg, say: "It reports the burst number, the next expected sequence number and the error count."}
      - {edge: rpmsg-supervisor, say: "The supervisor restarts its deadline and compares the report with the fabric's own sequence counter."}
  - id: latency-event
    title: One latency measurement on hart 4
    steps:
      - {edge: irq-lat1, say: "The latency unit raises F2M[5] and starts counting 50 MHz cycles."}
      - {edge: plic-hart4, say: "The PLIC presents source 123 to hart 4, which is in machine mode with nothing in between."}
      - {edge: hart4-fic3, say: "The handler writes the ACK register through FIC3."}
      - {edge: fic3-core, say: "The write stops the count; the value goes into the minimum, maximum, sum and histogram."}
  - id: boot
    title: Boot, from power-on to both systems running
    steps:
      - {edge: envm-hss, say: "The system controller configures the fabric and releases the MSS; the E51 starts the HSS from eNVM."}
      - {edge: hss-payload, say: "The HSS trains DDR and reads the payload from the SD card."}
      - {edge: hss-supervisor, say: "It starts the supervisor on hart 4 in machine mode. It runs from this moment, long before Linux."}
      - {edge: hss-uboot, say: "It starts U-Boot on harts 1 to 3 in supervisor mode, with OpenSBI underneath."}
      - {edge: uboot-linux, say: "U-Boot loads the kernel image and starts Linux with three CPUs."}
      - {edge: rpmsg-supervisor, say: "Linux attaches to the running hart 4 through remoteproc and the supervisor announces its channel."}
