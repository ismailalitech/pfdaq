#@TYPE: Machine
#@NAME: mpfs-disco-kit-amp
#@SOC: Polarfire SoC
#@DESCRIPTION: PolarFire SoC Discovery Kit, AMP: Linux on U54_1-3, FreeRTOS on U54_4
# Project port of mpfs-icicle-kit-amp (meta-mchp linux4microchip-2026.04). Not a vendor machine.

require conf/machine/include/mpfs-common.inc

MACHINE_TYPE = "amp"

MACHINE_FEATURES:append = " amp"
# HSS starts the FreeRTOS context at boot (early boot); Linux attaches to it.
DISTRO_FEATURES_BACKFILL:append = "${@bb.utils.contains('MCHP_FEATURES', 'mchpcore', ' hss-early-boot-freertos', '', d)}"

KERNEL_DTC_FLAGS += "-@"
KERNEL_DEVICETREE ?= "microchip/mpfs-disco-kit-amp.dtb"

UBOOT_MACHINE = "microchip_mpfs_discokit_defconfig"

IMAGE_INSTALL:remove = " dt-overlay-mchp"

SERIAL_CONSOLES = "115200;ttyS1"

UBOOT_ENV = "boot"
UBOOT_ENV_SUFFIX = "scr"
UBOOT_ENV_SIZE = "0x2000"

HSS_PAYLOAD = "amp"

IMAGE_BOOT_FILES ?= " \
    fitImage \
    boot.scr \
    uboot.env \
"

WKS_FILE ?= "mpfs-rootfs.wks"

# mpfs-disco-kit override pulls in the vendor Discovery Kit files (boot.cmd, package lists).
MACHINEOVERRIDES .= ":mpfs:mpfs-disco-kit"
